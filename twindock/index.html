<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#050914" />
<title>Twin Dock · Capture Anchor Control v2</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./transitions.css?v=p3b1" />
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="우주선 기준 회전 우주정거장 도킹 게임"></canvas>
  <canvas id="feedback" aria-hidden="true"></canvas>

  <div class="topbar">
    <div id="missionHud" class="hud missionHud"><div class="k">ANCHOR CONTROL V2</div><div class="v"><span id="score">0 / 5</span></div></div>
    <div class="hud statusHud"><div class="k">STATUS</div><div id="mode" class="v">대기</div></div>
  </div>

  <div class="centerMsg"><strong id="msgTitle">동일 상대운동 · 도킹 위치 비교</strong><span id="msgSub">각 trial은 같은 초기 상태에서 독립적으로 시작합니다.</span></div>

  <div id="stageTransition" class="stageTransition" aria-hidden="true">
    <div class="sweep"></div>
    <div class="stageCue"><span id="stageKicker">TARGET 2 / 5</span><strong id="stageTitle">LONG CARGO · 전방 · r98</strong></div>
    <div class="sweep"></div>
  </div>

  <div id="missionCompleteFx" class="missionCompleteFx" aria-hidden="true">
    <div class="edgeFrame"></div>
    <div class="completeCue"><span>ANCHOR CONTROL V2</span><strong id="missionCompleteText">5 / 5 TRIALS COMPLETE</strong></div>
  </div>

  <div class="debugHud" aria-hidden="true">
    <span>REL <b id="relSpeed">0.0</b></span>
    <span id="ckPos"><i class="dot"></i>위치</span><span id="ckVel"><i class="dot"></i>속도</span>
    <span id="ckDir"><i class="dot"></i>방향</span><span id="ckSpin"><i class="dot"></i>회전</span>
  </div>

  <div class="controls">
    <div class="padWrap">
      <div class="padLabel"><span>왼쪽 RCS · 기체 기준</span><b id="lPct">0%</b></div>
      <div id="lPad" class="pad"><div class="padRing"></div><div id="lOrigin" class="origin"></div><div id="lThumb" class="thumb"></div></div>
    </div>
    <div class="middleControls">
      <button id="startBtn" class="btn primary" type="button">시작</button>
      <button id="resetBtn" class="btn" type="button">초기화</button>
      <button id="fullBtn" class="btn" type="button">전체</button>
      <div class="tiny">양손의 합 = 이동 · 정밀 감도<br>양손 차이 = 회전</div>
    </div>
    <div class="padWrap">
      <div class="padLabel"><span>오른쪽 RCS · 기체 기준</span><b id="rPct">0%</b></div>
      <div id="rPad" class="pad"><div class="padRing"></div><div id="rOrigin" class="origin"></div><div id="rThumb" class="thumb"></div></div>
    </div>
  </div>
  <div class="portraitBlock"><div><strong>가로 화면으로 돌려주세요</strong><span>양손 조작을 위해 가로 화면에 맞춰 설계했습니다.</span></div></div>
  <div id="flash" class="flash"></div><div id="pulse" class="dockPulse"></div>
</div>
<script src="./src/config.js"></script>
<script src="./src/math.js"></script>
<script src="./src/geometry.js"></script>
<script src="./src/craft-geometry.js?v=anchorv2"></script>
<script src="./src/state.js?v=craftshape1"></script>
<script src="./src/docking.js"></script>
<script src="./src/mission.js?v=anchorv2"></script>
<script src="./src/input.js"></script>
<script src="./src/physics.js"></script>
<script src="./src/camera.js"></script>
<script src="./src/ui.js"></script>
<script src="./src/renderer.js"></script>
<script src="./src/craft-probe.js?v=craftshape1"></script>
<script src="./src/presentation.js?v=p3a2"></script>
<script src="./src/feedback.js"></script>
<script src="./src/effects.js?v=p3a2"></script>
<script src="./src/transitions.js?v=p3b1"></script>
<script src="./src/main.js?v=anchorv2"></script>
</body>
</html>
