const labels=['위치까지 맞음','숫자만 맞음','없는 숫자'],kinds=['check','move','x'],colors=['g','a','r'];function mark(i,n){let e=E('span','result '+colors[i]);e.append(icon(kinds[i]),E('span','',String(n)));e.title=labels[i]+' '+n+'개';e.setAttribute('aria-label',e.title);return e}function legend(){let d=E('div','legend');labels.forEach((t,i)=>{let e=E('span');e.append(icon(kinds[i],colors[i]),document.createTextNode(t));d.append(e)});return d}function digits(a,hidden=false,ok=false){let d=E('div','digitRow');a.forEach(n=>d.append(E('span','digit'+(hidden?' hidden':'')+(ok?' ok':''),hidden?'?':String(n))));return d}function panel(title,en){let p=E('section','panel'),h=E('div','panelHead'),b=E('div','body');h.append(E('span','',title),E('span','spacer'),E('span','eng',en));p.append(h,b);return{p,h,b}}
