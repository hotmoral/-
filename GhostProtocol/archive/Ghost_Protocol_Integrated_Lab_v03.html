function showFirstGuides(){if(phase!=='running'||active||guideOpen)return;let visible=m.ns.filter(n=>n.seen),keys=[];let add=k=>{if(!progress.stateIntro.includes(k)&&!keys.includes(k))keys.push(k)};if(visible.some(n=>n.id!==0))add('permission');if(visible.some(n=>n.identified&&(n.read.length||n.control.length)||!n.identified&&n.identify))add('difficulty');for(let n of visible){if(n.flags.includes('critical'))add('critical');if(n.flags.some(f=>f==='caution'||f==='hazard'))add('risk');if(n.flags.includes('restricted'))add('restricted');if(!n.identified)add('hidden')}
 let types=[...new Set(visible.filter(n=>n.identified&&!progress.deviceIntro.includes(n.type)).map(n=>n.type))];if(!keys.length&&!types.length)return;
 guideOpen=true;pauseIntro();$('dialog').classList.add('guide');$('overlay').hidden=false;
 let groups=keys.map(k=>`<section class="guideGroup"><div class="guideTitle">${stateGuides[k].title}</div><div class="stateGuide">${stateGuides[k].items.map(([label,color,desc])=>`<div class="guideItem" style="--guide:${color}"><strong>${label}</strong>${desc}</div>`).join('')}</div></section>`).join('');
 let dev=types.length?`<section class="guideGroup"><div class="guideTitle">새로 발견한 설비</div><div class="stateGuide">${types.map(t=>`<div class="guideItem guideRow"><div class="deviceIcon" style="color:${COL.available}">${icon(t,COL.available)}</div><div><strong>${devices[t][0]}</strong>${devices[t][2]}</div></div>`).join('')}</div></section>`:'';
 $('dialog').innerHTML=`<span class="dialogTimer paused" id="modalTime">${fmt(clock())} · 정지</span><div class="tag">FIRST DISCOVERY</div><h2>신규 시스템 안내</h2><div class="guideBody">${groups}${dev}</div><div class="guideScrollHint" id="guideScrollHint" hidden>아래로 스크롤하여 나머지 안내를 확인하세요.</div><div class="buttons"><button class="primary" id="ackGuide">확인 · 임무 계속</button></div>`;
 let body=$('dialog').querySelector('.guideBody');$('guideScrollHint').hidden=body.scrollHeight<=body.clientHeight+2;$('ackGuide').onclick=()=>{for(let k of keys)if(!progress.stateIntro.includes(k))progress.stateIntro.push(k);for(let t of types)if(!progress.deviceIntro.includes(t))progress.deviceIntro.push(t);save();close();tick()};tick()
}

function openTask(id,k){let n=m.ns[id];if(active||guideOpen||phase!=='running'||clock()<=0||!can(m,n,k))return;let t=currentTask(n,k);if(!t){apply(id,k);return}active={id,k,task:t.id,level:t.level,token:++tokenSeq,ready:false};let first=!progress.intro.includes(t.id);let hint=defs[t.id-1][3];if(t.id===20)hint=`${[3,5,7][t.level]}개 채널을 교차 없이 연결하고 장애물 외 모든 칸을 채우세요.`;if(t.id===24)hint=`1부터 ${[16,25,49][t.level]}까지 순서대로 선택하세요.`;if(t.id===25)hint=`각 채널의 1번부터 순서대로 ${[18,40,60][t.level]}개 데이터를 정리하세요.`;if(!first){launchPuzzle();return}pauseIntro();$('dialog').innerHTML=`<span class="dialogTimer paused" id="modalTime">${fmt(clock())} · 정지</span><div class="tag">FIRST OPERATION · ${levels[t.level]}</div><h2>${defs[t.id-1][1]}</h2><p>${display(n)} / ${k==='identify'?'정체 식별':k==='read'?'열람 권한':'제어 권한'}</p><p class="introHint">${hint}</p><div class="small">현재는 설명 화면입니다. 문제 시작을 누르면 남은 시간이 다시 감소합니다.</div><div class="buttons"><button id="cancel">취소</button><button class="primary" id="beginPuzzle">문제 시작</button></div>`;$('overlay').hidden=false;$('cancel').onclick=()=>{close();tick()};$('beginPuzzle').onclick=launchPuzzle;tick()}
function launchPuzzle(){if(!active||phase!=='running'||clock()<=0){close();return}let a=active;let n=m.ns[a.id];resumeIntro();$('overlay').hidden=false;$('overlay').classList.add('playing');$('dialog').classList.add('playing');$('dialog').innerHTML=`<div class="puzzleTop"><span class="tag">${display(n)} · ${levels[a.level]}</span><strong id="modalTime" class="dialogTimer">${fmt(clock())}</strong><button id="cancel">작업 중단</button></div><iframe id="puzzleFrame" title="논리게임" allow="autoplay"></iframe>`;$('cancel').onclick=()=>{close();tick()};let raw=new TextDecoder().decode(Uint8Array.from(atob(PUZZLE_DATA),c=>c.charCodeAt(0)));$('puzzleFrame').srcdoc=raw.replace('__PUZZLE_CONFIG__',JSON.stringify({id:a.task,level:a.level,token:a.token}));tick()}
window.ghostPuzzleReady=function(token){if(!active||active.token!==token||phase!=='running'||clock()<=0)return;active.ready=true;if(!progress.intro.includes(active.task)){progress.intro.push(active.task);save()}};
window.ghostPuzzleError=function(token){if(!active||active.token!==token)return;close();log('문제 생성 실패 · 다시 시도하세요');render()};
window.ghostPuzzleSuccess=function(token,id,level,errors,elapsed){if(!active||!active.ready||active.token!==token||active.task!==id||active.level!==level||phase!=='running'||clock()<=0)return;let a=active;close();log(`작업 완료 · ${elapsed.toFixed(1)}초 / 오류 ${errors}회`);apply(a.id,a.k)};
window.addEventListener('message',e=>{let f=$('puzzleFrame'),d=e.data;if(!f||e.source!==f.contentWindow||!d||d.ghostPuzzle!==true||!active||d.token!==active.token)return;if(d.type==='ready')window.ghostPuzzleReady(d.token);else if(d.type==='error')window.ghostPuzzleError(d.token);else if(d.type==='success')window.ghostPuzzleSuccess(d.token,d.id,d.level,d.errors,d.elapsed)});
function close(){resumeIntro();active=null;guideOpen=false;$('dialog').classList.remove('guide');$('overlay').hidden=true;$('overlay').classList.remove('playing');$('dialog').classList.remove('playing');$('dialog').replaceChildren()}
function apply(id,k){if(phase!=='running'||clock()<=0)return;let n=m.ns[id],res=transition(m,id,k);if(!res)return;if(res.t){if(!progress.games.includes(res.t.id))progress.games.push(res.t.id);progress.levels[res.t.id]=Math.max(progress.levels[res.t.id]??-1,res.t.level);log(`${defs[res.t.id-1][1]} · 해결 완료`)}if(n.identified&&!progress.devices.includes(n.type))progress.devices.push(n.type);if(res.effect==='time'){deadline+=45000;extra+=45;log('감시 제어 · +45초')}else if(res.effect==='clue'){m.clue=true;log('메일 분석 · 목표 단서 확보')}else if(res.effect)log(res.effect);if(res.newIds.length){res.newIds.forEach(id=>showNew.add(id));log(`후속 설비 ${res.newIds.length}개 발견`)}save();render();showFirstGuides()}
function winMission(){if(phase!=='running'||clock()<=0||!complete(m))return;phase='won';if(m.kind==='tutorial'&&m.tutorial===progress.tutorial)progress.tutorial++;save();log('MISSION COMPLETE · '+fmt(clock())+' 남음');render()}
function tick(){let sec=phase==='ready'?m?.seconds||0:phase==='running'?clock():null;if(sec!==null){$('clock').textContent=fmt(sec);$('clock').className=sec<=30?'danger':sec<=90?'warn':'';if($('modalTime')){$('modalTime').textContent=fmt(sec)+(pausedAt!==null?' · 정지':'');$('modalTime').classList.toggle('danger',sec<=30);$('modalTime').classList.toggle('warn',sec>30&&sec<=90)}}if(phase==='running'&&sec===0){phase='lost';close();log('TIME EXPIRED');renderBrief();renderDetail()}}
function load(i){close();modeIndex=Number(i);if(modeIndex<12)m=makeTutorial(modeIndex);else {let stage=progress.tutorial<12?0: Object.values(progress.levels).filter(v=>v>=1).length>=8?2:1;for(let attempt=0;attempt<12;attempt++){m=makeGenerated(modeIndex-12,stage,progress.levels);if(valid(m))break}}if(!valid(m))throw Error('invalid network');selected=0;phase='ready';deadline=0;extra=0;logs=[];view={x:0,y:0,w:820,h:420};showNew.clear();$('log').innerHTML='';log('임무 대기 · START');render()}
$('missionSelect').innerHTML=tutorial.map((v,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} 입문 · ${v[0]}</option>`).join('')+missionTypes.map((v,i)=>`<option value="${i+12}">TEST · ${v[0]}</option>`).join('');$('missionSelect').onchange=e=>load(e.target.value);$('restart').onclick=()=>load(modeIndex);$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};function zoom(f){let w=Math.max(260,Math.min(1000,view.w*f)),h=w*420/820;view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};$('map').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view={x:0,y:0,w:820,h:420};renderMap()};let drag=null,pointers=new Map();const svg=$('map');svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,v:{...view},id:e.target.closest('[data-id]')?.dataset.id,moved:false};svg.setPointerCapture(e.pointerId)}else if(pointers.size===2){let a=[...pointers.values()];drag={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),v:{...view}};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!drag)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(drag.pinch&&pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),w=Math.max(260,Math.min(1000,drag.v.w*drag.d/Math.max(d,1))),h=w*420/820;view={x:drag.v.x+(drag.v.w-w)/2,y:drag.v.y+(drag.v.h-h)/2,w,h}}else if(!drag.pinch){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;let scale=Math.max(view.w/svg.clientWidth,view.h/svg.clientHeight);view={...drag.v,x:drag.v.x-dx*scale,y:drag.v.y-dy*scale}}svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(drag&&!drag.pinch&&!drag.moved&&drag.id!==undefined){selected=Number(drag.id);renderMap();renderDetail()}if(!pointers.size)drag=null;}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null});svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.dataset.id!==undefined){e.preventDefault();selected=Number(e.target.dataset.id);renderMap();renderDetail()}});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});setInterval(tick,200);$('missionSelect').value=Math.min(progress.tutorial,12);load(Number($('missionSelect').value));
</script></body></html>
