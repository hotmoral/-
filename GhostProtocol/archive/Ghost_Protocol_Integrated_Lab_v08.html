const missionLeads=['게이트웨이와 중계 서버에 접속하여 내부 통신 경로를 확보하라.','메일 서버를 조사하고 지정 자료에 접근하라.','인증 서버의 보안 검사를 통과하라.','방화벽을 통과하고 필요한 접근 권한을 확보하라.','백업 서버에서 손상된 데이터를 복원하라.','통신 서버의 데이터 규칙을 분석하라.','혼합된 통신 데이터를 올바르게 재조립하라.','목표 통신 경로를 연결하라.','비정상 장치를 식별하고 격리하라.','기록을 검증하고 사건의 순서를 복원하라.','단절된 네트워크와 회로를 복구하라.','CCTV와 시설 제어 시스템의 필요한 권한을 확보하라.'];
let briefingStart=false,focusSerial=0;
function missionButton(){return phase==='ready'?'<button class="primary" id="start">임무 시작</button>':phase==='running'?`<button class="primary" id="exit" ${complete(m)?'':'disabled'}>접속 종료</button>`:''}
function renderBrief(){let goals=m.goals.map((g,i)=>{let n=m.ns[g.id],ok=goalDone(m,g);return `<div class="goal ${ok?'ok':''}">${ok?'✓':'○'} ${n.seen||m.kind==='tutorial'?display(n):'목표 설비 '+(i+1)} · ${g.permission===2?'제어':'열람'}${g.alternative!=null?' · 대체 가능':''}</div>`}).join('');$('brief').innerHTML=`<div class="tag">MISSION ${String(modeIndex+1).padStart(2,'0')}</div><div class="missionTitle">${m.name}</div><div class="missionLead">${m.kind==='tutorial'?missionLeads[m.tutorial]:m.description}</div>${goals}${m.clue?`<div class="goal">메일 단서: ${devices[m.ns[m.goals[0].id].type][0]}</div>`:''}<div class="small">제한시간 ${fmt(m.seconds)}${extra?' + '+extra+'초':''}</div>${m.security?'<div id="securityStatus" class="securityNote"></div>':''}`;$('missionToggle').textContent=`임무 ${m.goals.filter(g=>goalDone(m,g)).length}/${m.goals.length}`;$('missionAction').innerHTML=missionButton();$('missionAction').hidden=phase==='won'||phase==='lost';if($('start'))$('start').onclick=start;if($('exit'))$('exit').onclick=winMission;if($('next'))$('next').onclick=()=>{let v=(modeIndex+1)%24;$('missionSelect').value=v;load(v)};if($('retry'))$('retry').onclick=()=>load(modeIndex)}
function hideMission(){briefingStart=false;$('missionShade').hidden=true}
function openMission(initial=false){if(cine||guideOpen||active)return;beep(420,.09,.025,'triangle');beep(720,.09,.02,'sine',.09);briefingStart=initial;$('missionShade').hidden=false;$('missionCaption').textContent=initial?'INCOMING MISSION':'MISSION / OBJECTIVES';$('missionClose').hidden=initial;$('missionFooter').innerHTML=initial?'<button class="primary" id="deploy">접속 시작</button>':'';if(initial)$('deploy').onclick=()=>{hideMission();visualStartCore()};}
$('missionToggle').onclick=()=>openMission(false);$('missionClose').onclick=hideMission;

function renderDetail(){let n=m.ns[selected];if(!n||!n.seen){$('detail').textContent='설비를 선택하세요.';return}let c=COL[state(n)],st=['접근 불가','접근 가능','열람 권한','제어 권한'][['locked','available','read','control'].indexOf(state(n))],d=devices[n.type],html=`<div class="deviceHead"><div class="deviceIcon" style="color:${c}">${n.identified?icon(n.type,c):'?'}</div><div><div class="missionTitle">${display(n)}</div><div class="status" style="color:${c}">${st}</div></div></div><div class="badges">${markFlags(n)}</div><div class="small">${n.identified?d[2]:'보호된 정체를 분석해야 합니다.'}</div>`;if(n.id===0){$('detail').innerHTML=html;return}let kinds=n.identified?['read',...(n.control.length?['control']:[])]:['identify'];for(let k of kinds){let label={read:'열람 권한',control:'제어 권한',identify:'정체 식별'}[k],tasks=k==='identify'?[n.identify]:n[k];html+=`<div class="task"><strong>${label}</strong>${tasks.map(t=>`<div class="${t.done?'status':''}">${t.done?'✓':'○'} ${String(t.id).padStart(2,'0')} ${defs[t.id-1][1]} <span class="level" data-level="${t.level}">${levels[t.level]}</span></div>`).join('')||'<div class="small">별도 보안 작업 없음</div>'}<button class="secondary" data-kind="${k}" ${phase==='running'&&can(m,n,k)?'':'disabled'}>${k==='identify'?'식별 분석':k==='read'?'열람 작업':'제어 작업'}</button></div>`}if(n.effect==='time')html+='<div class="small">제어 완료 시 +45초, 추적률 −25%p 및 추적 속도 감소</div>';if(m.security&&n.flags.includes('hazard'))html+='<div class="securityNote danger">첫 실제 작업 시 추적률 +12%p</div>';else if(m.security&&n.flags.includes('caution'))html+='<div class="securityNote warn">첫 실제 작업 시 추적률 +5%p</div>';if(m.blocked&&adjacent(m,n.id).length<m.edges.filter(e=>e.includes(n.id)).length)html+='<div class="securityNote danger">일부 연결 단절 · 자동 복구 대기 또는 우회</div>';if(n.effect==='auth')html+='<div class="small">제어 완료 시 연계 설비 인증 승인</div>';$('detail').innerHTML=html;$('detail').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>openTask(n.id,b.dataset.kind))}
function render(){renderMap();renderBrief();renderDetail();tick()}

let guideOpen=false;
function focusDevice(id,cb,delay=620){let serial=++focusSerial;guideOpen=true;pauseIntro();document.body.classList.add('focusLock');if(id!=null){selected=id;renderMap();renderDetail();let el=$('map').querySelector(`[data-id="${id}"]`);el?.classList.add('focusPulse')}setTimeout(()=>{if(serial!==focusSerial||phase!=='running')return;document.body.classList.remove('focusLock');cb()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:delay)}
function showGuideCard(key,n,onAck){beep(520,.075,.022,'triangle');beep(800,.07,.018,'sine',.075);let device=key==='device';$('dialog').classList.add('guide');$('dialog').innerHTML=`<div class="teachHeader"><h2>${device?devices[n.type][0]:stateGuides[key].title}</h2><span class="dialogTimer paused" id="modalTime">${fmt(clock())} · 정지</span></div>${systemLesson(key,n?.type)}<div class="buttons"><button class="primary" id="ackGuide">확인 · 계속</button></div>`;$('overlay').hidden=false;$('ackGuide').onclick=()=>{if(device){if(!progress.deviceIntro.includes(n.type))progress.deviceIntro.push(n.type)}else if(!progress.stateIntro.includes(key))progress.stateIntro.push(key);save();close();onAck?.();tick()};tick()}
function showFirstGuides(){if(phase!=='running'||active||guideOpen||cine)return;let visible=m.ns.filter(n=>n.seen),pending=[];let add=(k,n)=>{if(!progress.stateIntro.includes(k)&&!pending.some(x=>x.key===k))pending.push({key:k,n})};for(let n of visible){if(n.identified&&!progress.deviceIntro.includes(n.type)&&!pending.some(x=>x.key==='device'&&x.n.type===n.type))pending.push({key:'device',n});if(n.id!==0)add('permission',n);if(n.flags.includes('critical'))add('critical',n);if(n.flags.some(f=>f==='caution'||f==='hazard')){add('risk',n);if(m.security)add('riskActive',n)}if(n.flags.includes('restricted'))add('restricted',n);if(!n.identified)add('hidden',n)}if(m.security){add('trace',null);if(m.security.conditional)add('conditional',null)}if(outageNotice)add('outage',null);if(!pending.length)return;let {key,n}=pending[0];focusDevice(n?.id,()=>showGuideCard(key,n,showFirstGuides))}

function playCine({title,sub='',lines=[],kind='ok',duration=1550,after=null,glitch=false}){if(cine)return false;let ownsPause=pausedAt===null;if(ownsPause){pausedAt=Date.now();lastSecurity=pausedAt}let serial=++cineSerial;let el=$('cinematic');cine={serial,ownsPause,after,timer:null};document.body.classList.add('cineLock');el.hidden=false;el.dataset.kind=kind;$('cineTitle').textContent=title;$('cineSub').textContent=sub;$('cineStatus').textContent='SYSTEM EVENT / TIME HOLD';$('cineClock').textContent=fmt(clock());$('cineCode').textContent='';$('cineProgress').style.width='0%';$('cineSymbol').textContent=kind==='danger'||kind==='lost'?'!':kind==='warn'?'△':kind==='won'?'✓':'›_';$('cineSkip').textContent='건너뛰기';let result=kind==='won'||kind==='lost';let completed=false;function readyResult(){if(completed||cine?.serial!==serial)return;completed=true;clearTimeout(cine.timer);$('cineCode').textContent=body;$('cineProgress').style.width='100%';$('cineSkip').textContent=kind==='won'?'다음 임무':'재도전';$('cineSkip').classList.add('resultReady');$('cineSkip').onclick=()=>{clearCine();let v=kind==='won'?(modeIndex+1)%24:modeIndex;$('missionSelect').value=v;load(v);visualStart()}}$('cineSkip').classList.remove('resultReady');$('cineSkip').onclick=()=>result?readyResult():finishCine(serial);if(glitch&&!matchMedia('(prefers-reduced-motion: reduce)').matches){let fx=$('glitchFX');fx.className='';void fx.offsetWidth;fx.className='glitchOn'}sfx(kind);terminalPush(lines);let body=lines.map((line,i)=>i===0?'ghost@local:js> '+line:'  '+line).join('\n'),start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(){if(cine?.serial!==serial)return;let f=Math.min(1,(performance.now()-start)/duration),p=Math.min(1,f/.78),count=reduced?body.length:Math.floor(p*body.length),code=$('cineCode');code.textContent=body.slice(0,count)+(p<1?' ▌':'');code.scrollTop=code.scrollHeight;$('cineProgress').style.width=(f*100)+'%';if(p<1&&Math.random()<.34)beep(650+Math.random()*160,.022,.013,'triangle');if(f>=1){if(result)readyResult();else finishCine(serial)}else cine.timer=setTimeout(frame,32)}frame();return true}
function finishCine(serial){if(cine?.serial!==serial)return;let fn=cine.after;clearCine();if(fn)fn();if(phase==='running'&&!guideOpen&&!active&&!cine)showFirstGuides();tick()}
function queueAlert(title,sub,kind='warn',glitch=false,lines=[]){if(phase!=='running')return;if(kind==='ok'){terminalPush(lines);return}if(alertQueue.some(x=>x.title===title))return;alertQueue.push({title,sub,kind,glitch,lines,duration:kind==='danger'?1350:1050})}
function pumpAlerts(){if(!cine&&!guideOpen&&pausedAt===null&&phase==='running'&&alertQueue.length&&(!active||active.ready))playCine(alertQueue.shift())}
function visualStart(){if(phase!=='ready'||cine)return;soundInit();openMission(true)}function visualStartCore(){if(phase!=='ready')return;terminalPush(['ghost@local:js> const mission = m.name;', '// SESSION INITIALIZED', '// '+m.name]);sfx('ok');startCore()}
function visualApply(id,k){if(phase!=='running'||clock()<=0||cine)return;let n=m.ns[id],t=currentTask(n,k),result=operationResult;operationResult=null;terminalPush(commandLines(id,k,t,result));sfx('ok');let before=m.ns.filter(q=>q.seen).length;applyCore(id,k);terminalPush([`// RESULT: permission=${m.ns[id].permission} / identified=${m.ns[id].identified}`,`// DISCOVERED: +${m.ns.filter(q=>q.seen).length-before}`]);if(!guideOpen){$('map').querySelector(`[data-id="${id}"]`)?.classList.add('focusPulse')}}

const conciseRules=[["기준과 다른 코드를 찾으세요.", "다른 코드를 모두 누르면 완료됩니다."], ["기준과 똑같은 코드를 찾으세요.", "일치하는 블록을 모두 누르세요."], ["위아래 같은 위치의 비트를 비교하세요.", "기준과 다른 비트만 누르세요."], ["왼쪽과 오른쪽의 같은 코드를 연결하세요.", "왼쪽 코드 → 오른쪽 코드 순으로 누르세요."], ["첫 글자에 맞는 채널로 분류하세요.", "데이터를 누른 뒤 같은 문자 채널을 누르세요."], ["표시된 조건에 맞는 데이터만 찾으세요.", "조건을 모두 만족하는 블록을 누르세요."], ["데이터가 반복되거나 이동하는 규칙을 찾으세요.", "다음에 올 블록을 고르세요."], ["앞뒤 데이터의 규칙을 찾으세요.", "빈칸에 들어갈 블록을 고르세요."], ["입력과 출력이 어떻게 바뀌는지 살펴보세요.", "새 입력에도 같은 규칙을 적용하세요."], ["각 후보를 단서 코드와 비교하세요.", "두 일치 개수가 모든 단서와 맞는 후보가 정답입니다."], ["숫자를 눌러 코드를 바꾸고 검사하세요.", "검사 결과를 이용해 모든 자리를 맞추세요."], ["선택한 숫자의 합을 목표값과 맞추세요.", "다시 누르면 선택이 취소됩니다."], ["값을 눌러 바꾸세요.", "모든 조건에 ✓가 표시되면 완료됩니다."], ["먼저 필요한 블록부터 활성화하세요.", "선행 조건이 모두 완료된 블록을 누르세요."], ["정상 규칙을 확인하세요.", "규칙을 어기는 데이터만 누르세요."], ["입력 비트를 눌러 0과 1을 바꾸세요.", "기준과 모든 위치를 맞추세요."], ["S에서 T까지 상하좌우로 연결하세요.", "장애물을 피해 표시된 최단 이동 수를 맞추세요."], ["연결선을 눌러 전체 노드를 연결하세요.", "고정선은 유지하고 총 비용을 최소화하세요."], ["연결선을 눌러 X를 고립시키세요.", "S와 T의 연결은 유지하고 차단 비용을 최소화하세요."], ["같은 문자 쌍을 각각 연결하세요.", "교차 없이 장애물 외 모든 칸을 채우세요."], ["블록을 눌러 회전시키세요.", "IN부터 OUT과 모든 분기 종점까지 연결하세요."], ["앞 조각의 끝과 다음 조각의 시작을 맞추세요.", "조각을 순서대로 선택해 배열하세요."], ["필요한 명령을 먼저 실행하도록 배열하세요.", "선행 조건에 맞춰 모든 명령을 선택하세요."], ["1부터 마지막 숫자까지 차례로 누르세요.", "숫자의 위치는 무작위로 배치됩니다."], ["채널마다 1번부터 차례로 누르세요.", "A와 B 등 채널 사이를 자유롭게 오갈 수 있습니다."]];

const guideShort={permission:['연결 경로를 먼저 확보하세요.','보안 작업을 시작할 수 있습니다.','내부 정보와 후속 설비를 확인합니다.','설비 기능을 조작합니다. 열람도 가능합니다.'],difficulty:['적은 데이터와 단순한 조건','더 많은 데이터와 조건','복잡한 조건과 연결 구조'],critical:['목표나 대체 경로에 관련된 중요한 설비입니다.'],risk:['추가 보안 또는 감시 기능이 있습니다.','일반 임무에서 접근 시 추적 위험이 커집니다.'],restricted:['강화된 보안이 적용된 설비입니다.'],hidden:['식별 작업을 해결하면 정체가 공개됩니다. 권한 확보는 별도입니다.'],trace:['추적이 진행 중입니다.','주의 경보가 시작됩니다.','일부 연결이 끊길 수 있습니다.','발각 위험이 매우 높습니다.','발각되어 임무에 실패합니다.'],riskActive:['첫 작업 시 추적률 +5%p','첫 작업 시 추적률 +12%p'],outage:['우회하거나 15초 후 복구를 기다리세요. 확보한 권한은 유지됩니다.'],conditional:['첫 실제 작업부터 시간과 추적이 시작됩니다.']};
function puzzleLesson(id,level=0){let lines=[...conciseRules[id-1]];let extra=id===10||id===11?`<div class="keyLegend"><div><b class="green">자리 일치</b><span>숫자와 위치가 모두 같음</span></div><div><b class="amber">숫자만 일치</b><span>숫자는 같고 위치가 다름</span></div></div>`:id===16?`<p class="teachExtra">${['선택한 비트만 반전','오른쪽 이웃도 반전','양옆 이웃도 반전'][level]}</p>`:'';return `<div class="teachSplit"><div class="teachText"><div class="teachLabel">해결 방법</div>${lines.map((v,i)=>`<div class="teachStep"><b>${i+1}</b><span>${v}</span></div>`).join('')}${extra}</div><div class="teachVisual"><div class="teachLabel">예시</div>${tutorialDemo(id,level)}</div></div>`}
function stateVisual(key,label,color,i,type){if(key==='permission')return `<div class="miniNode" style="--mark:${color}">${icon('data',color)}</div><b style="color:${color}">${label}</b>`;if(key==='difficulty')return `<div class="miniTask"><span>보안 작업</span><b class="level" data-level="${i}">${label}</b></div>`;if(key==='trace')return `<div class="traceExample" style="--mark:${color}"><i style="width:${[18,30,60,85,100][i]}%"></i></div><b style="color:${color}">${[18,30,60,85,100][i]}%</b>`;if(key==='riskActive')return `<b style="color:${color}">TRACE +${i===0?5:12}%p</b>`;if(key==='outage')return `<span class="brokenLine">● ┄ × ┄ ●</span>`;if(key==='conditional')return `<b class="amber">대기</b><span>→</span><b class="green">06:00 → 05:59</b>`;return `<div class="miniNode marked" style="--mark:${color}">${key==='hidden'?'<span>?</span>':icon(type&&devices[type]?type:'data',COL.available)}</div><b style="color:${color}">${label.split(' · ')[0]}</b>`}
function systemLesson(key,type){if(key==='device'){let d=devices[type];return `<div class="teachSplit"><div class="teachText"><div class="teachLabel">역할</div><div class="teachStep"><span>${d[2]}</span></div></div><div class="teachVisual"><div class="teachLabel">지도 표시</div><div class="deviceSample"><div class="miniNode large" style="--mark:${type==='local'?COL.control:COL.available}">${icon(type,type==='local'?COL.control:COL.available)}</div><b>${d[0]}</b><small>${d[1]}</small></div></div></div>`}let def=stateGuides[key];return `<div class="stateLesson"><div class="teachLabel">설명</div><div class="teachLabel">지도·상태 표시 예시</div>${def.items.map(([label,color,desc],i)=>{let c=key==='difficulty'?['#66dfad','#e4bc6c','#ef737b'][i]:color;return `<div class="stateText" style="--mark:${c}"><b>${label}</b><span>${guideShort[key]?.[i]||desc}</span></div><div class="stateVisual">${stateVisual(key,label,c,i,type)}</div>`}).join('')}</div>`}
let helpOpen=false;
function showHelpList(){ $('helpBack').hidden=true;let sections=[['시스템',progress.stateIntro.filter(k=>stateGuides[k]).map(k=>[stateGuides[k].title,'state',k])],['설비',progress.deviceIntro.filter(k=>devices[k]).map(k=>[devices[k][0],'device',k])],['논리게임',progress.intro.filter(k=>defs[k-1]).sort((a,b)=>a-b).map(k=>[String(k).padStart(2,'0')+' · '+defs[k-1][1],'puzzle',k])]];$('helpBody').innerHTML=`<div class="helpList">${sections.map(([title,items])=>`<div class="helpGroup"><h3>${title} <small>${items.length}</small></h3>${items.length?items.map(([label,kind,key])=>`<button data-help-kind="${kind}" data-help-key="${key}">${label}<span>›</span></button>`).join(''):'<div class="emptyHelp">아직 본 설명이 없습니다.</div>'}</div>`).join('')}</div>`;$('helpBody').querySelectorAll('[data-help-kind]').forEach(b=>b.onclick=()=>showHelpItem(b.dataset.helpKind,b.dataset.helpKey))}
function showHelpItem(kind,key){$('helpBack').hidden=false;let title=kind==='puzzle'?defs[+key-1][1]:kind==='device'?devices[key][0]:stateGuides[key].title;$('helpBody').innerHTML=`<h3 class="helpItemTitle">${title}</h3>${kind==='puzzle'?puzzleLesson(+key,Math.max(0,progress.levels[key]??0)):systemLesson(kind==='device'?'device':key,kind==='device'?key:null)}`;$('helpBody').scrollTop=0}
function openHelp(){if(cine||guideOpen||active||helpOpen||!$('missionShade').hidden)return;helpOpen=true;guideOpen=true;pauseIntro();$('helpShade').hidden=false;showHelpList();tick()}
function closeHelp(){if(!helpOpen)return;helpOpen=false;$('helpShade').hidden=true;guideOpen=false;resumeIntro();if(phase==='running')showFirstGuides();tick()}
$('helpToggle').onclick=openHelp;$('helpClose').onclick=closeHelp;$('helpBack').onclick=showHelpList;

const start=visualStart,apply=visualApply,winMission=visualWin,failMission=visualFail,load=visualLoad;
$('missionSelect').innerHTML=tutorial.map((v,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} 입문 · ${v[0]}</option>`).join('')+missionTypes.map((v,i)=>`<option value="${i+12}">TEST · ${v[0]}</option>`).join('');$('missionSelect').onchange=e=>load(e.target.value);$('restart').onclick=()=>load(modeIndex);$('resetProgress').onclick=()=>{if(!window.confirm('임무 완료 기록과 최초 안내 이력을 모두 초기화할까요?'))return;progress={tutorial:0,levels:{},devices:[],games:[],intro:[],stateIntro:[],deviceIntro:[]};save();$('missionSelect').value='0';load(0)};$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};function zoom(f){let w=Math.max(260,Math.min(1000,view.w*f)),h=w*420/820;view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};$('map').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view={x:0,y:0,w:820,h:420};renderMap()};let drag=null,pointers=new Map();const svg=$('map');svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,v:{...view},id:e.target.closest('[data-id]')?.dataset.id,moved:false};svg.setPointerCapture(e.pointerId)}else if(pointers.size===2){let a=[...pointers.values()];drag={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),v:{...view}};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!drag)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(drag.pinch&&pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),w=Math.max(260,Math.min(1000,drag.v.w*drag.d/Math.max(d,1))),h=w*420/820;view={x:drag.v.x+(drag.v.w-w)/2,y:drag.v.y+(drag.v.h-h)/2,w,h}}else if(!drag.pinch){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;let scale=Math.max(view.w/svg.clientWidth,view.h/svg.clientHeight);view={...drag.v,x:drag.v.x-dx*scale,y:drag.v.y-dy*scale}}svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(drag&&!drag.pinch&&!drag.moved&&drag.id!==undefined){selected=Number(drag.id);renderMap();renderDetail()}if(!pointers.size)drag=null;}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null});svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.dataset.id!==undefined){e.preventDefault();selected=Number(e.target.dataset.id);renderMap();renderDetail()}});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});setInterval(tick,200);$('missionSelect').value=Math.min(progress.tutorial,12);load(Number($('missionSelect').value));
</script></body></html>
