x0EfUAAAA"><div><small>CIPHER / LIVE COMM</small><strong>오류 검출</strong></div><span class="hold">시간 정지</span></div><div class="teachBody"><div class="teachText"><div class="label">해결 방법</div><p id="speech"></p></div><div class="teachVisual"><div class="exampleHead"><span class="label">문제 예시</span><button id="replay" class="aux">다시 보기</button></div><div id="demo" style="display:flex;flex:1;min-height:0"></div><div class="nav"><button id="prev">이전</button><span id="step" aria-live="polite"></span><button id="next">다음</button></div></div></div><div class="buttons"><button id="cancel">취소</button><button id="start" class="primary">문제 시작</button></div></section></div><script>const config={sound:true};

const $=id=>document.getElementById(id),levels=[[16,2,8],[32,4,8],[48,7,8]];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(level){const [n,count,cols]=levels[level],base=Array.from({length:8},()=>String(Math.floor(Math.random()*2))).join(''),targets=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,count),items=Array.from({length:n},(_,i)=>targets.includes(i)?String(1-Number(base[i%8])):base[i%8]);return {base,items,targets,cols}}
const check='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 8 3 3 7-7"/></svg>';let sound=config.sound!==false,audio=null;function scannerTone(kind){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')return;let now=audio.currentTime;const tone=(f,to,delay,dur,vol,type='sine')=>{const o=audio.createOscillator(),g=audio.createGain(),t=now+delay;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.035,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.01)};if(kind==='scan'){tone(260,780,0,1.52,.022,'sine');tone(520,980,0,1.52,.009,'triangle')}else{tone(175,72,0,.29,.105,'sine');tone(330,165,0,.17,.035,'triangle');tone(523.25,523.25,.06,.36,.043);tone(659.25,659.25,.15,.36,.039);tone(783.99,1046.5,.24,.45,.034)}}catch{}}
function beep(ok,final=false){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')return;let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?620:190,t);o.frequency.exponentialRampToValueAtTime(ok?(final?1040:860):110,t+.12);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)}catch{}}document.addEventListener('pointerdown',()=>{if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}},{passive:true});
function scanner(host,problem,{demo=false,onDone=()=>{},onSolved=()=>{},onError=()=>{}}={}){let sweepFrame=0,disposed=false,found=new Set(),errors=0,finished=false,paused=false,scanning=false,timers=new Set(),wrongTimers=new Map();const after=(ms,fn)=>{let id=setTimeout(()=>{timers.delete(id);if(!disposed)fn()},ms);timers.add(id);return id};const el=document.createElement('section');el.className='scanner bit';el.innerHTML=`<div class="top"><span>BIT INSPECTION</span><strong class="state">검사 대기</strong></div><div class="workspace"><aside class="side"><div class="statusPanel"><div class="progressRow"><span class="label">오류 검출</span><div class="counter">0 <small>/ ${problem.targets.length}</small></div></div><div class="meter"><i></i></div><div class="monitorHead"><span class="label">비트 분석</span><span class="monitorId" hidden>--</span></div><div class="position">선택 대기</div><div class="monitor"><div class="compare" role="img" aria-label="비트 비교"></div><div class="finalReport" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-8"/></svg><strong>검출 완료</strong><small class="reportCount"></small></div><div class="signal" role="status">비트 선택 대기</div></div></div></aside><div class="board"><div class="boardHead"><span class="goalLabel"><span class="goalFull">기준과 <b class="goalWord">일치하지 않는 비트</b>를 모두 선택</span><span class="goalCompact">목표: <b class="goalWord">불일치 비트</b> 선택</span></span><span class="goalCount">${problem.items.length}개</span></div><div class="matrixWrap"><div class="channelMatrix" style="--rows:${problem.items.length/8}"><div class="matrixLabels"><span aria-hidden="true"></span><span class="refLabel"><span>기준<br>비트열</span></span><span class="dataLabel">검사 데이터</span>${Array.from({length:problem.items.length/8},(_,r)=>`<span class="rowIndex"><span class="rowWord">DATA</span>${String(r+1).padStart(2,'0')}</span>`).join('')}</div>${[...problem.base].map((c,i)=>`<div class="channel" data-col="${i}"><span class="channelIndex">${String(i+1).padStart(2,'0')}</span><span class="refBit">${c}</span><span class="channelBridge" aria-hidden="true"></span></div>`).join('') }</div></div></div></div><div class="foot"><span>LOCAL // DATA SCANNER</span><span class="err">오선택 0</span></div>`;host.replaceChildren(el);const q=s=>el.querySelector(s),channels=[...el.querySelectorAll('.channel')],refs=channels.map(c=>c.querySelector('.refBit')),signal=q('.signal'),compare=q('.compare');const cells=problem.items.map((code,i)=>{let b=document.createElement('button');b.type='button';b.className='cell';b.dataset.i=i;b.innerHTML=`<span class="addr">${String(i+1).padStart(2,'0')}</span><span class="code">${[...code].map(c=>'<span>'+c+'</span>').join('')}</span><span class="flag">${check}</span>`;b.setAttribute('aria-label',`${Math.floor(i/8)+1}행 ${i%8+1}열 비트 ${code}`);b.disabled=demo;b.onclick=()=>choose(i);channels[i%8].append(b);return b});function status(text,cls=''){signal.textContent=text;signal.className='signal '+cls}function controls(){cells.forEach((b,i)=>b.disabled=demo||paused||finished||scanning||found.has(i))}function analysis(i=null,pending=false){const col=i===null?-1:i%8,ref=col<0?'–':problem.base[col],value=i===null?'–':problem.items[i],diff=i!==null&&!pending&&ref!==value; q('.position').textContent=i===null?'선택 대기':`${Math.floor(i/8)+1}행 · ${col+1}열`;q('.monitorId').textContent=i===null?'--':String(i+1).padStart(2,'0');refs.forEach((x,k)=>x.classList.toggle('refActive',k===col));compare.innerHTML=`<span class="readLabel">기준</span><span></span><span class="readLabel">선택</span><span class="readValue refValue">${ref}</span><span class="compareSymbol ${diff?'mismatch':i!==null&&!pending?'match':''}">${i===null?'·':pending?'···':diff?'≠':'='}</span><span class="readValue ${diff?'mismatch':''}">${value}</span>`;compare.setAttribute('aria-label',i===null?'선택 대기':`${Math.floor(i/8)+1}행 ${col+1}열 기준 ${ref}, 선택 ${value}`)}analysis();

function clearCompareCue(){refs.forEach(e=>e.classList.remove('lessonRef','lessonMismatch'));cells.forEach(e=>e.classList.remove('lessonTarget','lessonMismatch'));channels.forEach(e=>e.classList.remove('lessonRail','lessonMismatch'))}
function compareCue(i){if(!demo||disposed)return;clearCompareCue();const col=i%8,ref=refs[col],cell=cells[i],rail=channels[col],mismatch=problem.base[col]!==problem.items[i];ref.classList.add('lessonRef');cell.classList.add('lessonTarget');rail.classList.add('lessonRail');if(mismatch){ref.classList.add('lessonMismatch');cell.classList.add('lessonMismatch');rail.classList.add('lessonMismatch')}analysis(i);q('.position').textContent=`비교 예시 · ${Math.floor(i/8)+1}행 ${col+1}열`;status(mismatch?'불일치 · 선택 대상':'일치 · 정상 비트',mismatch?'diffResult':'ok')}
function mark(i){found.add(i);const b=cells[i];b.classList.add('found');b.disabled=true;b.classList.remove('cue');b.setAttribute('aria-label',`${Math.floor(i/8)+1}행 ${i%8+1}열 오류 비트 검출 완료`);b.querySelector('.code span').classList.add('diff');q('.counter').innerHTML=`${found.size} <small>/ ${problem.targets.length}</small>`;q('.statusPanel .meter i').style.width=100*found.size/problem.targets.length+'%';q('.state').textContent='검출 중';analysis(i);status('불일치 · 오류 검출','diffResult')}
function complete(){finished=true;controls();onSolved(errors);q('.state').textContent='최종 확인 대기';after(1800,()=>{q('.state').textContent='검출 결과 검증';status('검출 결과 확인 중');const board=q('.board'),line=document.createElement('div'),reveal=document.createElement('div');line.className='finalSweep';reveal.className='scanReveal';board.style.setProperty('--scan-y','0px');board.append(reveal,line);scannerTone('scan');const sweepDuration=1600;const layout=()=>{const r=board.getBoundingClientRect();reveal.replaceChildren(...[...found].map(i=>{const c=cells[i].getBoundingClientRect(),o=document.createElement('div');o.className='scanOutline';o.style.cssText=`left:${c.left-r.left-board.clientLeft}px;top:${c.top-r.top-board.clientTop}px;width:${c.width}px;height:${c.height}px`;return o}));};layout();const start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let w=board.clientWidth,h=board.clientHeight;const frame=now=>{if(disposed)return;const progress=Math.min(1,Math.max(0,(now-start)/sweepDuration));if(w!==board.clientWidth||h!==board.clientHeight){w=board.clientWidth;h=board.clientHeight;layout()}board.style.setProperty('--scan-y',`${(reduced?(progress===1?1:0):progress)*h}px`);if(progress<1){sweepFrame=requestAnimationFrame(frame);return}sweepFrame=0;line.remove();reveal.remove();[...found].forEach(i=>cells[i].classList.add('verify'));q('.state').textContent='검출 완료';q('.monitor').classList.add('final');q('.finalReport').hidden=false;q('.reportCount').textContent=`오류 ${found.size}개 확인`;el.classList.add('celebrating');const celebration=document.createElement('div');celebration.className='scannerCelebration';celebration.setAttribute('role','status');celebration.innerHTML=`<div class="burst" aria-hidden="true"></div><div class="burstGlow" aria-hidden="true"></div><div class="successPlate"><svg class="plateFrame" viewBox="0 0 190 88" preserveAspectRatio="none" aria-hidden="true" fill="none"><defs><linearGradient id="scannerPlateFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163c32" stop-opacity=".98"/><stop offset="1" stop-color="#0a1c22" stop-opacity=".98"/></linearGradient></defs><path class="frameOuter" d="M12 1H178L189 12V76L178 87H12L1 76V12Z" fill="url(#scannerPlateFill)"/><path class="frameInner" d="M15 5H175L185 15V73L175 83H15L5 73V15Z"/><path class="frameCorner" pathLength="1" d="M1 24V12L12 1H32"/><path class="frameCorner" pathLength="1" d="M189 24V12L178 1H158"/><path class="frameCorner" pathLength="1" d="M1 64V76L12 87H32"/><path class="frameCorner" pathLength="1" d="M189 64V76L178 87H158"/></svg><svg class="successIcon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 4h18l11 11v18L33 44H15L4 33V15Z"/><path class="tick" d="m14 24 7 7 14-15" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>검출 완료</strong><small>오류 ${found.size}개 확인</small></div>`;el.append(celebration);scannerTone('success');after(1500,()=>{celebration.remove();el.classList.remove('celebrating');onDone()})};if(reduced)line.hidden=true;sweepFrame=requestAnimationFrame(frame)})}
function choose(i,force=false){if(disposed||finished||scanning||found.has(i)||(!force&&(demo||paused)))return false;const b=cells[i],ok=problem.targets.includes(i);scanning=true;controls();b.classList.add('scanning');q('.state').textContent='비교 중';q('.state').classList.add('scanningState');analysis(i,true);status('기준 비트와 비교 중');after(520,()=>{b.classList.remove('scanning');q('.state').classList.remove('scanningState');scanning=false;if(!ok){errors++;onError(errors);q('.err').textContent='오선택 '+errors;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');if(wrongTimers.has(i))clearTimeout(wrongTimers.get(i));wrongTimers.set(i,after(450,()=>{b.classList.remove('wrong');wrongTimers.delete(i)}));analysis(i);status('일치 · 오선택','bad');q('.state').textContent='검출 중';beep(false)}else{mark(i);beep(true);if(found.size===problem.targets.length)complete()}controls()});return ok}return {el,cells,choose,mark,status,compareCue,clearCompareCue,resetAnalysis,restoreErrors(n){errors=n;q('.err').textContent='오선택 '+n},pause(v){paused=v;controls()},dispose(){disposed=true;clearCompareCue();if(sweepFrame)cancelAnimationFrame(sweepFrame);timers.forEach(clearTimeout);timers.clear();el.remove()},get state(){return {found:[...found],errors,finished,scanning}}}}
const sample={base:'10110010',items:[...'1001001010110110'],targets:[2,13],cols:8};
const speech=['데이터에 오류가 발생했어. 기준 비트열과 비교해서 오류 비트를 찾아내야 해.','맨 위 파란색 줄이 기준 비트열이야. 같은 세로줄의 비트끼리 비교해.','기준은 1인데 아래는 0이야. 이렇게 일치하지 않는 비트를 선택해.','기준과 일치하는 비트는 정상이야. 선택하면 오선택으로 기록돼.','오류 비트를 모두 찾아내면 검출이 완료돼.'];
function emphasize(el,message){el.replaceChildren();const chunks=message.split(/(일치하지 않는 비트|오류 비트|기준 비트열)/g);chunks.forEach(t=>{if(/^(일치하지 않는 비트|오류 비트|기준 비트열)$/.test(t)){const b=document.createElement('strong');b.className='goalWord';b.textContent=t;el.append(b)}else el.append(document.createTextNode(t))})}
let live=null,lesson=null,index=0,serial=0,lessonTimers=[],busy=false;
function newGame(){live?.dispose();live=scanner($('host'),generate($('difficulty').selectedIndex))}
function cancelLesson(){serial++;lessonTimers.forEach(clearTimeout);lessonTimers=[];lesson?.dispose();lesson=null;busy=false}
function nav(){emphasize($('speech'),speech[index]);$('step').textContent=`${index+1}/${speech.length}`;$('prev').disabled=index===0;$('next').disabled=busy||index===speech.length-1}
function showStep(i){if(!Number.isInteger(i)||i<0||i>=speech.length)return;cancelLesson();index=i;const token=serial;const later=(ms,f)=>lessonTimers.push(setTimeout(()=>{if(serial===token)f()},ms));lesson=scanner($('demo'),sample,{demo:true,onDone:()=>{if(serial===token){busy=false;nav()}}});if(i>=3){lesson.mark(2);lesson.resetAnalysis()}if(i===4)lesson.restoreErrors(1);busy=i>=1;nav();if(i===0)return;let target=i===1?0:i===2?2:i===3?0:13;later(4000,()=>lesson.compareCue(target));if(i===1){later(1500+4000,()=>{busy=false;nav()});return}later(5700,()=>{lesson.clearCompareCue();lesson.choose(target,true);if(i!==4)later(1600,()=>{busy=false;nav()})})}
function openLesson(){live.pause(true);$('shade').hidden=false;showStep(0)}function closeLesson(){cancelLesson();$('shade').hidden=true;live.pause(false)}$('prev').onclick=()=>showStep(index-1);$('next').onclick=()=>{if(!busy&&index<speech.length-1)showStep(index+1)};$('replay').onclick=()=>showStep(index);$('help').onclick=()=>{if(!live.state.scanning)openLesson()};$('cancel').onclick=closeLesson;$('start').onclick=()=>{closeLesson();newGame()};$('difficulty').onchange=newGame;$('reset').onclick=newGame;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='효과음 '+(sound?'ON':'OFF')};$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};newGame();openLesson();
</script></body></html>
