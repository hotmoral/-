function rotateGame(){let cols=5,rows=4,n=cols*rows,ids=seq(n),route=[];for(let y=0;y<rows;y++){for(let x=0;x<cols;x++)route.push(y*cols+(y%2?cols-1-x:x))}if(R(0,1))route=route.map(k=>Math.floor(k/cols)*cols+(cols-1-k%cols));if(R(0,1))route.reverse();let dirs=(a,b)=>b===a-cols?0:b===a+1?1:b===a+cols?2:3,base=ids.map(()=>[]);route.forEach((k,i)=>{if(i>0)base[k].push(dirs(k,route[i-1]));if(i<n-1)base[k].push(dirs(k,route[i+1]))});let first=route[0],last=route.at(-1);function outside(k){return k%cols===0?3:k%cols===cols-1?1:Math.floor(k/cols)===0?0:2}base[first].push(outside(first));base[last].push(outside(last));let rot=ids.map(()=>R(0,3));function get(k){return base[k].map(d=>(d+rot[k])%4)}function matching(){return ids.filter(k=>get(k).every(d=>{let x=k%cols,y=Math.floor(k/cols),nx=x+[0,1,0,-1][d],ny=y+[-1,0,1,0][d];if(nx<0||nx>=cols||ny<0||ny>=rows)return (k===first||k===last)&&d===outside(k);return get(ny*cols+nx).includes((d+2)%4)})&&((k!==first&&k!==last)||get(k).includes(outside(k)))).length}function connected(){let seen=new Set([first]),q=[first];while(q.length){let k=q.shift();for(let d of get(k)){let x=k%cols+[0,1,0,-1][d],y=Math.floor(k/cols)+[-1,0,1,0][d];if(x<0||x>=cols||y<0||y>=rows)continue;let j=y*cols+x;if(!seen.has(j)&&get(j).includes((d+2)%4)){seen.add(j);q.push(j)}}}return seen.size===n}if(matching()===n)rot[0]=(rot[0]+1)%4;return{draw(p){label(p,'모든 회로 조각 연결 · S에서 T로 데이터 전송');grid(p,cols,ids,k=>{let a=get(k),b=button('',()=>{rot[k]=(rot[k]+1)%4;let m=matching();progress(m/n);render();if(m===n&&connected())win()},'cell',{tile:k});b.style.aspectRatio='1.65';b.style.minHeight='22px';let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';for(let d of a){let line=document.createElementNS(svg.namespaceURI,'line');let end=[[50,0],[100,50],[50,100],[0,50]][d];Object. function sequenceGame(groups,count){let items=shuffle(seq(groups*count).map(k=>({g:Math.floor(k/count),n:k%count+1}))),counts=seq(groups).map(()=>0),total=groups*count;function accept(k,g=null,el=null){let x=items[k];if(x.n<=counts[x.g])return;if(g!==null&&g!==x.g){bad('채널 불일치');if(el)flash(el);return}if(x.n!==counts[x.g]+1){bad('순서 오류');if(el)flash(el);return}counts[x.g]++;good('DATA ACCEPTED');progress(counts.reduce((a,b)=>a+b,0)/total);render();if(counts.every(n=>n===count))win()}return{draw(p){if(groups===1)label(p,`NEXT / ${counts[0]===count?'DONE':String(counts[0]+1).padStart(2,'0')}`,'ref');grid(p,groups===1?5:8,items,(x,k)=>{let processed=x.n<=counts[x.g],b=button(processed?'✓':(groups===1?'':letters[x.g]+'-')+x.n,el=>accept(k,null,el),'cell '+(processed?'empty':''),{seq:k});if(groups>1&&!processed){b.style.color=groupColors[x.g];dragItem(b,k,(j,g)=>accept(j,g))}return b},groups>1?'board40':'');if(groups>1){counts.forEach((n,g)=>{let d=E('div','folder');let a=E('b','',letters[g]);a.style.color=groupColors[g];d.append(a);let bar=E('div','slots');for(let j=1;j<=count;j++){let f=E('span',j<=n?'filled':'',j);if(j<=n)f.style.color=groupColors[g];bar.append(f)}d.append(bar,E('span','count',n+'/'+count));d.dataset.folder=g;d.style.borderBottom='1px solid #29434e';p.append(d)})}},solve(){for(let g=0;g<groups;g++)for(let n=1;n<=count;n++){let k=items.findIndex(x=>x.g===g&&x.n===n);click(`[data-seq="${k}"]`)}}}}
