function cameraDraw(t){let canvas=$('camcanvas');if(!canvas||activeTab!=='cctv')return;let c=canvas.getContext('2d'),w=640,h=360;if(!state.camLoop&&!state.paused&&!state.ended)displayTime=t;const ct=displayTime/1000,cam=camId;let vx=[351,320,282][cam],vy=[143,150,135][cam];function poly(pts,fill,stroke){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.stroke()}}function line(x,y,X,Y,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}function rect(x,y,a,b,color){c.fillStyle=color;c.fillRect(x,y,a,b)}let grad=c.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#46544e');grad.addColorStop(.5,'#6a7970');grad.addColorStop(1,'#25302e');rect(0,0,w,h,grad);poly([[0,0],[w,0],[vx+40,vy-24],[vx-40,vy-24]],'#35433f');poly([[0,h],[w,h],[vx+40,vy+53],[vx-40,vy+53]],'#4d5b55');poly([[0,0],[vx-40,vy-24],[vx-40,vy+53],[0,h]],'#53615a');poly([[w,0],[vx+40,vy-24],[vx+40,vy+53],[w,h]],'#394841');rect(vx-40,vy-24,80,77,'#293934');for(let x=-100;x<850;x+=115)line(x,h,vx,vy+42,'#202f2c',1);for(let i=0;i<8;i++){let yy=vy+53+(h-vy-53)*(i/7)**2;line(0,yy,w,yy,'#283b36',1)}for(let i=0;i<5;i++){let s=1-i*.18,y=vy-24-(vy-24)*s;poly([[vx-67*s,y],[vx+67*s,y],[vx+47*s,y+10*s],[vx-47*s,y+10*s]],'#b8d1be');c.fillStyle='#c4e2cc14';c.fillRect(vx-100*s,y,200*s,19*s)}for(let i=0;i<5;i++){let z=.16+i*.19;let x=(vx-40)*(1-z),y0=(vy-24)*(1-z),y1=(vy+53)*(1-z)+h*z;line(x,y0,x,y1,'#33423d',2);let rx=vx+40+(w-vx-40)*z;line(rx,y0,rx,y1,'#24372e',2)}
if(cam===2){for(let side=0;side<2;side++)for(let i=0;i<4;i++){let z=1-i*.22,xx=side? w-115*z-20:20+65*(1-z),yy=vy+(10-vy)*z,ww=92*z,hh=240*z;rect(xx,yy,ww,hh,'#172522');rect(xx+4,yy+4,ww-8,hh-8,'#34443e');for(let k=0;k<9;k++){let ry=yy+12*z+k*23*z;rect(xx+8*z,ry,ww-16*z,14*z,'#192c26');for(let m=0;m<3;m++)rect(xx+(12+m*7)*z,ry+5*z,3*z,2*z,(Math.floor(ct*2)+i+k+m)%5===0?'#d9b27a':'#78c391')}}}else{for(let i=0;i<3;i++){let z=1-i*.28,x=cam===0?60+100*(1-z):w-180*z-35,y=vy+(40-vy)*z,ww=82*z,hh=230*z;poly([[x,y],[x+ww,y+10*z],[x+ww,y+hh],[x,y+hh+30*z]],'#283732','#1c2926');rect(x+ww*.72,y+hh*.54,5*z,13*z,'#a4b4a4');rect(x+9*z,y+15*z,ww-18*z,25*z,'#69786e');}}
let doorW=46,doorH=69;rect(vx-doorW/2,vy-13,doorW,doorH,'#19231f');if(!state.door||cam===2){rect(vx-doorW/2+3,vy-10,doorW-6,doorH-6,'#59665d');line(vx,vy-10,vx,vy+53,'#26342d',2);rect(vx+9,vy+25,3,8,'#b4beaa')}else{rect(vx-doorW/2+3,vy-10,8,doorH-6,'#59665d');rect(vx+doorW/2-11,vy-10,8,doorH-6,'#59665d');rect(vx-10,vy+23,20,30,'#405b4c')}
if(cam!==2){let phase=(ct*.13+cam*.27)%1,z=.28+.65*(.5-.5*Math.cos(phase*2*Math.PI)),px=vx+(cam===0?-1:1)*((45+80*Math.sin(phase*2*Math.PI))*z),py=vy+53+z*112,sz=46*z,step=Math.sin(ct*6)*sz*.15;c.fillStyle='#14251e88';c.beginPath();c.ellipse(px,py+2,sz*.45,sz*.13,0,0,Math.PI*2);c.fill();line(px-3*z,py-sz*.48,px-step-5*z,py,'#182620',6*z);line(px+3*z,py-sz*.48,px+step+5*z,py,'#1c2b24',6*z);rect(px-sz*.19,py-sz*.82,sz*.38,sz*.42,'#2a3930');line(px-sz*.16,py-sz*.74,px-sz*.3-step*.5,py-sz*.46,'#293c31',5*z);line(px+sz*.16,py-sz*.74,px+sz*.3+step*.5,py-sz*.46,'#293c31',5*z);c.fillStyle='#788479';c.beginPath();c.arc(px,py-sz*.93,sz*.13,0,Math.PI*2);c.fill();rect(px-sz*.15,py-sz*1.04,sz*.30,sz*.08,'#192a22');}
let vignette=c.createRadialGradient(w*.5,h*.5,75,w*.5,h*.5,360);vignette.addColorStop(0,'#0000');vignette.addColorStop(1,'#0009');rect(0,0,w,h,vignette);for(let i=0;i<160;i++){let x=Math.random()*w,y=Math.random()*h;rect(x,y,Math.random()*4+1,1,Math.random()>.5?'#cbd7bd16':'#0003')}if(Math.floor(ct*4)%17===0)rect(0,(ct*73)%h,w,2,'#d7e9d124');c.font='12px monospace';c.fillStyle='#b8c9b1';c.fillText('HELIX SECURITY  /  '+String(Math.floor(ct/60)%60).padStart(2,'0')+':'+String(Math.floor(ct)%60).padStart(2,'0'),12,h-12);}
function end(success){state.ended=true;state.paused=false;state.jobs=[];log(success?'DISCONNECTED :: 임무 성공':'CONNECTION TERMINATED :: 추적 완료',success?'ok':'bad');renderAll();$('overlay').classList.remove('hidden');$('dialog').innerHTML=`<h1 style="color:${success?'#65f3ba':'#ff686b'}">${success?'MISSION COMPLETE':'TRACE COMPLETE'}</h1><p>${success?'NOVA 원본 자료를 확보하고 연결을 안전하게 종료했습니다.':'보안 시스템에 의해 가상 연결이 강제로 종료되었습니다.'}</p><div class="missionbox">접속 장치 ${state.owned.size}/12 · 최종 추적률 ${Math.floor(state.trace)}% · 소요 ${Math.floor(state.elapsed)}초</div><button id="restart">다시 시작</button>`;$('restart').onclick=()=>{init();$('overlay').classList.add('hidden');beep(550,.1)}}
function showIntro(){state.paused=true;$('overlay').classList.remove('hidden');$('dialog').innerHTML='<h1>GHOST PROTOCOL</h1><p>OP. 01 / HELIX RESEARCH</p><div class="missionbox">목표: 가상 연구시설의 NOVA 원본 자료 확보 후 접속 종료.</div><p>네트워크에서 장치를 선택하고 오른쪽 보안 유형에 맞는 도구를 실행하세요. 연결 경로는 자유롭게 선택할 수 있습니다.</p><p>추적률 100%에 도달하면 실패합니다. 중계 서버와 감시 서버를 장악하면 추적을 줄일 수 있습니다.</p><button id="begin">접속 시작</button>';$('begin').onclick=()=>{state.paused=false;$('overlay').classList.add('hidden');beep(480,.12);renderAll()}}
function pause(){if(state.ended)return;state.paused=true;renderMetrics();$('overlay').classList.remove('hidden');$('dialog').innerHTML='<h1>SESSION PAUSED</h1><p>추적과 실행 중인 프로그램을 일시 정지했습니다.</p><button id="resume">계속하기</button><button class="secondary" id="reset">처음부터</button>';$('resume').onclick=()=>{state.paused=false;$('overlay').classList.add('hidden');renderAll()};$('reset').onclick=()=>{init();showIntro()}}
function tick(now){let dt=Math.min(.15,Math.max(0,(now-last)/1000));last=now;if(noticeUntil&&now>noticeUntil){$('notice').classList.remove('show');noticeUntil=0}if(state.started&&!state.paused&&!state.ended){state.elapsed+=dt;state.coverCooldown=Math.max(0,state.coverCooldown-dt);let oldTrace=state.trace;let rate=(state.suppressed?.18:.43)+(state.jobs.length? .13*state.jobs.length:0);if(state.owned.has('fw'))rate*=.83;if(state.camLoop)rate*=.92;state.trace=Math.min(100,state.trace+rate*dt);let changed=false;for(const j of state.jobs){j.left-=dt;let step=Math.floor((1-j.left/j.duration)*4);if(step>j.logStep&&step<4){j.logStep=step;let msgs={scan:['신호 수집','노드 식별','연결 분석'],decrypt:['가상 암호 블록 분석','패턴 검증','응답 확인'],spoof:['세션 협상','가상 서명 검증','권한 응답 대기'],cover:['중계 경로 연결','신호 분산','추적 갱신'],suppress:['감시 채널 분석','가상 방해 신호 전송','상태 검증'],transfer:['자료 블록 읽기','가상 패킷 전송','무결성 확인']};log(`> ${msgs[j.tool.id][step-1]} / ${step*25}%`);beep(320+step*80,.025,'triangle')}}let done=state.jobs.filter(j=>j.left<=0);if(done.length){state.jobs=state.jobs.filter(j=>j.left>0);for(let j of done)finish(j);changed=true}for(let thresh of [50,75,90])if(oldTrace<thresh&&state.trace>=thresh){log(`WARNING :: TRACE ${thresh}%`,'bad');toast(`추적률 ${thresh}% · 보안 경고`,true)}if(state.trace>=100){end(false)}else if(changed)renderAll();else if(now-lastDraw>120){renderTools();renderJobs();renderMetrics();lastDraw=now}}if(activeTab==='cctv'&&now-camFrame>70){cameraDraw(now);camFrame=now}requestAnimationFrame(tick)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{beep(350,.04);switchTab(b.dataset.tab)});$('pause').onclick=pause;$('exit').onclick=()=>{if(state.extracted&&!state.ended)end(true)};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'SFX ON':'SFX OFF';if(soundOn)beep()};$('full').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen();try{await screen.orientation.lock('landscape')}catch(e){}}}catch(e){toast('브라우저 전체화면 기능을 사용하세요.')}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.started&&!state.paused&&!state.ended)pause()});init();showIntro();requestAnimationFrame(tick);
