function makeGenerated(i,stage=1,seenLevels={}){let [name,type,ids,mode]=missionTypes[i],rand=Math.random,swap=rand()<.5;let lev=id=>Math.min(stage,(seenLevels[id]??-1)+1);let n=[node(0,'local',65,210),node(1,'gate',190,210,[2]),node(2,swap?'fire':'auth',345,92,[swap?13:10]),node(3,'relay',345,328,[17]),node(4,'mail',500,65,[6],[],{effect:'clue'}),node(5,'watch',500,325,[1],[15],{effect:'time',flags:['caution']}),node(6,type,710,210,mode==='control'?[ids[0]]:[[ids[0],lev(ids[0])], [ids[1],lev(ids[1])]],mode==='control'?[[ids[1],lev(ids[1])]]:[],{flags:['critical']})];if(mode==='control')n[6].read[0].level=lev(ids[0]);let edges=[[0,1],[1,2],[1,3],[2,4],[3,5],[2,6],[3,6]];if(!swap){n[2].control=[task(14)];n[2].effect='auth';n[3].grantFrom=2;}if(stage>=1&&rand()<.65){n[6].identified=false;n[6].flags.push('restricted');n[6].identify=task(5,lev(5));}if([4,5,6,11].includes(i))n[6].flags.push('hazard');if(stage>=2){n.push(node(7,'backup',710,325,[8],[],{effect:'backup'}));edges.push([5,7],[7,6]);}let alternative=stage>=2&&[0,2].includes(i)?7:null;if(alternative!==null){n[7].flags.push('critical');if(i===2)n[7].control=[task(16,lev(16))]}return {name,ns:n,edges,goals:[{id:6,permission:mode==='control'?2:1,alternative}],seconds:360+stage*90,kind:'generated',description:'복수 경로 중 필요한 설비를 선택해 목표를 달성하세요. 보조 설비를 활용할 수 있습니다.'}}
function adjacent(m,id){return m.edges.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0])}function accessible(m,n){return n.id===0||adjacent(m,n.id).some(id=>m.ns[id].permission>=1)}function reveal(m){let a=[];for(let n of m.ns)if(n.permission>=1)for(let id of adjacent(m,n.id))if(!m.ns[id].seen){m.ns[id].seen=true;a.push(id)}return a}function currentTask(n,kind){if(kind==='identify')return !n.identified?n.identify:null;return n[kind].find(t=>!t.done)||null}function can(m,n,kind){return !!(n&&n.seen&&accessible(m,n)&&(kind==='identify'?!n.identified&&n.identify: n.identified&&(kind==='read'?n.permission===0:kind==='control'&&n.permission===1&&n.control.length>0)))}
function transition(m,id,kind){let n=m.ns[id];if(!can(m,n,kind))return null;let t=currentTask(n,kind);if(t)t.done=true;let effect=null;if(kind==='identify'){n.identified=true}else if(!currentTask(n,kind)){n.permission=kind==='read'?1:2;if(n.effect==='auth'&&kind==='control'){for(let q of m.ns)if(q.grantFrom===id&&q.identified){q.read.forEach(t=>t.done=true);if(q.seen&&accessible(m,q))q.permission=Math.max(q.permission,1)}effect='연계 인증 승인';}if(n.effect==='time'&&kind==='control')effect='time';if(n.effect==='clue'&&kind==='read')effect='clue';if(n.effect==='backup'&&kind==='read')effect='백업 자료 확인';}return {t,effect,newIds:reveal(m)}}function goalDone(m,g){return m.ns[g.id].permission>=g.permission||(g.alternative!=null&&m.ns[g.alternative].permission>=g.permission)}function complete(m){return m.goals.every(g=>goalDone(m,g))}
function valid(m){if(m.ns.length<3||m.ns.some((n,i)=>n.id!==i)||m.edges.some(e=>e.some(i=>!m.ns[i])))return false;let clone=structuredClone(m);reveal(clone);for(let i=0;i<100&&!complete(clone);i++){let change=false;for(let n of clone.ns)for(let k of ['identify','read','control'])if(can(clone,n,k)){transition(clone,n.id,k);change=true}if(!change)return false}return complete(clone)}
let progress={tutorial:0,levels:{},devices:[],games:[]};try{let p=JSON.parse(localStorage.getItem('ghost_network_lab_v1')||'null');if(p)progress={...progress,...p}}catch{}function save(){try{localStorage.setItem('ghost_network_lab_v1',JSON.stringify(progress))}catch{}}
let m,selected=0,phase='ready',deadline=0,extra=0,logs=[],active=null,view={x:0,y:0,w:820,h:420},showNew=new Set(),modeIndex=0;const clock=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;function log(s){logs.unshift(s);logs=logs.slice(0,8);$('log').innerHTML=logs.map(x=>'<div>&gt; '+x+'</div>').join('')}
function icon(type,color){return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${devices[type][3]}</svg>`}function state(n){return n.permission===2?'control':n.permission===1?'read':accessible(m,n)?'available':'locked'}function display(n){return n.identified?devices[n.type][0]:'미식별 설비'}function markFlags(n){return n.flags.map(f=>`<span class="badge" style="color:${statuses[f][1]}">${statuses[f][0]}</span>`).join('')}
function renderMap(){let svg=$('map'),out='<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1b333e" stroke-width=".7"/></pattern></defs><rect x="-3000" y="-3000" width="6820" height="6420" fill="url(#grid)"/>';for(let [a,b] of m.edges){let u=m.ns[a],v=m.ns[b];if(!u.seen||!v.seen)continue;let col=u.permission&&v.permission?COL.read:u.permission||v.permission?COL.available:'#536770';out+=`<path d="M${u.x} ${u.y}L${v.x} ${v.y}" stroke="${col}" stroke-width="${u.permission&&v.permission?2.6:1.7}" stroke-dasharray="${u.permission||v.permission?'0':'5 4'}"/>`;}for(let n of m.ns.filter(n=>n.seen)){let c=COL[state(n)],flag=n.flags.includes('hazard')?'#ef737b':n.flags.includes('critical')?'#e4bc6c':n.flags.length?statuses[n.flags[0]][1]:null,dd=devices[n.type];out+=`<g class="node ${showNew.has(n.id)?'appear':''}" data-id="${n.id}" tabindex="0" role="button" aria-label="${display(n)}" transform="translate(${n.x} ${n.y})">${flag?`<rect class="${n.flags.includes('hazard')?'traceRing':''}" x="-36" y="-36" width="72" height="72" rx="10" fill="none" stroke="${flag}" stroke-width="1.5" stroke-dasharray="5 4"/>`:''}${selected===n.id?'<rect x="-40" y="-40" width="80" height="80" rx="11" fill="none" stroke="#dceeea" stroke-width="1.5"/>':''}<rect class="nodebox" x="-31" y="-31" width="62" height="62" rx="6" fill="#13272f" stroke="${c}" stroke-width="2"/>${n.identified?`<g transform="translate(-18 -18) scale(1.5)" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">${dd[3]}</g>`:`<text y="10" font-size="30" fill="${flag||c}" text-anchor="middle">?</text>`}<text y="49" fill="${c}" text-anchor="middle" font-size="16" font-weight="600">${n.identified?dd[1]:'UNKNOWN'}</text><text y="66" text-anchor="middle" fill="#a5babd" font-size="14">${display(n)}</text>${flag?`<text y="82" fill="${flag}" text-anchor="middle" font-size="12">${n.flags.map(f=>statuses[f][0]).join(' · ')}</text>`:''}</g>`}svg.innerHTML=out;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);$('count').textContent=`발견 ${m.ns.filter(n=>n.seen).length}개`;showNew.clear()}
function renderBrief(){let goals=m.goals.map((g,i)=>{let n=m.ns[g.id],ok=goalDone(m,g);return `<div class="goal ${ok?'ok':''}">${ok?'✓':'○'} ${n.seen?display(n):'목표 설비 '+(i+1)} · ${g.permission===2?'제어':'열람'}${g.alternative!=null?' · 백업 대체 가능':''}</div>`}).join('');$('brief').innerHTML=`<div class="tag">${m.kind==='tutorial'?'TRAINING '+String(m.tutorial+1).padStart(2,'0'):'FIELD TEST'}</div><div class="missionTitle">${m.name}</div><div class="small">${m.description}</div>${goals}${m.clue?`<div class="goal">메일 단서: 목표 종류는 ${devices[m.ns[m.goals[0].id].type][0]}. 위치·정체 식별 권한은 별도로 확보해야 합니다.</div>`:''}<div class="small">기본 시간 ${fmt(m.seconds)}${extra?' + '+extra+'초':''}<br>개별 작업 제한시간 없음</div><div class="notice">이번 버전은 네트워크 검수용입니다. 논리게임은 모의 성공 버튼으로 대체합니다.</div>${phase==='ready'?'<button class="primary" id="start">임무 시작</button>':phase==='running'?`<button class="primary" id="exit" ${complete(m)?'':'disabled'}>접속 종료 · 임무 완료</button>`:phase==='won'?'<button class="primary" id="next">다음 임무</button>':'<button class="primary" id="retry">재도전</button>'}<div class="small">입문 완료 ${progress.tutorial}/12 · LAB 검수 이력</div>`;if($('start'))$('start').onclick=start;if($('exit'))$('exit').onclick=winMission;if($('next'))$('next').onclick=()=>{let v=(modeIndex+1)%24;$('missionSelect').value=v;load(v)};if($('retry'))$('retry').onclick=()=>load(modeIndex)}
function renderDetail(){let n=m.ns[selected];if(!n||!n.seen){$('detail').textContent='설비를 선택하세요.';return}let c=COL[state(n)],st=['접근 불가','접근 가능','열람 권한','제어 권한'][['locked','available','read','control'].indexOf(state(n))],d=devices[n.type],html=`<div class="deviceHead"><div class="deviceIcon" style="color:${c}">${n.identified?icon(n.type,c):'?'}</div><div><div class="missionTitle">${display(n)}</div><div class="status" style="color:${c}">${st}</div></div></div><div class="badges">${markFlags(n)}</div><div class="small">${n.identified?d[2]:'보호된 정체를 분석해야 합니다.'}</div>`;if(n.identified&&!progress.devices.includes(n.type))html+='<div class="new">신규 설비 · 역할 안내</div>';if(n.id===0){$('detail').innerHTML=html;return}let kinds=n.identified?['read',...(n.control.length?['control']:[])]:['identify'];for(let k of kinds){let label={read:'열람 권한',control:'제어 권한',identify:'정체 식별'}[k],tasks=k==='identify'?[n.identify]:n[k];html+=`<div class="task"><strong>${label}</strong>${tasks.map(t=>`<div class="${t.done?'status':''}">${t.done?'✓':'○'} ${String(t.id).padStart(2,'0')} ${defs[t.id-1][1]} <span class="level">${levels[t.level]}</span></div>`).join('')||'<div class="small">별도 보안 작업 없음</div>'}<button class="secondary" data-kind="${k}" ${phase==='running'&&can(m,n,k)?'':'disabled'}>${k==='identify'?'식별 분석':k==='read'?'열람 작업':'제어 작업'}</button></div>`}if(n.effect==='time')html+='<div class="small">제어 완료 시 임무 시간 +45초 (시험 규칙)</div>';if(n.effect==='auth')html+='<div class="small">제어 완료 시 중계 서버 연계 인증 승인</div>';$('detail').innerHTML=html;$('detail').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>openTask(n.id,b.dataset.kind))}
function render(){renderMap();renderBrief();renderDetail();tick()}
function start(){if(phase!=='ready')return;phase='running';deadline=Date.now()+m.seconds*1000;reveal(m).forEach(id=>showNew.add(id));log('임무 개시 · 첫 설비 발견');render()}
function openTask(id,k){let n=m.ns[id];if(phase!=='running'||clock()<=0||!can(m,n,k))return;let t=currentTask(n,k);if(!t){apply(id,k);return}active={id,k};let first=!progress.games.includes(t.id);let hint=defs[t.id-1][3];if(t.id===20)hint='각 채널을 교차 없이 연결하고 장애물 외 모든 칸을 채우세요.';if(t.id===24)hint='1부터 마지막 번호까지 순서대로 선택하세요.';if(t.id===25)hint='각 채널의 1번부터 순서대로 데이터를 정리하세요.';$('dialog').innerHTML=`<span class="dialogTimer" id="modalTime">${fmt(clock())}</span><div class="tag">${first?'FIRST OPERATION':'SECURITY OPERATION'} · ${levels[t.level]}</div><h2>${defs[t.id-1][1]}</h2><p>${display(n)} / ${k==='identify'?'정체 식별':k==='read'?'열람 권한':'제어 권한'}</p>${first?'<div class="new">처음 등장한 논리게임</div>':''}<p>${hint}</p><div class="notice">논리게임 본체는 다음 통합 단계에서 연결됩니다. 이 버튼은 성공 결과와 권한 전이만 검수합니다.</div><div class="small">설명을 읽는 동안에도 임무 시간은 감소합니다.</div><div class="buttons"><button id="cancel">취소</button><button class="primary" id="simulate">모의 성공</button></div>`;$('overlay').hidden=false;$('cancel').onclick=close;$('simulate').onclick=()=>{if(active&&phase==='running'&&clock()>0){let a=active;close();apply(a.id,a.k)}}}
function close(){active=null;$('overlay').hidden=true}function apply(id,k){if(phase!=='running'||clock()<=0)return;let n=m.ns[id],res=transition(m,id,k);if(!res)return;if(res.t){if(!progress.games.includes(res.t.id))progress.games.push(res.t.id);progress.levels[res.t.id]=Math.max(progress.levels[res.t.id]??-1,res.t.level);log(`${defs[res.t.id-1][1]} · 모의 성공`)}if(n.identified&&!progress.devices.includes(n.type))progress.devices.push(n.type);if(res.effect==='time'){deadline+=45000;extra+=45;log('감시 제어 · +45초')}else if(res.effect==='clue'){m.clue=true;log('메일 분석 · 목표 단서 확보')}else if(res.effect)log(res.effect);if(res.newIds.length){res.newIds.forEach(id=>showNew.add(id));log(`후속 설비 ${res.newIds.length}개 발견`)}save();render()}
function winMission(){if(phase!=='running'||clock()<=0||!complete(m))return;phase='won';if(m.kind==='tutorial'&&m.tutorial===progress.tutorial)progress.tutorial++;save();log('MISSION COMPLETE · '+fmt(clock())+' 남음');render()}
function tick(){let sec=phase==='ready'?m?.seconds||0:phase==='running'?clock():null;if(sec!==null){$('clock').textContent=fmt(sec);$('clock').className=sec<=30?'danger':sec<=90?'warn':'';if($('modalTime'))$('modalTime').textContent=fmt(sec)}if(phase==='running'&&sec===0){phase='lost';close();log('TIME EXPIRED');renderBrief();renderDetail()}}
function load(i){close();modeIndex=Number(i);if(modeIndex<12)m=makeTutorial(modeIndex);else {let stage=progress.tutorial<12?0: Object.values(progress.levels).filter(v=>v>=1).length>=8?2:1;m=makeGenerated(modeIndex-12,stage,progress.levels)}if(!valid(m))throw Error('invalid network');selected=0;phase='ready';deadline=0;extra=0;logs=[];view={x:0,y:0,w:820,h:420};showNew.clear();$('log').innerHTML='';log('임무 대기 · START');render()}
$('missionSelect').innerHTML=tutorial.map((v,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} 입문 · ${v[0]}</option>`).join('')+missionTypes.map((v,i)=>`<option value="${i+12}">TEST · ${v[0]}</option>`).join('');$('missionSelect').onchange=e=>load(e.target.value);$('restart').onclick=()=>load(modeIndex);$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};function zoom(f){let w=Math.max(260,Math.min(1000,view.w*f)),h=w*420/820;view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};$('map').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view={x:0,y:0,w:820,h:420};renderMap()};let drag=null,pointers=new Map();const svg=$('map');svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,v:{...view},id:e.target.closest('[data-id]')?.dataset.id,moved:false};svg.setPointerCapture(e.pointerId)}else if(pointers.size===2){let a=[...pointers.values()];drag={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),v:{...view}};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!drag)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(drag.pinch&&pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),w=Math.max(260,Math.min(1000,drag.v.w*drag.d/Math.max(d,1))),h=w*420/820;view={x:drag.v.x+(drag.v.w-w)/2,y:drag.v.y+(drag.v.h-h)/2,w,h}}else if(!drag.pinch){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;let scale=Math.max(view.w/svg.clientWidth,view.h/svg.clientHeight);view={...drag.v,x:drag.v.x-dx*scale,y:drag.v.y-dy*scale}}svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(drag&&!drag.pinch&&!drag.moved&&drag.id!==undefined){selected=Number(drag.id);renderMap();renderDetail()}if(!pointers.size)drag=null;}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null});svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.dataset.id!==undefined){e.preventDefault();selected=Number(e.target.dataset.id);renderMap();renderDetail()}});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});setInterval(tick,200);$('missionSelect').value=Math.min(progress.tutorial,11);load(Number($('missionSelect').value));
</script></body></html>
