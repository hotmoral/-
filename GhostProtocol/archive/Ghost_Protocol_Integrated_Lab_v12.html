 critical:{title:'중요도 표시',items:[['중요 설비 · CRITICAL','#e4bc6c','임무 목표 또는 중요한 대체 경로에 관련된 설비입니다. 외곽 마커와 중요 설비 문구로 표시됩니다.']]},
 risk:{title:'주의 · 위험 표시',items:[['주의 · CAUTION','#e4bc6c','추가 보안 작업이나 감시 기능을 가진 설비입니다.'],['위험 · HAZARD','#ef737b','위험 임무에 관련된 핵심 설비입니다. 붉은 외곽선으로 표시됩니다. 일반 임무에서 첫 작업을 시작하면 추적률이 증가합니다. 입문 임무에서는 경고 표시만 적용됩니다.']]},
 restricted:{title:'특수 보안 표시',items:[['특수 보안 · RESTRICTED','#ad94ea','추가 분석이 필요한 설비입니다. 정체가 보호되어 있으면 식별 작업을 먼저 수행합니다.']]},
 hidden:{title:'정체 은닉',items:[['미식별 설비 · UNKNOWN','#e4bc6c','특수한 경우에만 등장합니다. 식별 논리게임을 완료하면 정체가 공개됩니다. 열람 및 제어 권한은 별도입니다.']]}

stateGuides.riskActive={title:'위험 표시 · 실제 효과',items:[['주의','#e4bc6c','첫 실제 작업에서 추적률 +5%p'],['위험','#ef737b','첫 실제 작업에서 추적률 +12%p. 반복 작업 자체에는 같은 설비의 최초 페널티가 다시 부과되지 않습니다.']]};stateGuides.outage={title:'연결 단절 · OFFLINE',items:[['붉은 점선과 ×','#ef737b','일시적으로 통과할 수 없는 연결입니다. 기존 권한은 유지됩니다. 다른 경로를 이용하거나 15초 후 복구를 기다리세요.']]};

let guideOpen=false;
function focusDevice(id,cb,delay=620){let serial=++focusSerial;guideOpen=true;pauseIntro();document.body.classList.add('focusLock');if(id!=null){selected=id;renderMap();renderDetail();let el=$('map').querySelector(`[data-id="${id}"]`);el?.classList.add('focusPulse')}setTimeout(()=>{if(serial!==focusSerial||phase!=='running')return;document.body.classList.remove('focusLock');cb()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:delay)}
function showGuideCard(key,n,onAck){beep(520,.075,.022,'triangle');beep(800,.07,.018,'sine',.075);let device=key==='device';$('dialog').classList.add('guide');$('dialog').innerHTML=`<div class="teachHeader"><h2>${device?devices[n.type][0]:stateGuides[key].title}</h2><span class="dialogTimer paused" id="modalTime">${fmt(clock())} · 정지</span></div>${systemLesson(key,n?.type)}<div class="buttons"><button class="primary" id="ackGuide">확인 · 계속</button></div>`;$('overlay').hidden=false;$('ackGuide').onclick=()=>{if(device){if(!progress.deviceIntro.includes(n.type))progress.deviceIntro.push(n.type)}else if(!progress.stateIntro.includes(key))progress.stateIntro.push(key);save();close();onAck?.();tick()};tick()}
function showFirstGuides(){if(phase!=='running'||active||guideOpen||cine)return;let visible=m.ns.filter(n=>n.seen),pending=[];let add=(k,n)=>{if(!progress.stateIntro.includes(k)&&!pending.some(x=>x.key===k))pending.push({key:k,n})};for(let n of visible){if(n.identified&&!progress.deviceIntro.includes(n.type)&&!pending.some(x=>x.key==='device'&&x.n.type===n.type))pending.push({key:'device',n});if(n.id!==0)add('permission',n);if(n.flags.includes('critical'))add('critical',n);if(n.flags.some(f=>f==='caution'||f==='hazard')){add('risk',n);if(m.security)add('riskActive',n)}if(n.flags.includes('restricted'))add('restricted',n);if(!n.identified)add('hidden',n)}if(m.security){add('trace',null);if(m.security.conditional)add('conditional',null)}if(outageNotice)add('outage',null);if(!pending.length)return;let {key,n}=pending[0];focusDevice(n?.id,()=>showGuideCard(key,n,showFirstGuides))}
function startCore(){if(phase!=='ready')return;phase='running';lastSecurity=Date.now();if(!m.security?.conditional)startTimer();pauseIntro();guideOpen=true;document.body.classList.add('focusLock');reveal(m).forEach(id=>showNew.add(id));log('임무 개시 · 첫 설비 발견');render();let serial=++focusSerial;setTimeout(()=>{if(serial!==focusSerial||phase!=='running')return;guideOpen=false;document.body.classList.remove('focusLock');resumeIntro();showFirstGuides()},1500)}

const conciseRules=[["기준과 다른 코드를 찾으세요.", "다른 코드를 모두 누르면 완료됩니다."], ["파란 기준 코드를 확인하세요.", "검사 대상 중 똑같은 코드를 모두 누르세요."], ["위아래 같은 위치의 비트를 비교하세요.", "기준과 다른 비트만 누르세요."], ["왼쪽과 오른쪽의 같은 코드를 연결하세요.", "왼쪽 코드 → 오른쪽 코드 순으로 누르세요."], ["첫 글자에 맞는 채널로 분류하세요.", "데이터를 누른 뒤 같은 문자 채널을 누르세요."], ["제시된 조건을 확인하세요.", "모든 조건을 만족하는 데이터만 누르세요."], ["데이터가 반복되거나 이동하는 규칙을 찾으세요.", "다음에 올 블록을 고르세요."], ["앞뒤 데이터의 규칙을 찾으세요.", "빈칸에 들어갈 블록을 고르세요."], ["입력과 출력이 어떻게 바뀌는지 살펴보세요.", "새 입력에도 같은 규칙을 적용하세요."], ["후보와 단서의 숫자 및 위치를 비교하세요.", "모든 단서의 일치 개수와 맞는 후보를 누르세요."], ["숫자를 눌러 코드를 바꾸고 검사하세요.", "검사 결과를 이용해 모든 자리를 맞추세요."], ["선택한 숫자의 합을 목표값과 맞추세요.", "다시 누르면 선택이 취소됩니다."], ["값을 눌러 바꾸세요.", "모든 조건에 ✓가 표시되면 완료됩니다."], ["먼저 필요한 블록부터 활성화하세요.", "선행 조건이 모두 완료된 블록을 누르세요."], ["정상 규칙을 확인하세요.", "규칙을 어기는 데이터만 누르세요."], ["입력 비트를 눌러 0과 1을 바꾸세요.", "기준과 모든 위치를 맞추세요."], ["S에서 T까지 상하좌우로 연결하세요.", "장애물을 피해 표시된 최단 이동 수를 맞추세요."], ["연결선을 눌러 전체 노드를 연결하세요.", "고정선은 유지하고 총 비용을 최소화하세요."], ["연결선을 눌러 X를 고립시키세요.", "S와 T의 연결은 유지하고 차단 비용을 최소화하세요."], ["같은 문자 쌍을 각각 연결하세요.", "교차 없이 장애물 외 모든 칸을 채우세요."], ["블록을 눌러 회전시키세요.", "IN부터 OUT과 모든 분기 종점까지 연결하세요."], ["앞 조각의 끝과 다음 조각의 시작을 맞추세요.", "조각을 순서대로 선택해 배열하세요."], ["필요한 명령을 먼저 실행하도록 배열하세요.", "선행 조건에 맞춰 모든 명령을 선택하세요."], ["1부터 마지막 숫자까지 차례로 누르세요.", "숫자의 위치는 무작위로 배치됩니다."], ["채널마다 1번부터 차례로 누르세요.", "A와 B 등 채널 사이를 자유롭게 오갈 수 있습니다."]];

const guideShort={permission:['연결 경로를 먼저 확보하세요.','보안 작업을 시작할 수 있습니다.','내부 정보와 후속 설비를 확인합니다.','설비 기능을 조작합니다. 열람도 가능합니다.'],difficulty:['적은 데이터와 단순한 조건','더 많은 데이터와 조건','복잡한 조건과 연결 구조'],critical:['목표나 대체 경로에 관련된 중요한 설비입니다.'],risk:['추가 보안 또는 감시 기능이 있습니다.','일반 임무에서 접근 시 추적 위험이 커집니다.'],restricted:['강화된 보안이 적용된 설비입니다.'],hidden:['식별 작업을 해결하면 정체가 공개됩니다. 권한 확보는 별도입니다.'],trace:['추적이 진행 중입니다.','주의 경보가 시작됩니다.','일부 연결이 끊길 수 있습니다.','발각 위험이 매우 높습니다.','발각되어 임무에 실패합니다.'],riskActive:['첫 작업 시 추적률 +5%p','첫 작업 시 추적률 +12%p'],outage:['우회하거나 15초 후 복구를 기다리세요. 확보한 권한은 유지됩니다.'],conditional:['첫 실제 작업부터 시간과 추적이 시작됩니다.']};
function puzzleLesson(id,level=0){let lines=[...conciseRules[id-1]];let extra=id===10||id===11?`<div class="keyLegend"><div><b class="green">자리 일치</b><span>숫자와 위치가 모두 같음</span></div><div><b class="amber">숫자만 일치</b><span>숫자는 같고 위치가 다름</span></div></div>`:id===16?`<p class="teachExtra">${['선택한 비트만 반전','오른쪽 이웃도 반전','양옆 이웃도 반전'][level]}</p>`:'';return `<div class="teachSplit"><div class="teachText"><div class="teachLabel">해결 방법</div>${lines.map((v,i)=>`<div class="teachStep"><b>${i+1}</b><span>${v}</span></div>`).join('')}${extra}</div><div class="teachVisual">${tutorialDemo(id,level)}</div></div>`}
function stateVisual(key,label,color,i,type){if(key==='permission')return `<div class="miniNode" style="--mark:${color}">${icon('data',color)}</div><b style="color:${color}">${label}</b>`;if(key==='difficulty')return `<div class="miniTask"><span>보안 작업</span><b class="level" data-level="${i}">${label}</b></div>`;if(key==='trace')return `<div class="traceExample" style="--mark:${color}"><i style="width:${[18,30,60,85,100][i]}%"></i></div><b style="color:${color}">${[18,30,60,85,100][i]}%</b>`;if(key==='riskActive')return `<b style="color:${color}">TRACE +${i===0?5:12}%p</b>`;if(key==='outage')return `<span class="brokenLine">● ┄ × ┄ ●</span>`;if(key==='conditional')return `<b class="amber">대기</b><span>→</span><b class="green">06:00 → 05:59</b>`;return `<div class="miniNode marked" style="--mark:${color}">${key==='hidden'?'<span>?</span>':icon(type&&devices[type]?type:'data',COL.available)}</div><b style="color:${color}">${label.split(' · ')[0]}</b>`}
function systemLesson(key,type){if(key==='device'){let d=devices[type];return `<div class="teachSplit"><div class="teachText"><div class="teachLabel">역할</div><div class="teachStep"><span>${d[2]}</span></div></div><div class="teachVisual"><div class="teachLabel">지도 표시</div><div class="deviceSample"><div class="miniNode large" style="--mark:${type==='local'?COL.control:COL.available}">${icon(type,type==='local'?COL.control:COL.available)}</div><b>${d[0]}</b><small>${d[1]}</small></div></div></div>`}let def=stateGuides[key];return `<div class="stateLesson" data-state="${key}"><div class="teachLabel">설명</div><div class="teachLabel">지도·상태 표시 예시</div>${def.items.map(([label,color,desc],i)=>{let c=key==='difficulty'?['#66dfad','#e4bc6c','#ef737b'][i]:color;return `<div class="stateText" style="--mark:${c}"><b>${label}</b><span>${guideShort[key]?.[i]||desc}</span></div><div class="stateVisual">${stateVisual(key,label,c,i,type)}</div>`}).join('')}</div>`}
let helpOpen=false;
function showHelpList(){ $('helpBack').hidden=true;let sections=[['시스템',progress.stateIntro.filter(k=>stateGuides[k]).map(k=>[stateGuides[k].title,'state',k])],['설비',progress.deviceIntro.filter(k=>devices[k]).map(k=>[devices[k][0],'device',k])],['논리게임',progress.intro.filter(k=>defs[k-1]).sort((a,b)=>a-b).map(k=>[String(k).padStart(2,'0')+' · '+defs[k-1][1],'puzzle',k])]];$('helpBody').innerHTML=`<div class="helpList">${sections.map(([title,items])=>`<div class="helpGroup"><h3>${title} <small>${items.length}</small></h3>${items.length?items.map(([label,kind,key])=>`<button data-help-kind="${kind}" data-help-key="${key}">${label}<span>›</span></button>`).join(''):'<div class="emptyHelp">아직 본 설명이 없습니다.</div>'}</div>`).join('')}</div>`;$('helpBody').querySelectorAll('[data-help-kind]').forEach(b=>b.onclick=()=>showHelpItem(b.dataset.helpKind,b.dataset.helpKey))}
function showHelpItem(kind,key){$('helpBack').hidden=false;let title=kind==='puzzle'?defs[+key-1][1]:kind==='device'?devices[key][0]:stateGuides[key].title;$('helpBody').innerHTML=`<h3 class="helpItemTitle">${title}</h3>${kind==='puzzle'?puzzleLesson(+key,Math.max(0,progress.levels[key]??0)):systemLesson(kind==='device'?'device':key,kind==='device'?key:null)}`;$('helpBody').scrollTop=0}
function openHelp(){if(cine||guideOpen||active||helpOpen||!$('missionShade').hidden)return;helpOpen=true;guideOpen=true;pauseIntro();$('helpShade').hidden=false;showHelpList();tick()}
function closeHelp(){if(!helpOpen)return;helpOpen=false;$('helpShade').hidden=true;guideOpen=false;resumeIntro();if(phase==='running')showFirstGuides();tick()}
$('helpToggle').onclick=openHelp;$('helpClose').onclick=closeHelp;$('helpBack').onclick=showHelpList;

const start=visualStart,apply=visualApply,winMission=visualWin,failMission=visualFail,load=visualLoad;
$('missionSelect').innerHTML=tutorial.map((v,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} 입문 · ${v[0]}</option>`).join('')+missionTypes.map((v,i)=>`<option value="${i+12}">TEST · ${v[0]}</option>`).join('');$('missionSelect').onchange=e=>load(e.target.value);$('restart').onclick=()=>load(modeIndex);$('resetProgress').onclick=()=>{if(!window.confirm('임무 완료 기록과 최초 안내 이력을 모두 초기화할까요?'))return;progress={tutorial:0,levels:{},devices:[],games:[],intro:[],stateIntro:[],deviceIntro:[]};save();$('missionSelect').value='0';load(0)};$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};function zoom(f){let w=Math.max(260,Math.min(1000,view.w*f)),h=w*420/820;view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};$('map').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}$('plus').onclick=()=>zoom(.8);$('minus').onclick=()=>zoom(1.25);$('fit').onclick=()=>{view={x:0,y:0,w:820,h:420};renderMap()};let drag=null,pointers=new Map();const svg=$('map');svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,v:{...view},id:e.target.closest('[data-id]')?.dataset.id,moved:false};svg.setPointerCapture(e.pointerId)}else if(pointers.size===2){let a=[...pointers.values()];drag={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),v:{...view}};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!drag)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(drag.pinch&&pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),w=Math.max(260,Math.min(1000,drag.v.w*drag.d/Math.max(d,1))),h=w*420/820;view={x:drag.v.x+(drag.v.w-w)/2,y:drag.v.y+(drag.v.h-h)/2,w,h}}else if(!drag.pinch){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;let scale=Math.max(view.w/svg.clientWidth,view.h/svg.clientHeight);view={...drag.v,x:drag.v.x-dx*scale,y:drag.v.y-dy*scale}}svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(drag&&!drag.pinch&&!drag.moved&&drag.id!==undefined){selected=Number(drag.id);renderMap();renderDetail()}if(!pointers.size)drag=null;}svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null});svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.dataset.id!==undefined){e.preventDefault();selected=Number(e.target.dataset.id);renderMap();renderDetail()}});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});setInterval(tick,200);$('missionSelect').value=Math.min(progress.tutorial,12);load(Number($('missionSelect').value));
</script></body></html>
