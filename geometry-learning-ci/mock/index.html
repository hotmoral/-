<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f7f9">
<title>공간을 발견하다 · 학습 화면 시제품</title>
<style>
:root{color-scheme:light;--ink:#1e303b;--muted:#5e727e;--line:#dce6e9;--accent:#087a82;--accent-soft:#e1f3f2;--bg:#f3f7f9;--surface:#fff;--shadow:0 14px 45px rgba(28,58,67,.07);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}button{font:inherit;cursor:pointer}button:disabled{opacity:.44;cursor:not-allowed}button:focus-visible{outline:3px solid #de9937;outline-offset:3px}a{color:var(--accent)}.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{min-height:100svh;max-width:1280px;margin:0 auto;padding:clamp(12px,2.8vw,32px);padding-bottom:max(12px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:-.045em;font-size:clamp(18px,2.5vw,24px)}.brand span{color:var(--accent)}.submark{border:1px solid #ccdfe2;background:#eaf2f4;padding:6px 10px;border-radius:99px;color:#4d6873;font-size:12px;font-weight:700;white-space:nowrap}
main{display:grid;gap:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.mode-btn{border:1px solid #d3e0e4;background:#fff;border-radius:14px;color:#48626e;min-height:46px;font-weight:730;padding:9px 18px}.tab[aria-selected="true"],.mode-btn[aria-pressed="true"]{background:#174e57;color:#fff;border-color:#174e57}
.learning{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.72fr);gap:16px;align-items:stretch}.board-card,.controls-card{background:var(--surface);border:1px solid #e3eaed;border-radius:23px;box-shadow:var(--shadow)}.board-card{min-width:0;padding:clamp(16px,2.7vw,28px);display:flex;flex-direction:column;gap:10px}.eyebrow{font-weight:800;color:var(--accent);font-size:12px;letter-spacing:.12em}.board-card h1{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:-.055em;line-height:1.23}.description{font-size:14px;color:var(--muted);margin:0}.canvas-holder{position:relative;flex:1;min-height:290px;display:flex;align-items:center;justify-content:center;border:1px solid #e3eced;border-radius:20px;background:radial-gradient(circle at 50% 30%,#fff 0%,#f3f9f8 90%);overflow:hidden}.canvas-holder svg{display:block;width:100%;height:100%;max-height:510px;aspect-ratio:5/4;pointer-events:none}.canvas-note{position:absolute;top:12px;left:12px;padding:5px 10px;background:rgba(255,255,255,.89);border:1px solid #dfe9ea;border-radius:9px;font-size:12px;color:var(--muted);font-weight:700}.canvas-caption{color:var(--muted);font-size:13px;min-height:18px}.controls-card{padding:clamp(16px,2.5vw,25px);display:flex;flex-direction:column;gap:16px;min-width:0}.controls-card h2{font-size:17px;letter-spacing:-.035em;margin:0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mode-btn{font-size:14px;padding:10px 6px;border-radius:12px}.divider{height:1px;background:var(--line);width:100%}.section-title{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#e4f2f2;border:1px solid #b8dadb;color:#145964;border-radius:14px;min-height:52px;padding:9px 12px;font-weight:800}.action.primary{background:var(--accent);border-color:var(--accent);color:#fff}.action.secondary{background:white;border-color:#d2dfe3;color:#536a75}.action.full{grid-column:1/-1}.action:not(:disabled):active,.tab:not(:disabled):active{transform:scale(.98)}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.option{display:grid;place-items:center;gap:5px;background:#f8fafb;border:2px solid #dbe5e9;border-radius:14px;min-height:90px;padding:10px 4px;color:#536a75;font-size:13px;font-weight:800}.option[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:#155961}.option svg{width:66px;height:49px}.status{background:#f4f8fa;border-left:3px solid var(--accent);padding:12px 13px;border-radius:8px;color:#405968;font-size:13px;min-height:66px}.quiet{font-size:12px;color:var(--muted);line-height:1.65}.controls-bottom{margin-top:auto}.foot{margin:12px 2px 0;color:#667a84;font-size:12px;line-height:1.6;text-align:center}
@media(max-width:740px){.shell{padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}header{margin:3px 2px 13px}.learning{grid-template-columns:1fr;gap:12px}.board-card{border-radius:19px;padding:16px}.controls-card{border-radius:19px;padding:16px;gap:12px}.canvas-holder{height:clamp(250px,40svh,360px);min-height:250px;flex-shrink:0}.canvas-holder svg{max-height:100%}.board-card h1{font-size:clamp(22px,6vw,30px)}.tabs{gap:7px}.tab{flex:1;min-width:0;padding:8px 4px;font-size:14px}}
@media(orientation:landscape) and (max-height:600px){.shell{padding:9px 14px}header{margin-bottom:7px}.brand{font-size:17px}.submark{font-size:11px;padding:3px 8px}main{gap:8px}.tabs{gap:6px}.tab{min-height:44px;font-size:13px;padding:5px 12px}.learning{grid-template-columns:minmax(0,1.5fr) minmax(280px,.95fr);gap:10px}.board-card{padding:12px;gap:5px;border-radius:16px}.board-card h1{font-size:20px}.description{font-size:12px}.canvas-holder{flex:0 0 auto;min-height:170px;height:clamp(170px,calc(100svh - 170px),240px);border-radius:13px}.canvas-caption{font-size:11px}.controls-card{padding:12px;gap:8px;border-radius:16px}.controls-card h2{font-size:14px}.mode-btn{min-height:44px;font-size:12px;padding:5px}.section-title{margin:0 0 5px;font-size:11px}.action{min-height:44px;padding:5px 7px;font-size:12px}.option{min-height:64px;padding:3px}.option svg{width:43px;height:29px}.status{min-height:43px;padding:7px;font-size:11px}.quiet{font-size:10px}.foot{margin:5px 0 0;font-size:10px}.controls-card .divider{display:none}}
@media(max-width:740px) and (max-height:650px) and (orientation:portrait){
.shell{padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
header{margin-bottom:5px}.brand{font-size:17px}.submark{font-size:10px;padding:4px 7px}
main{gap:8px}.learning{gap:8px}.board-card{padding:10px;gap:5px}
.board-card h1{font-size:21px}.board-card .description,.board-card .canvas-caption{display:none}
.canvas-holder{height:210px;min-height:210px;flex-shrink:0}
.controls-card{padding:9px;gap:6px}
.controls-card h2,.controls-card .divider,.controls-card .quiet,.controls-card .section-title{display:none}
.controls-card .status{min-height:42px;padding:8px}
.controls-card .option{min-height:64px}.controls-card .action{min-height:48px}
}
@media(prefers-reduced-motion:no-preference){.shape-group{transition:transform .28s ease}.action,.tab{transition:transform .1s ease,background-color .12s ease}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span>공간을</span> 발견하다 <span aria-hidden="true">·</span> 학습 플레이어</div><span class="submark">화면 시제품 · 미채점</span></header>
<main>
<div class="tabs" role="tablist" aria-label="수업 유형 선택">
<button class="tab" id="tab-rotate" role="tab" aria-selected="true" aria-controls="lesson-panel" data-lesson="rotate">회전</button>
<button class="tab" id="tab-reflect" role="tab" aria-selected="false" aria-controls="lesson-panel" data-lesson="reflect">반사·대칭</button>
<button class="tab" id="tab-space" role="tab" aria-selected="false" aria-controls="lesson-panel" data-lesson="space">공간 제약</button>
</div>
<div id="lesson-panel" class="learning" role="tabpanel" aria-labelledby="tab-rotate">
<section class="board-card" aria-label="학습 도형">
<span class="eyebrow" id="eyebrow">직접 관찰 · G2</span>
<h1 id="question">돌리면 무엇이 바뀔까?</h1>
<p class="description" id="description">직접 돌려 보며 칸의 연결 관계를 살펴보세요.</p>
<div class="canvas-holder">
<span class="canvas-note" id="canvas-note">연습용 합성 도형</span>
<svg id="geometry" viewBox="0 0 480 380" role="img" aria-label="합성 도형을 관찰하는 공간"></svg>
</div>
<div class="canvas-caption" id="canvas-caption">도형 조작은 정답 판정과 연결되지 않습니다.</div>
</section>
<aside class="controls-card" aria-label="학습 조작">
<h2>어떻게 살펴볼까요?</h2>
<div class="modes" aria-label="활동 모드">
<button class="mode-btn" id="mode-explore" aria-pressed="true" data-mode="explore">직접 해보기</button>
<button class="mode-btn" id="mode-predict" aria-pressed="false" data-mode="predict">먼저 생각하기</button>
</div>
<div class="divider"></div>
<div><p class="section-title" id="area-title">조작</p><div id="options" class="options" hidden></div><div id="actions" class="action-row"></div></div>
<div class="controls-bottom"><div class="status" id="status" role="status" aria-live="polite">회전 버튼을 눌러 변화를 살펴보세요.</div><p class="quiet" id="rule-note">서로 다른 학습 자극으로 만든 미채점 시연입니다. 평가·저장은 실행되지 않습니다.</p></div>
</aside>
</div>
</main>
<p class="foot">시각·조작 구조 검토용 HTML · 실제 90문제·Selector·Evidence·채점·저장과 연결되지 않음 · 색상 이외의 경계·문자 표기를 함께 사용</p>
</div>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=(id)=>document.getElementById(id);
const config={
 rotate:{tag:"직접 관찰 · G2",question:"돌리면 무엇이 바뀔까?",description:"직접 돌려 보며 칸의 연결 관계를 살펴보세요.",caption:"위치와 방향은 달라도 칸 사이의 연결은 유지돼요.",action:"90° 돌리기",type:"rotation"},
 reflect:{tag:"직접 관찰 · G4",question:"거울의 양쪽은 어떻게 같을까?",description:"축을 기준으로 뒤집었을 때 대응점을 살펴보세요.",caption:"양쪽의 대응점은 대칭축에서 같은 거리에 있어요.",action:"좌우 뒤집기",type:"reflection"},
 space:{tag:"배치 탐색 · G6",question:"한 조각을 놓으면 무엇이 남을까?",description:"먼저 놓는 위치를 바꾸며 남은 공간을 관찰하세요.",caption:"이 배치는 화면 구조 검토용이며 완성 가능성은 채점하지 않아요.",action:"배치 바꾸기",type:"placement"}
};
const model={lesson:"rotate",mode:"explore",turn:0,mirrored:false,placement:-1,choice:null,firstChoice:null,committed:false,replayed:false};
const base=[[0,0],[1,0],[2,0],[0,1]];
const options=["가","나","다"];
function el(tag,attrs={},parent){let x=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,String(v));if(parent)parent.appendChild(x);return x}
function board(svg,kind,preview=false){
 svg.replaceChildren();
 el("title",{},svg).textContent=kind==="space"?"도형을 놓은 후 남는 칸을 살펴보는 예시":kind==="reflect"?"중앙 대칭축과 블록의 위치를 비교하는 도형":"네 칸이 연결된 합성 도형";
 const grid=el("g",{"stroke":"#dce9eb","stroke-width":"1"},svg);
 for(let x=80;x<=400;x+=40)el("line",{x1:x,y1:50,x2:x,y2:330},grid);
 for(let y=50;y<=330;y+=40)el("line",{x1:80,y1:y,x2:400,y2:y},grid);
 if(kind==="reflect") {el("line",{x1:240,y1:65,x2:240,y2:320,stroke:"#b17d50","stroke-width":3,"stroke-dasharray":"8 6"},svg);el("text",{x:251,y:76,fill:"#97724e","font-size":13},svg).textContent="대칭축"}
 if(kind==="space"){
  const cells=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[1,2],[2,2]];
  const placed=[[[0,0],[0,1],[1,1],[1,2]],[[1,0],[1,1],[2,1],[2,2]]];
  const current=model.placement;
  const group=el("g",{},svg);
  cells.forEach(([cx,cy])=>{const occupied=current>=0&&placed[current].some(p=>p[0]===cx&&p[1]===cy);el("rect",{x:171+cx*48,y:99+cy*48,width:45,height:45,rx:7,fill:occupied?"#70b9b4":"#ffffff",stroke:occupied?"#28777c":"#9cb6bf","stroke-width":2},group)});
  el("text",{x:240,y:286,"text-anchor":"middle","font-size":14,fill:"#476875"},svg).textContent=current<0?"먼저 조각을 놓아 보세요":current===0?"배치 A · 남은 칸을 관찰하세요":"배치 B · 남은 칸을 관찰하세요";
  return;
 }
 const group=el("g",{class:"shape-group"},svg);
 const t=model.mode==="predict"&&!model.replayed?{turn:0,mirrored:false}:{turn:model.turn,mirrored:model.mirrored};
 const angle=kind==="rotate"?t.turn*90:0;
 const mirror=kind==="reflect"&&t.mirrored?-1:1;
 group.setAttribute("transform","translate(240 191) rotate("+angle+") scale("+mirror+" 1) translate(-78 -54)");
 base.forEach(([x,y])=>el("rect",{x:x*51,y:y*51,width:48,height:48,rx:7,fill:"#65b7ae",stroke:"#176c73","stroke-width":"2"},group));
 el("circle",{cx:24,cy:24,r:7,fill:"#fefefe"},group);
 el("circle",{cx:24,cy:24,r:3.5,fill:"#126a73"},group);
}
function addButton(text,cls,handler,disabled=false){const b=document.createElement("button");b.type="button";b.textContent=text;b.className="action "+cls;b.disabled=disabled;b.addEventListener("click",handler);$("actions").appendChild(b);return b}
function setStatus(text){$("status").textContent=text}
function resetForLesson(name){model.lesson=name;model.mode="explore";resetStage();update()}
function resetStage(){model.turn=0;model.mirrored=false;model.placement=-1;model.choice=null;model.firstChoice=null;model.committed=false;model.replayed=false}
function setMode(mode){model.mode=mode;resetStage();update()}
function choose(i){if(model.committed)return;if(model.firstChoice===null)model.firstChoice=i;model.choice=i;renderControls();setStatus("처음 고른 "+options[model.firstChoice]+" · 현재 선택 "+options[i]+". 확정 전 결과는 보이지 않아요.")}
function commit(){if(model.choice===null||model.committed)return;model.committed=true;renderControls();setStatus("처음 고른 "+options[model.firstChoice]+" · 확정한 "+options[model.choice]+" 기록(이 화면 내부). 변화 보기를 누르세요.")}
function replay(){if(!model.committed||model.replayed)return;model.replayed=true;if(model.lesson==="rotate")model.turn=1;else if(model.lesson==="reflect")model.mirrored=true;else model.placement=model.choice%2;board($("geometry"),model.lesson);renderControls();setStatus("사후 시연입니다. 정답·오답을 채점하지 않고, 선택도 바꾸지 않습니다.")}
function optionIcon(index){
const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 80 60");svg.setAttribute("aria-hidden","true");
const group=el("g",{transform:"translate(41 30) rotate("+(index*90)+") translate(-25 -24)"},svg);
[[0,0],[1,0],[1,1]].forEach(([x,y])=>el("rect",{x:x*20,y:y*20,width:18,height:18,rx:3,fill:"#8dc3c2",stroke:"#3c8390","stroke-width":1},group));
return svg;
}
function renderControls(){
 const a=$("actions"),o=$("options");a.replaceChildren();o.replaceChildren();o.hidden=model.mode!=="predict";
 $("area-title").textContent=model.mode==="predict"?(model.lesson==="space"?"어느 배치를 먼저 고를까요?":"변환 뒤 모양을 예상해 보세요"):"조작";
 if(model.mode==="explore"){
  const c=config[model.lesson];
  addButton(c.action,"primary",()=>{
   if(model.lesson==="rotate")model.turn=(model.turn+1)%4;
   else if(model.lesson==="reflect")model.mirrored=!model.mirrored;
   else model.placement=(model.placement+1)%2;
   board($("geometry"),model.lesson);renderControls();setStatus("변화를 살펴보세요. 이 화면은 정답을 판정하지 않습니다.");
  });
  addButton("되돌리기","secondary",()=>{
   if(model.lesson==="rotate")model.turn=(model.turn+3)%4;
   else if(model.lesson==="reflect")model.mirrored=false;
   else model.placement=-1;
   board($("geometry"),model.lesson);renderControls();setStatus("화면의 조작만 되돌렸습니다. 학습 평가 기록은 생성하지 않습니다.");
  },model.lesson==="rotate"?model.turn===0:model.lesson==="reflect"?!model.mirrored:model.placement<0);
 }else{
  const count=model.lesson==="space"?2:3;
  for(let i=0;i<count;i++){
   const btn=document.createElement("button");btn.className="option";btn.type="button";
   btn.setAttribute("aria-pressed",String(model.choice===i));
   btn.setAttribute("aria-label",options[i]+" 보기");
   btn.disabled=model.committed;
   btn.appendChild(optionIcon(i));
   const label=document.createElement("span");label.textContent=model.lesson==="space"?"배치 "+options[i]:options[i]+" 보기";btn.appendChild(label);
   btn.addEventListener("click",()=>choose(i));
   o.appendChild(btn);
  }
  if(!model.committed)addButton("선택 확정","primary full",commit,model.choice===null);
  else if(!model.replayed)addButton("변화 보기","primary full",replay);
  else addButton("다시 생각하기","secondary full",()=>setMode("predict"));
 }
}
function update(){
 const c=config[model.lesson];
 $("eyebrow").textContent=c.tag;
 $("question").textContent=c.question;
 $("description").textContent=model.mode==="predict"?(model.lesson==="space"?"배치를 고르고 확정하세요. 먼저 완성 결과를 보여주지 않아요.":"머릿속으로 생각한 뒤 보기를 확정하세요. 실제 변환은 그 다음에 보여줘요."):c.description;
 $("canvas-caption").textContent=model.mode==="predict"?"확정 전에는 변환 결과를 시연하지 않습니다.":c.caption;
 $("canvas-note").textContent=model.mode==="predict"?"첫 선택 보존 · 모의 화면":"연습용 합성 도형";
 $("geometry").setAttribute("aria-label",model.lesson==="rotate"?"합성 네 칸 도형의 회전 시연":model.lesson==="reflect"?"세로축으로 좌우 반사하는 합성 도형":"조각 배치 예시와 남은 칸");
 for(const b of document.querySelectorAll("[data-lesson]")){b.setAttribute("aria-selected",String(b.dataset.lesson===model.lesson));b.tabIndex=b.dataset.lesson===model.lesson?0:-1;}
 $("lesson-panel").setAttribute("aria-labelledby","tab-"+model.lesson);
 for(const b of document.querySelectorAll("[data-mode]"))b.setAttribute("aria-pressed",String(b.dataset.mode===model.mode));
 $("rule-note").textContent=model.lesson==="space"?"합성 배치 시연입니다. 실제 미래 해결 가능성·과정 신호·채점은 계산하지 않습니다.":"별도 합성 도형을 사용하는 시제품입니다. 첫 선택은 화면 내부에만 보존하며 채점·저장은 하지 않습니다.";
 renderControls();board($("geometry"),model.lesson);
 setStatus(model.mode==="predict"?"보기를 고르고 확정하세요. 확정 전 변환 시연을 하지 않습니다.":"도형을 직접 움직여 변화를 살펴보세요.");
}
const lessonTabs=Array.from(document.querySelectorAll("[data-lesson]"));
lessonTabs.forEach((b,i)=>{
 b.addEventListener("click",()=>resetForLesson(b.dataset.lesson));
 b.addEventListener("keydown",(event)=>{
  const key=event.key;
  if(!["ArrowLeft","ArrowRight","Home","End"].includes(key))return;
  event.preventDefault();
  const next=key==="Home"?0:key==="End"?lessonTabs.length-1:
    (i+(key==="ArrowRight"?1:-1)+lessonTabs.length)%lessonTabs.length;
  resetForLesson(lessonTabs[next].dataset.lesson);
  lessonTabs[next].focus();
 });
});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
update();
</script>
