<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#101813"/>
  <title>Outpost Wilds</title>
  <link rel="stylesheet" href="/style-v3.css?v=16"/>
  <link rel="stylesheet" href="/patch-v4.css?v=16"/>
  <link rel="stylesheet" href="/patch-v5.css?v=16"/>
  <link rel="stylesheet" href="/patch-v6.css?v=16"/>
  <link rel="stylesheet" href="/patch-v7.css?v=16"/>
  <link rel="stylesheet" href="/patch-v12.css?v=16"/>
  <link rel="stylesheet" href="/patch-v13.css?v=16"/>
  <link rel="stylesheet" href="/patch-v14.css?v=16"/>
  <link rel="stylesheet" href="/patch-v15.css?v=16"/>
  <link rel="stylesheet" href="/patch-v16.css?v=16"/>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="brand"><b>OUTPOST WILDS</b><span id="online">공동 월드 연결 중…</span></div>
    <div id="zoneBadge" class="zoneBadge"><span>개척 거점</span><small>안전지대</small></div>
    <div class="topcards">
      <div class="card baseCard"><span>공동 거점</span><div class="row"><b id="baseLv">LV.1</b><em id="weapon">조잡한 창 LV.1</em></div><div class="bar hp"><i id="baseHp"></i></div></div>
      <div class="card phase"><span id="phaseLabel">낮</span><b id="clockLabel">☀ 탐험 · 채집</b></div>
    </div>
    <div class="resources" aria-label="보유 자원">
      <div class="resourceChip" title="목재"><img src="/assets/res-wood.svg" alt="목재"><b id="wood">0</b></div>
      <div class="resourceChip" title="돌과 광석"><img src="/assets/res-stone.svg" alt="돌"><b id="stone">0</b></div>
      <div class="resourceChip" title="식량"><img src="/assets/res-meat.svg" alt="식량"><b id="meat">0</b></div>
    </div>
    <div class="mission card" id="mission">
      <span>건설/승급 목표</span>
      <b id="missionTitle">건물 칸에서 성장 경로를 선택하세요</b>
      <div id="missionCost" class="costs"></div>
      <div class="bar missionBar"><i id="missionFill"></i></div>
    </div>
    <div class="personal card">
      <span>공용 무기</span>
      <div class="personalRow"><b id="meritLabel">공용 · 조잡한 창 LV.1</b><em id="craftLabel">공용 무기 강화 칸에서 자원 투입</em></div>
    </div>
    <div class="carry card"><span>짐</span><b id="carryLabel">0%</b><div class="bar carryBar"><i id="carryFill"></i></div></div>
    <div id="bossHud" class="bossHud"><span>우두머리 습격</span><b>우두머리</b><div class="bar bossBar"><i id="bossFill"></i></div></div>
    <div id="toast"></div>
    <div id="contextHint"></div>
  </div>
  <div id="joystick"><div class="stick"><i></i></div></div>
  <div id="desktopHelp">WASD 이동 · 자동 전투/채집 · 단계별 시설 해금 · 방벽/거점 자원 보수 · 공용 비축고 · 채팅 · FINAL NIGHT</div>
  <script src="/game-v3.js?v=16"></script>
  <script src="/patch-v4.js?v=16"></script>
  <script src="/patch-v5.js?v=16"></script>
  <script src="/patch-v6.js?v=16"></script>
  <script src="/patch-v6-sync.js?v=16"></script>
  <script src="/patch-v7.js?v=16"></script>
  <script src="/patch-v8.js?v=16"></script>
  <script src="/patch-v9.js?v=16"></script>
  <script src="/patch-v10.js?v=16"></script>
  <script src="/patch-v11.js?v=16"></script>
  <script src="/patch-v12.js?v=16"></script>
  <script src="/patch-v13.js?v=16"></script>
  <script src="/patch-v14.js?v=16"></script>
  <script src="/patch-v15.js?v=16"></script>
  <script src="/patch-v16.js?v=16"></script>
</body>
</html>
