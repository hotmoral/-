<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#101813"/>
  <title>Outpost Wilds</title>
  <link rel="stylesheet" href="/style-v3.css?v=7"/>
  <link rel="stylesheet" href="/patch-v4.css?v=7"/>
  <link rel="stylesheet" href="/patch-v5.css?v=7"/>
  <link rel="stylesheet" href="/patch-v6.css?v=7"/>
  <link rel="stylesheet" href="/patch-v7.css?v=7"/>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="brand"><b>OUTPOST WILDS</b><span id="online">공동 월드 연결 중…</span></div>
    <div id="zoneBadge" class="zoneBadge"><span>개척 거점</span><small>안전지대</small></div>
    <div class="topcards">
      <div class="card baseCard"><span>공동 거점</span><div class="row"><b id="baseLv">LV.1</b><em id="weapon">조잡한 창</em></div><div class="bar hp"><i id="baseHp"></i></div></div>
      <div class="card phase"><span id="phaseLabel">낮</span><b id="clockLabel">☀ 탐험 · 채집</b></div>
    </div>
    <div class="resources" aria-label="보유 자원">
      <div class="resourceChip" title="목재"><img src="/assets/res-wood.svg" alt="목재"><b id="wood">0</b></div>
      <div class="resourceChip" title="돌과 광석"><img src="/assets/res-stone.svg" alt="돌"><b id="stone">0</b></div>
      <div class="resourceChip" title="식량"><img src="/assets/res-meat.svg" alt="식량"><b id="meat">0</b></div>
    </div>
    <div class="mission card" id="mission">
      <span>건설 목표</span>
      <b id="missionTitle">건설 칸에 자원을 운반하세요</b>
      <div id="missionCost" class="costs"></div>
      <div class="bar missionBar"><i id="missionFill"></i></div>
    </div>
    <div class="personal card">
      <span>개인 장비</span>
      <div class="personalRow"><b id="meritLabel">장비 · 조잡한 창</b><em id="craftLabel">장비 강화 칸에서 자원 투입</em></div>
    </div>
    <div class="carry card"><span>짐</span><b id="carryLabel">0%</b><div class="bar carryBar"><i id="carryFill"></i></div></div>
    <div id="bossHud" class="bossHud"><span>황폐 경계의 우두머리</span><b>잿빛 포식자</b><div class="bar bossBar"><i id="bossFill"></i></div></div>
    <div id="toast"></div>
    <div id="contextHint"></div>
  </div>
  <div id="joystick"><div class="stick"><i></i></div></div>
  <div id="desktopHelp">WASD 이동 · 가까운 적/자원 자동 행동 · 건설 칸 위에서 자동 자원 투입</div>
  <script src="/game-v3.js?v=7"></script>
  <script src="/patch-v4.js?v=7"></script>
  <script src="/patch-v5.js?v=7"></script>
  <script src="/patch-v6.js?v=7"></script>
  <script src="/patch-v6-sync.js?v=7"></script>
  <script src="/patch-v7.js?v=7"></script>
</body>
</html>
