<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#121713" />
  <title>SAFEHOUSE — 협동 좀비 생존</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0e120f;--panel:#171d19;--panel2:#202721;--line:#39443a;--text:#edf3ed;--muted:#a5afa6;
      --good:#8fd59d;--danger:#e58d84;--warn:#d7bd72;--accent:#a9d7b0;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overscroll-behavior:none}
    button,input{font:inherit} button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 14px;font-weight:750}
    button:active{transform:translateY(1px)} button[disabled]{opacity:.45}
    .app{width:min(1180px,100%);margin:0 auto;padding:10px;display:grid;gap:10px}
    .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
    .phase{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}
    .pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 10px;font-size:13px;white-space:nowrap}
    .pill strong{font-size:14px}.conn{font-size:12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px;align-items:start}
    .worldWrap{min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#101712;position:relative}
    canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:manipulation;background:#121a14}
    .hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);font-size:12px;color:#eef3ee;background:#111a14dd;border:1px solid #415044;padding:7px 9px;border-radius:10px;pointer-events:none}
    .side{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.card h2{font-size:14px;margin:0 0 9px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#121713;border-radius:10px;padding:8px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:15px}
    .bar{height:7px;background:#0d110e;border-radius:99px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:var(--good);width:0}.bar.danger>i{background:var(--danger)}
    .maint{display:none}.maint.show{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.readyBtn{width:100%;margin-top:9px;background:#243426;border-color:#58705c}.readyBtn.on{background:#36563d;border-color:#80b18b}
    .vote{font-size:13px;color:var(--muted);margin-top:8px}.vote strong{color:var(--text)}
    .events{display:grid;gap:6px;max-height:190px;overflow:auto}.event{font-size:12px;line-height:1.35;padding:7px 8px;background:#111612;border-radius:8px;border-left:3px solid #576159}.event.good{border-left-color:var(--good)}.event.danger{border-left-color:var(--danger)}
    .legend{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
    .nameRow{display:flex;gap:6px;align-items:center}.nameRow input{min-width:0;width:150px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px}.nameRow button{min-height:38px;padding:7px 10px;font-size:12px}
    .banner{display:none;background:#2b2619;border:1px solid #665a36;color:#f0dfab;border-radius:12px;padding:10px 12px;font-size:13px}.banner.show{display:block}
    @media(max-width:760px){.app{padding:7px}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.eventsCard{grid-column:1/-1}.top{grid-template-columns:1fr}.nameRow{justify-content:space-between}.nameRow input{width:100%;max-width:220px}}
    @media(max-width:470px){.side{grid-template-columns:1fr}.eventsCard{grid-column:auto}.pill{font-size:12px;padding:6px 8px}.hint{font-size:11px}.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="phase">
      <div class="pill"><strong id="dayText">DAY 1</strong></div>
      <div class="pill"><span id="phaseText">정비</span> · <strong id="timerText">시간 정지</strong></div>
      <div class="pill">거점 <strong id="baseText">300/300</strong></div>
      <div class="conn" id="connText">서버 연결 중…</div>
    </div>
    <div class="nameRow">
      <input id="nameInput" maxlength="16" aria-label="플레이어 이름" />
      <button id="nameBtn" type="button">이름 변경</button>
    </div>
  </div>

  <div class="banner" id="pendingBanner">진행 중인 DAY에 합류했습니다. 다음 DAY 아침부터 직접 플레이합니다.</div>

  <div class="layout">
    <div class="worldWrap">
      <canvas id="game" width="1200" height="800" aria-label="좀비 생존 게임 월드"></canvas>
      <div class="hint" id="hint">맵을 탭하면 이동합니다. 자원·좀비의 경계 안에 들어가면 채집과 공격이 자동으로 시작됩니다.</div>
    </div>

    <aside class="side">
      <section class="card">
        <h2>내 상태</h2>
        <div class="statgrid">
          <div class="stat"><span>체력</span><b id="hpText">100</b><div class="bar"><i id="hpBar"></i></div></div>
          <div class="stat"><span>탄약</span><b id="ammoText">18</b></div>
          <div class="stat"><span>운반</span><b id="carryText">0 / 12</b></div>
          <div class="stat"><span>처치</span><b id="killsText">0</b></div>
        </div>
      </section>

      <section class="card">
        <h2>공동 비축</h2>
        <div class="statgrid">
          <div class="stat"><span>식량</span><b id="foodText">0</b></div>
          <div class="stat"><span>자재</span><b id="scrapText">0</b></div>
          <div class="stat"><span>약품</span><b id="medsText">0</b></div>
          <div class="stat"><span>생존자</span><b id="peopleText">1</b></div>
        </div>
      </section>

      <section class="card maint" id="maintCard">
        <h2>정비 단계 · 시간 정지</h2>
        <div class="actions">
          <button type="button" data-action="repair">방벽 수리<br><small>자재 5</small></button>
          <button type="button" data-action="ammo">탄약 보급<br><small>자재 4</small></button>
          <button type="button" data-action="heal">치료<br><small>약품 1</small></button>
        </div>
        <button class="readyBtn" id="readyBtn" type="button">다음 날 준비 완료</button>
        <div class="vote" id="voteText">0 / 1 준비 · 과반수 1명 필요</div>
      </section>

      <section class="card eventsCard">
        <h2>상황</h2>
        <div class="events" id="events"></div>
      </section>

      <section class="card">
        <div class="legend">
          <span><i class="dot" style="background:#b8e1c0"></i>생존자</span>
          <span><i class="dot" style="background:#ba6f67"></i>좀비</span>
          <span><i class="dot" style="background:#c7b36e"></i>자원 범위</span>
          <span><i class="dot" style="background:#759a7c"></i>안전 거점</span>
        </div>
      </section>
    </aside>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const els = {
    day:$('dayText'), phase:$('phaseText'), timer:$('timerText'), base:$('baseText'), conn:$('connText'),
    hp:$('hpText'), hpBar:$('hpBar'), ammo:$('ammoText'), carry:$('carryText'), kills:$('killsText'),
    food:$('foodText'), scrap:$('scrapText'), meds:$('medsText'), people:$('peopleText'),
    maint:$('maintCard'), ready:$('readyBtn'), vote:$('voteText'), events:$('events'), pending:$('pendingBanner'), hint:$('hint'),
    name:$('nameInput'), nameBtn:$('nameBtn')
  };

  let myId = null;
  let state = null;
  let ws = null;
  let reconnectTimer = null;
  let localReady = false;
  let clockOffset = 0;
  const savedName = localStorage.getItem('zc-name') || `생존자${Math.floor(100 + Math.random()*900)}`;
  els.name.value = savedName;

  const colors = {
    food:'#b9b36e', scrap:'#9aa0a4', meds:'#91b7a0', ammo:'#b29a78', zombie:'#b96861', elite:'#d08a72', player:'#b8e1c0'
  };

  function connect(){
    clearTimeout(reconnectTimer);
    els.conn.textContent = '서버 연결 중…';
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.addEventListener('open', () => {
      els.conn.textContent = '온라인';
      ws.send(JSON.stringify({type:'hello', token:localStorage.getItem('zc-token') || '', name:els.name.value.trim()}));
    });
    ws.addEventListener('message', e => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if(msg.type === 'welcome'){
        myId = msg.id;
        localStorage.setItem('zc-token', msg.token);
      } else if(msg.type === 'state'){
        state = msg;
        clockOffset = msg.serverNow - Date.now();
        updateUI();
      }
    });
    ws.addEventListener('close', () => {
      els.conn.textContent = '연결 끊김 · 재접속 중';
      reconnectTimer = setTimeout(connect, 1300);
    });
    ws.addEventListener('error', () => { try{ ws.close(); }catch{} });
  }

  function send(data){ if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data)); }
  function mine(){ return state?.players?.find(p => p.id === myId) || null; }
  function carryTotal(p){ return p ? p.carry.food+p.carry.scrap+p.carry.meds+p.carry.ammo : 0; }
  function phaseName(p){ return p==='day'?'낮 탐색':p==='night'?'야간 방어':'정비'; }

  function updateUI(){
    if(!state) return;
    const me = mine();
    els.day.textContent = `DAY ${state.day}`;
    els.phase.textContent = phaseName(state.phase);
    els.base.textContent = `${Math.ceil(state.baseHp)}/${state.baseMaxHp}`;
    els.food.textContent = state.stash.food;
    els.scrap.textContent = state.stash.scrap;
    els.meds.textContent = state.stash.meds;
    els.people.textContent = state.players.filter(p=>p.connected && !p.pending).length;
    els.maint.classList.toggle('show', state.phase === 'maintenance');
    els.pending.classList.toggle('show', Boolean(me?.pending));

    if(me){
      els.hp.textContent = `${Math.max(0,Math.ceil(me.hp))}/${me.maxHp}`;
      els.hpBar.style.width = `${Math.max(0, Math.min(100, me.hp/me.maxHp*100))}%`;
      els.ammo.textContent = me.ammo;
      els.carry.textContent = `${carryTotal(me)} / ${me.carryCap}`;
      els.kills.textContent = me.kills;
      localReady = me.ready;
      els.ready.classList.toggle('on', me.ready);
      els.ready.textContent = me.ready ? '준비 완료 ✓' : '다음 날 준비 완료';
      els.ready.disabled = Boolean(me.pending);
    }

    const r = state.ready;
    els.vote.innerHTML = `<strong>${r.ready} / ${r.total}</strong> 준비 · 과반수 <strong>${r.required}명</strong> 필요`;
    els.events.replaceChildren(...state.events.slice().reverse().map(ev => {
      const d = document.createElement('div'); d.className = `event ${ev.tone||''}`; d.textContent = ev.text; return d;
    }));
  }

  function updateTimer(){
    if(!state) return;
    const serverNow = Date.now()+clockOffset;
    if(state.phase === 'maintenance'){
      if(state.countdownEndsAt){
        const s = Math.max(0,(state.countdownEndsAt-serverNow)/1000);
        els.timer.textContent = `출발 ${s.toFixed(1)}초`;
      } else els.timer.textContent = '시간 정지';
    } else if(state.phaseEndsAt){
      const sec = Math.max(0,Math.ceil((state.phaseEndsAt-serverNow)/1000));
      const m = Math.floor(sec/60), s = String(sec%60).padStart(2,'0');
      els.timer.textContent = `${m}:${s}`;
    }
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }

  function drawWorld(){
    requestAnimationFrame(drawWorld);
    if(!state) return;
    const W=state.world.width,H=state.world.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = state.phase==='night' ? '#101211' : '#142018'; ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = state.phase==='night' ? '#202823' : '#25372a'; ctx.lineWidth=1;
    for(let x=0;x<=W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<=H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

    const b=state.world.base;
    ctx.save();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#213428';ctx.fill();
    ctx.strokeStyle='#759a7c';ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='#d9e7db';ctx.font='700 18px system-ui';ctx.textAlign='center';ctx.fillText('SAFEHOUSE',b.x,b.y-8);
    ctx.fillStyle='#9eb3a2';ctx.font='13px system-ui';ctx.fillText('접근 시 물자 자동 반납',b.x,b.y+15);
    ctx.restore();

    for(const r of state.resources){
      ctx.save();
      ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeStyle = r.stock>0 ? colors[r.type] : '#4b504c';
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle = r.stock>0 ? colors[r.type] : '#555b56';
      ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(r.x,r.y,r.r-3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#edf3ed';ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.fillText(r.label,r.x,r.y-2);
      ctx.fillStyle='#aeb8af';ctx.font='12px system-ui';ctx.fillText(r.stock>0?`${r.type==='food'?'식량':r.type==='scrap'?'자재':r.type==='meds'?'약품':'탄약'} ${r.stock}`:'소진',r.x,r.y+17);
      ctx.restore();
    }

    const me=mine();
    if(me && !me.pending && state.phase!=='maintenance'){
      ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='#9ab6a055';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(me.x,me.y,155,0,Math.PI*2);ctx.stroke();ctx.restore();
    }

    for(const z of state.zombies){
      ctx.save();ctx.translate(z.x,z.y);
      ctx.fillStyle=z.elite?colors.elite:colors.zombie;
      ctx.beginPath();ctx.ellipse(0,0,z.elite?14:11,z.elite?18:15,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e4b2aa';ctx.beginPath();ctx.arc(0,-16,z.elite?8:6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#281918';ctx.fillRect(-14,-28,28,3);ctx.fillStyle='#ce6e64';ctx.fillRect(-14,-28,28*(z.hp/z.maxHp),3);
      ctx.restore();
    }

    for(const p of state.players){
      ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=p.connected?1:.38;
      if(p.pending) ctx.globalAlpha=.28;
      const isMe=p.id===myId;
      ctx.fillStyle=isMe?'#d9f2de':colors.player;
      ctx.beginPath();ctx.ellipse(0,2,10,15,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(0,-14,7,0,Math.PI*2);ctx.fill();
      if(isMe){ctx.strokeStyle='#f1fff2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.stroke()}
      if(p.downUntil>Date.now()+clockOffset){ctx.strokeStyle='#e58d84';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,10);ctx.moveTo(10,-10);ctx.lineTo(-10,10);ctx.stroke()}
      ctx.fillStyle='#edf3ed';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.name,0,31);
      if(p.ready && state.phase==='maintenance'){ctx.fillStyle='#8fd59d';ctx.fillText('READY',0,46)}
      ctx.restore();
    }

    if(me && !me.pending){
      ctx.save();ctx.strokeStyle='#d8e8da88';ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(me.x,me.y,4,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
  }

  canvas.addEventListener('pointerdown', e => {
    if(!state || !myId) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*canvas.width;
    const y=(e.clientY-rect.top)/rect.height*canvas.height;
    send({type:'move',x,y});
  });

  els.ready.addEventListener('click',()=>send({type:'ready',value:!localReady}));
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>send({type:'maintenance-action',action:btn.dataset.action})));
  els.nameBtn.addEventListener('click',()=>{
    const name=(els.name.value.trim()||'생존자').slice(0,16);els.name.value=name;localStorage.setItem('zc-name',name);send({type:'name',name});
  });
  els.name.addEventListener('keydown',e=>{if(e.key==='Enter')els.nameBtn.click()});

  setInterval(updateTimer,100);
  connect();
  drawWorld();
})();
</script>
</body>
</html>
