<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0d120f" />
  <title>SAFEHOUSE — 협동 좀비 생존</title>
  <style>
    :root{color-scheme:dark;--text:#f1f5f1;--muted:#aeb7af;--line:#425047;--panel:#101713e8;--good:#8fd59d;--danger:#e58d84;--warn:#d7bd72}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d120f;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    button{font:inherit;color:inherit}
    .game{position:relative;width:100%;height:100dvh;min-height:420px;overflow:hidden;background:#0d120f;touch-action:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#111913}
    .hud{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
    .hudGroup{display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
    .chip{background:#0c120edb;border:1px solid #3a473e;border-radius:999px;padding:7px 10px;font-size:12px;line-height:1;backdrop-filter:blur(8px);white-space:nowrap}
    .chip strong{font-size:13px}
    .stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
    .stat{background:#0c120edb;border:1px solid #3a473e;border-radius:10px;padding:6px 8px;font-size:11px;backdrop-filter:blur(8px);white-space:nowrap}
    .stat b{font-size:13px;margin-left:3px}
    .connection{width:8px;height:8px;border-radius:50%;background:#d7bd72;box-shadow:0 0 0 3px #0d120faa;position:absolute;right:max(7px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));transform:translate(3px,-3px);pointer-events:none}.connection.ok{background:#8fd59d}.connection.bad{background:#e58d84}
    .pending{position:absolute;left:50%;top:58px;transform:translateX(-50%);max-width:calc(100% - 30px);background:#2a2519e8;border:1px solid #675a35;border-radius:10px;padding:8px 11px;font-size:12px;color:#f1dfac;text-align:center;display:none;pointer-events:none}.pending.show{display:block}
    .toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:#0c120ee8;border:1px solid #445148;border-radius:10px;padding:7px 10px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70%;text-align:center}.toast.show{opacity:1}
    .joystick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));width:132px;height:132px;border-radius:50%;background:#0b100dcc;border:1px solid #465149;box-shadow:inset 0 0 0 22px #17201988;touch-action:none;user-select:none}
    .joystick::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#748078;transform:translate(-50%,-50%)}
    .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#dce8de;border:2px solid #68756c;transform:translate(-50%,-50%);box-shadow:0 3px 16px #0008;pointer-events:none}
    .autoTag{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));background:#0c120ebb;border:1px solid #354239;border-radius:999px;padding:7px 9px;font-size:11px;color:#aeb7af;pointer-events:none}
    .maint{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:#101713f2;border:1px solid #445148;border-radius:16px;padding:11px;display:none;backdrop-filter:blur(10px);box-shadow:0 12px 30px #0008}.maint.show{display:block}
    .maintTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.maintTitle{font-weight:800;font-size:14px}.stash{display:flex;gap:8px;font-size:11px;color:var(--muted);white-space:nowrap}.stash b{color:var(--text)}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions button,.ready{min-height:46px;border:1px solid #445148;background:#1b241e;border-radius:11px;font-weight:750;font-size:12px}.actions button:active,.ready:active{transform:translateY(1px)}
    .ready{width:100%;margin-top:7px;background:#26372a;border-color:#5d7662}.ready.on{background:#36563d;border-color:#80b18b}
    .vote{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}.vote b{color:var(--text)}
    .countdown{color:#f0dfab;font-weight:800}
    @media(max-width:430px){.chip{padding:6px 8px}.stat{padding:5px 7px}.joystick{width:120px;height:120px}.knob{width:54px;height:54px}.autoTag{font-size:10px}.maint{padding:9px}.actions button{font-size:11px}}
    @media(orientation:landscape) and (max-height:520px){.joystick{width:104px;height:104px}.knob{width:46px;height:46px}.hud{top:7px}.maint{width:min(620px,calc(100% - 140px));left:auto;right:12px;transform:none}.autoTag{display:none}}
  </style>
</head>
<body>
<div class="game" id="gameRoot">
  <canvas id="game" aria-label="협동 좀비 생존 게임"></canvas>

  <div class="hud">
    <div class="hudGroup">
      <div class="chip"><strong id="dayText">DAY 1</strong> · <span id="phaseText">정비</span> <strong id="timerText">정지</strong></div>
      <div class="chip" id="baseChip">거점 <strong id="baseText">300</strong></div>
    </div>
    <div class="stats">
      <div class="stat">HP <b id="hpText">100</b></div>
      <div class="stat">탄 <b id="ammoText">18</b></div>
      <div class="stat">가방 <b id="carryText">0/12</b></div>
    </div>
  </div>
  <div class="connection" id="connDot" title="서버 연결 상태"></div>
  <div class="pending" id="pendingBanner">진행 중인 DAY입니다. 다음 아침부터 합류합니다.</div>
  <div class="toast" id="toast"></div>

  <div class="joystick" id="joystick" aria-label="이동 조이스틱">
    <div class="knob" id="knob"></div>
  </div>
  <div class="autoTag" id="autoTag">접근 시 자동 채집 · 자동 공격</div>

  <section class="maint" id="maintCard" aria-label="정비 메뉴">
    <div class="maintTop">
      <div class="maintTitle">정비 · 시간 정지</div>
      <div class="stash">식 <b id="foodText">0</b> · 자 <b id="scrapText">0</b> · 약 <b id="medsText">0</b></div>
    </div>
    <div class="actions">
      <button type="button" data-action="repair">방벽 수리<br><small>자재 5</small></button>
      <button type="button" data-action="ammo">탄약 보급<br><small>자재 4</small></button>
      <button type="button" data-action="heal">치료<br><small>약품 1</small></button>
    </div>
    <button class="ready" id="readyBtn" type="button">다음 날 준비 완료</button>
    <div class="vote" id="voteText">0 / 1 준비</div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = $('gameRoot');
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const els = {
    day:$('dayText'), phase:$('phaseText'), timer:$('timerText'), base:$('baseText'), baseChip:$('baseChip'),
    hp:$('hpText'), ammo:$('ammoText'), carry:$('carryText'), food:$('foodText'), scrap:$('scrapText'), meds:$('medsText'),
    maint:$('maintCard'), ready:$('readyBtn'), vote:$('voteText'), pending:$('pendingBanner'), conn:$('connDot'), toast:$('toast'),
    joystick:$('joystick'), knob:$('knob'), autoTag:$('autoTag')
  };

  let myId = null;
  let state = null;
  let ws = null;
  let reconnectTimer = null;
  let clockOffset = 0;
  let localReady = false;
  let joystickPointer = null;
  let input = {x:0,y:0};
  let lastSent = {x:99,y:99};
  let toastTimer = null;
  let lastEventId = null;
  const playerName = localStorage.getItem('zc-name') || `생존자${Math.floor(100 + Math.random()*900)}`;

  const colors = {food:'#b9b36e',scrap:'#9aa0a4',meds:'#91b7a0',ammo:'#b29a78',zombie:'#b96861',elite:'#d08a72',player:'#b8e1c0'};

  function connect(){
    clearTimeout(reconnectTimer);
    els.conn.className='connection';
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.addEventListener('open',()=>{
      els.conn.className='connection ok';
      ws.send(JSON.stringify({type:'hello',token:localStorage.getItem('zc-token')||'',name:playerName}));
    });
    ws.addEventListener('message',e=>{
      let msg; try{msg=JSON.parse(e.data)}catch{return}
      if(msg.type==='welcome'){
        myId=msg.id;
        localStorage.setItem('zc-token',msg.token);
      } else if(msg.type==='state'){
        state=msg;
        clockOffset=msg.serverNow-Date.now();
        updateUI();
        showLatestEvent();
      }
    });
    ws.addEventListener('close',()=>{
      els.conn.className='connection bad';
      stopInput();
      reconnectTimer=setTimeout(connect,1300);
    });
    ws.addEventListener('error',()=>{try{ws.close()}catch{}});
  }

  function send(data){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data))}
  function mine(){return state?.players?.find(p=>p.id===myId)||null}
  function carryTotal(p){return p?p.carry.food+p.carry.scrap+p.carry.meds+p.carry.ammo:0}
  function phaseName(p){return p==='day'?'낮':p==='night'?'밤':'정비'}

  function updateUI(){
    if(!state)return;
    const me=mine();
    els.day.textContent=`DAY ${state.day}`;
    els.phase.textContent=phaseName(state.phase);
    els.base.textContent=`${Math.ceil(state.baseHp)}/${state.baseMaxHp}`;
    els.baseChip.style.display=state.baseHp<state.baseMaxHp||state.phase==='night'?'block':'none';
    els.food.textContent=state.stash.food;
    els.scrap.textContent=state.stash.scrap;
    els.meds.textContent=state.stash.meds;
    els.maint.classList.toggle('show',state.phase==='maintenance');
    els.pending.classList.toggle('show',Boolean(me?.pending));
    els.joystick.style.opacity=me?.pending?'.35':'1';
    els.autoTag.style.display=state.phase==='maintenance'?'none':'block';
    if(me){
      els.hp.textContent=Math.max(0,Math.ceil(me.hp));
      els.ammo.textContent=me.ammo;
      els.carry.textContent=`${carryTotal(me)}/${me.carryCap}`;
      localReady=me.ready;
      els.ready.classList.toggle('on',me.ready);
      els.ready.textContent=me.ready?'준비 완료 ✓':'다음 날 준비 완료';
      els.ready.disabled=Boolean(me.pending);
    }
    const r=state.ready;
    const cd=state.countdownEndsAt?'<span class="countdown"> · 출발 대기</span>':'';
    els.vote.innerHTML=`<b>${r.ready}/${r.total}</b> 준비 · 과반수 ${r.required}명${cd}`;
    if(state.phase==='maintenance'&&Math.hypot(input.x,input.y)>.01)stopInput();
  }

  function showLatestEvent(){
    if(!state?.events?.length)return;
    const ev=state.events[state.events.length-1];
    if(ev.id===lastEventId)return;
    lastEventId=ev.id;
    els.toast.textContent=ev.text;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2200);
  }

  function updateTimer(){
    if(!state)return;
    const t=Date.now()+clockOffset;
    if(state.phase==='maintenance'){
      if(state.countdownEndsAt){
        const s=Math.max(0,(state.countdownEndsAt-t)/1000);
        els.timer.textContent=`${s.toFixed(1)}초`;
      }else els.timer.textContent='정지';
    }else if(state.phaseEndsAt){
      const sec=Math.max(0,Math.ceil((state.phaseEndsAt-t)/1000));
      els.timer.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    }
  }

  function resizeCanvas(){
    const rect=root.getBoundingClientRect();
    const dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.max(1,Math.round(rect.width*dpr));
    canvas.height=Math.max(1,Math.round(rect.height*dpr));
    canvas.style.width=`${rect.width}px`;
    canvas.style.height=`${rect.height}px`;
  }

  function camera(){
    const rect=canvas.getBoundingClientRect();
    const me=mine();
    const target=me||state?.world?.base||{x:600,y:400};
    const scale=Math.max(rect.width/560,rect.height/720);
    const halfW=rect.width/(2*scale),halfH=rect.height/(2*scale);
    let x=target.x,y=target.y;
    if(state){
      x=halfW*2>=state.world.width?state.world.width/2:Math.max(halfW,Math.min(state.world.width-halfW,x));
      y=halfH*2>=state.world.height?state.world.height/2:Math.max(halfH,Math.min(state.world.height-halfH,y));
    }
    return {x,y,scale,w:rect.width,h:rect.height};
  }

  function drawWorld(){
    requestAnimationFrame(drawWorld);
    if(!state)return;
    const rect=canvas.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr))resizeCanvas();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle=state.phase==='night'?'#0d110f':'#142018';ctx.fillRect(0,0,rect.width,rect.height);
    const cam=camera();
    const sx=x=>(x-cam.x)*cam.scale+cam.w/2;
    const sy=y=>(y-cam.y)*cam.scale+cam.h/2;
    const s=cam.scale;

    ctx.strokeStyle=state.phase==='night'?'#1d251f':'#26372a';ctx.lineWidth=1;
    const left=cam.x-cam.w/(2*s),right=cam.x+cam.w/(2*s),top=cam.y-cam.h/(2*s),bottom=cam.y+cam.h/(2*s);
    for(let x=Math.floor(left/80)*80;x<=right;x+=80){ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),cam.h);ctx.stroke()}
    for(let y=Math.floor(top/80)*80;y<=bottom;y+=80){ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(cam.w,sy(y));ctx.stroke()}

    const b=state.world.base;
    ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),b.r*s,0,Math.PI*2);ctx.fillStyle='#213428';ctx.fill();ctx.strokeStyle='#759a7c';ctx.lineWidth=Math.max(2,3*s);ctx.stroke();
    ctx.fillStyle='#d9e7db';ctx.font=`700 ${Math.max(12,15*s)}px system-ui`;ctx.textAlign='center';ctx.fillText('SAFEHOUSE',sx(b.x),sy(b.y)-5*s);

    for(const r of state.resources){
      const x=sx(r.x),y=sy(r.y),rr=r.r*s;
      if(x+rr<0||x-rr>cam.w||y+rr<0||y-rr>cam.h)continue;
      ctx.save();ctx.setLineDash([7,5]);ctx.strokeStyle=r.stock>0?colors[r.type]:'#4b504c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.15;ctx.fillStyle=r.stock>0?colors[r.type]:'#555b56';ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#edf3ed';ctx.font=`700 ${Math.max(11,13*s)}px system-ui`;ctx.textAlign='center';ctx.fillText(r.label,x,y-2);ctx.fillStyle='#b7c0b8';ctx.font=`${Math.max(10,11*s)}px system-ui`;ctx.fillText(r.stock>0?`${r.stock}`:'소진',x,y+15);ctx.restore();
    }

    const me=mine();
    if(me&&!me.pending&&state.phase!=='maintenance'){
      ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='#b9d9bf4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx(me.x),sy(me.y),155*s,0,Math.PI*2);ctx.stroke();ctx.restore();
    }

    for(const z of state.zombies){
      const x=sx(z.x),y=sy(z.y);if(x<-30||x>cam.w+30||y<-40||y>cam.h+40)continue;
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=z.elite?colors.elite:colors.zombie;ctx.beginPath();ctx.ellipse(0,0,z.elite?14:11,z.elite?18:15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4b2aa';ctx.beginPath();ctx.arc(0,-16,z.elite?8:6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#281918';ctx.fillRect(-14,-28,28,3);ctx.fillStyle='#ce6e64';ctx.fillRect(-14,-28,28*(z.hp/z.maxHp),3);ctx.restore();
    }

    for(const p of state.players){
      const x=sx(p.x),y=sy(p.y);if(x<-30||x>cam.w+30||y<-50||y>cam.h+50)continue;
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=p.connected?1:.38;if(p.pending)ctx.globalAlpha=.28;const isMe=p.id===myId;ctx.fillStyle=isMe?'#e5f7e8':colors.player;ctx.beginPath();ctx.ellipse(0,2,10,15,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,-14,7,0,Math.PI*2);ctx.fill();if(isMe){ctx.strokeStyle='#f2fff4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.stroke()}if(p.downUntil>Date.now()+clockOffset){ctx.strokeStyle='#e58d84';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,10);ctx.moveTo(10,-10);ctx.lineTo(-10,10);ctx.stroke()}ctx.fillStyle='#eef3ee';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(isMe?'나':p.name,0,32);ctx.restore();
    }
  }

  function setJoystickFromEvent(e){
    const r=els.joystick.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;
    const max=r.width*.31;
    const d=Math.hypot(dx,dy);
    if(d>max){dx=dx/d*max;dy=dy/d*max}
    const nx=dx/max,ny=dy/max;
    const dead=.12;
    input.x=Math.abs(nx)<dead?0:nx;
    input.y=Math.abs(ny)<dead?0:ny;
    els.knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  }
  function stopInput(){
    input.x=0;input.y=0;joystickPointer=null;els.knob.style.transform='translate(-50%,-50%)';sendInput(true);
  }
  function sendInput(force=false){
    const x=Math.round(input.x*100)/100,y=Math.round(input.y*100)/100;
    if(force||Math.abs(x-lastSent.x)>.02||Math.abs(y-lastSent.y)>.02){send({type:'input',x,y});lastSent={x,y}}
  }

  els.joystick.addEventListener('pointerdown',e=>{
    if(mine()?.pending)return;
    joystickPointer=e.pointerId;els.joystick.setPointerCapture(e.pointerId);setJoystickFromEvent(e);sendInput(true);e.preventDefault();
  });
  els.joystick.addEventListener('pointermove',e=>{if(e.pointerId!==joystickPointer)return;setJoystickFromEvent(e);e.preventDefault()});
  els.joystick.addEventListener('pointerup',e=>{if(e.pointerId===joystickPointer)stopInput()});
  els.joystick.addEventListener('pointercancel',e=>{if(e.pointerId===joystickPointer)stopInput()});

  const keys=new Set();
  function keyInput(){
    let x=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);
    let y=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
    const d=Math.hypot(x,y);if(d>1){x/=d;y/=d}input={x,y};sendInput(true);
  }
  window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys.add(e.key);keyInput();e.preventDefault()}});
  window.addEventListener('keyup',e=>{if(keys.delete(e.key)){keyInput();e.preventDefault()}});

  els.ready.addEventListener('click',()=>send({type:'ready',value:!localReady}));
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>send({type:'maintenance-action',action:btn.dataset.action})));
  setInterval(()=>sendInput(false),50);
  setInterval(updateTimer,100);
  window.addEventListener('resize',resizeCanvas);
  window.addEventListener('blur',stopInput);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopInput()});
  resizeCanvas();connect();drawWorld();
})();
</script>
</body>
</html>
