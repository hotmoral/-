name: Einstein Pre4 P1 Hotspot Optimization Zero-Draw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-p1-hotspot-optimization-zero-draw.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-p1-hotspot-zero-draw-v2
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: b9cee065c261066919c36284c04c4777323c167b
      BRANCH: pre4-zero-draw-runtime-memory-optimization-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
      CLASSES_DIR: /tmp/einstein-pre4-p1-classes
      SOURCES_FILE: /tmp/einstein-pre4-p1-sources.txt
    steps:
      - name: Require private write token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout public patch harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: d2854ae39e3e5ac5394aa3d0603d81d0e5733c02
          path: Harness
          persist-credentials: false

      - name: Checkout exact validated candidate
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b9cee065c261066919c36284c04c4777323c167b
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 2
          persist-credentials: true

      - name: Apply P1 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C EinsteinGame rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 Harness/scripts/einstein_pre4_p1_patch.py EinsteinGame
          git -C EinsteinGame diff --check
          mapfile -t changed < <(git -C EinsteinGame diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/aha/StructuralAhaAnalyzer.java'
          test "${changed[1]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java'
          test "${changed[2]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/ExperienceSimulator.java'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java 8 and run focused regressions
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          find puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss -type f -name '*.java' -print | sort >> "$SOURCES_FILE"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.PssAhaTest | tee /tmp/p1-aha.log
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.PssDifficultyTest | tee /tmp/p1-difficulty.log
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.PssExperienceTest | tee /tmp/p1-experience.log
          grep -F 'CP8 STRUCTURAL AHA ANALYZER: PASS; assertions=3511' /tmp/p1-aha.log

      - name: Commit and push validated P1 candidate
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          git config user.name 'Einstein Zero-Draw Optimization'
          git config user.email 'noreply@localhost'
          git add puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/aha/StructuralAhaAnalyzer.java
          git add puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java
          git add puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/ExperienceSimulator.java
          git commit -m 'perf: index bounded replay and reuse path identities'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$NEW_SHA"
          echo "P1_CANDIDATE_SHA=$NEW_SHA"
          echo 'formalAcquisitionInvocation=0'
          echo 'privateEvidenceWrite=0'
          echo 'EINSTEIN_PRE4_P1_ZERO_DRAW=PASS'