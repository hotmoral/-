                prefix = prefix.append(leaf.steps.get(i));
                if (targets.contains(prefix.pathId) && indexedForLeaf.add(prefix.pathId))
                    out.computeIfAbsent(prefix.pathId, x -> new ArrayList<>()).add(new CascadeLocation(leaf,i));
            }
        }
        return out;
