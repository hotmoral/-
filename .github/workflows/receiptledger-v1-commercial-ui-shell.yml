name: ReceiptLedger V1 Commercial UI Shell

on:
  push:
    branches:
      - receiptledger/run-v1-commercial-ui-shell-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-commercial-ui-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP34 scope and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=2a15e14e9897aa9785762faef1568254fbeb5f82
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp34-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-commercial-ui-shell.yml) ;;
              receiptledger/CP34_COMMERCIAL_UI_SHELL_PLAN.md) ;;
              receiptledger/COMMERCIAL_UI_SHELL_CONSISTENCY_REVIEW.md) ;;
              receiptledger/COMMERCIAL_UI_SHELL_GOLDEN_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/AndroidManifest.xml) ;;
              receiptledger/harness/android-v1/app/src/main/res/values/strings.xml) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/HomeActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/SearchBrowseActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/LibraryActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/shell/CommercialDestinationV1.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/shell/CommercialShellFormatterV1.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/shell/CommercialUiShellV1Test.java) ;;
              '') ;;
              *) echo "CP34 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp34-changed-files.txt

          for frozen in catalog product semantics identity category commodity commoditydetail persistence price priceintel priceeval search detail design ocr recovery item validation review; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/$frozen" || {
              echo "Frozen upstream package changed: $frozen"; exit 32;
            }
          done

          for frozen_file in \
            "$APP/src/main/java/com/receiptledger/v1/MainActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/ProductDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/CommodityDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/PriceHistoryActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/ReceiptDetailActivity.java"; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$frozen_file" || {
              echo "Frozen CP34 dependency changed: $frozen_file"; exit 33;
            }
          done

          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 33' "$APP/build.gradle"
          grep -Fq "versionName '1.0.32-commercial-ui-shell'" "$APP/build.gradle"

          MANIFEST="$APP/src/main/AndroidManifest.xml"
          grep -Fq '<activity android:name=".HomeActivity" android:exported="true">' "$MANIFEST"
          grep -Fq '<activity android:name=".MainActivity" android:exported="false" />' "$MANIFEST"
          grep -Fq '<activity android:name=".SearchBrowseActivity" android:exported="false" />' "$MANIFEST"
          grep -Fq 'android.intent.action.MAIN' "$MANIFEST"
          grep -Fq 'android.intent.category.LAUNCHER' "$MANIFEST"

          HOME="$APP/src/main/java/com/receiptledger/v1/HomeActivity.java"
          SEARCH="$APP/src/main/java/com/receiptledger/v1/SearchBrowseActivity.java"
          LIBRARY="$APP/src/main/java/com/receiptledger/v1/LibraryActivity.java"
          grep -Fq 'new Intent(this, MainActivity.class)' "$HOME"
          grep -Fq 'new Intent(this, SearchBrowseActivity.class)' "$HOME"
          grep -Fq 'new Intent(this, LibraryActivity.class)' "$HOME"
          grep -Fq 'discovery.recent(3)' "$HOME"
          grep -Fq 'SearchBrowseQueryV1.text' "$SEARCH"
          grep -Fq 'discovery.recent' "$SEARCH"
          grep -Fq 'discovery.frequent' "$SEARCH"
          grep -Fq 'discovery.byCategory' "$SEARCH"
          grep -Fq 'ProductDetailActivity.class' "$SEARCH"
          grep -Fq 'CommodityDetailActivity.class' "$SEARCH"
          if grep -Fq 'PriceHistoryActivity.class' "$LIBRARY"; then
            echo 'Library still exposes legacy PriceHistoryActivity as primary browse path'; exit 34
          fi

      - name: Test lint and build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
            if ! grep -Fqx 'No issues found.' "$REPORT"; then
              echo 'CP34 requires lint 0 errors / 0 warnings'
              status=43
            fi
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Extract and verify CP34 metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp34-commercial-ui-shell-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml'
          root=ET.parse(path).getroot()
          if int(root.attrib.get('failures','0')) or int(root.attrib.get('errors','0')):
              raise SystemExit('CP34 tests failed')
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP34_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected exactly one CP34_METRICS line, got %d' % len(lines))
          line=lines[0]
          values={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)', line)}
          expected={
            'shell_version':1,
            'launcher_home':1,
            'add_receipt':1,
            'search_browse':1,
            'category_browse':1,
            'standard_detail':1,
            'commodity_detail':1,
            'receipt_history':1,
            'legacy_price_entry_removed':1,
            'schema_unchanged':1,
          }
          for key,value in expected.items():
              if values.get(key) != value:
                  raise SystemExit('%s expected %d got %r' % (key,value,values.get(key)))
          print(line)
          PY

      - name: Package and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=2a15e14e9897aa9785762faef1568254fbeb5f82
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-commercial-ui-shell
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-commercial-ui-shell-debug.apk"
          cp receiptledger/cp34-commercial-ui-shell-metrics.txt "$OUT/CP34_COMMERCIAL_UI_SHELL_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml" "$OUT/COMMERCIAL_UI_SHELL_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml" "$OUT/CAPTURE_REVIEW_UX_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml" "$OUT/COMMODITY_DETAIL_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml" "$OUT/PRODUCT_DETAIL_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml" "$OUT/SEARCH_BROWSE_V1_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-commercial-ui-shell-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 51; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP34_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-commercial-ui-shell-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_COMMERCIAL_UI_SHELL_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'launcher=HOME_ACTIVITY'
            echo 'capture_destination=CP33_MAIN_ACTIVITY'
            echo 'discovery=CP29_READ_ONLY'
            echo 'standard_detail=CP31'
            echo 'commodity_detail=CP32'
            echo 'receipt_history=LIBRARY_TO_RECEIPT_DETAIL'
            echo 'legacy_price_history_primary_entry=REMOVED'
            echo 'identity_authority=UNCHANGED'
            echo 'ui_architecture=PROGRAMMATIC_ANDROID_WIDGET_PRESERVED'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.32-commercial-ui-shell'
            echo 'version_code=33'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP34_COMMERCIAL_UI_SHELL_METRICS.txt "$OUT"/COMMERCIAL_UI_SHELL_V1_TEST.xml "$OUT"/CP34_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-commercial-ui-shell-${{ github.run_id }}
          path: receiptledger/output/v1-commercial-ui-shell/
          if-no-files-found: error
          retention-days: 14
