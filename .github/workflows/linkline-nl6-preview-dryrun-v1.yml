name: Linkline NL6 Preview Dry Run

on:
  push:
    branches:
      - linkline/cloudflare-nl6-repair-preview-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact preview commit
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Node syntax and delivery materialization
        shell: bash
        working-directory: repo/timing-defense-skilled-v2-harness
        run: |
          set -euo pipefail
          node --check src/index.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          import worker from './src/index.js';

          const root=path.resolve('public');
          const mime=(p)=>p.endsWith('.mjs')||p.endsWith('.js')?'text/javascript':p.endsWith('.json')?'application/json':p.endsWith('.css')?'text/css':'text/html';
          const env={ASSETS:{fetch:async(request)=>{
            const url=new URL(typeof request==='string'?request:request.url);
            const rel=url.pathname==='/'?'index.html':url.pathname.replace(/^\//,'');
            try{
              const body=await fs.readFile(path.join(root,rel));
              return new Response(body,{status:200,headers:{'content-type':mime(rel)}});
            }catch{
              return new Response('Not Found',{status:404});
            }
          }}};
          const blobSha=(text)=>{
            const body=Buffer.from(text,'utf8');
            return createHash('sha1').update(Buffer.from(`blob ${body.length}\0`)).update(body).digest('hex');
          };
          const get=async(p)=>worker.fetch(new Request(`https://preview.invalid${p}`),env);

          const health=await get('/api/health');
          if(health.status!==200)throw new Error('health status');
          const h=await health.json();
          if(h.sessionId!=='NL6_MATCHED_1_REPAIR_1'||h.humanCollectionEnabled!==false)throw new Error('health identity');

          const appResponse=await get('/app.mjs');
          if(appResponse.status!==200)throw new Error('app materialization status');
          const app=await appResponse.text();
          if(blobSha(app)!=='4eb9fa0c7deded41d9e33074618873edd760c86a')throw new Error('app blob');
          if(!app.includes('linkline-nl6-matched-repair-1.json')||app.includes('linkline-nl5-matched-repair-1.json'))throw new Error('app filename');

          const protocolResponse=await get('/protocol.mjs');
          if(protocolResponse.status!==200)throw new Error('protocol materialization status');
          const protocol=await protocolResponse.text();
          if(blobSha(protocol)!=='bf076ae47a21c2aab7004b2ee5aa4bcb9d051868')throw new Error('protocol blob');
          if(!protocol.includes('LINKLINE_A3_NL6_RUNTIME_ANALYSIS_METADATA')||!protocol.includes("bundle?.largerN!==6"))throw new Error('protocol identity');

          const index=await get('/index.html');
          if(index.status!==200)throw new Error('index status');
          console.log('PREVIEW_DELIVERY_MATERIALIZATION_PASS');
          NODE

      - name: Wrangler dry run
        shell: bash
        working-directory: repo/timing-defense-skilled-v2-harness
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npx wrangler deploy --dry-run --outdir /tmp/linkline-nl6-wrangler-dry
          test -d /tmp/linkline-nl6-wrangler-dry
          echo WRANGLER_DRY_RUN_PASS
