name: Timing Defense P5 Stage48 real-monster fast temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-fast-temp.yml
      - timing-defense-workspace/tools/run_p5_stage48_armored_vs_real_pulse_temp.py

permissions:
  contents: read

jobs:
  fast-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run Stage48 armored-vs-real pulse comparison
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage48_armored_vs_real_pulse_temp.py > /tmp/armored_vs_real.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p5_stage48_armored_vs_real_pulse_temp.json').read_text())
          print('P5_STAGE48_ARMORED_VS_REAL='+json.dumps(d['rows'],sort_keys=True))
          print('P5_STAGE48_ARMORED_VS_REAL_SCHEDULES='+json.dumps(d['schedules'],sort_keys=True))
          PY
