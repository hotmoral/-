name: Timing Defense P5 Stage48 real-monster fast temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-fast-temp.yml
      - timing-defense-workspace/tools/run_p5_stage48_sieger_death_position_temp.py
      - timing-defense-workspace/tools/run_p5_stage48_screen_handoff_timeline_temp.py

permissions:
  contents: read

jobs:
  fast-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run Stage48 screen-handoff timeline diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage48_screen_handoff_timeline_temp.py > /tmp/handoff.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p5_stage48_screen_handoff_timeline_temp.json').read_text())
          slim=[]
          for r in d['rows']:
              slim.append({
                  'variant':r['variant'],'class':r['class'],
                  'windups':r['siegerWindups'],'shots':r['siegerShots'],
                  'damagedBeforePrimary':r['damagedBeforePrimaryCount'],
                  'diedBeforePrimary':r['diedBeforePrimaryCount'],
                  'everPrimary':r['everPrimaryCount'],
                  'minProtectDamage':r['minProtectedUntilFirstDamage'],
                  'maxProtectDamage':r['maxProtectedUntilFirstDamage'],
                  'minAheadAtDamage':r['minBodiesAheadAtFirstDamage'],
                  'maxAheadAtDamage':r['maxBodiesAheadAtFirstDamage'],
              })
          print('P5_STAGE48_SCREEN_HANDOFF_SUMMARY='+json.dumps(slim,sort_keys=True))
          print('P5_STAGE48_SCREEN_HANDOFF_FULL='+json.dumps(d,sort_keys=True))
          PY
