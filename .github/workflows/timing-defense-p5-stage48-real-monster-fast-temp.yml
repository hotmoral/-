name: Timing Defense P5 Stage48 real-monster fast temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-fast-temp.yml

permissions:
  contents: read

jobs:
  fast-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run SIEGER windup diagnostic and print aggregate
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage48_sieger_windup_diagnostic_temp.py > /tmp/windup.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p5_stage48_sieger_windup_diagnostic_temp.json').read_text())
          out={}
          for name,v in d['variants'].items():
            out[name]={k:v[k] for k in ('windupCases','totalWindups','shotCases','totalShots','repositionCases','totalRepositions','perClass')}
          print('P5_STAGE48_SIEGER_WINDUP='+json.dumps(out,sort_keys=True))
          PY
