name: Timing Defense P5 Stage48 real-monster fast temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-fast-temp.yml
      - timing-defense-workspace/tools/run_p5_stage46_49_moderate_standoff_grunt_screen_temp.py

permissions:
  contents: read

jobs:
  fast-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run moderate SIEGER standoff screen
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage46_49_moderate_standoff_grunt_screen_temp.py > /tmp/moderate-standoff.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p5_stage46_49_moderate_standoff_grunt_screen_temp.json').read_text())
          print('P5_MODERATE_STANDOFF_AGG='+json.dumps(d['aggregate'],sort_keys=True))
          for r in d['rows']:
              print('P5_MODERATE_STANDOFF_ROW='+json.dumps(r,sort_keys=True))
          PY
