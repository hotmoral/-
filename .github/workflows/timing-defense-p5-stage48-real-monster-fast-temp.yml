name: Timing Defense P5 Stage48 real-monster fast temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-fast-temp.yml

permissions:
  contents: read

jobs:
  fast-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run and print aggregate
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage48_real_monster_chronology_fast_temp.py > /tmp/full.json
          cp p5_stage48_real_monster_chronology_fast_temp.json /tmp/result1.json
          python3 tools/run_p5_stage48_real_monster_chronology_fast_temp.py > /tmp/full2.json
          cmp /tmp/result1.json p5_stage48_real_monster_chronology_fast_temp.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('p5_stage48_real_monster_chronology_fast_temp.json')
          d=json.loads(p.read_text())
          out={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'variants':{}}
          for name,v in d['variants'].items():
            a=v['aggregate']
            out['variants'][name]={
              'settled':f"{a['settledThroughStage49Count']}/{a['totalRows']}",
              'failures':a['failures'],
              'stage48SiegerShotCases':a['stage48SiegerShotCases'],
              'stage48TotalSiegerShots':a['stage48TotalSiegerShots'],
              'stage48MaxSiegerShotsOneRow':a['stage48MaxSiegerShotsOneRow'],
              'perClass':a['perClass']
            }
          print('P5_STAGE48_REAL_MONSTER_AGGREGATE='+json.dumps(out,sort_keys=True))
          PY
