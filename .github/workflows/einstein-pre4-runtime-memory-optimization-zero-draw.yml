name: Einstein Pre4 Candidate Zero-Draw Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-runtime-memory-optimization-zero-draw.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-candidate-zero-draw-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: bddc1e741252eec7793d9064a607c495c006ce9c
      CANDIDATE_SHA: b9cee065c261066919c36284c04c4777323c167b
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BASE_CLASSES: /tmp/einstein-pre4-base-classes
      CANDIDATE_CLASSES: /tmp/einstein-pre4-candidate-classes
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bddc1e741252eec7793d9064a607c495c006ce9c
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: Baseline
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b9cee065c261066919c36284c04c4777323c167b
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: Candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Hard gate exact reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C Candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C Candidate cat-file -e "$BASE_SHA^{commit}"
          test "$(git -C Candidate merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git -C Candidate diff --name-only "$BASE_SHA" HEAD | sort)
          expected=(
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/contract/HumanStep.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/RawDifficultyEvidence.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAssessment.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/ExperienceSimulator.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/RawExperienceEvidence.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/path/HumanSolutionPath.java'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 7
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test -z "$(git -C Candidate diff --name-only "$BASE_SHA" HEAD -- puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/acquisition)"
          test -z "$(git -C Candidate diff --name-only "$BASE_SHA" HEAD -- puzzle-authoring/build.gradle)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile baseline and candidate as Java 8
        shell: bash
        run: |
          set -euo pipefail
          compile_repo() {
            repo="$1"
            out="$2"
            src="/tmp/$(basename "$out")-sources.txt"
            rm -rf "$out" "$src"
            mkdir -p "$out"
            find "$repo/puzzle-core/src/main/java" "$repo/puzzle-authoring/src/main/java" -type f -name '*.java' -print | sort > "$src"
            find "$repo/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss" -type f -name '*.java' -print | sort >> "$src"
            java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$out" "@$src"
          }
          compile_repo Baseline "$BASE_CLASSES"
          compile_repo Candidate "$CANDIDATE_CLASSES"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for root in ['/tmp/einstein-pre4-base-classes','/tmp/einstein-pre4-candidate-classes']:
              files=list(Path(root).rglob('*.class'))
              assert files
              bad=[]
              for p in files:
                  magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
                  if (magic,minor,major)!=(0xCAFEBABE,0,52):
                      bad.append((str(p),major))
              assert not bad,bad[:10]
              print('JAVA8_CLASSFILE_TARGET=PASS root='+root+' count='+str(len(files)))
          PY

      - name: Run CP8 CP9 CP10 exact equivalence and timing
        shell: bash
        run: |
          set -euo pipefail
          run_suite() {
            repo="$1"
            cp="$2"
            tag="$3"
            rm -rf "$repo/build/pss-logical-core"
            (cd "$repo" && /usr/bin/time -f '%e' -o "/tmp/${tag}-aha.time" java -Xmx2g -cp "$cp" com.example.einsteingame.authoring.pss.PssAhaTest > "/tmp/${tag}-aha.log")
            (cd "$repo" && /usr/bin/time -f '%e' -o "/tmp/${tag}-difficulty.time" java -Xmx2g -cp "$cp" com.example.einsteingame.authoring.pss.PssDifficultyTest > "/tmp/${tag}-difficulty.log")
            (cd "$repo" && /usr/bin/time -f '%e' -o "/tmp/${tag}-experience.time" java -Xmx2g -cp "$cp" com.example.einsteingame.authoring.pss.PssExperienceTest > "/tmp/${tag}-experience.log")
          }
          run_suite Baseline "$BASE_CLASSES" base
          run_suite Candidate "$CANDIDATE_CLASSES" candidate
          diff -u /tmp/base-aha.log /tmp/candidate-aha.log
          diff -u /tmp/base-difficulty.log /tmp/candidate-difficulty.log
          diff -u /tmp/base-experience.log /tmp/candidate-experience.log
          diff -qr Baseline/build/pss-logical-core Candidate/build/pss-logical-core
          grep -F 'CP8 STRUCTURAL AHA ANALYZER: PASS; assertions=3511' /tmp/candidate-aha.log
          echo "BASE_AHA_SECONDS=$(cat /tmp/base-aha.time)"
          echo "CANDIDATE_AHA_SECONDS=$(cat /tmp/candidate-aha.time)"
          echo "BASE_DIFFICULTY_SECONDS=$(cat /tmp/base-difficulty.time)"
          echo "CANDIDATE_DIFFICULTY_SECONDS=$(cat /tmp/candidate-difficulty.time)"
          echo "BASE_EXPERIENCE_SECONDS=$(cat /tmp/base-experience.time)"
          echo "CANDIDATE_EXPERIENCE_SECONDS=$(cat /tmp/candidate-experience.time)"

      - name: Verify optimization structure
        shell: bash
        working-directory: Candidate
        run: |
          set -euo pipefail
          grep -F 'reuseSuppliedAha ? suppliedAha : new StructuralAhaAnalyzer().analyze(paths)' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java
          grep -F 'reuseSuppliedDifficulty ? suppliedDifficulty' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/ExperienceSimulator.java
          grep -F 'Objects.requireNonNull(kind), pathId' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/path/HumanSolutionPath.java
          ! grep -F '"pathExperienceTraces",RecordSupport.value(traces)' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/experience/ExperienceSimulator.java

      - name: Run candidate path and acquisition regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd Candidate && java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.PssPathExplorerTest | tee /tmp/pre4-path.log)
          (cd Candidate/puzzle-authoring && java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionTest | tee /tmp/pre4-ia1.log)
          (cd Candidate/puzzle-authoring && java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionIA2Test | tee /tmp/pre4-ia2.log)
          (cd Candidate/puzzle-authoring && java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionIA3Test | tee /tmp/pre4-ia3.log)
          (cd Candidate/puzzle-authoring && java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionCheckpointTest | tee /tmp/pre4-checkpoint.log)
          grep -F 'IntentAcquisitionTest PASS assertions=22' /tmp/pre4-ia1.log
          grep -F 'IntentAcquisitionIA2Test PASS assertions=33' /tmp/pre4-ia2.log
          grep -F 'IntentAcquisitionIA3Test PASS assertions=43' /tmp/pre4-ia3.log
          grep -F 'IntentAcquisitionCheckpointTest PASS assertions=12' /tmp/pre4-checkpoint.log

      - name: Run bounded-view constrained heap regression
        shell: bash
        working-directory: Candidate/puzzle-authoring
        run: |
          set -euo pipefail
          java -Xmx64m -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.contract.BoundedCanonicalRecordViewTest stress | tee /tmp/pre4-bounded.log
          grep -F 'BoundedCanonicalRecordViewStress PASS assertions=2 logicalMinimumBytes=100663296' /tmp/pre4-bounded.log

      - name: Postflight zero-draw boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C Candidate status --porcelain --untracked-files=all)"
          printf '%s\n' \
            'EINSTEIN_PRE4_CANDIDATE_ZERO_DRAW=PASS' \
            "candidate=$CANDIDATE_SHA" \
            'CP8_CP9_CP10_EXACT_OUTPUT_EQUIVALENCE=PASS' \
            'PATH_AND_IA_REGRESSIONS=PASS' \
            'CONSTRAINED_HEAP_REGRESSION=PASS' \
            'formalAcquisitionInvocation=0' \
            'privateEvidenceWrite=0' \
            'artifactUpload=0'