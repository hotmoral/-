name: Mobi P1-C-R2 Minimal Volumetric Proxy V1

on:
  push:
    branches:
      - 'mobi/run-p1-c-r2-minimal-volumetric-proxy-20261016'
    paths:
      - 'mobi/p1-b2/geometry/p1_c_r2_minimal_volumetric_proxy_v1.py'
      - 'mobi/p1-b2/geometry/run_p1_c_r2_minimal_volumetric_proxy_v1.py'
      - 'mobi/p1-b2/geometry/test_p1_c_r2_minimal_volumetric_proxy_v1.py'
      - '.github/workflows/mobi-p1-c-r2-minimal-volumetric-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-c-r2-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c-r2/evidence
          { echo "git_commit=${GITHUB_SHA}"; echo "runner=ubuntu-latest"; python3 --version; } | tee mobi/p1-c-r2/evidence/environment.txt

      - name: Verify exact private parity and frozen semantic inputs
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'p1_c_r2_minimal_volumetric_proxy_v1.py': '4d4006f66e98fbf10ce54ed87bb78a9ee5ee3daa',
              'run_p1_c_r2_minimal_volumetric_proxy_v1.py': '2f22832470d48ed9646821df62f8505b7ce3bb54',
              'test_p1_c_r2_minimal_volumetric_proxy_v1.py': 'b30d9c494d78073cd6c2f966b7117daefd6867ca',
              'model.py': 'c4e0334cf5896d0bb7a2ab3e8d89c1cd37f7410b',
              'orientation_v2.py': '33cb9c1e8f3b41f038898345a0aee0642609e812',
              'e_v0_profiles.py': '087826028fa7a2ad5a9a042ec188f335c9ff18cc',
              'e_v0_fixture_adapter.py': '96bb5351208c157003ce0a50f828075537c5edb5',
              'c3_semantic.py': '9ebb7192fbd414f134ecd15991ca252af58bfd62',
              'c3w_h6n_fixture_adapter.py': 'fd3a53be0ef18e8ee4085b031cf8e7d2faa18195',
              'h6n_stepped_turn_v2.py': '8903145739c5eb0a21b87d192c27cfdab6fc48b0',
              'h6n_stepped_turn.py': '62ee60e58120b4db537cb8247f507d7ede67afcb',
              'candidates_v2.py': '39bcf9759387800c7da60ace45a528d238d4208f',
              'motions_v2.py': 'a3d6c1fd0227216fdf2a69e056e3b177dc398c53',
              'test_e_v0_structural.py': '97b32bb571e1dabec8297955f0cd20207205c5ab',
              'test_c4_hard_motion.py': '41e41f9160d66049f6e43bf62e33f531bb80d6fc',
          }
          lines = []
          mismatches = []
          for path, wanted in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              lines.append(f'{actual}  {path}')
              if actual != wanted:
                  mismatches.append((path, wanted, actual))
          Path('../../p1-c-r2/evidence/git_blob_shas.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          if mismatches:
              raise SystemExit('blob mismatch: ' + repr(mismatches))
          print('exact_private_public_and_frozen_semantic_hashes=PASS')
          PY

      - name: Run retained semantic regressions and R2 V1 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_c4_hard_motion.py test_e_v0_structural.py test_p1_c_r2_minimal_volumetric_proxy_v1.py 2>&1 | tee ../../p1-c-r2/evidence/unittest.txt

      - name: Generate deterministic R2 V1 evidence
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-c-r2/run1 ../../p1-c-r2/run2
          PYTHONHASHSEED=1 python3 run_p1_c_r2_minimal_volumetric_proxy_v1.py --output-dir ../../p1-c-r2/run1
          PYTHONHASHSEED=777 python3 run_p1_c_r2_minimal_volumetric_proxy_v1.py --output-dir ../../p1-c-r2/run2
          (cd ../../p1-c-r2/run1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-c-r2/run1.sha256
          (cd ../../p1-c-r2/run2 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-c-r2/run2.sha256
          cmp ../../p1-c-r2/run1.sha256 ../../p1-c-r2/run2.sha256
          cp -R ../../p1-c-r2/run1/. ../../p1-c-r2/evidence/
          cp ../../p1-c-r2/run1.sha256 ../../p1-c-r2/evidence/files.sha256
          echo "hash_seed_repeat_exact=PASS" > ../../p1-c-r2/evidence/deterministic.txt

      - name: Validate R2 V1 evidence
        working-directory: mobi/p1-c-r2/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          s=json.loads(Path('summary.json').read_text())
          assert s['mechanicalPass'] is True, s
          assert s['recordCount']==1770, s
          assert s['semanticMutationCount']==0, s
          assert s['nonfiniteRecordCount']==0, s
          assert s['domainBoundsMismatchCount']==0, s
          assert s['maxPawPinError']<=1e-9, s
          assert s['proxySignatureCount']==1, s
          assert s['externalDomainCounts']==[6], s
          assert s['correctionUseCount']==0, s
          assert s['nativeH4RecordCount']>0, s
          assert s['maxNormalizedH6NWidthStep']<=0.10, s
          assert s['maxNormalizedH6NHeightStep']<=0.10, s
          m=s['frontMassRatiosM0_80dp']
          assert m['craniumToCervicalWidthRatio']>1.40, m
          assert m['thoraxToCervicalWidthRatio']>1.70, m
          assert m['thoraxToCraniumWidthRatio']>1.0, m
          svgs=sorted(Path('debug').glob('*.svg'))
          assert len(svgs)==9, len(svgs)
          for p in svgs: ET.parse(p)
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Hash evidence
        working-directory: mobi/p1-c-r2/evidence
        run: sha256sum environment.txt git_blob_shas.txt unittest.txt summary.json manifest.json records.json files.sha256 deterministic.txt | tee EVIDENCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-c-r2-minimal-volumetric-proxy-v1-${{ github.run_id }}
          path: mobi/p1-c-r2/evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
