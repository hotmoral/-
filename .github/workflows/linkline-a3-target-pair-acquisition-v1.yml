name: Linkline A3 Target-Pair Acquisition v1

on:
  push:
    branches:
      - linkline/a3-target-pair-diversity-v1
    paths:
      - linkline/tools/a3_target_pair_acquisition_v1.py
      - linkline/a3-target-pair-diversity-v1/EXPOSURE_APPROVAL.md
      - .github/workflows/linkline-a3-target-pair-acquisition-v1.yml

permissions:
  contents: write

concurrency:
  group: linkline-a3-target-pair-diversity-v1
  cancel-in-progress: true

jobs:
  profile-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { n: 5, length: 6 }
          - { n: 5, length: 7 }
          - { n: 5, length: 8 }
          - { n: 5, length: 9 }
          - { n: 5, length: 10 }
          - { n: 6, length: 8 }
          - { n: 6, length: 9 }
          - { n: 6, length: 10 }
          - { n: 6, length: 11 }
          - { n: 6, length: 12 }
          - { n: 6, length: 13 }
          - { n: 6, length: 14 }
          - { n: 6, length: 15 }

    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify approved public execution closure
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          test "$(git hash-object linkline/reference/m2_state_model.py)" = "c2bf85974d317eb18a8b02a1ac4ee7eb244fcb77"
          test "$(git hash-object linkline/reference/m3_solver.py)" = "16b170656bbdffa8e836a891ffbf221de6c2935f"
          test "$(git hash-object linkline/analysis/a2_cognitive.py)" = "880aa4d8668fd71e2ce8222331f0da0368229400"
          test "$(git hash-object linkline/analysis/a3_structural_features.py)" = "35a6b997816ee3608d4d8064febd059159030796"
          test "$(git hash-object linkline/tools/a3_final_candidate_pool_public.py)" = "86635edf7266f2f2524ed031467cf4e3045c69c9"
          test -s linkline/a3-target-pair-diversity-v1/EXPOSURE_APPROVAL.md

      - name: Syntax check
        shell: bash
        working-directory: repo/linkline
        run: |
          set -euo pipefail
          python --version
          python -m py_compile tools/a3_final_candidate_pool_public.py tools/a3_target_pair_acquisition_v1.py

      - name: Profile one deterministic expanded domain
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          rm -rf "output/target-pair/N${{ matrix.n }}L${{ matrix.length }}"
          python tools/a3_target_pair_acquisition_v1.py \
            --n "${{ matrix.n }}" \
            --length "${{ matrix.length }}" \
            --state-count 48 \
            --output-dir "output/target-pair/N${{ matrix.n }}L${{ matrix.length }}"
          test -s "output/target-pair/N${{ matrix.n }}L${{ matrix.length }}/N${{ matrix.n }}L${{ matrix.length }}.candidates.json"
          test -s "output/target-pair/N${{ matrix.n }}L${{ matrix.length }}/N${{ matrix.n }}L${{ matrix.length }}.summary.json"
          sha256sum "output/target-pair/N${{ matrix.n }}L${{ matrix.length }}"/*.json

      - name: Upload public-safe domain shard
        uses: actions/upload-artifact@v4
        with:
          name: linkline-a3-target-pair-N${{ matrix.n }}L${{ matrix.length }}
          path: repo/linkline/output/target-pair/N${{ matrix.n }}L${{ matrix.length }}/*.json
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: profile-domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Download all public-safe shards
        uses: actions/download-artifact@v4
        with:
          pattern: linkline-a3-target-pair-*
          path: shards
          merge-multiple: true

      - name: Combine and validate de-identified acquisition pool
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          rm -rf public_output/a3_target_pair_acquisition_v1
          python tools/a3_target_pair_acquisition_v1.py \
            --combine-dir ../../shards \
            --output-dir public_output/a3_target_pair_acquisition_v1
          test -s public_output/a3_target_pair_acquisition_v1/candidate_pool.json
          test -s public_output/a3_target_pair_acquisition_v1/summary.json
          sha256sum public_output/a3_target_pair_acquisition_v1/*.json

      - name: Commit public-safe acquisition output
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/public_output/a3_target_pair_acquisition_v1
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Linkline A3: materialize target-pair acquisition v1"
          git push origin HEAD:linkline/a3-target-pair-diversity-v1
