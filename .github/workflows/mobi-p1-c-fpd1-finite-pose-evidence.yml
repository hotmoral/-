name: Mobi P1-C FPD1 Finite-Pose Evidence

on:
  push:
    branches:
      - mobi/run-p1-c-fpd1-evidence-20261017
    paths:
      - '.github/workflows/mobi-p1-c-fpd1-finite-pose-evidence.yml'

permissions:
  contents: read

concurrency:
  group: mobi-p1-c-fpd1-finite-pose-evidence
  cancel-in-progress: false

jobs:
  fpd1-finite-pose-evidence:
    if: github.ref == 'refs/heads/mobi/run-p1-c-fpd1-evidence-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact execution ancestry and frozen executable identities
        shell: bash
        run: |
          set -euo pipefail
          BASE='263dd07a07a67f31947e9be24b63fb1c3b62e671'
          test "$GITHUB_REF" = 'refs/heads/mobi/run-p1-c-fpd1-evidence-20261017'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE"...HEAD)" = '.github/workflows/mobi-p1-c-fpd1-finite-pose-evidence.yml'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py)" = 'b76d4034cc23555c382d2508aaaa31e7578797ec'
          test "$(sha256sum mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')" = '157ca0408f27e67330d10e49dff8b91446c0d674d4c106ec548bfbe001b8f097'
          test "$(git hash-object mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py)" = '06d65f0aeddc2c854b8d8dce6e265eb729f6dbb9'
          test "$(sha256sum mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')" = 'c6131b75e7a38abd7580c671b8a6c4fe8db0ca85ae86e86ad0e7e0f44ea5825c'
          test "$(git hash-object .github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml)" = '65b77b06e3b2da7ea351453d5b83ffa7921a19e3'
          test "$(sha256sum .github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml | awk '{print $1}')" = '2265eb1ade8e6607cf34139f7d735e5ecd231821cf3450e3003d9b1e6beacd3e'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py)" = 'd13d191499b6d734845051ba428323fdcf37dabd'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)" = '837f4abe7ff474a527893b099be8087a104f7aaa'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r10_morphology_reduction_v1.py)" = 'f281aad3e3a6c740c38c0a3f015718996dc45157'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_d_projection_v1.py)" = '5c8820fb7270e7727ececb1bb37d3a24331b24ab'
          grep -q 'P1_C_FPD1_IMPLEMENTATION_FREEZE' mobi/p1-b2/geometry/P1_C_FPD1_IMPLEMENTATION_FREEZE.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mobi/p1-b2/geometry/P1_C_FPD1_IMPLEMENTATION_IDENTITY.json')
          x=json.loads(p.read_text())
          assert x['freezeToken']=='P1_C_FPD1_IMPLEMENTATION_FREEZE'
          b=x['executionBoundary']
          assert b['finitePoseEvidenceRunAuthorizedByThisFreeze'] is False
          assert b['actualFinitePoseEvidenceExecuted'] is False
          assert b['deformedV3125Produced'] is False
          assert b['deformedRasterEvidenceProduced'] is False
          assert b['perceptualReviewExecuted'] is False
          wf=Path('.github/workflows/mobi-p1-c-fpd1-finite-pose-evidence.yml').read_text()
          token='--evaluate'+'-pose'
          assert wf.count(token)==1, f'actual pose invocation count drift: {wf.count(token)}'
          print('FPD1 frozen identity and single-invocation boundary PASS')
          PY

      - name: Assemble and verify exact frozen R11 implementation
        shell: bash
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          ./assemble_p1_c_r11_semantic_scaffold_v1.sh
          echo 'af2d8ccafb1878ad96cf6fae60167ae2a33f82480aa76710ce97c8fd95a6ad87  p1_c_r11_semantic_scaffold_v1.py' | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.4' \
            'fast-simplification==0.2.0' \
            'trimesh==4.11.1' \
            'scikit-image==0.26.0' \
            'scipy==1.17.0'
          python - <<'PY'
          import sys, numpy, fast_simplification, trimesh, skimage, scipy
          expected={
              'numpy':'2.5.4','fast_simplification':'0.2.0','trimesh':'4.11.1',
              'skimage':'0.26.0','scipy':'1.17.0'
          }
          actual={
              'numpy':numpy.__version__,'fast_simplification':fast_simplification.__version__,
              'trimesh':trimesh.__version__,'skimage':skimage.__version__,'scipy':scipy.__version__
          }
          if sys.version_info[:3] != (3,12,15): raise SystemExit(sys.version)
          if actual != expected: raise SystemExit(f'dependency drift: {actual}')
          print(sys.version)
          print(actual)
          PY

      - name: Compile and run frozen regression suite before evidence
        shell: bash
        run: |
          set -euo pipefail
          cd mobi/p1-b2/geometry
          python -m py_compile p1_c_fpd1_finite_pose_discriminator_v1.py test_p1_c_fpd1_finite_pose_discriminator_v1.py
          python -m unittest -v test_p1_c_r11_semantic_scaffold_v1.py
          python -m unittest -v test_p1_c_r12_surface_terminal_bind_alias_v1.py
          python -m unittest -v test_p1_c_dar1_diagnostic_axis_revision_v1.py
          python -m unittest -v test_p1_c_fpd1_finite_pose_discriminator_v1.py

      - name: Acquire exact frozen Standing Cat source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c-fpd1/source
          UA='Mobi FPD1 frozen finite-pose evidence/1.0'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -A "$UA" \
            'https://www.innerscene.com/api/library/standing-cat-cda42538/download' \
            -o mobi/p1-c-fpd1/source/cat-original.glb
          echo '6870facdd3c7784581382af0ede14e5d6fc8f2092ac9ff15cda1f8c3feb315e5  mobi/p1-c-fpd1/source/cat-original.glb' | sha256sum -c -

      - name: Reconfirm real-scaffold pre-evidence isolation immediately before pose
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-fpd1/source/cat-original.glb
          E=mobi/p1-c-fpd1/evidence
          mkdir -p "$E"
          PYTHONHASHSEED=1 python "$G/p1_c_fpd1_finite_pose_discriminator_v1.py" "$SRC" \
            --geometry-dir "$G" --pre-evidence-audit --out "$E/pre_evidence_audit.json"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('mobi/p1-c-fpd1/evidence/pre_evidence_audit.json').read_text())
          assert x['actualFinitePoseEvidenceExecuted'] is False
          assert x['deformedV3125Produced'] is False
          assert x['rasterEvidenceExecuted'] is False
          assert x['perceptualReviewExecuted'] is False
          assert x['identity']['meshArraySha256']=='839968886420707267d0e546c080f1af62c262391bf5e7a13babdbec1be32d77'
          assert x['weightSha256']=='171653287d416ce2fdb30db3e51356b241f0507614de8316ec0ed4ec0588b12c'
          assert x['supportIsolation']['positiveSupportUnionCount']==626
          assert x['supportIsolation']['positiveSupportDomainCounts']=={'CORE':612,'FORE_L':10,'FORE_R':4,'HIND_L':0,'HIND_R':0,'TAIL':0}
          for role in ('FORE_L_PAW_CTRL','FORE_R_PAW_CTRL','HIND_L_PAW_CTRL','HIND_R_PAW_CTRL'):
              assert x['supportIsolation']['pawAnchors'][role]['selectedRoleWeight']==0.0
          print('FPD1 immediate pre-evidence isolation PASS')
          PY

      - name: Execute exact frozen FPD1 finite pose once
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-fpd1/source/cat-original.glb
          OUT=mobi/p1-c-fpd1/evidence/run
          PYTHONHASHSEED=1 python "$G/p1_c_fpd1_finite_pose_discriminator_v1.py" "$SRC" \
            --geometry-dir "$G" --evaluate-pose --out "$OUT"

      - name: Validate frozen evidence invariants without product overclaim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('mobi/p1-c-fpd1/evidence/run')
          x=json.loads((root/'summary.json').read_text())
          assert x['version']=='P1_C_FPD1_FINITE_POSE_DISCRIMINATOR_V1'
          assert x['poseId']=='FPD1_FOREQUARTER_PIVOT_NECK_HEAD_YAW_LEFT_8DEG'
          assert x['actualFinitePoseEvidenceExecuted'] is True
          assert x['deformedV3125Produced'] is True
          assert x['rasterEvidenceExecuted'] is True
          assert x['perceptualReviewExecuted'] is False
          assert x['identity']['vertexCount']==3125 and x['identity']['faceCount']==6246
          assert x['identity']['meshArraySha256']=='839968886420707267d0e546c080f1af62c262391bf5e7a13babdbec1be32d77'
          assert x['bindVertexSha256'] != x['deformedVertexSha256']
          assert x['weightSha256']=='171653287d416ce2fdb30db3e51356b241f0507614de8316ec0ed4ec0588b12c'
          assert x['pawAnchorsExact'] is True
          s=x['supportIsolation']
          assert s['positiveSupportUnionCount']==626
          assert s['positiveSupportDomainCounts']=={'CORE':612,'FORE_L':10,'FORE_R':4,'HIND_L':0,'HIND_R':0,'TAIL':0}
          assert s['noSelectedSupportInHindOrTail'] is True
          assert x['directViewCount']==9
          assert x['denseViewCount']==73
          g=x['geometryHealth']
          assert g['finiteVertexCount']==3125 and g['vertexCount']==3125
          assert g['nonFiniteAreaFaceCount']==0
          assert g['outsideSelectedSupportDisplacement']['max']==0.0
          paw=json.loads((root/'paw_anchor_report.json').read_text())
          assert set(paw)=={'FORE_L_PAW_CTRL','FORE_R_PAW_CTRL','HIND_L_PAW_CTRL','HIND_R_PAW_CTRL'}
          for role,row in paw.items():
              assert row['exactByteNumericIdentity'] is True
              assert row['displacement']==0.0
          v=json.loads((root/'visual_evidence.json').read_text())
          assert v['directViewCount']==9
          assert [r['yawDeg'] for r in v['directViews']]==[-90.0,-67.5,-45.0,-22.5,0.0,22.5,45.0,67.5,90.0]
          assert v['denseViewCount']==73
          direct=root/'direct_deformed_only'
          assert len(list(direct.glob('FPD1_DEFORMED_*_96.png')))==10
          assert len(list(direct.glob('FPD1_DEFORMED_*_96_8X.png')))==10
          print('FPD1 structural evidence invariants PASS; perceptual verdict still pending')
          PY

      - name: Record immutable execution manifest
        if: always()
        shell: bash
        run: |
          set -u
          E=mobi/p1-c-fpd1/evidence
          mkdir -p "$E"
          {
            echo "git_head=$GITHUB_SHA"
            echo "git_parent=$(git rev-parse HEAD^)"
            echo "workflow_blob=$(git hash-object .github/workflows/mobi-p1-c-fpd1-finite-pose-evidence.yml)"
            echo "workflow_sha256=$(sha256sum .github/workflows/mobi-p1-c-fpd1-finite-pose-evidence.yml | awk '{print $1}')"
            echo "fpd1_impl_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py)"
            echo "fpd1_impl_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')"
            echo "fpd1_tests_blob=$(git hash-object mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py)"
            echo "fpd1_tests_sha256=$(sha256sum mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')"
            echo "dar1_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py)"
            echo "r12_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)"
            if test -f mobi/p1-b2/geometry/p1_c_r11_semantic_scaffold_v1.py; then
              echo "r11_assembled_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_r11_semantic_scaffold_v1.py | awk '{print $1}')"
            else
              echo 'r11_assembled_sha256=NOT_ASSEMBLED_BEFORE_FAILURE'
            fi
          } > "$E/execution_identity.txt"
          python - <<'PY' > "$E/environment.txt"
          import importlib, platform, sys
          print(sys.version)
          print(platform.platform())
          for module,label in [
              ('numpy','numpy'),('fast_simplification','fast-simplification'),
              ('trimesh','trimesh'),('skimage','scikit-image'),('scipy','scipy')]:
              try:
                  m=importlib.import_module(module)
                  print(label,getattr(m,'__version__','UNKNOWN'))
              except Exception as exc:
                  print(label,'NOT_AVAILABLE',type(exc).__name__)
          PY
          find "$E" -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$E/EVIDENCE_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobi-p1-c-fpd1-finite-pose-evidence-${{ github.run_id }}
          path: mobi/p1-c-fpd1/evidence
          if-no-files-found: error
          retention-days: 30
