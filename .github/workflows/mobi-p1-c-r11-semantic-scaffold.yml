name: Mobi P1-C R11 Semantic Scaffold Stage-1 Evidence

on:
  workflow_dispatch:
    inputs:
      confirm_stage1:
        description: 'Exact authorization token required after Stage-0 freeze review'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobi-p1-c-r11-semantic-scaffold-stage1
  cancel-in-progress: false

jobs:
  r11-stage1:
    if: >-
      github.ref == 'refs/heads/mobi/run-p1-c-r11-semantic-scaffold-20261016' &&
      inputs.confirm_stage1 == 'RUN_R11_STAGE1_AFTER_STAGE0_FREEZE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stage-0 freeze and trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/mobi/run-p1-c-r11-semantic-scaffold-20261016'
          test '${{ inputs.confirm_stage1 }}' = 'RUN_R11_STAGE1_AFTER_STAGE0_FREEZE'
          FREEZE='mobi/p1-b2/geometry/P1_C_R11_STAGE0_IMPLEMENTATION_FREEZE.md'
          ID='mobi/p1-b2/geometry/P1_C_R11_STAGE0_IDENTITY.json'
          test -f "$FREEZE"
          test -f "$ID"
          grep -q 'R11_STAGE0_IMPLEMENTATION_FREEZE' "$FREEZE"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          ident=json.loads(Path('mobi/p1-b2/geometry/P1_C_R11_STAGE0_IDENTITY.json').read_text())
          for path, expected in ident['gitBlobSha1'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual != expected:
                  raise SystemExit(f'blob identity drift: {path}: {actual} != {expected}')
          print('Stage-0 blob identity PASS')
          PY

      - name: Assemble and verify frozen R11 implementation bytes
        shell: bash
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          ./assemble_p1_c_r11_semantic_scaffold_v1.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip

      - name: Install frozen R11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.4' \
            'fast-simplification==0.2.0' \
            'trimesh==4.11.1' \
            'scikit-image==0.26.0' \
            'scipy==1.17.0'
          python - <<'PY'
          import sys, numpy, fast_simplification, trimesh, skimage, scipy
          expected={
              'numpy':'2.5.4','fast_simplification':'0.2.0','trimesh':'4.11.1',
              'skimage':'0.26.0','scipy':'1.17.0'
          }
          actual={
              'numpy':numpy.__version__,'fast_simplification':fast_simplification.__version__,
              'trimesh':trimesh.__version__,'skimage':skimage.__version__,'scipy':scipy.__version__
          }
          if sys.version_info[:3] != (3,12,15): raise SystemExit(sys.version)
          if actual != expected: raise SystemExit(f'dependency drift: {actual}')
          print(sys.version)
          print(actual)
          PY

      - name: Verify inherited R10 code identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r10_morphology_reduction_v1.py)" = 'f281aad3e3a6c740c38c0a3f015718996dc45157'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_d_projection_v1.py)" = '5c8820fb7270e7727ececb1bb37d3a24331b24ab'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_b_inspector_v1.py)" = '9b7899bc1c39d02291813a826df01d3697192846'

      - name: Run Stage-0 synthetic contract tests only
        shell: bash
        run: |
          set -euo pipefail
          cd mobi/p1-b2/geometry
          python -m unittest -v test_p1_c_r11_semantic_scaffold_v1.py

      - name: Acquire exact frozen standing-cat source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c-r11/evidence/source
          E=mobi/p1-c-r11/evidence/source
          UA='Mobi R11 bounded public feasibility/1.0'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -A "$UA" \
            'https://www.innerscene.com/api/library/standing-cat-cda42538/download' \
            -o "$E/cat-original.glb"
          echo '6870facdd3c7784581382af0ede14e5d6fc8f2092ac9ff15cda1f8c3feb315e5  mobi/p1-c-r11/evidence/source/cat-original.glb' | sha256sum -c -

      - name: Hard-gate V3125 identity before any scaffold extraction
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-r11/evidence/source/cat-original.glb
          rm -rf /tmp/r11_identity
          mkdir -p /tmp/r11_identity
          PYTHONHASHSEED=1 python "$G/p1_c_r11_semantic_scaffold_v1.py" "$SRC" --geometry-dir "$G" --identity-only --out /tmp/r11_identity/seed1.json
          PYTHONHASHSEED=777 python "$G/p1_c_r11_semantic_scaffold_v1.py" "$SRC" --geometry-dir "$G" --identity-only --out /tmp/r11_identity/seed777.json
          diff -u /tmp/r11_identity/seed1.json /tmp/r11_identity/seed777.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/r11_identity/seed1.json').read_text())
          assert x['vertexCount']==3125 and x['faceCount']==6246
          assert len(x['meshArraySha256'])==64
          Path('mobi/p1-c-r11/evidence/V3125_MESH_IDENTITY.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          print('V3125 identity gate PASS',x['meshArraySha256'])
          PY

      - name: Execute frozen R11 Stage-1 evidence twice
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-r11/evidence/source/cat-original.glb
          mkdir -p mobi/p1-c-r11/evidence/seed1 mobi/p1-c-r11/evidence/seed777
          PYTHONHASHSEED=1 python "$G/p1_c_r11_semantic_scaffold_v1.py" "$SRC" --geometry-dir "$G" --out mobi/p1-c-r11/evidence/seed1
          PYTHONHASHSEED=777 python "$G/p1_c_r11_semantic_scaffold_v1.py" "$SRC" --geometry-dir "$G" --out mobi/p1-c-r11/evidence/seed777
          diff -qr mobi/p1-c-r11/evidence/seed1 mobi/p1-c-r11/evidence/seed777 | tee mobi/p1-c-r11/evidence/deterministic_diff.txt
          test ! -s mobi/p1-c-r11/evidence/deterministic_diff.txt

      - name: Record environment and evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          E=mobi/p1-c-r11/evidence
          python - <<'PY' > "$E/environment.txt"
          import platform,sys,numpy,fast_simplification,trimesh,skimage,scipy
          print(sys.version)
          print(platform.platform())
          print('numpy',numpy.__version__)
          print('fast-simplification',fast_simplification.__version__)
          print('trimesh',trimesh.__version__)
          print('scikit-image',skimage.__version__)
          print('scipy',scipy.__version__)
          PY
          find "$E" -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$E/EVIDENCE_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-c-r11-semantic-scaffold-${{ github.run_id }}
          path: mobi/p1-c-r11/evidence
          if-no-files-found: error
          retention-days: 30
