name: Einstein Campaign 2000 CP9 Context Reuse Committed Proof V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-cp9-context-reuse-committed-proof-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  fixed-bank-stage:
    if: >-
      github.event.head_commit.message == 'optimization: prove committed Einstein CP9 context reuse v1'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        stage: [4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 9d981bc9048bc024c59ee6ede3ae04abe4c833d8
      BANK_SHA: bbb2f5043b7eda70daaa2328b301a8f3d51c37ec
      BASE_SOURCE: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require private repository read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact committed optimization source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 9d981bc9048bc024c59ee6ede3ae04abe4c833d8
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact immutable production Bank snapshot
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bbb2f5043b7eda70daaa2328b301a8f3d51c37ec
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard exact committed production diff
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SOURCE" "$SOURCE_SHA" -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/curriculum/CurriculumMetadataBuilder.java'
          test "${changed[1]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java'
          echo 'CP9_CONTEXT_REUSE_COMMITTED_DIFF_GUARD=PASS'

      - name: Run fixed Bank committed-source timing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ProductionStore rev-parse HEAD)" = "$BANK_SHA"
          bash EinsteinGame/tools/campaign-production-2000/run_n5_fixed_stage_timing_readonly_v1.sh '${{ matrix.stage }}'
