name: Einstein Pre4 Runtime Memory Optimization Zero-Draw V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-runtime-memory-optimization-zero-draw-v2.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-runtime-memory-optimization-zero-draw-v2
  cancel-in-progress: false

jobs:
  validate-and-publish-candidate:
    if: >-
      github.event.head_commit.message == 'ci: run Einstein pre4 zero-draw optimization harness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: bddc1e741252eec7793d9064a607c495c006ce9c
      CANDIDATE_BRANCH: pre4-zero-draw-runtime-memory-optimization-v1
      BASE_CLASSES: /tmp/einstein-pre4-base-classes
      CANDIDATE_CLASSES: /tmp/einstein-pre4-candidate-classes
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: main
          path: Harness
          persist-credentials: false

      - name: Checkout exact accepted Einstein source with write credential
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bddc1e741252eec7793d9064a607c495c006ce9c
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run zero-draw optimization harness
        shell: bash
        run: bash Harness/scripts/einstein-pre4-runtime-memory-optimize.sh
