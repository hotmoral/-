name: Einstein Phase2 Supporting Skill Acceptance DryRun V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-phase2-stage125-second-ring-stall-diagnostic-readonly-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: c8b438027503d1257f4a23f274794220155fbaf9
      EXPECTED_BANK_HEAD: b423073076594ca68f45681f40afec1cd9ed5ba9
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: c8b438027503d1257f4a23f274794220155fbaf9
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Bank read-only
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and validate supporting-skill acceptance semantics
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/EinsteinGame"
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          CLASSES=/tmp/einstein-phase2-supporting-acceptance-classes
          SOURCES=/tmp/einstein-phase2-supporting-acceptance-sources.txt

          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"
          LIVE_BANK_HEAD="$(git -C "$STORE" rev-parse HEAD)"
          echo "LIVE_BANK_HEAD=$LIVE_BANK_HEAD"
          test "$LIVE_BANK_HEAD" = "$EXPECTED_BANK_HEAD"
          cd "$SRC"

          python3 - <<'PY'
          import json
          from pathlib import Path
          store=Path('../ProductionStore/production/campaign-2000-bank-v1/bank')
          manifest=json.loads((store/'manifest.json').read_text())
          assert manifest['bankedCount']==124, manifest
          assert manifest['nextOrdinal']==125, manifest
          assert manifest['state']=='OPEN', manifest
          assert manifest['acquiredPending']==[], manifest
          print('LIVE_STAGE125_FRONTIER=PASS')
          PY

          rm -rf "$CLASSES" "$SOURCES"
          mkdir -p "$CLASSES"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2SupportingSkillAcceptanceDryRunV1.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo PHASE2_SUPPORTING_SKILL_ACCEPTANCE_COMPILE=PASS

          export EINSTEIN_PHASE2_SUPPORTING_ACCEPTANCE_DRYRUN=true
          java -Xmx4g -cp "$CLASSES" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Phase2SupportingSkillAcceptanceDryRunV1
