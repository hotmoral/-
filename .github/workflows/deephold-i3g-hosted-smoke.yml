name: DeepHold I3G hosted smoke

on:
  push:
    branches:
      - qa/deephold-i3g-hosted-smoke-v1
    paths:
      - '.github/workflows/deephold-i3g-hosted-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment and verify isolated routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://timing-defense-skilled-v2-harness.sktjsek.workers.dev'
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS "$base/deephold-i1/hosted-manifest.json" -o /tmp/manifest.json; then
              if python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['schema']=='DEEPHOLD_HOSTED_BUNDLE'
          assert m['sourceMainSha']=='2c89eb6cfb7ec97198aabb5dee4eab4f253bf5de'
          assert m['slice']=='I3G_CLOSED_VALIDATED'
          assert m['appSha256']=='9f1730cf58ab64beabff92ba0c4e5d428cab40f06b9a2ce8daafef02cb5b54af'
          PY
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsS "$base/api/health" -o /tmp/health.json
          echo 'Hosted manifest:'
          cat /tmp/manifest.json
          echo
          echo 'Health:'
          cat /tmp/health.json
          echo
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deephold-smoke
          cd /tmp/deephold-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium hosted smoke 915x412
        shell: bash
        working-directory: /tmp/deephold-smoke
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 915, height: 412 } });
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(String(e)));
              const url = 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/deephold-i1/';
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
              assert.ok(response && response.ok(), `page status ${response && response.status()}`);
              await page.waitForSelector('canvas', { timeout: 20000 });
              await page.waitForFunction(() => document.querySelectorAll('.skill-button').length === 5, null, { timeout: 20000 });
              const result = await page.evaluate(() => ({
                skills: document.querySelectorAll('.skill-button').length,
                joysticks: document.querySelectorAll('.joystick-zone').length,
                canvas: Boolean(document.querySelector('canvas')),
                minimap: Boolean(document.querySelector('.minimap')),
                r7: Boolean(document.querySelector('.minimap-region-marker[data-region-code="R7"]')),
                width: innerWidth,
                height: innerHeight,
              }));
              assert.equal(result.skills, 5);
              assert.equal(result.joysticks, 1);
              assert.equal(result.canvas, true);
              assert.equal(result.minimap, true);
              assert.equal(result.r7, true);
              assert.deepEqual(consoleErrors, []);
              assert.deepEqual(pageErrors, []);
              console.log(JSON.stringify({ status: 'PASS', url, ...result, errors: 0 }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          JS
