name: Clumi Stable Unsigned V3 Icon

on:
  push:
    branches:
      - clumi/stable-v3-icon-build
    paths:
      - '.github/workflows/einstein-clumi-stable-unsigned-v3-icon.yml'

permissions:
  contents: read

jobs:
  build-stable-unsigned-v3-icon:
    if: >-
      github.event.head_commit.message == 'build: Clumi Stable unsigned v3 icon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 0a9a8128e8b251973e408c4d1afe28dfdfd9aa82
      BANK_SHA: f58b303283c3cd7696489b50d2964e01746ac0ab
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BUILD_TOOLS: '34.0.0'

    steps:
      - name: Require private source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact Stable v3 icon source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact 1-120 Bank snapshot
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.BANK_SHA }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: bank
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and Bank commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C bank rev-parse HEAD)" = "$BANK_SHA"

      - name: Materialize exact 1-120 runtime pack and stage catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          source=Path('source')
          bank=Path('bank/production/campaign-2000-bank-v1/bank')
          manifest=json.loads((bank/'manifest.json').read_text())
          assert manifest['schemaVersion']=='campaign-problem-bank-v1'
          assert manifest['bankedCount']==120
          assert manifest['nextOrdinal']==121
          assert manifest['failedOrQuarantinedCount']==0
          assert manifest['acquiredPending']==[]
          stages=bank/'stages'
          assert not (stages/'stage-0121.json').exists()

          entries=[]
          for n in range(1,121):
              p=stages/f'stage-{n:04d}.json'
              assert p.is_file(), p
              record=json.loads(p.read_text())
              assert record['schemaVersion']=='campaign-problem-bank-v1'
              assert record['state']=='BANKED'
              assert record['ordinal']==n
              expected=f'PZ_CAMPAIGN_{n:06d}'
              assert record['publishedPuzzleId']==expected
              entry=record['runtimeEntry']
              assert entry['publishedPuzzleId']==expected
              assert entry['runtimeSchemaVersion']=='published-runtime-puzzle-v1'
              assert entry['publicationSchemaVersion']=='puzzle-publication-identity-v1'
              assert entry['puzzle']['puzzleId']==expected
              assert entry['puzzle']['puzzleRevision']==entry['revision']
              assert entry['puzzle']['catalogVersion']=='icons_v0.2_logical_v1'
              entries.append(entry)

          old_pack_path=source/'app/src/main/assets/puzzles/campaign-pack-0010-v1.json'
          old_pack=json.loads(old_pack_path.read_text())
          assert len(old_pack['puzzles'])==10
          for i in range(10):
              assert old_pack['puzzles'][i]==entries[i], f'base/bank mismatch at stage {i+1}'

          pack={
              'runtimeSchemaVersion':'published-runtime-puzzle-v1',
              'packId':'campaign-pack-0120-v3-icon',
              'puzzles':entries,
          }
          pack_bytes=(json.dumps(pack,separators=(',',':'),ensure_ascii=False)+'\n').encode()
          assert len(pack_bytes)<2_000_000
          old_pack_path.write_bytes(pack_bytes)

          cfg_path=source/'app/src/main/assets/stages/campaign-stage-config-v1.properties'
          cfg=cfg_path.read_text()
          assert 'configVersion=clumi-campaign-stage-v1' in cfg
          assert 'stageCount=10' in cfg
          assert cfg.count('starterUndoBoost=2')==1
          prefix,rewards=cfg.split('starterUndoBoost=2',1)
          prefix=prefix.replace('# Production campaign snapshot 0001-0010; gameplay thresholds preserved from the validated pilot tuning.\n','# Stable v3 icon campaign snapshot 0001-0120; content unchanged from Stable v2.\n',1)
          prefix=prefix.replace('stageCount=10','stageCount=120',1)
          lines=[prefix.rstrip()]
          for n in range(11,121):
              lines += [
                  f'stage.{n}.puzzleId=PZ_CAMPAIGN_{n:06d}',
                  f'stage.{n}.revision={entries[n-1]["revision"]}',
                  f'stage.{n}.referenceTime=300',
                  f'stage.{n}.undoLimit=4',
                  f'stage.{n}.threeStarTime=300',
                  f'stage.{n}.threeStarUndo=1',
                  f'stage.{n}.twoStarTime=420',
                  f'stage.{n}.twoStarUndo=2',
                  f'stage.{n}.oneStarTime=540',
                  f'stage.{n}.oneStarUndo=4',
              ]
          cfg_new='\n'.join(lines)+'\n'+'starterUndoBoost=2'+rewards
          cfg_path.write_text(cfg_new)

          evidence={
              'schemaVersion':'clumi-stable-v3-icon-bank120-integration-v1',
              'sourceSha':'0a9a8128e8b251973e408c4d1afe28dfdfd9aa82',
              'bankSha':'f58b303283c3cd7696489b50d2964e01746ac0ab',
              'bankPrefixHash':manifest['bankPrefixHash'],
              'stageCount':120,
              'firstPuzzleId':entries[0]['publishedPuzzleId'],
              'lastPuzzleId':entries[-1]['publishedPuzzleId'],
              'runtimePackSha256':hashlib.sha256(pack_bytes).hexdigest(),
              'stageConfigSha256':hashlib.sha256(cfg_new.encode()).hexdigest(),
              'excludedStage121':True,
              'releaseChange':'launcher icon only',
          }
          Path('Clumi-Stable-v3-icon-bank120-integration.json').write_text(json.dumps(evidence,indent=2)+'\n')
          Path('generated-assets').mkdir()
          (Path('generated-assets')/'campaign-pack-0010-v1.json').write_bytes(pack_bytes)
          (Path('generated-assets')/'campaign-stage-config-v1.properties').write_text(cfg_new)
          print(json.dumps(evidence,indent=2))
          PY

      - name: Prepare Stable v3 identity without signing material
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          text=p.read_text()
          assert text.count("applicationId 'com.example.einsteingame'")==1
          assert text.count('versionCode 13')==1
          assert text.count("versionName '0.2.7.1'")==1
          text=text.replace("applicationId 'com.example.einsteingame'","applicationId 'com.hotmoral.clumi'",1)
          text=text.replace('versionCode 13','versionCode 3',1)
          text=text.replace("versionName '0.2.7.1'","versionName '1.0.2'",1)
          p.write_text(text)
          PY
          git diff --check

      - name: Verify launcher icon resources
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          test -s app/src/main/res/mipmap/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Build unsigned Stable v3 release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain \
              :app:assembleRelease -x :app:lintVitalRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and verify unsigned Stable v3 identity
        shell: bash
        run: |
          set -euo pipefail
          INPUT=source/app/build/outputs/apk/release/app-release-unsigned.apk
          OUTPUT=Clumi-Stable-v3-icon-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "$OUTPUT"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$OUTPUT"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$OUTPUT" | tee stable-v3-icon-badging.txt
          grep -F "package: name='com.hotmoral.clumi' versionCode='3' versionName='1.0.2'" stable-v3-icon-badging.txt
          unzip -p "$OUTPUT" assets/puzzles/campaign-pack-0010-v1.json > packaged-runtime.json
          unzip -p "$OUTPUT" assets/stages/campaign-stage-config-v1.properties > packaged-stage-config.properties
          cmp packaged-runtime.json generated-assets/campaign-pack-0010-v1.json
          cmp packaged-stage-config.properties generated-assets/campaign-stage-config-v1.properties
          python3 - <<'PY'
          import json
          p=json.load(open('packaged-runtime.json'))
          assert len(p['puzzles'])==120
          assert p['puzzles'][0]['publishedPuzzleId']=='PZ_CAMPAIGN_000001'
          assert p['puzzles'][-1]['publishedPuzzleId']=='PZ_CAMPAIGN_000120'
          assert all(x['publishedPuzzleId']!='PZ_CAMPAIGN_000121' for x in p['puzzles'])
          cfg=open('packaged-stage-config.properties').read()
          assert 'stageCount=120' in cfg
          assert 'stage.120.puzzleId=PZ_CAMPAIGN_000120' in cfg
          assert 'stage.121.' not in cfg
          PY
          sha256sum "$OUTPUT" | tee Clumi-Stable-v3-icon-aligned-unsigned.apk.sha256

      - name: Stage local signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner

      - name: Upload Stable v3 unsigned APK and frozen integration assets
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Stable-v3-icon-unsigned
          path: |
            Clumi-Stable-v3-icon-aligned-unsigned.apk
            Clumi-Stable-v3-icon-aligned-unsigned.apk.sha256
            stable-v3-icon-badging.txt
            Clumi-Stable-v3-icon-bank120-integration.json
            generated-assets
            signing-tools
          retention-days: 3
          if-no-files-found: error
