name: Einstein Campaign Production 2000 Stage 0002 Terminal Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-stage2-terminal-verify.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  verify-stage-0002-terminal:
    if: >-
      github.event.head_commit.message == 'production: verify compact Einstein campaign stage 0002 terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANK_BRANCH: campaign-production-2000-bank-v1
      BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
      EVIDENCE_REMOTE_BASE: production/campaign-2000-bank-v1/evidence
      BASE_BANK_COMMIT: f7b2f5e8df239f267131bca11acced4106287fa6
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout live durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: false

      - name: Verify compact stage-0002 durable terminal
        shell: bash
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          export STORE
          HEAD="$(git -C "$STORE" rev-parse HEAD)"
          test "$(git -C "$STORE" merge-base "$BASE_BANK_COMMIT" HEAD)" = "$BASE_BANK_COMMIT"
          test -f "$STORE/$BANK_REMOTE_ROOT/bank/stages/stage-0001.json"
          test -f "$STORE/$BANK_REMOTE_ROOT/bank/stages/stage-0002.json"
          test ! -e "$STORE/$BANK_REMOTE_ROOT/bank/stages/stage-0003.json"
          test ! -e "$STORE/$BANK_REMOTE_ROOT/bank/requests/stage-0003.json"
          test -f "$STORE/$EVIDENCE_REMOTE_BASE/stage-0002/attempt-draw0.json"
          test -f "$STORE/$EVIDENCE_REMOTE_BASE/stage-0002/acquired-result.json"
          test "$(stat -c %s "$STORE/$EVIDENCE_REMOTE_BASE/stage-0002/attempt-draw0.json")" -lt 10485760
          test "$(stat -c %s "$STORE/$EVIDENCE_REMOTE_BASE/stage-0002/acquired-result.json")" -lt 10485760
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          store=Path(os.environ['STORE'])
          root=store/os.environ['BANK_REMOTE_ROOT']/'bank'
          ev=store/os.environ['EVIDENCE_REMOTE_BASE']/'stage-0002'
          m=json.loads((root/'manifest.json').read_text())
          s1=json.loads((root/'stages/stage-0001.json').read_text())
          s2=json.loads((root/'stages/stage-0002.json').read_text())
          attempt=json.loads((ev/'attempt-draw0.json').read_text())
          acquired=json.loads((ev/'acquired-result.json').read_text())
          assert m['bankedCount']==2 and m['nextOrdinal']==3 and m['publishedCount']==0, m
          assert m['failedOrQuarantinedCount']==0, m
          assert s1['state']=='BANKED' and s1['stageId']=='stage-0001'
          assert s2['state']=='BANKED' and s2['stageId']=='stage-0002' and s2['ordinal']==2
          assert s2['sourceProvenance']['fullMetadataStored'] is False
          assert s2['sourceProvenance']['boundedCp12ProjectionStored'] is True
          assert 'curriculumMetadata' not in s2 and 'cp12MetadataProjection' in s2
          assert s2['validationRefs']['cp12MetadataProjectionReplayStatus']=='VALID_PREFIX'
          assert len(s2['curriculumMetadataIdentity'])==64
          assert len(s2['cp12MetadataProjectionIdentity'])==64
          assert attempt['attempt']['disposition']=='ACQUIRED'
          assert acquired['recordType']=='CampaignProduction2000AcquiredResultV3'
          assert acquired['acquired']['stageId']=='stage-0002'
          assert acquired['acquired']['cp12MetadataProjectionIdentity']==s2['cp12MetadataProjectionIdentity']
          print('EINSTEIN_CAMPAIGN_PRODUCTION_STAGE_0002_COMPACT_DURABLE_TERMINAL=PASS')
          print('bankedCount=2')
          print('nextOrdinal=3')
          print('failedOrQuarantinedCount=0')
          print('attemptBytes='+(ev/'attempt-draw0.json').stat().st_size.__str__())
          print('acquiredEvidenceBytes='+(ev/'acquired-result.json').stat().st_size.__str__())
          print('bankStageBytes='+(root/'stages/stage-0002.json').stat().st_size.__str__())
          PY
          echo "bankHead=$HEAD"
