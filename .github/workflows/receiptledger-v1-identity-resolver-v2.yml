name: ReceiptLedger V1 Identity Resolver V2
on:
  push:
    branches: ['receiptledger/run-v1-identity-resolver-v2-20261016']
    paths:
      - '.github/workflows/receiptledger-v1-identity-resolver-v2.yml'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/identity/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/identity/**'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'receiptledger-v1-identity-resolver-v2-${{ github.ref }}', cancel-in-progress: false }
jobs:
  validate-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Ensure Android API 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13', cache-disabled: true }
      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh
      - name: Enforce CP24 scope and frozen contracts
        run: |
          set -euo pipefail
          BASE=d04667a5dd9f257117f59bcde194d5b702fa1337
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp24-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-identity-resolver-v2.yml) ;;
              receiptledger/CP24_*.md|receiptledger/IDENTITY_RESOLVER_V2_*.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/identity/*) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/identity/*) ;;
              '') ;;
              *) echo "CP24 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp24-changed-files.txt
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/catalog" || { echo 'Frozen catalog domain changed'; exit 32; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/product" || { echo 'Frozen product persistence/runtime changed'; exit 33; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/semantics" || { echo 'Frozen CP23 semantics changed'; exit 34; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/persistence" || { echo 'Receipt persistence changed'; exit 35; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || { echo 'Manifest changed'; exit 36; }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 23' "$APP/build.gradle"
          grep -Fq "versionName '1.0.22-identity-resolver-v2'" "$APP/build.gradle"
          ! grep -R -Ei 'levenshtein|embedding|cosine|phonetic|fuzzy' "$APP/src/main/java/com/receiptledger/v1/identity"/*.java
      - name: Test lint and build
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then
              echo "Expected test result missing: $TEST_XML"
              status=42
            fi
          done
          exit "$status"
      - name: Extract and verify CP24 identity metrics
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp24-identity-metrics.txt
          import re, xml.etree.ElementTree as ET
          path = 'receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml'
          root = ET.parse(path).getroot()
          text = '\n'.join((node.text or '') for node in root.iter('system-out'))
          lines = [line.strip() for line in text.splitlines() if line.strip().startswith('CP24_METRICS ')]
          if len(lines) != 1:
              raise SystemExit('Expected exactly one CP24_METRICS line, got %d' % len(lines))
          line = lines[0]
          values = {k:int(v) for k,v in re.findall(r'(\w+)=(\d+)', line)}
          required = ['fixtures','known_identity','auto_links','correct_auto_links','incorrect_auto_links','false_merge','false_split','review_required','unresolved','repeat_cases','repeat_reused']
          missing = [k for k in required if k not in values]
          if missing: raise SystemExit('Missing metrics: ' + ','.join(missing))
          if values['false_merge'] != 0 or values['incorrect_auto_links'] != 0:
              raise SystemExit('Unsafe automatic identity decision in golden metrics')
          if values['repeat_cases'] < 1 or values['repeat_reused'] != values['repeat_cases']:
              raise SystemExit('Repeat confirmed reuse requirement failed')
          if values['false_split'] * 20 > values['known_identity']:
              raise SystemExit('Fragmentation risk exceeds 5 percent')
          print(line)
          PY
      - name: Package and verify evidence
        run: |
          set -euo pipefail
          BASE=d04667a5dd9f257117f59bcde194d5b702fa1337
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-identity-resolver-v2
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-identity-resolver-v2-debug.apk"
          cp receiptledger/cp24-identity-metrics.txt "$OUT/CP24_IDENTITY_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml" "$OUT/IDENTITY_RESOLVER_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml" "$OUT/RECEIPT_PRODUCT_SEMANTICS_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml" "$OUT/CATALOG_DOMAIN_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml" "$OUT/PERSISTENCE_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-identity-resolver-v2-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then
              echo "Forbidden permission packaged: $forbidden"
              exit 51
            fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP24_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-identity-resolver-v2-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_IDENTITY_RESOLVER_V2_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'alias_precedence=MERCHANT_THEN_GLOBAL'
            echo 'fuzzy_auto_link=FORBIDDEN'
            echo 'strict_semantic_auto_link=UNIQUE_CONFIRMED_PRODUCT_NAME_AND_SPEC'
            echo 'ambiguity=REVIEW_REQUIRED'
            echo 'price_truth=RECEIPT_DERIVED'
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.22-identity-resolver-v2'
            echo 'version_code=23'
            echo 'network_permission=REMOVED'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP24_IDENTITY_METRICS.txt "$OUT"/IDENTITY_RESOLVER_V2_TEST.xml "$OUT"/CP24_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: 'receiptledger-v1-identity-resolver-v2-${{ github.run_id }}'
          path: 'receiptledger/output/v1-identity-resolver-v2/'
          if-no-files-found: error
          retention-days: 14
