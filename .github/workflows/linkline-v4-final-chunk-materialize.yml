name: Linkline V4 exact final chunk materialization

on:
  push:
    branches:
      - linkline/v4-object-probe-v1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize exact V4 final chunk') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Repair one missing byte and verify exact identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src = Path('linkline/v4-transfer-debug/candidate-1041-1300.json')
          dst = Path('linkline/v4-transfer-debug/exact-1041-1300.json')
          data = src.read_bytes()
          bad = b'[6,8,[1,0,6,2,18,19,25,24],[0,1]]'
          good = b'[6,8,[1,0,6,12,18,19,25,24],[0,1]]'
          if data.count(bad) != 1:
              raise SystemExit('EXPECTED_SINGLE_MISSING_BYTE_PATTERN_NOT_FOUND')
          repaired = data.replace(bad, good, 1)
          sha256 = hashlib.sha256(repaired).hexdigest()
          git_sha = hashlib.sha1(f'blob {len(repaired)}\0'.encode() + repaired).hexdigest()
          obj = json.loads(repaired.decode('utf-8'))
          if len(repaired) != 12891:
              raise SystemExit(f'BAD_SIZE:{len(repaired)}')
          if sha256 != '444385bce60499b32c1bf8aea05a0e2eec32ac77743c0ab08b1296ccff86b616':
              raise SystemExit(f'BAD_SHA256:{sha256}')
          if git_sha != '45b9d71fc48e94c687c343cefcd36b5c29b0044f':
              raise SystemExit(f'BAD_GIT_SHA:{git_sha}')
          if obj.get('fromPosition') != 1041 or obj.get('throughPosition') != 1300 or len(obj.get('rows', [])) != 260:
              raise SystemExit('BAD_CHUNK_STRUCTURE')
          dst.write_bytes(repaired)
          PY

      - name: Commit exact chunk object
        run: |
          set -euo pipefail
          test "$(git hash-object linkline/v4-transfer-debug/exact-1041-1300.json)" = "45b9d71fc48e94c687c343cefcd36b5c29b0044f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/v4-transfer-debug/exact-1041-1300.json
          git commit -m "linkline: materialize exact V4 final chunk"
          git push origin HEAD:linkline/v4-object-probe-v1
