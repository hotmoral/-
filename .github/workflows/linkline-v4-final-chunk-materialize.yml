name: Linkline V4 final chunk identity check

on:
  push:
    branches:
      - linkline/v4-object-probe-v1

permissions:
  contents: write

jobs:
  identity:
    if: ${{ !contains(github.event.head_commit.message, 'record V4 valid-candidate identity') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify valid candidate identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('linkline/v4-transfer-debug/candidate-1041-1300.json')
          out=Path('linkline/v4-transfer-debug/valid-candidate-identity.json')
          data=p.read_bytes()
          obj=json.loads(data.decode('utf-8'))
          report={
            'size':len(data),
            'gitBlobSha':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest(),
            'sha256':hashlib.sha256(data).hexdigest(),
            'parsedRows':len(obj.get('rows',[])),
            'schema':obj.get('schema'),
            'fromPosition':obj.get('fromPosition'),
            'throughPosition':obj.get('throughPosition'),
            'expectedDescriptorSha256':'444385bce60499b32c1bf8aea05a0e2eec32ac77743c0ab08b1296ccff86b616'
          }
          report['descriptorSha256Match']=report['sha256']==report['expectedDescriptorSha256']
          out.write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Commit identity evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/v4-transfer-debug/valid-candidate-identity.json
          git commit -m "linkline: record V4 valid-candidate identity"
          git push origin HEAD:linkline/v4-object-probe-v1
