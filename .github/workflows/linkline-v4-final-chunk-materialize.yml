name: Linkline V4 final chunk materialize

on:
  push:
    branches:
      - linkline/v4-object-probe-v1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'recover exact V4 final chunk') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Recover single missing numeric byte by exact Git blob identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          p = Path('linkline/v4-transfer-debug/candidate-1041-1300.json')
          r = Path('linkline/v4-transfer-debug/recovery.json')
          expected = '81458e6ebcc645d22fff597bcffb6294d0f24e76'
          data = p.read_bytes()
          if len(data) != 12890:
              raise SystemExit(f'unexpected candidate size: {len(data)}')

          header = b'blob 12891\0'
          found = None
          attempts = 0
          for pos in range(len(data) + 1):
              prefix = header + data[:pos]
              suffix = data[pos:]
              for byte in b'0123456789':
                  attempts += 1
                  candidate = data[:pos] + bytes([byte]) + suffix
                  if hashlib.sha1(header + candidate).hexdigest() == expected:
                      found = (pos, byte, candidate)
                      break
              if found:
                  break

          report = {
              'expectedGitBlobSha': expected,
              'inputSize': len(data),
              'attempts': attempts,
              'matched': bool(found),
          }
          if found:
              pos, byte, candidate = found
              obj = json.loads(candidate.decode('utf-8'))
              if len(obj.get('rows', [])) != 260:
                  raise SystemExit('recovered JSON row count mismatch')
              p.write_bytes(candidate)
              report.update({
                  'insertPosition': pos,
                  'insertByteAscii': chr(byte),
                  'outputSize': len(candidate),
                  'parsedRows': len(obj['rows']),
              })
          r.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if not found:
              raise SystemExit('no single numeric-byte insertion matched expected Git blob SHA')
          PY
          test "$(git hash-object linkline/v4-transfer-debug/candidate-1041-1300.json)" = "81458e6ebcc645d22fff597bcffb6294d0f24e76"

      - name: Commit exact recovered blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/v4-transfer-debug/candidate-1041-1300.json linkline/v4-transfer-debug/recovery.json
          git commit -m "linkline: recover exact V4 final chunk"
          git push origin HEAD:linkline/v4-object-probe-v1
