name: Linkline V4 final chunk materialize

on:
  push:
    branches:
      - linkline/v4-object-probe-v1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'record efficient ASCII scan') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Efficient ASCII insertion scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, traceback

          p = Path('linkline/v4-transfer-debug/candidate-1041-1300.json')
          r = Path('linkline/v4-transfer-debug/ascii-scan.json')
          expected = bytes.fromhex('81458e6ebcc645d22fff597bcffb6294d0f24e76')
          data = p.read_bytes()
          report = {'inputSize': len(data), 'matched': False}
          try:
              if len(data) != 12890:
                  raise ValueError(f'unexpected candidate size: {len(data)}')
              header = b'blob 12891\0'
              prefix_hasher = hashlib.sha1()
              prefix_hasher.update(header)
              attempts = 0
              found = None
              for pos in range(len(data) + 1):
                  suffix = data[pos:]
                  for byte in range(128):
                      attempts += 1
                      h = prefix_hasher.copy()
                      h.update(bytes((byte,)))
                      h.update(suffix)
                      if h.digest() == expected:
                          candidate = data[:pos] + bytes((byte,)) + suffix
                          found = (pos, byte, candidate)
                          break
                  if found:
                      break
                  if pos < len(data):
                      prefix_hasher.update(data[pos:pos+1])
              report['attempts'] = attempts
              if found:
                  pos, byte, candidate = found
                  obj = json.loads(candidate.decode('utf-8'))
                  if len(obj.get('rows', [])) != 260:
                      raise ValueError('recovered JSON row count mismatch')
                  p.write_bytes(candidate)
                  report.update({'matched': True, 'insertPosition': pos, 'insertByte': byte, 'insertByteRepr': repr(chr(byte)), 'outputSize': len(candidate), 'parsedRows': 260})
          except Exception as exc:
              report['error'] = repr(exc)
              report['traceback'] = traceback.format_exc()
          r.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify when matched and commit report
        run: |
          set -euo pipefail
          MATCHED="$(python3 -c 'import json; print(str(json.load(open("linkline/v4-transfer-debug/ascii-scan.json"))["matched"]).lower())')"
          if [ "${MATCHED}" = "true" ]; then
            test "$(git hash-object linkline/v4-transfer-debug/candidate-1041-1300.json)" = "81458e6ebcc645d22fff597bcffb6294d0f24e76"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/v4-transfer-debug/candidate-1041-1300.json linkline/v4-transfer-debug/ascii-scan.json
          git commit -m "linkline: record efficient ASCII scan"
          git push origin HEAD:linkline/v4-object-probe-v1
