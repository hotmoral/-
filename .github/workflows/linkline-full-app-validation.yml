name: Linkline Full App Validation

on:
  push:
    branches:
      - linkline/settings-validation-v1
    paths:
      - '.github/workflows/linkline-full-app-validation.yml'
      - 'linkline-full-validation/**'

permissions:
  contents: read

jobs:
  full-app-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reconstruct exact private app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/linkline-app"
          rm -rf "$APP"
          mkdir -p "$APP"
          cp -a timing-defense-skilled-v2-harness/public/. "$APP/"
          cp linkline-full-validation/package.json "$APP/package.json"
          mkdir -p "$APP/tests" "$APP/assets/performance-stamps"
          cp -a linkline-full-validation/tests/. "$APP/tests/"
          cp linkline-settings-validation/src/settings-preferences.mjs "$APP/src/settings-preferences.mjs"
          cp linkline-settings-validation/src/settings-about.mjs "$APP/src/settings-about.mjs"
          cp linkline-full-validation/visual-assets.mjs "$APP/src/visual-assets.mjs"
          cp linkline-full-validation/assets/s-plus-approved.svg "$APP/assets/performance-stamps/s-plus-approved.svg"
          cp linkline-full-validation/assets/a-plus-approved.svg "$APP/assets/performance-stamps/a-plus-approved.svg"
          cp linkline-full-validation/assets/b-plus-approved.svg "$APP/assets/performance-stamps/b-plus-approved.svg"
          APP="$APP" python3 linkline-full-validation/reconstruct.py

      - name: Verify exact private-source identity
        shell: bash
        run: |
          APP="$RUNNER_TEMP/linkline-app" bash linkline-full-validation/verify.sh

      - name: Run full app npm test
        shell: bash
        working-directory: ${{ runner.temp }}/linkline-app
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm test
