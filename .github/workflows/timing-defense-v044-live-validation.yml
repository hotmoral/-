name: Timing Defense v0.44 SUPPORTER Live Validation

on:
  push:
    branches:
      - timing-defense-cloudflare-do-poc
    paths:
      - '.github/workflows/timing-defense-v044-live-validation.yml'
      - 'timing-defense-cloudflare-poc/src/v044-supporter-*.js'
      - 'timing-defense-cloudflare-poc/wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timing-defense-v044-live-validation
  cancel-in-progress: true

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      BASE_URL: https://timing-defense-do-poc.sktjsek.workers.dev
      EXPECTED_VERSION: 0.44-cf.1
    steps:
      - name: Prepare artifacts
        run: mkdir -p artifacts
      - name: Wait for exact Cloudflare deployment marker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),base=process.env.BASE_URL,expected=process.env.EXPECTED_VERSION,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const deadline=Date.now()+180000;let last='';while(Date.now()<deadline){try{const r=await fetch(`${base}/api/health?ci=${Date.now()}`,{cache:'no-store'});last=await r.text();fs.writeFileSync('artifacts/health.txt',last);let d;try{d=JSON.parse(last)}catch{};console.log(`health ${r.status} ${d?.version||'unknown'}`);if(r.ok&&d?.version===expected)return}catch(e){last=String(e?.stack||e)}await sleep(3000)}fs.writeFileSync('artifacts/health.txt',last||'no response');process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run SUPPORTER authority diagnostics
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');(async()=>{const r=await fetch(`${process.env.BASE_URL}/api/diagnostics/v044-supporter?ci=${Date.now()}`,{cache:'no-store'}),text=await r.text();fs.writeFileSync('artifacts/supporter-diagnostics.json',text);console.log(text);let d;try{d=JSON.parse(text)}catch{};const ok=r.ok&&d?.ok&&d?.version==='0.44-cf.1-diagnostics'&&d?.foundation?.ok&&d?.foundation?.passed===22&&d?.v039?.ok&&d?.v039?.passed===57&&d?.shield?.ok&&d?.shield?.passed===11&&d?.flyer?.ok&&d?.flyer?.passed===10&&d?.charger?.ok&&d?.charger?.passed===17&&d?.splitter?.ok&&d?.splitter?.passed===14&&d?.supporter?.ok&&d?.supporter?.passed===17&&d?.supporter?.total===17;if(!ok)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Root loader smoke
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');const base=process.env.BASE_URL;
          (async()=>{const browser=await chromium.launch({headless:true});try{const page=await browser.newPage({viewport:{width:1280,height:720}});await page.goto(`${base}/?ci=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>!!window.__TDFlyerYV041,null,{timeout:30000});const text=await page.locator('body').innerText();fs.writeFileSync('artifacts/root-loader.txt',text.slice(0,5000));await page.screenshot({path:'artifacts/root-loader.png',fullPage:true});}finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run complete prior browser/WebSocket regression
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');const base=process.env.BASE_URL;
          (async()=>{let browser,page;const logs=[];try{browser=await chromium.launch({headless:true});page=await browser.newPage({viewport:{width:1440,height:1000}});page.on('console',m=>logs.push(`[console:${m.type()}] ${m.text()}`));page.on('pageerror',e=>logs.push(`[pageerror] ${String(e?.stack||e)}`));const url=`${base}/v039-validation-suite.html?fix=cf0441&ci=${encodeURIComponent(process.env.GITHUB_SHA||Date.now())}`;await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>{const t=document.body?.innerText||'';return t.includes('FINAL · PASS')||t.includes('FINAL · FAIL')},null,{timeout:240000});const body=await page.locator('body').innerText();fs.writeFileSync('artifacts/prior-regression.txt',body);fs.writeFileSync('artifacts/browser.log',logs.join('\n'));await page.screenshot({path:'artifacts/prior-regression.png',fullPage:true});console.log(body);if(!body.includes('FINAL · PASS'))process.exitCode=1}catch(e){console.error(e);process.exitCode=1}finally{if(browser)await browser.close()}})();
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-v044-supporter-live-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
