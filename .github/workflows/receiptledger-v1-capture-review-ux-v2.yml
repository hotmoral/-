name: ReceiptLedger V1 Capture Review UX V2

on:
  push:
    branches:
      - receiptledger/run-v1-capture-review-ux-v2-20261016
    paths:
      - 'receiptledger/CP33_CAPTURE_REVIEW_UX_V2_PLAN.md'
      - 'receiptledger/CAPTURE_REVIEW_UX_V2_CONSISTENCY_REVIEW.md'
      - 'receiptledger/CAPTURE_REVIEW_UX_V2_GOLDEN_VECTORS.md'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/res/values/strings.xml'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/MainActivity.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewAssessmentV2.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewConfirmationV2.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/RepeatIdentityReuseV1.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewDialog.java'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/review/CaptureReviewUxV2Test.java'
      - '.github/workflows/receiptledger-v1-capture-review-ux-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-capture-review-ux-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-capture-review-ux-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP33 scope and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=1996668e1fec6961eb158c5dd2e6b673fdb46ee0
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp33-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-capture-review-ux-v2.yml) ;;
              receiptledger/CP33_CAPTURE_REVIEW_UX_V2_PLAN.md) ;;
              receiptledger/CAPTURE_REVIEW_UX_V2_CONSISTENCY_REVIEW.md) ;;
              receiptledger/CAPTURE_REVIEW_UX_V2_GOLDEN_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/res/values/strings.xml) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/MainActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewAssessmentV2.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewConfirmationV2.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/RepeatIdentityReuseV1.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewDialog.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/review/CaptureReviewUxV2Test.java) ;;
              '') ;;
              *) echo "CP33 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp33-changed-files.txt

          for frozen in catalog product semantics identity category commodity commoditydetail persistence price priceintel priceeval search detail design ocr recovery item validation; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/$frozen" || { echo "Frozen upstream package changed: $frozen"; exit 32; }
          done
          for frozen_file in \
            "$APP/src/main/java/com/receiptledger/v1/ProductDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/CommodityDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/PriceHistoryActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/ReceiptDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/LibraryActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/review/ReceiptReviewEngine.java" \
            "$APP/src/main/java/com/receiptledger/v1/review/ReviewInputParser.java" \
            "$APP/src/main/java/com/receiptledger/v1/review/ReviewItemInput.java"; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$frozen_file" || { echo "Frozen CP33 dependency changed: $frozen_file"; exit 33; }
          done

          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 32' "$APP/build.gradle"
          grep -Fq "versionName '1.0.31-capture-review-ux-v2'" "$APP/build.gradle"
          grep -Fq 'CaptureReviewAssessmentV2.assess' "$APP/src/main/java/com/receiptledger/v1/MainActivity.java"
          grep -Fq 'ReceiptReviewDialog.showRequired' "$APP/src/main/java/com/receiptledger/v1/MainActivity.java"
          grep -Fq 'ReceiptReviewDialog.showAll' "$APP/src/main/java/com/receiptledger/v1/MainActivity.java"
          grep -Fq 'resolveAndLinkExact' "$APP/src/main/java/com/receiptledger/v1/MainActivity.java"
          grep -Fq 'USER_CONFIRMED_DEFAULT_ONE:' "$APP/src/main/java/com/receiptledger/v1/review/CaptureReviewConfirmationV2.java"
          grep -Fq 'ValueOrigin.DEFAULT_ONE' "$APP/src/main/java/com/receiptledger/v1/review/CaptureReviewAssessmentV2.java"
          if grep -Fq 'PassDiagnostic' "$APP/src/main/java/com/receiptledger/v1/MainActivity.java"; then
            echo 'Primary CP33 UI still exposes pass diagnostics'; exit 34
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/MainActivity.java').read_text()
          load=p.index('private void loadImage')
          auto=p.index('runOcr();', load)
          save=p.index('repository.save(record, image);')
          link=p.index('resolveAndLinkExact', save)
          if auto <= load: raise SystemExit('Auto processing ordering missing')
          if link <= save: raise SystemExit('Exact alias reuse must occur only after receipt save')
          PY

      - name: Test lint and build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
            if ! grep -Fqx 'No issues found.' "$REPORT"; then
              echo 'CP33 requires lint 0 errors / 0 warnings'
              status=43
            fi
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.ReceiptReviewEngineTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.price.PriceHistoryServiceTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Extract and verify CP33 metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp33-capture-review-ux-v2-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml'
          root=ET.parse(path).getroot()
          if int(root.attrib.get('failures','0')) or int(root.attrib.get('errors','0')):
              raise SystemExit('CP33 tests failed')
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP33_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected exactly one CP33_METRICS line, got %d' % len(lines))
          line=lines[0]
          values={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)', line)}
          expected={
            'capture_review_version':2,
            'auto_confirm_cases':2,
            'review_required_cases':7,
            'user_edit_exit':1,
            'selective_review':1,
            'full_edit':1,
            'raw_ocr_preserved':1,
            'exact_alias_reuse':1,
            'unknown_alias_safe':1,
            'link_failure_isolated':1,
            'auto_processing':1,
            'schema_unchanged':1,
          }
          for key,value in expected.items():
              if values.get(key) != value:
                  raise SystemExit('%s expected %d got %r' % (key,value,values.get(key)))
          print(line)
          PY

      - name: Package and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=1996668e1fec6961eb158c5dd2e6b673fdb46ee0
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-capture-review-ux-v2
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-capture-review-ux-v2-debug.apk"
          cp receiptledger/cp33-capture-review-ux-v2-metrics.txt "$OUT/CP33_CAPTURE_REVIEW_UX_V2_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml" "$OUT/CAPTURE_REVIEW_UX_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.ReceiptReviewEngineTest.xml" "$OUT/RECEIPT_REVIEW_ENGINE_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml" "$OUT/COMMODITY_DETAIL_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml" "$OUT/PRODUCT_DETAIL_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml" "$OUT/DESIGN_SYSTEM_FOUNDATION_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml" "$OUT/SEARCH_BROWSE_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml" "$OUT/PRICE_EVALUATION_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml" "$OUT/PRICE_INTELLIGENCE_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml" "$OUT/COMMODITY_NON_STANDARD_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-capture-review-ux-v2-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 51; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP33_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-capture-review-ux-v2-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_CAPTURE_REVIEW_UX_V2_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'capture_auto_processing=YES'
            echo 'mandatory_full_review=NO'
            echo 'explicit_save_ack=REQUIRED'
            echo 'selective_review=YES'
            echo 'default_one_requires_confirmation=YES'
            echo 'exact_alias_reuse=GLOBAL_CONFIRMED_ONLY'
            echo 'fuzzy_identity=FORBIDDEN'
            echo 'receipt_traceability=PRESERVED'
            echo 'ui_architecture=PROGRAMMATIC_ANDROID_WIDGET_PRESERVED'
            echo 'compose_migration=NONE'
            echo 'material_dependency_added=NO'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.31-capture-review-ux-v2'
            echo 'version_code=32'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP33_CAPTURE_REVIEW_UX_V2_METRICS.txt "$OUT"/CAPTURE_REVIEW_UX_V2_TEST.xml "$OUT"/CP33_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-capture-review-ux-v2-${{ github.run_id }}
          path: receiptledger/output/v1-capture-review-ux-v2/
          if-no-files-found: error
          retention-days: 14
