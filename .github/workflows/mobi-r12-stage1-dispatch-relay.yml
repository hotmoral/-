name: Mobi R12 Stage-1 One-Shot Dispatch Relay

on:
  push:
    branches:
      - mobi/ops-r12-stage1-dispatch-20261017

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Mobi: dispatch frozen R12 Stage-1 once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch frozen R12 Stage-1 once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobi-p1-c-r12-surface-terminal-bind.yml/dispatches" \
            -d '{"ref":"mobi/run-p1-c-r12-surface-terminal-bind-20261017","inputs":{"confirm_stage1":"RUN_R12_STAGE1_AFTER_STAGE0_FREEZE"}}'
          echo 'R12 Stage-1 workflow_dispatch accepted.'
