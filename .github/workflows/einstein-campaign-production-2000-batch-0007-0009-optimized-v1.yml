name: Einstein Campaign Production 2000 Batch 0007-0009 Optimized V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-batch-0007-0009-optimized-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-batch-0007-0009:
    if: >-
      github.event.head_commit.message == 'production: run optimized Einstein campaign batch 0007-0009'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNNER_SHA: a0c1f9c282d556a78c6bded46410533188853442
      EXPECTED_BANK_HEAD: bbb2f5043b7eda70daaa2328b301a8f3d51c37ec
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact optimized bounded batch runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: a0c1f9c282d556a78c6bded46410533188853442
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute bounded optimized compact N5 batch
        shell: bash
        env:
          EINSTEIN_RUNNER_SHA: a0c1f9c282d556a78c6bded46410533188853442
          EINSTEIN_BANK_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
        run: |
          set -euo pipefail
          bash EinsteinGame/tools/campaign-production-2000/run_compact_n5_batch.sh 7 3 "$EXPECTED_BANK_HEAD"
