name: Timing Defense P5 Skilled V2 Stage46-49 temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-skilled-v2-stage46-49-temp.yml

permissions:
  contents: read

jobs:
  skilled-v2-factor-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Install YAML dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Run twice, verify determinism, print compact factor result
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage46_47_skilled_factor_isolation_temp.py > /tmp/run1.txt
          cp p5_stage46_47_skilled_factor_isolation_temp.json /tmp/result1.json
          python3 tools/run_p5_stage46_47_skilled_factor_isolation_temp.py > /tmp/run2.txt
          cmp /tmp/result1.json p5_stage46_47_skilled_factor_isolation_temp.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('p5_stage46_47_skilled_factor_isolation_temp.json')
          d=json.loads(p.read_text())
          print('P5_SKILLED_FACTOR='+json.dumps({'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'aggregate':d['aggregate'],'seeds':d['seeds']},sort_keys=True))
          PY
