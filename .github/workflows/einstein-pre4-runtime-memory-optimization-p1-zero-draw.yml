name: Einstein Pre4 P1 Traversal Optimization Zero-Draw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-runtime-memory-optimization-p1-zero-draw.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-runtime-memory-optimization-p1-zero-draw-v1
  cancel-in-progress: false

jobs:
  validate-and-publish-candidate:
    if: >-
      github.event.head_commit.message == 'ci: run Einstein pre4 P1 traversal optimization zero draw'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: b9cee065c261066919c36284c04c4777323c167b
      CANDIDATE_BRANCH: pre4-zero-draw-runtime-memory-optimization-v2
      BASE_CLASSES: /tmp/einstein-pre4-p1-base-classes
      CANDIDATE_CLASSES: /tmp/einstein-pre4-p1-candidate-classes
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: main
          path: Harness
          persist-credentials: false

      - name: Checkout exact P0 candidate with write credential
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b9cee065c261066919c36284c04c4777323c167b
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run P1 traversal optimization harness
        shell: bash
        run: bash Harness/scripts/einstein-pre4-runtime-memory-optimize-p1.sh
