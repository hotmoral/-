name: Cloudflare endpoint diagnostic v2

on:
  push:
    branches:
      - timing-defense-skilled-v2-harness-v01
    paths:
      - '.github/workflows/cloudflare-endpoint-diagnostic-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-name:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' -o /tmp/health
          grep -q 'skilled-v2-harness-v0.1' /tmp/health

  production-branch-preview:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' -o /tmp/health
          grep -q 'skilled-v2-harness-v0.1' /tmp/health

  linkline-preview:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://linkline-cloudflare-product-v-timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' -o /tmp/health
          grep -q 'skilled-v2-harness-v0.1' /tmp/health
