name: ReceiptLedger V1 OCR Recovery Core
on:
  push:
    branches: ['receiptledger/run-v1-ocr-recovery-core-20261015']
    paths: ['receiptledger/**', '.github/workflows/receiptledger-v1-ocr-recovery-core.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'receiptledger-v1-ocr-recovery-${{ github.ref }}', cancel-in-progress: false }
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9', cache-disabled: true }
      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh
      - name: Enforce recovery budget and offline contracts
        run: |
          set -euo pipefail
          grep -q 'MAX_PASSES=3' receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/recovery/OcrRecoveryEngine.java
          grep -q 'MAX_PIXELS=6_000_000L' receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/recovery/ReceiptImagePreprocessor.java
          grep -q 'adaptiveBinaryInPlace' receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/recovery/OcrRecoveryEngine.java
          grep -q 'sourceElementQuads' receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/ocr/OcrDocument.java
      - name: Test and build OCR Recovery Core
        run: gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:assembleDebug
      - name: Package evidence
        run: |
          set -euo pipefail; SRC=receiptledger/harness/android-v1; APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"; OUT=receiptledger/output/v1-ocr-recovery-core; rm -rf "$OUT"; mkdir -p "$OUT"; cp "$APK" "$OUT/receiptledger-v1-ocr-recovery-core-debug.apk"; unzip -t "$OUT/receiptledger-v1-ocr-recovery-core-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"; AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1); "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"; for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then exit 31; fi; done; sha256sum "$OUT/receiptledger-v1-ocr-recovery-core-debug.apk" > "$OUT/APK_SHA256.txt"; { echo 'checkpoint=RL_V1_OCR_RECOVERY_CORE_01'; echo "public_commit=${GITHUB_SHA}"; echo 'version_name=1.0.13-ocr-recovery-core'; echo 'version_code=14'; echo 'ocr_pass_budget=3'; echo 'passes=ORIGINAL_CONTRAST_BINARY'; echo 'recovery_max_pixels=6000000'; echo 'selection=STRUCTURE_VALIDATION_SCORE'; echo 'cross_pass_merge=NOT_INCLUDED'; echo 'network_permission=REMOVED'; echo 'signing=debug_only'; } > "$OUT/BUILD_IDENTITY.txt"; (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"; sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt > "$OUT/EVIDENCE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with: { name: 'receiptledger-v1-ocr-recovery-core-${{ github.run_id }}', path: 'receiptledger/output/v1-ocr-recovery-core/', if-no-files-found: error, retention-days: 14 }
