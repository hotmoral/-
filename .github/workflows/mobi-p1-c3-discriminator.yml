name: Mobi P1-C3 Structural Discriminator

on:
  push:
    branches:
      - 'mobi/run-p1-c3-representation-20261015'
    paths:
      - 'mobi/p1-b2/geometry/c3_semantic.py'
      - 'mobi/p1-b2/geometry/c3_renderers.py'
      - 'mobi/p1-b2/geometry/run_c3_matrix.py'
      - 'mobi/p1-b2/geometry/test_c3.py'
      - '.github/workflows/mobi-p1-c3-discriminator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-c3-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c3/evidence
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "runner=ubuntu-latest"
            python3 --version
          } | tee mobi/p1-c3/evidence/environment.txt

      - name: Verify private-canonical source blob parity
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          test "$(git hash-object model.py)" = "c4e0334cf5896d0bb7a2ab3e8d89c1cd37f7410b"
          test "$(git hash-object candidates_v2.py)" = "39bcf9759387800c7da60ace45a528d238d4208f"
          test "$(git hash-object motions_v2.py)" = "a3d6c1fd0227216fdf2a69e056e3b177dc398c53"
          test "$(git hash-object orientation_v2.py)" = "33cb9c1e8f3b41f038898345a0aee0642609e812"
          test "$(git hash-object turn_2p5d.py)" = "05ca5e26f75b07f53d2d3fee6db38f43fc71314d"
          test "$(git hash-object c3_semantic.py)" = "9ebb7192fbd414f134ecd15991ca252af58bfd62"
          test "$(git hash-object c3_renderers.py)" = "c6ed7102d846b4fd7572b08aa4314dbe60239784"
          test "$(git hash-object run_c3_matrix.py)" = "8668613e8784406d081bb389a60d92eba23df2c1"
          test "$(git hash-object test_c3.py)" = "0c2532c51d9d0c24cb95ced52853671da9409ed4"
          git hash-object model.py candidates_v2.py motions_v2.py orientation_v2.py turn_2p5d.py c3_semantic.py c3_renderers.py run_c3_matrix.py test_c3.py | tee ../../p1-c3/evidence/git_blob_shas.txt
          sha256sum model.py candidates_v2.py motions_v2.py orientation_v2.py turn_2p5d.py c3_semantic.py c3_renderers.py run_c3_matrix.py test_c3.py | tee ../../p1-c3/evidence/source_sha256.txt
          echo "P1-C3 private/public source parity PASS"

      - name: Run C3 regression tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_c3.py 2>&1 | tee ../../p1-c3/evidence/unittest.txt

      - name: Run discriminator matrix twice and generate scorecards
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from run_c3_matrix import canonical_bytes, run_c3_matrix, write_scorecards

          out = Path('../../p1-c3/evidence')
          out.mkdir(parents=True, exist_ok=True)

          first_records, first_summary = run_c3_matrix(sample_count=17)
          second_records, second_summary = run_c3_matrix(sample_count=17)
          if canonical_bytes(first_records) != canonical_bytes(second_records):
              raise SystemExit('C3 record determinism mismatch')
          if canonical_bytes(first_summary) != canonical_bytes(second_summary):
              raise SystemExit('C3 summary determinism mismatch')
          if first_summary['semanticHashMismatchTotal'] != 0:
              raise SystemExit('RF-B/RF-C semantic identity mismatch')
          if first_summary['rfBMaxCorrectionFamilyCount'] != 0:
              raise SystemExit('RF-B unexpectedly used authored correctives')
          if first_summary['rfCCorrectionFamilies'] != ['H4_CORE_ENVELOPE', 'H6_TURN_ENVELOPE']:
              raise SystemExit(f"unexpected RF-C correction families: {first_summary['rfCCorrectionFamilies']}")
          if first_summary['maxPartitionGroupCount'] > 4:
              raise SystemExit('partition group count exceeded canonical bound')

          first_summary['deterministicRepeatExact'] = True
          (out / 'results.json').write_text(json.dumps(first_records, indent=2, sort_keys=True), encoding='utf-8')
          (out / 'summary.json').write_text(json.dumps(first_summary, indent=2, sort_keys=True), encoding='utf-8')
          scorecards = write_scorecards(out / 'scorecards')
          if len(scorecards) != 18:
              raise SystemExit(f'expected 18 scorecards, got {len(scorecards)}')
          print(json.dumps(first_summary, indent=2, sort_keys=True))
          print(f'scorecards={len(scorecards)}')
          PY

      - name: Parse all scorecards as XML
        working-directory: mobi/p1-c3/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('scorecards').glob('*.svg'))
          if len(files) != 18:
              raise SystemExit(f'expected 18 SVG scorecards, got {len(files)}')
          for path in files:
              ET.parse(path)
          print(f'xml_parse_pass={len(files)}')
          PY

      - name: Hash evidence files
        working-directory: mobi/p1-c3/evidence
        run: |
          set -euo pipefail
          find scorecards -type f -print0 | sort -z | xargs -0 sha256sum > SCORECARD_SHA256SUMS.txt
          sha256sum environment.txt git_blob_shas.txt source_sha256.txt unittest.txt results.json summary.json SCORECARD_SHA256SUMS.txt | tee EVIDENCE_SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-c3-discriminator-${{ github.run_id }}
          path: mobi/p1-c3/evidence/
          if-no-files-found: error
          retention-days: 30
