name: ReceiptLedger Post-V1 Physical OCR Remediation

on:
  push:
    branches:
      - receiptledger/run-post-v1-physical-ocr-remediation-20261017
    paths:
      - 'receiptledger/CP37_FALSE_ITEM_ROW_REMEDIATION_PLAN.md'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/structure/ReceiptStructureAnalyzer.java'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/structure/ReceiptStructureAnalyzerTest.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReviewItemInput.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewEngine.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewAssessmentV2.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewDialog.java'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/review/ReceiptReviewEngineTest.java'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/devicevalidation/DeviceValidationReportV1Test.java'
      - 'receiptledger/harness/android-v1/app/src/main/res/values/cp37_strings.xml'
      - '.github/workflows/receiptledger-post-v1-physical-ocr-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-false-item-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          set -o pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce bounded remediation scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=6b7d7b9b65432701b43da53a0e6f0ff1e47a1449
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp37-remediation-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-post-v1-physical-ocr-remediation.yml) ;;
              receiptledger/CP37_FALSE_ITEM_ROW_REMEDIATION_PLAN.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/structure/ReceiptStructureAnalyzer.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/structure/ReceiptStructureAnalyzerTest.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReviewItemInput.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewEngine.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/CaptureReviewAssessmentV2.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/review/ReceiptReviewDialog.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/review/ReceiptReviewEngineTest.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/devicevalidation/DeviceValidationReportV1Test.java) ;;
              receiptledger/harness/android-v1/app/src/main/res/values/cp37_strings.xml) ;;
              '') ;;
              *) echo "CP37 remediation scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp37-remediation-changed-files.txt

          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || { echo 'manifest changed'; exit 32; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/ocr" || { echo 'OCR engine changed'; exit 33; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/recovery" || { echo 'recovery logic changed'; exit 34; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/identity" || { echo 'identity changed'; exit 35; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/price" || { echo 'price changed'; exit 36; }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 37' "$APP/build.gradle"
          grep -Fq "versionName '1.0.36-physical-ocr-remediation'" "$APP/build.gradle"

      - name: Unit regression lint and APK build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
            if ! grep -Fqx 'No issues found.' "$REPORT"; then status=43; fi
          else
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.structure.ReceiptStructureAnalyzerTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.ReceiptReviewEngineTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.evaluation.RealReceiptEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Verify remediation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp37-remediation-metrics.txt
          import xml.etree.ElementTree as ET
          cases = {
            'structure': ('receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.structure.ReceiptStructureAnalyzerTest.xml', 5),
            'review': ('receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.ReceiptReviewEngineTest.xml', 5),
            'report': ('receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml', 5),
          }
          for name,(path,expected) in cases.items():
              root=ET.parse(path).getroot()
              vals={k:int(root.attrib.get(k,'0')) for k in ('tests','failures','errors','skipped')}
              if vals['tests'] != expected or vals['failures'] or vals['errors'] or vals['skipped']:
                  raise SystemExit(f'{name} contract mismatch: {vals}')
          print('CP37_REMEDIATION_METRICS version=1 structure_tests=5 review_tests=5 report_tests=5 predate_false_item_gate=1 explicit_item_removal=1 provenance_preserved=1 report_structure_delta=1 schema_unchanged=1')
          PY

      - name: Package remediation artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE=6b7d7b9b65432701b43da53a0e6f0ff1e47a1449
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/post-v1-physical-ocr-remediation
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/ReceiptLedger-1.0.36-physical-ocr-remediation-debug.apk"
          cp receiptledger/cp37-remediation-metrics.txt "$OUT/CP37_REMEDIATION_METRICS.txt"
          cp receiptledger/CP37_FALSE_ITEM_ROW_REMEDIATION_PLAN.md "$OUT/"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.structure.ReceiptStructureAnalyzerTest.xml" "$OUT/STRUCTURE_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.ReceiptReviewEngineTest.xml" "$OUT/REVIEW_ENGINE_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml" "$OUT/DEVICE_VALIDATION_REPORT_TEST.xml"
          unzip -t "$OUT/ReceiptLedger-1.0.36-physical-ocr-remediation-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 81; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP37_REMEDIATION_DIFF.txt"
          sha256sum "$OUT/ReceiptLedger-1.0.36-physical-ocr-remediation-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_POST_V1_PHYSICAL_OCR_VALIDATION_01_REMEDIATION_A'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'status=REMEDIATION_CANDIDATE'
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'ocr_engine=UNCHANGED'
            echo 'recovery_policy=UNCHANGED'
            echo 'version_name=1.0.36-physical-ocr-remediation'
            echo 'version_code=37'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/APK_PERMISSIONS.txt \
            "$OUT"/CP37_REMEDIATION_METRICS.txt "$OUT"/CP37_REMEDIATION_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-post-v1-physical-ocr-remediation-${{ github.run_id }}
          path: receiptledger/output/post-v1-physical-ocr-remediation/
          if-no-files-found: error
          retention-days: 14
