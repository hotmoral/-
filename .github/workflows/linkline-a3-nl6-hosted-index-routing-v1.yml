name: Linkline A3 NL6 Hosted Index Routing

on:
  push:
    branches:
      - linkline/a3-nl6-hosted-parity-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose root and index routing
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://e42e0ae5-timing-defense-skilled-v2-harness.sktjsek.workers.dev'
          echo '--- ROOT ---'
          curl --silent --show-error --dump-header /tmp/root.headers "${BASE}/" -o /tmp/root.body
          cat /tmp/root.headers
          echo "root_blob=$(git hash-object /tmp/root.body)"
          echo '--- INDEX ---'
          curl --silent --show-error --dump-header /tmp/index.headers "${BASE}/index.html" -o /tmp/index.body
          cat /tmp/index.headers
          echo "index_blob=$(git hash-object /tmp/index.body)"
          echo '--- INDEX FOLLOW ---'
          curl --fail --silent --show-error --location "${BASE}/index.html" -o /tmp/index-follow.body
          echo "index_follow_blob=$(git hash-object /tmp/index-follow.body)"
          test "$(git hash-object /tmp/root.body)" = "2429cf72ceb18d1265a2f69656aafebe1aa11f2e"
          test "$(git hash-object /tmp/index-follow.body)" = "2429cf72ceb18d1265a2f69656aafebe1aa11f2e"
          echo HOSTED_INDEX_ROUTING_PASS
