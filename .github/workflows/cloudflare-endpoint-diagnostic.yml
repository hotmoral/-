name: Cloudflare endpoint diagnostic

on:
  push:
    branches:
      - timing-defense-skilled-v2-harness-v01
    paths:
      - '.github/workflows/cloudflare-endpoint-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Production-name URL
        continue-on-error: true
        run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' | tee /tmp/a
          grep -q 'skilled-v2-harness-v0.1' /tmp/a

      - name: Production-branch preview candidate
        continue-on-error: true
        run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' | tee /tmp/b
          grep -q 'skilled-v2-harness-v0.1' /tmp/b

      - name: Known Linkline preview URL
        continue-on-error: true
        run: |
          curl -fsS --max-time 10 'https://linkline-cloudflare-product-v-timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' | tee /tmp/c
          grep -q 'skilled-v2-harness-v0.1' /tmp/c
