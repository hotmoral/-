name: Einstein N5 Transfer Producer Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-n5-transfer-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.head_commit.message == 'verify: Einstein N5 transfer producer preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_SHA: ff5ccfc195f8b7e8fa0576d65e851c91bf66900d
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Require private read credential
        shell: bash
        run: test -n "$READ_TOKEN"
      - name: Checkout exact transfer runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ff5ccfc195f8b7e8fa0576d65e851c91bf66900d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize and compile transfer producer
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          python3 tools/campaign-production-2000/materialize_n5_transfer_producer.py
          P='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000N5TransferProducerV1.java'
          grep -F 'MIN_ORDINAL=121' "$P"
          grep -F 'MAX_ORDINAL=240' "$P"
          grep -F '"transfer".equals(stage.learningIntent)' "$P"
          grep -F 'stage.primarySkill,stage.domain,stage.difficultyBand,TransferContext.missing()' "$P"
          ! grep -F 'producer only supports ordinals 1..120' "$P"
          ! grep -F 'stage learningIntent must be direct' "$P"
          CLASSES=/tmp/einstein-transfer-preflight-classes
          SOURCES=/tmp/einstein-transfer-preflight-sources.txt
          rm -rf "$CLASSES" "$SOURCES"
          mkdir -p "$CLASSES"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java' >> "$SOURCES"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java' >> "$SOURCES"
          echo "$P" >> "$SOURCES"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          bash -n tools/campaign-production-2000/run_compact_n5_transfer_batch.sh
          echo 'N5_TRANSFER_PREFLIGHT=PASS'
