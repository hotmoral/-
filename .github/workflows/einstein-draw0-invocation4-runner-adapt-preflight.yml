name: Einstein Draw0 Invocation4 Runner Adaptation Zero-Draw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-draw0-invocation4-runner-adapt-preflight.yml'

permissions:
  contents: read

concurrency:
  group: einstein-draw0-invocation4-runner-adapt-preflight
  cancel-in-progress: false

jobs:
  adapt:
    if: github.event.head_commit.message == 'ci: adapt Einstein draw0 invocation4 runner zero draw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCEPTED_SOURCE_SHA: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      OLD_RUNNER_SHA: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
      FIXTURE_SHA: b34abb909dd1d154ca964423c6bde3bcb347407d
      FIXTURE_BLOB_SHA: ce555f511ca4003e95a24fbca975081c61109222
      RUNNER_BRANCH: campaign-intent-acquisition-draw0-recovery-invocation4-runner-v1
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
      CLASSES_DIR: /tmp/einstein-invocation4-runner-classes
      SOURCES_FILE: /tmp/einstein-invocation4-runner-sources.txt
      EXEC_DIR: /tmp/einstein-invocation4-runner-preflight
    steps:
      - name: Require credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout patch harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: 209a177a8f7839c385a28385431f160bafe28ef9
          path: Harness
          persist-credentials: false

      - name: Checkout exact invocation4 runner branch base
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-intent-acquisition-draw0-recovery-invocation4-runner-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: true

      - name: Checkout exact invocation3 runner source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: OldRunner
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact frozen bounded fixture
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b34abb909dd1d154ca964423c6bde3bcb347407d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: FrozenFixture
          fetch-depth: 1
          persist-credentials: false

      - name: Apply invocation4 runner-only adaptation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C EinsteinGame rev-parse HEAD)" = "$ACCEPTED_SOURCE_SHA"
          SRC='OldRunner/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          DST='EinsteinGame/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          python3 Harness/scripts/einstein_invocation4_runner_patch.py "$SRC" "$DST"
          git -C EinsteinGame diff --check
          mapfile -t changed < <(git -C EinsteinGame status --porcelain --untracked-files=all | sed 's/^...//' | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          F="EinsteinGame/${changed[0]}"
          grep -F 'EXPECTED_PRODUCTION_SOURCE="cdb66a3e0509bfec050a907bb43efb4e01b4ffeb"' "$F"
          grep -F 'EXECUTE_TOKEN="RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_4"' "$F"
          grep -F 'FORMAL_REMOTE_ROOT="evidence/bounded-acquisition/draw0-recovery-invocation-4"' "$F"
          grep -F '"historicalDraw0InvocationCount",3,"recoveryInvocationOrdinal",4' "$F"
          grep -F 'draw0InvocationOrdinal=4' "$F"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile exact Java 8 runner preflight set
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE" "$EXEC_DIR"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          cat >> "$SOURCES_FILE" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          ../FrozenFixture/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=list(Path('/tmp/einstein-invocation4-runner-classes').rglob('*.class'))
          assert files
          for p in files:
              magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
              assert (magic,minor,major)==(0xCAFEBABE,0,52),(p,major)
          print('JAVA8_CLASSFILE_TARGET=PASS count='+str(len(files)))
          PY

      - name: Run zero-draw local durability and split-resume preflight
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
          EINSTEIN_REMOTE_EVIDENCE_ROOT: preflight/invocation4-local
        run: |
          set -euo pipefail
          java -Xmx512m -cp "$CLASSES_DIR" \
            com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionAckDurableRecoveryRunnerV1 \
            preflight "$EXEC_DIR" | tee /tmp/einstein-invocation4-runner-preflight.log
          grep -F 'ACK_DURABLE_RECOVERY_LOCAL_PREFLIGHT=PASS' /tmp/einstein-invocation4-runner-preflight.log
          grep -F 'SPLIT_RESUME_CONTRACT=PASS' /tmp/einstein-invocation4-runner-preflight.log
          grep -F 'formalAcquisitionInvocationCount=0' /tmp/einstein-invocation4-runner-preflight.log

      - name: Commit and push validated runner-only successor
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          git config user.name 'Einstein Recovery Runner'
          git config user.email 'noreply@localhost'
          git add puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          git commit -m 'test: adapt durable recovery runner for invocation 4'
          test "$(git rev-parse HEAD^)" = "$ACCEPTED_SOURCE_SHA"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$RUNNER_BRANCH"
          test "$(git ls-remote origin "refs/heads/$RUNNER_BRANCH" | cut -f1)" = "$NEW_SHA"
          printf '%s\n' \
            'EINSTEIN_DRAW0_INVOCATION4_RUNNER_ADAPTATION=PASS' \
            "runner=$NEW_SHA" \
            "acceptedSource=$ACCEPTED_SOURCE_SHA" \
            'splitResume=PASS' \
            'localRemoteAck=PASS' \
            'formalAcquisitionInvocation=0'
