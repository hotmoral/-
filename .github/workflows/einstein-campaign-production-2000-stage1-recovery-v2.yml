name: Einstein Campaign Production 2000 Stage 0001 Recovery V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-stage1-recovery-v2.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  recover-stage-0001-v2:
    if: >-
      github.event.head_commit.message == 'production: recover sealed Einstein campaign stage 0001 compact v2'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNNER_SHA: 1ec2d5caa10985a8959a4a3d79d7c695a6bc3fc6
      ACCEPTED_SOURCE_SHA: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
      BANK_BRANCH: campaign-production-2000-bank-v1
      EXPECTED_BANK_HEAD: 2ecb1e1a8d5d73491c223f89176ed6136bdbc685
      BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
      EVIDENCE_STAGE_ROOT: production/campaign-2000-bank-v1/evidence/stage-0001
      CLASSES_DIR: /tmp/einstein-campaign-production-recovery-v2-classes
      SOURCES_FILE: /tmp/einstein-campaign-production-recovery-v2-sources.txt
      BANK_DIR: /tmp/einstein-campaign-production-bank
      RECOVERED_OUTPUT: /tmp/einstein-stage-0001-recovered-acquired-v2.json
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact compact recovery source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 1ec2d5caa10985a8959a4a3d79d7c695a6bc3fc6
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact sealed recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles)"
          cd ../ProductionStore
          test "$(git rev-parse --abbrev-ref HEAD)" = "$BANK_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BANK_HEAD"
          test "$(git ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$EXPECTED_BANK_HEAD"
          test -f "$EVIDENCE_STAGE_ROOT/attempt-draw0.json"
          test -f "$BANK_REMOTE_ROOT/bank/failures/stage-0001.json"
          test -f "$BANK_REMOTE_ROOT/bank/requests/stage-0001.json"
          test ! -e "$EVIDENCE_STAGE_ROOT/attempt-draw1.json"
          test ! -e "$BANK_REMOTE_ROOT/bank/stages/stage-0001.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_STAGE_ROOT'])/'attempt-draw0.json'
          x=json.loads(p.read_text())
          a=x['attempt']
          assert a['drawIndex']==0
          assert a['disposition']=='ACQUIRED'
          assert a['evidence']['generator']['status']=='SUCCESS'
          assert a['evidence']['canonicalHuman']['status']=='SOLVED'
          assert a['evidence']['CP12Replay']['status']=='VALID_PREFIX'
          attempt=x['attemptIdentity']
          metadata=a['evidence']['curriculumMetadataIdentity']
          assert len(attempt)==64 and len(metadata)==64
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SEALED_ATTEMPT_IDENTITY='+attempt+'\n')
              f.write('SEALED_METADATA_IDENTITY='+metadata+'\n')
          print('SEALED_STAGE_0001_RECOVERY_V2_GUARD=PASS')
          print('sealedAttemptIdentity='+attempt)
          print('sealedMetadataIdentity='+metadata)
          print('formalDrawsAlreadyConsumed=1')
          print('additionalFormalDrawsAuthorized=0')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile accepted engine plus bounded recovery projection
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Stage1RecoveryV2.java' >> "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java' >> "$SOURCES_FILE"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"

      - name: Restore durable bank
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$BANK_DIR" "$RECOVERED_OUTPUT"
          cp -a "$GITHUB_WORKSPACE/ProductionStore/$BANK_REMOTE_ROOT/bank" "$BANK_DIR"
          python3 tools/campaign-production-2000/campaign_production_2000.py status "$BANK_DIR" > /tmp/pre-recovery-v2-status.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pre-recovery-v2-status.json'))
          assert x['bankedCount']==0 and x['nextOrdinal']==1 and x['publishedCount']==0, x
          assert x['failedOrQuarantinedCount']==1, x
          print('PRE_RECOVERY_V2_BANK_GUARD=PASS')
          PY

      - name: Replay sealed draw for bounded materialization only
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_PRODUCER_AUTHORIZATION: START_2000_MAINLINE_PRODUCTION_V1
          EINSTEIN_PRODUCTION_SOURCE_HEAD: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
          EINSTEIN_PRODUCTION_PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
          EINSTEIN_STAGE_REQUEST: ${{ github.workspace }}/ProductionStore/production/campaign-2000-bank-v1/bank/requests/stage-0001.json
          EINSTEIN_ACQUIRED_OUTPUT: /tmp/einstein-stage-0001-recovered-acquired-v2.json
          EINSTEIN_SEALED_ATTEMPT_IDENTITY: ${{ env.SEALED_ATTEMPT_IDENTITY }}
          EINSTEIN_SEALED_METADATA_IDENTITY: ${{ env.SEALED_METADATA_IDENTITY }}
        run: |
          set -euo pipefail
          java -Xmx8g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Stage1RecoveryV2 \
            | tee /tmp/einstein-stage1-recovery-v2.log

      - name: Validate compact payload and promote ACQUIRED to BANKED
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test -f "$RECOVERED_OUTPUT"
          test "$(stat -c %s "$RECOVERED_OUTPUT")" -lt 10485760
          export RECOVERED_OUTPUT SEALED_ATTEMPT_IDENTITY SEALED_METADATA_IDENTITY
          python3 - <<'PY'
          import json, os
          x=json.load(open(os.environ['RECOVERED_OUTPUT']))
          assert x['state']=='ACQUIRED'
          assert x['stageId']=='stage-0001' and x['ordinal']==1
          assert x['publishedPuzzleId']=='PZ_CAMPAIGN_000001'
          assert len(x['contentFingerprint'])==64
          assert x['validationRefs']['sealedAttemptIdentity']==os.environ['SEALED_ATTEMPT_IDENTITY']
          assert x['validationRefs']['metadataIdentity']==os.environ['SEALED_METADATA_IDENTITY']
          assert x['validationRefs']['cp12ReplayStatus']=='VALID_PREFIX'
          assert x['validationRefs']['cp12MetadataProjectionReplayStatus']=='VALID_PREFIX'
          assert x['validationRefs']['materializationReplayAdditionalFormalDraws']==0
          assert x['sourceProvenance']['formalDrawsConsumedAdditional']==0
          assert x['sourceProvenance']['fullMetadataStored'] is False
          assert x['sourceProvenance']['boundedCp12ProjectionStored'] is True
          assert x['curriculumMetadataIdentity']==os.environ['SEALED_METADATA_IDENTITY']
          assert len(x['cp12MetadataProjectionIdentity'])==64
          assert x['runtimeEntry']['publishedPuzzleId']=='PZ_CAMPAIGN_000001'
          print('RECOVERED_ACQUIRED_V2_PAYLOAD=PASS')
          print('payloadBytes='+str(os.path.getsize(os.environ['RECOVERED_OUTPUT'])))
          PY
          python3 tools/campaign-production-2000/campaign_production_2000.py record-acquired "$BANK_DIR" "$RECOVERED_OUTPUT"
          python3 tools/campaign-production-2000/campaign_production_2000.py commit-acquired "$BANK_DIR" --ordinal 1 > /tmp/stage1-banked-v2.json
          rm -f "$BANK_DIR/failures/stage-0001.json"
          python3 tools/campaign-production-2000/campaign_production_2000.py status "$BANK_DIR" > /tmp/post-recovery-v2-status.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/post-recovery-v2-status.json'))
          assert x['bankedCount']==1 and x['publishedCount']==0 and x['nextOrdinal']==2, x
          assert x['failedOrQuarantinedCount']==0, x
          print('STAGE_0001_BANK_PROMOTION_V2=PASS')
          PY

      - name: Persist recovered BANKED stage and receipt
        shell: bash
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$EXPECTED_BANK_HEAD"
          TARGET="$STORE/$BANK_REMOTE_ROOT/bank"
          rm -rf "$TARGET"
          cp -a "$BANK_DIR" "$TARGET"
          export STORE RECOVERED_OUTPUT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          x=json.load(open(os.environ['RECOVERED_OUTPUT']))
          raw=Path(os.environ['RECOVERED_OUTPUT']).read_bytes()
          receipt={
            'recordType':'CampaignProduction2000Stage1RecoveryV2Receipt',
            'schemaVersion':'1.0.0',
            'stageId':'stage-0001',
            'status':'RECOVERED_AND_BANKED',
            'sealedAttemptIdentity':x['validationRefs']['sealedAttemptIdentity'],
            'sealedMetadataIdentity':x['validationRefs']['metadataIdentity'],
            'cp12MetadataProjectionIdentity':x['cp12MetadataProjectionIdentity'],
            'contentFingerprint':x['contentFingerprint'],
            'recoveredPayloadSha256':hashlib.sha256(raw).hexdigest(),
            'formalDrawsConsumedAdditional':0,
            'runnerSource':os.environ['RUNNER_SHA']
          }
          p=Path(os.environ['STORE'])/os.environ['EVIDENCE_STAGE_ROOT']/'recovery-v2-receipt.json'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          PY
          git -C "$STORE" config user.name 'Einstein Campaign Production'
          git -C "$STORE" config user.email 'noreply@localhost'
          git -C "$STORE" add -- "$BANK_REMOTE_ROOT/bank" "$EVIDENCE_STAGE_ROOT/recovery-v2-receipt.json"
          git -C "$STORE" commit -m 'production: recover and bank stage-0001 from sealed draw0'
          COMMIT="$(git -C "$STORE" rev-parse HEAD)"
          git -C "$STORE" push origin "HEAD:refs/heads/$BANK_BRANCH"
          test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$COMMIT"
          echo "BANKED_COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - name: Stage-0001 recovery terminal acceptance
        shell: bash
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          export STORE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STORE'])/os.environ['BANK_REMOTE_ROOT']/'bank'
          manifest=json.loads((root/'manifest.json').read_text())
          stage=json.loads((root/'stages/stage-0001.json').read_text())
          receipt=json.loads((Path(os.environ['STORE'])/os.environ['EVIDENCE_STAGE_ROOT']/'recovery-v2-receipt.json').read_text())
          assert manifest['bankedCount']==1
          assert manifest['publishedCount']==0
          assert manifest['failedOrQuarantinedCount']==0
          assert manifest['nextOrdinal']==2
          assert stage['state']=='BANKED' and stage['stageId']=='stage-0001' and stage['ordinal']==1
          assert stage['runtimeEntry']['publishedPuzzleId']=='PZ_CAMPAIGN_000001'
          assert len(stage['contentFingerprint'])==64
          assert receipt['status']=='RECOVERED_AND_BANKED'
          assert receipt['formalDrawsConsumedAdditional']==0
          assert not (root/'requests/stage-0002.json').exists()
          print('EINSTEIN_CAMPAIGN_PRODUCTION_STAGE_0001_RECOVERY_V2_TERMINAL=PASS')
          print('bankedCount=1')
          print('publishedCount=0')
          print('nextOrdinal=2')
          print('additionalFormalDraws=0')
          print('bankCommit='+os.environ['BANKED_COMMIT'])
          PY
          test ! -e "$STORE/$EVIDENCE_STAGE_ROOT/attempt-draw1.json"
          test "$(git -C "$STORE" status --porcelain --untracked-files=all)" = ''
          test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$BANKED_COMMIT"
