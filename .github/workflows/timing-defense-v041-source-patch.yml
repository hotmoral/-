name: Timing Defense v0.41 One-shot FLYER Source Patch

on:
  push:
    branches:
      - timing-defense-cloudflare-v041-flyer-y
    paths:
      - '.github/workflows/timing-defense-v041-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-cloudflare-v041-flyer-y
      - name: Patch Lv6/N3 geometry to consume authoritative yAt and FLYER size
        run: |
          python - <<'PY'
          from pathlib import Path
          edits={
            'timing-defense-cloudflare-poc/src/v036-entry.js':[
              ("  shield:{ knockResist: .62, size: 1.08 }\n", "  shield:{ knockResist: .62, size: 1.08 },\n  flyer: { knockResist: .90, size: .78 }\n"),
              ("  return {id:monster.id,type:monster.type,x:room.xAt(monster,at),y:monster.y,size:d.size||1};\n", "  const y=typeof room.yAt==='function'?room.yAt(monster,at):monster.y;\n  return {id:monster.id,type:monster.type,x:room.xAt(monster,at),y,size:d.size||1};\n")
            ],
            'timing-defense-cloudflare-poc/src/v039-entry.js':[
              ("  shield:{knockResist:.62,size:1.08}\n", "  shield:{knockResist:.62,size:1.08},\n  flyer:{knockResist:.90,size:.78}\n"),
              ("  if(!monster)return null;const d=TYPE_META[monster.type]||TYPE_META.grunt;\n  return{id:monster.id,type:monster.type,x:room.xAt(monster,at),y:monster.y,size:d.size||1,boss:!!monster.boss};\n", "  if(!monster)return null;const d=TYPE_META[monster.type]||TYPE_META.grunt;\n  const y=typeof room.yAt==='function'?room.yAt(monster,at):monster.y;\n  return{id:monster.id,type:monster.type,x:room.xAt(monster,at),y,size:d.size||1,boss:!!monster.boss};\n")
            ]
          }
          for name,repls in edits.items():
            p=Path(name); s=p.read_text()
            for old,new in repls:
              n=s.count(old)
              if n!=1: raise SystemExit(f'{name}: expected exactly one match, got {n}: {old!r}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timing-defense-cloudflare-poc/src/v036-entry.js timing-defense-cloudflare-poc/src/v039-entry.js
          git diff --cached --check
          git commit -m "Use authoritative FLYER Y in Lv6 and N3 geometry"
          git push origin HEAD:timing-defense-cloudflare-v041-flyer-y
