name: Einstein Phase2 Stage125 Formal Gate Compile V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-phase2-stage125-formal-gate-compile-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ddb5f13435de48bdbb3f6b21674429a3e22385a7
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ddb5f13435de48bdbb3f6b21674429a3e22385a7
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and verify formal gate wiring
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/EinsteinGame"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2FormalProducerV1.java')
          s=p.read_text()
          assert 'IntentAcquisitionContinuationCoordinator.PostCp12CandidateGate phase2Gate=' in s
          assert 'f.prepared.request,f.context,f.resume,sink,phase2Gate' in s
          assert 'CampaignProduction2000Phase2WaveEnvelopeValidatorV1.validateCandidate(' in s
          print('FORMAL_POST_CP12_GATE_SOURCE_WIRING=PASS')
          PY

          CLASSES=/tmp/einstein-formal-gate-classes
          SOURCES=/tmp/einstein-formal-gate-sources.txt
          rm -rf "$CLASSES" "$SOURCES"
          mkdir -p "$CLASSES"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2ProducerV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2FormalProducerV1.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo FORMAL_POST_CP12_GATE_COMPILE=PASS
