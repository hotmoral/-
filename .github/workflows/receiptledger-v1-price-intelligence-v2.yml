name: ReceiptLedger V1 Price Intelligence V2

on:
  push:
    branches:
      - receiptledger/run-v1-price-intelligence-v2-20261016
    paths:
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/priceintel/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/priceintel/**'
      - '.github/workflows/receiptledger-v1-price-intelligence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-price-intelligence-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-price-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP27 scope and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=b5a20233fbe9d64d45e00c46adafadfbe6925f6e
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp27-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-price-intelligence-v2.yml) ;;
              receiptledger/CP27_PRICE_INTELLIGENCE_V2_PLAN.md) ;;
              receiptledger/PRICE_INTELLIGENCE_V2_CONSISTENCY_REVIEW.md) ;;
              receiptledger/PRICE_INTELLIGENCE_V2_GOLDEN_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/priceintel/*) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/priceintel/*) ;;
              '') ;;
              *) echo "CP27 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp27-changed-files.txt
          for frozen in catalog product semantics identity category commodity persistence price; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/$frozen" || { echo "Frozen upstream package changed: $frozen"; exit 32; }
          done
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || { echo 'Manifest changed'; exit 33; }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 26' "$APP/build.gradle"
          grep -Fq "versionName '1.0.25-price-intelligence-v2'" "$APP/build.gradle"

      - name: Test lint and build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.price.PriceHistoryServiceTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then
              echo "Expected test result missing: $TEST_XML"
              status=42
            fi
          done
          exit "$status"

      - name: Extract and verify CP27 price metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp27-price-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml'
          root=ET.parse(path).getroot()
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP27_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected exactly one CP27_METRICS line, got %d' % len(lines))
          line=lines[0]
          v={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)',line)}
          expected={
            'observations':10,
            'eligible':7,
            'excluded_discount':1,
            'excluded_invalid':1,
            'missing_form':1,
            'standard_cohorts':1,
            'commodity_strict_cohorts':1,
            'commodity_contextual_cohorts':1,
            'scope_checks':2,
            'receipt_traceable_rates':7,
          }
          missing=[k for k in expected if k not in v]
          if missing: raise SystemExit('Missing metrics: '+','.join(missing))
          for k,val in expected.items():
            if v[k] != val: raise SystemExit('%s expected %d got %d' % (k,val,v[k]))
          print(line)
          PY

      - name: Package and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=b5a20233fbe9d64d45e00c46adafadfbe6925f6e
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-price-intelligence-v2
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-price-intelligence-v2-debug.apk"
          cp receiptledger/cp27-price-metrics.txt "$OUT/CP27_PRICE_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml" "$OUT/PRICE_INTELLIGENCE_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.price.PriceHistoryServiceTest.xml" "$OUT/LEGACY_PRICE_HISTORY_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml" "$OUT/COMMODITY_NONSTANDARD_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml" "$OUT/CATEGORY_SYSTEM_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml" "$OUT/IDENTITY_RESOLVER_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml" "$OUT/RECEIPT_PRODUCT_SEMANTICS_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml" "$OUT/CATALOG_DOMAIN_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml" "$OUT/PERSISTENCE_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-price-intelligence-v2-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 51; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP27_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-price-intelligence-v2-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_PRICE_INTELLIGENCE_V2_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'legacy_price_core=UNCHANGED'
            echo 'comparison_price=RECEIPT_TRACEABLE_RATIO'
            echo 'multi_item_unallocated_discount=EXCLUDED_FROM_AGGREGATES'
            echo 'sole_item_discount=EXACT_ATTRIBUTION_ALLOWED'
            echo 'standard_basis=EXACT_STABLE_PACKAGE'
            echo 'commodity_strict_basis=KG_L_EACH'
            echo 'commodity_like_form=CONTEXTUAL_ONLY'
            echo 'price_judgment=DEFERRED_CP28'
            echo 'price_truth=RECEIPT_DERIVED'
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.25-price-intelligence-v2'
            echo 'version_code=26'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP27_PRICE_METRICS.txt "$OUT"/PRICE_INTELLIGENCE_V2_TEST.xml "$OUT"/CP27_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-price-intelligence-v2-${{ github.run_id }}
          path: receiptledger/output/v1-price-intelligence-v2/
          if-no-files-found: error
          retention-days: 14
