name: Einstein Phase2 Stage125 Sparse L2 Replay ReadOnly V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-phase2-stage125-sparse-l2-replay-readonly-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: b9da191fda38c8875053f5761e16e4c51bf86dc3
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b9da191fda38c8875053f5761e16e4c51bf86dc3
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and run sparse-L2 draw0 replay
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/EinsteinGame"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          CLASSES=/tmp/einstein-stage125-sparse-l2-classes
          SOURCES=/tmp/einstein-stage125-sparse-l2-sources.txt
          rm -rf "$CLASSES" "$SOURCES"
          mkdir -p "$CLASSES"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2Stage125SparseL2ScorerV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2Stage125SparseL2ReplayReadOnlyV1.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo STAGE125_SPARSE_L2_COMPILE=PASS
          export EINSTEIN_PHASE2_STAGE125_SPARSE_L2_READONLY=true
          java -Xmx4g -cp "$CLASSES" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Phase2Stage125SparseL2ReplayReadOnlyV1 | tee /tmp/stage125-sparse-l2.log
          grep -F 'STAGE125_SPARSE_L2_REPLAY_READONLY=PASS' /tmp/stage125-sparse-l2.log
