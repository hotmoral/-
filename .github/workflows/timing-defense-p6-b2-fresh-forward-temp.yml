name: Timing Defense P6-B2 Fresh Forward Temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-p6-b2-fresh-forward

permissions:
  contents: read

jobs:
  fresh-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Syntax check
        run: python -m py_compile timing-defense-workspace/tools/run_p6_b2_fresh_forward_progression_temp_v0_1.py

      - name: Run fresh-forward twice
        run: |
          python timing-defense-workspace/tools/run_p6_b2_fresh_forward_progression_temp_v0_1.py --seeds 20 --output /tmp/fresh_forward_a.json
          python timing-defense-workspace/tools/run_p6_b2_fresh_forward_progression_temp_v0_1.py --seeds 20 --output /tmp/fresh_forward_b.json
          cmp /tmp/fresh_forward_a.json /tmp/fresh_forward_b.json
          sha256sum /tmp/fresh_forward_a.json
          cp /tmp/fresh_forward_a.json fresh_forward_result.json

      - name: Print bounded validation summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('fresh_forward_result.json',encoding='utf-8'))
          c=x['checks']
          print('classification=',x['classification'])
          print('survivalClaim=',x['authority']['survivalClaim'])
          print('invariantFailures=',len(c['invariantFailures']))
          print('earlyLv6DirectionalPass=',c['earlyLv6DirectionalPass'])
          for r in c['earlyLv6Directional']:
              print('EARLY',r['class'],r['deltaPct'],r['expected'],r['pass'])
          print('isolatedSameStageAtkAggregatePass=',c['isolatedSameStageAtkAggregatePass'])
          print('isolatedSameStageAtkPairViolationCount=',c['isolatedSameStageAtkPairViolationCount'])
          print('cumulativePathStageRootActionIncreaseCount=',c['cumulativePathStageRootActionIncreaseCount'])
          print('--- LV31 SUMMARY ---')
          for r in x['summary']:
              print(r['fixture'],r['class'],'ATK_ON' if r['shopOn'] else 'ATK_OFF','reach',r['lv31ReachCount'],'meanStage',r['lv31ReachStageMean'],'range',r['lv31ReachStageMin'],r['lv31ReachStageMax'],'roots',r['rootActionsMean'])
          if c['invariantFailures']:
              raise SystemExit('invariant failure')
          if not c['earlyLv6DirectionalPass']:
              raise SystemExit('early Lv6 directional fidelity failure')
          if not c['isolatedSameStageAtkAggregatePass']:
              raise SystemExit('isolated same-stage ATK direction failure')
          PY

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-b2-fresh-forward-result
          path: fresh_forward_result.json
          if-no-files-found: warn
