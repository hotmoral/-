name: ReceiptLedger V1 Public Foundation

on:
  push:
    branches:
      - 'receiptledger/run-v1-foundation-20261015'
    paths:
      - 'receiptledger/**'
      - '.github/workflows/receiptledger-v1-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public work unit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-}"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Set up isolated Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Audit public material and namespace isolation
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Run foundation tests and build debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p receiptledger/harness/android-v1 \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Package deterministic build evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-foundation
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-foundation-debug.apk"
          unzip -t "$OUT/receiptledger-v1-foundation-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          sha256sum "$OUT/receiptledger-v1-foundation-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo "project=ReceiptLedger"
            echo "foundation=RL_V1_FOUNDATION_01"
            echo "public_commit=${GITHUB_SHA}"
            echo "application_id=com.receiptledger.v1"
            echo "version_name=1.0.0-foundation"
            echo "version_code=1"
            echo "compile_sdk=35"
            echo "target_sdk=35"
            echo "min_sdk=23"
            echo "signing=debug_only"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "gradle=$(gradle --version | awk '/^Gradle /{print $2; exit}')"
          } > "$OUT/BUILD_IDENTITY.txt"
          (
            cd "$SRC"
            find . -type f \
              -not -path './app/build/*' \
              -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt > "$OUT/EVIDENCE_SHA256.txt"
          cat "$OUT/APK_SHA256.txt"

      - name: Upload ReceiptLedger foundation artifact
        uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-foundation-debug-${{ github.run_id }}
          path: receiptledger/output/v1-foundation/
          if-no-files-found: error
          retention-days: 14
