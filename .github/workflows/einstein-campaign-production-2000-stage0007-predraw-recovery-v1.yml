name: Einstein Campaign 2000 Stage0007 PreDraw Recovery V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-stage0007-predraw-recovery-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.head_commit.message == 'production: recover Einstein stage-0007 pre-draw failure v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_SHA: c4b591918072a09eb62c9f80f85a5df6b924c785
      BANK_SHA: 09937df18df3591657951d0864bc310195227057
      BANK_BRANCH: campaign-production-2000-bank-v1
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact repaired runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: c4b591918072a09eb62c9f80f85a5df6b924c785
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact durable Bank branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact zero-draw pre-draw failure boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ProductionStore rev-parse HEAD)" = "$BANK_SHA"
          test "$(git -C EinsteinGame rev-parse HEAD)" = "$RUNNER_SHA"
          grep -F 'EXPECTED_SOURCE="9d981bc9048bc024c59ee6ede3ae04abe4c833d8"' EinsteinGame/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000N5DirectProducerV1.java >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('ProductionStore/production/campaign-2000-bank-v1/bank')
          m=json.loads((root/'manifest.json').read_text())
          assert m['bankedCount']==6, m
          assert m['nextOrdinal']==7, m
          assert m['failedOrQuarantinedCount']==1, m
          assert m['acquiredPending']==[], m
          assert m['bankPrefixHash']=='5b27c4f6bd394154c19273d1dd6a3edea2c97d6c67777f70de5a4143b45dcfd5', m
          f=json.loads((root/'failures/stage-0007.json').read_text())
          assert f=={'detail':{},'ordinal':7,'reason':'exit=1','schemaVersion':'campaign-production-2000-v1','stageId':'stage-0007','status':'PRODUCER_FAILED'}, f
          assert (root/'requests/stage-0007.json').is_file()
          assert not (root/'acquired/stage-0007.json').exists()
          assert not (root/'stages/stage-0007.json').exists()
          ev=Path('ProductionStore/production/campaign-2000-bank-v1/evidence/stage-0007')
          assert not ev.exists() or not any(ev.glob('attempt-draw*.json'))
          assert not ev.exists() or not (ev/'acquired-result.json').exists()
          print('STAGE0007_PREDRAW_ZERO_DRAW_GUARD=PASS')
          PY

      - name: Remove only pre-draw failure and rebuild canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          rm ProductionStore/production/campaign-2000-bank-v1/bank/failures/stage-0007.json
          python3 EinsteinGame/tools/campaign-production-2000/campaign_production_2000.py status ProductionStore/production/campaign-2000-bank-v1/bank > /tmp/recovered-manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/recovered-manifest.json'))
          assert m['bankedCount']==6, m
          assert m['nextOrdinal']==7, m
          assert m['failedOrQuarantinedCount']==0, m
          assert m['acquiredPending']==[], m
          assert m['bankPrefixHash']=='5b27c4f6bd394154c19273d1dd6a3edea2c97d6c67777f70de5a4143b45dcfd5', m
          print('STAGE0007_PREDRAW_RECOVERY_MANIFEST=PASS')
          PY
          mapfile -t changed < <(git -C ProductionStore diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'production/campaign-2000-bank-v1/bank/failures/stage-0007.json'
          test "${changed[1]}" = 'production/campaign-2000-bank-v1/bank/manifest.json'

      - name: Commit and push zero-draw recovery
        shell: bash
        run: |
          set -euo pipefail
          git -C ProductionStore config user.name 'Einstein Campaign Production'
          git -C ProductionStore config user.email 'noreply@localhost'
          git -C ProductionStore add -A production/campaign-2000-bank-v1/bank/failures/stage-0007.json production/campaign-2000-bank-v1/bank/manifest.json
          git -C ProductionStore commit -m 'production: recover stage-0007 pre-draw source-pin failure'
          NEW_BANK_SHA="$(git -C ProductionStore rev-parse HEAD)"
          git -C ProductionStore push origin "HEAD:refs/heads/$BANK_BRANCH"
          echo "NEW_BANK_SHA=$NEW_BANK_SHA"
          echo 'FORMAL_DRAWS_CONSUMED_ADDITIONAL=0'
          echo 'STAGE0007_PREDRAW_RECOVERY=PASS'
