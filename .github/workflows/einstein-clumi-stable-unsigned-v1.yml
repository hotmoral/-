name: Clumi Stable Unsigned V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stable-unsigned-v1.yml'

permissions:
  contents: read

jobs:
  build-stable-unsigned-v1:
    if: >-
      github.event.head_commit.message == 'build: Clumi Stable unsigned v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      SOURCE_SHA: 6569598f37a794b7fb7837fbca0da4aaf205c7df
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BUILD_TOOLS: '34.0.0'

    steps:
      - name: Require private source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private UI source branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact Stable v1 source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Prepare Stable v1 identity without signing material
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          text=p.read_text()
          assert text.count("applicationId 'com.example.einsteingame'")==1
          assert text.count('versionCode 13')==1
          assert text.count("versionName '0.2.7.1'")==1
          text=text.replace("applicationId 'com.example.einsteingame'","applicationId 'com.hotmoral.clumi'",1)
          text=text.replace('versionCode 13','versionCode 1',1)
          text=text.replace("versionName '0.2.7.1'","versionName '1.0.0'",1)
          p.write_text(text)
          PY
          git diff --check

      - name: Build unsigned Stable v1 release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain \
              :app:assembleRelease -x :app:lintVitalRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and verify unsigned Stable identity
        shell: bash
        run: |
          set -euo pipefail
          INPUT=source/app/build/outputs/apk/release/app-release-unsigned.apk
          OUTPUT=Clumi-Stable-v1-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "$OUTPUT"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$OUTPUT"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$OUTPUT" | tee stable-badging.txt
          grep -F "package: name='com.hotmoral.clumi' versionCode='1' versionName='1.0.0'" stable-badging.txt
          sha256sum "$OUTPUT" | tee Clumi-Stable-v1-aligned-unsigned.apk.sha256

      - name: Stage local signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
          test -s signing-tools/apksigner
          test -s signing-tools/lib/apksigner.jar

      - name: Upload unsigned Stable v1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Stable-v1-unsigned
          path: |
            Clumi-Stable-v1-aligned-unsigned.apk
            Clumi-Stable-v1-aligned-unsigned.apk.sha256
            stable-badging.txt
            signing-tools
          retention-days: 3
          if-no-files-found: error
