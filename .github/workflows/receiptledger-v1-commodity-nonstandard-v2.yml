name: ReceiptLedger V1 Commodity Non-standard V2

on:
  push:
    branches:
      - receiptledger/run-v1-commodity-nonstandard-v2-20261016
    paths:
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/commodity/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/commodity/**'
      - '.github/workflows/receiptledger-v1-commodity-nonstandard-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-commodity-nonstandard-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-commodity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP26 scope and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=e9bbd3d1b2b5c6e153d6c76b1c02b2a1cd217389
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp26-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-commodity-nonstandard-v2.yml) ;;
              receiptledger/CP26_COMMODITY_NONSTANDARD_V2_PLAN.md) ;;
              receiptledger/COMMODITY_NONSTANDARD_V2_CONSISTENCY_REVIEW.md) ;;
              receiptledger/COMMODITY_NONSTANDARD_V2_GOLDEN_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/commodity/*) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/commodity/*) ;;
              '') ;;
              *) echo "CP26 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp26-changed-files.txt
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/catalog" || { echo 'Frozen catalog domain changed'; exit 32; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/product" || { echo 'Frozen product persistence/runtime changed'; exit 33; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/semantics" || { echo 'Frozen CP23 semantics changed'; exit 34; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/identity" || { echo 'Frozen CP24 identity resolver changed'; exit 35; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/category" || { echo 'Frozen CP25 category changed'; exit 36; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/persistence" || { echo 'Receipt persistence changed'; exit 37; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || { echo 'Manifest changed'; exit 38; }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 25' "$APP/build.gradle"
          grep -Fq "versionName '1.0.24-commodity-nonstandard-v2'" "$APP/build.gradle"

      - name: Test lint and build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then
              echo "Expected test result missing: $TEST_XML"
              status=42
            fi
          done
          exit "$status"

      - name: Extract and verify CP26 commodity metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp26-commodity-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml'
          root=ET.parse(path).getroot()
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP26_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected exactly one CP26_METRICS line, got %d' % len(lines))
          line=lines[0]
          v={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)',line)}
          required=['fixtures','known_commodity','auto_groups','correct_auto_groups','incorrect_auto_groups','false_group','review_suggestions','false_split','negative_fixtures','raw_form_cases','raw_form_preserved','repeat_cases','repeat_reused']
          missing=[k for k in required if k not in v]
          if missing: raise SystemExit('Missing metrics: '+','.join(missing))
          if v['incorrect_auto_groups'] != 0: raise SystemExit('Incorrect automatic commodity group')
          if v['false_group'] != 0: raise SystemExit('False commodity grouping detected')
          if v['correct_auto_groups'] != v['auto_groups']: raise SystemExit('Auto-group correctness mismatch')
          if v['raw_form_cases'] < 1 or v['raw_form_preserved'] != v['raw_form_cases']: raise SystemExit('Raw form preservation failed')
          if v['repeat_cases'] < 1 or v['repeat_reused'] != v['repeat_cases']: raise SystemExit('Confirmed repeat reuse failed')
          if v['review_suggestions'] < 1: raise SystemExit('No conservative review suggestion coverage')
          if v['false_split'] > 1: raise SystemExit('Fragmentation risk above bounded golden contract')
          print(line)
          PY

      - name: Package and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=e9bbd3d1b2b5c6e153d6c76b1c02b2a1cd217389
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-commodity-nonstandard-v2
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-commodity-nonstandard-v2-debug.apk"
          cp receiptledger/cp26-commodity-metrics.txt "$OUT/CP26_COMMODITY_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml" "$OUT/COMMODITY_NONSTANDARD_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml" "$OUT/CATEGORY_SYSTEM_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml" "$OUT/IDENTITY_RESOLVER_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml" "$OUT/RECEIPT_PRODUCT_SEMANTICS_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml" "$OUT/CATALOG_DOMAIN_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml" "$OUT/PERSISTENCE_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-commodity-nonstandard-v2-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 51; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP26_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-commodity-nonstandard-v2-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_COMMODITY_NONSTANDARD_V2_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'commodity_identity=EXISTING_STABLE_ID_ONLY'
            echo 'grouping_equals_comparability=FALSE'
            echo 'guessed_unit_conversion=FORBIDDEN'
            echo 'category_identity_authority=FORBIDDEN'
            echo 'price_truth=RECEIPT_DERIVED'
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.24-commodity-nonstandard-v2'
            echo 'version_code=25'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP26_COMMODITY_METRICS.txt "$OUT"/COMMODITY_NONSTANDARD_V2_TEST.xml "$OUT"/CP26_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-commodity-nonstandard-v2-${{ github.run_id }}
          path: receiptledger/output/v1-commodity-nonstandard-v2/
          if-no-files-found: error
          retention-days: 14
