name: Linkline A3 Target-Pair Selection Plan v3

on:
  push:
    branches:
      - linkline/a3-target-pair-diversity-v1
    paths:
      - linkline/tools/a3_target_pair_selection_plan_v3.py
      - .github/workflows/linkline-a3-target-pair-selection-plan-v3.yml

permissions:
  contents: write

concurrency:
  group: linkline-a3-target-pair-selection-plan-v3
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify approved source closure
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          test -s linkline/a3-target-pair-diversity-v1/EXPOSURE_APPROVAL.md
          test -s linkline/public_output/a3_final_candidate_pool_v2/candidate_pool.json
          test -s linkline/public_output/a3_target_pair_n5_expansion_v1/candidate_pool.json
          test -s linkline/public_output/a3_target_pair_acquisition_v1/candidate_pool.json
          test "$(git hash-object linkline/reference/m2_state_model.py)" = "c2bf85974d317eb18a8b02a1ac4ee7eb244fcb77"
          test "$(git hash-object linkline/reference/m3_solver.py)" = "16b170656bbdffa8e836a891ffbf221de6c2935f"
          test "$(git hash-object linkline/analysis/a3_structural_features.py)" = "35a6b997816ee3608d4d8064febd059159030796"
          test "$(git hash-object linkline/tools/a3_final_candidate_pool_public.py)" = "86635edf7266f2f2524ed031467cf4e3045c69c9"
          test "$(git hash-object linkline/tools/a3_final_candidate_pool_reuse_v2.py)" = "ed5d25f09a0ede74cfd02323137da56c3fefcc5d"

      - name: Syntax check
        shell: bash
        working-directory: repo/linkline
        run: |
          set -euo pipefail
          python --version
          python -m py_compile \
            tools/a3_target_pair_selection_plan_v1.py \
            tools/a3_target_pair_selection_plan_v3.py

      - name: Build public-safe 1,300-ID oriented selection plan v3
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          rm -rf public_output/a3_target_pair_selection_plan_v3
          python tools/a3_target_pair_selection_plan_v3.py \
            --legacy-pool public_output/a3_final_candidate_pool_v2/candidate_pool.json \
            --n5-pool public_output/a3_target_pair_n5_expansion_v1/candidate_pool.json \
            --n6-pool public_output/a3_target_pair_acquisition_v1/candidate_pool.json \
            --output-dir public_output/a3_target_pair_selection_plan_v3
          test -s public_output/a3_target_pair_selection_plan_v3/selection_plan.json
          test -s public_output/a3_target_pair_selection_plan_v3/summary.json
          cat public_output/a3_target_pair_selection_plan_v3/summary.json
          sha256sum public_output/a3_target_pair_selection_plan_v3/*.json

      - name: Commit public-safe oriented selection plan v3
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/public_output/a3_target_pair_selection_plan_v3
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Linkline A3: materialize oriented 1300 target-pair selection plan v3"
          git push origin HEAD:linkline/a3-target-pair-diversity-v1
