name: Mobi Samsung E6 Mobile Package

on:
  workflow_dispatch:

concurrency:
  group: mobi-samsung-e6-mobile-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mobile-e6-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Ensure Android API 35 build platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build synthetic E6 APKs
        run: |
          gradle --no-daemon -p mobi/harness :overlayprobe:assembleDebug :hostprobe:assembleDebug

      - name: Assemble mobile-only E6 package
        shell: bash
        run: |
          set -euo pipefail
          out=mobi/output/samsung-e6-mobile-package
          rm -rf "$out"
          mkdir -p "$out/apks"
          cp mobi/harness/overlayprobe/build/outputs/apk/debug/overlayprobe-debug.apk "$out/apks/overlayprobe-debug.apk"
          cp mobi/harness/hostprobe/build/outputs/apk/debug/hostprobe-debug.apk "$out/apks/hostprobe-debug.apk"
          cp mobi/tools/run_samsung_e6.sh "$out/run_samsung_e6.sh"
          cp mobi/e6-mobile-package/setup_termux.sh "$out/setup_termux.sh"
          cp mobi/e6-mobile-package/pair_connect.sh "$out/pair_connect.sh"
          cp mobi/e6-mobile-package/run.sh "$out/run.sh"
          cp mobi/e6-mobile-package/README_KO.md "$out/README_KO.md"
          chmod +x "$out/setup_termux.sh" "$out/pair_connect.sh" "$out/run.sh" "$out/run_samsung_e6.sh"
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(gradle --version | awk '/^Gradle / {print $2; exit}')"
            echo "package_mode=termux_wireless_adb_same_device"
          } > "$out/BUILD_IDENTITY.txt"
          (
            cd "$out"
            sha256sum \
              apks/overlayprobe-debug.apk \
              apks/hostprobe-debug.apk \
              setup_termux.sh \
              pair_connect.sh \
              run.sh \
              run_samsung_e6.sh \
              README_KO.md \
              BUILD_IDENTITY.txt \
              > PACKAGE_SHA256.txt
            bash -n setup_termux.sh
            bash -n pair_connect.sh
            bash -n run.sh
            bash -n run_samsung_e6.sh
          )

      - name: Upload mobile Samsung E6 package
        uses: actions/upload-artifact@v4
        with:
          name: mobi-artifact-t0-samsung-e6-mobile-${{ github.run_id }}
          path: mobi/output/samsung-e6-mobile-package
          if-no-files-found: error
