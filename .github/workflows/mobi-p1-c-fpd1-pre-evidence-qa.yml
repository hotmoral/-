name: Mobi P1-C FPD1 Pre-Evidence QA

on:
  push:
    branches:
      - mobi/run-p1-c-fpd1-implementation-20261017
    paths:
      - 'mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py'
      - 'mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py'
      - '.github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: mobi-p1-c-fpd1-pre-evidence-qa
  cancel-in-progress: false

jobs:
  fpd1-pre-evidence-qa:
    if: github.ref == 'refs/heads/mobi/run-p1-c-fpd1-implementation-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch and inherited frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/mobi/run-p1-c-fpd1-implementation-20261017'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py)" = 'd13d191499b6d734845051ba428323fdcf37dabd'
          test "$(sha256sum mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py | awk '{print $1}')" = '2ed9eac016c32a29a855eb26e0006c6e299a9b25d4a843b6cb4f398e6c356450'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)" = '837f4abe7ff474a527893b099be8087a104f7aaa'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r10_morphology_reduction_v1.py)" = 'f281aad3e3a6c740c38c0a3f015718996dc45157'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_d_projection_v1.py)" = '5c8820fb7270e7727ececb1bb37d3a24331b24ab'
          test "$(git hash-object mobi/p1-b2/geometry/test_p1_c_dar1_diagnostic_axis_revision_v1.py)" = 'ff49605ea62ac1c346cb9469c038d73da665976c'

      - name: Assemble and verify exact frozen R11 implementation
        shell: bash
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          ./assemble_p1_c_r11_semantic_scaffold_v1.sh
          echo 'af2d8ccafb1878ad96cf6fae60167ae2a33f82480aa76710ce97c8fd95a6ad87  p1_c_r11_semantic_scaffold_v1.py' | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip

      - name: Install frozen inherited runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.4' \
            'fast-simplification==0.2.0' \
            'trimesh==4.11.1' \
            'scikit-image==0.26.0' \
            'scipy==1.17.0'
          python - <<'PY'
          import sys, numpy, fast_simplification, trimesh, skimage, scipy
          expected={'numpy':'2.5.4','fast_simplification':'0.2.0','trimesh':'4.11.1','skimage':'0.26.0','scipy':'1.17.0'}
          actual={'numpy':numpy.__version__,'fast_simplification':fast_simplification.__version__,'trimesh':trimesh.__version__,'skimage':skimage.__version__,'scipy':scipy.__version__}
          if sys.version_info[:3] != (3,12,15): raise SystemExit(sys.version)
          if actual != expected: raise SystemExit(f'dependency drift: {actual}')
          print(sys.version)
          print(actual)
          PY

      - name: Static compile and enforce pre-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          python -m py_compile "$G/p1_c_fpd1_finite_pose_discriminator_v1.py" "$G/test_p1_c_fpd1_finite_pose_discriminator_v1.py"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml')
          text=p.read_text()
          forbidden='--evaluate'+'-pose'
          # The token may appear only inside this guard's Python source construction, never as a literal workflow command.
          if forbidden in text:
              raise SystemExit('pre-evidence workflow contains forbidden actual finite-pose invocation')
          src=Path('mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py').read_text()
          required=['FPD1_FOREQUARTER_PIVOT_NECK_HEAD_YAW_LEFT_8DEG','NECK_BASE_CTRL','HEAD_CTRL','def run_finite_pose_evidence','actualFinitePoseEvidenceExecuted']
          missing=[x for x in required if x not in src]
          if missing: raise SystemExit(f'missing frozen FPD1 implementation vocabulary: {missing}')
          print('FPD1 pre-evidence execution boundary PASS')
          PY

      - name: Run inherited and FPD1 synthetic contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd mobi/p1-b2/geometry
          python -m unittest -v test_p1_c_r11_semantic_scaffold_v1.py
          python -m unittest -v test_p1_c_r12_surface_terminal_bind_alias_v1.py
          python -m unittest -v test_p1_c_dar1_diagnostic_axis_revision_v1.py
          python -m unittest -v test_p1_c_fpd1_finite_pose_discriminator_v1.py

      - name: Acquire exact frozen standing-cat source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c-fpd1/qa/source
          E=mobi/p1-c-fpd1/qa/source
          UA='Mobi FPD1 bounded pre-evidence QA/1.0'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -A "$UA" \
            'https://www.innerscene.com/api/library/standing-cat-cda42538/download' \
            -o "$E/cat-original.glb"
          echo '6870facdd3c7784581382af0ede14e5d6fc8f2092ac9ff15cda1f8c3feb315e5  mobi/p1-c-fpd1/qa/source/cat-original.glb' | sha256sum -c -

      - name: Re-run frozen DAR1 neutral Stage-1 regression
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-fpd1/qa/source/cat-original.glb
          E=mobi/p1-c-fpd1/qa/neutral_stage1_regression
          mkdir -p "$E"
          PYTHONHASHSEED=1 python "$G/p1_c_dar1_diagnostic_axis_revision_v1.py" "$SRC" --geometry-dir "$G" --stage1 --out "$E"
          test -s "$E/summary.json" || test -s "$E/stage1_summary.json" || { echo 'neutral Stage-1 summary missing'; find "$E" -maxdepth 1 -type f -print; exit 1; }

      - name: Run real-scaffold FPD1 pre-evidence isolation audit under both seeds
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-fpd1/qa/source/cat-original.glb
          E=mobi/p1-c-fpd1/qa
          mkdir -p "$E/seed1" "$E/seed777"
          PYTHONHASHSEED=1 python "$G/p1_c_fpd1_finite_pose_discriminator_v1.py" "$SRC" --geometry-dir "$G" --pre-evidence-audit --out "$E/seed1/pre_evidence_audit.json"
          PYTHONHASHSEED=777 python "$G/p1_c_fpd1_finite_pose_discriminator_v1.py" "$SRC" --geometry-dir "$G" --pre-evidence-audit --out "$E/seed777/pre_evidence_audit.json"
          diff -u "$E/seed1/pre_evidence_audit.json" "$E/seed777/pre_evidence_audit.json" > "$E/deterministic_diff.txt"
          test ! -s "$E/deterministic_diff.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('mobi/p1-c-fpd1/qa/seed1/pre_evidence_audit.json').read_text())
          assert x['version']=='P1_C_FPD1_FINITE_POSE_DISCRIMINATOR_V1'
          assert x['decisionToken']=='P1_C_SMALL_FINITE_POSE_NECK_YAW_SELECTED'
          assert x['contractToken']=='P1_C_SMALL_FINITE_POSE_NECK_YAW_CONTRACT_FROZEN'
          assert x['preflightToken']=='P1_C_SMALL_FINITE_POSE_NECK_YAW_PREFLIGHT_PASS'
          p=x['pose']
          assert p['poseId']=='FPD1_FOREQUARTER_PIVOT_NECK_HEAD_YAW_LEFT_8DEG'
          assert p['pivotRole']=='FOREQUARTER_CTRL'
          assert p['axisR10']==[0.0,1.0,0.0]
          assert p['angleDeg']==8.0
          assert p['selectedRoles']==['NECK_BASE_CTRL','HEAD_CTRL']
          assert p['identityRoleCount']==28
          assert x['identity']['vertexCount']==3125 and x['identity']['faceCount']==6246
          assert x['identity']['meshArraySha256']=='839968886420707267d0e546c080f1af62c262391bf5e7a13babdbec1be32d77'
          assert x['controlCount']==30
          assert x['weightSha256']=='171653287d416ce2fdb30db3e51356b241f0507614de8316ec0ed4ec0588b12c'
          s=x['supportIsolation']
          assert s['positiveSupportUnionCount']==626
          assert s['positiveSupportDomainCounts']=={'CORE':612,'FORE_L':10,'FORE_R':4,'HIND_L':0,'HIND_R':0,'TAIL':0}
          assert s['noSelectedSupportInHindOrTail'] is True
          expected={'FORE_L_PAW_CTRL':1338,'FORE_R_PAW_CTRL':146,'HIND_L_PAW_CTRL':2277,'HIND_R_PAW_CTRL':826}
          for role,index in expected.items():
              assert s['pawAnchors'][role]['surfaceBindIndex']==index
              assert s['pawAnchors'][role]['selectedRoleWeight']==0.0
          assert x['dar1Isolation']['changedDiagnosticAxisRoles']==['TAIL_ROOT_CTRL']
          assert x['dar1Isolation']['allNonTailRootAxesExactInherited'] is True
          assert x['actualFinitePoseEvidenceExecuted'] is False
          assert x['deformedV3125Produced'] is False
          assert x['rasterEvidenceExecuted'] is False
          assert x['perceptualReviewExecuted'] is False
          assert x['rest']['maxNormalized'] <= 1e-9
          assert x['rest']['rmsNormalized'] <= 1e-10
          print('FPD1 real-scaffold pre-evidence isolation PASS')
          PY

      - name: Record exact QA executable identities and manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=mobi/p1-c-fpd1/qa
          mkdir -p "$E"
          {
            echo "git_head=$GITHUB_SHA"
            echo "fpd1_impl_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py)"
            echo "fpd1_impl_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')"
            echo "fpd1_tests_blob=$(git hash-object mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py)"
            echo "fpd1_tests_sha256=$(sha256sum mobi/p1-b2/geometry/test_p1_c_fpd1_finite_pose_discriminator_v1.py | awk '{print $1}')"
            echo "qa_workflow_blob=$(git hash-object .github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml)"
            echo "qa_workflow_sha256=$(sha256sum .github/workflows/mobi-p1-c-fpd1-pre-evidence-qa.yml | awk '{print $1}')"
            echo "dar1_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py)"
            echo "dar1_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py | awk '{print $1}')"
            echo "r12_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)"
            echo "r11_assembled_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_r11_semantic_scaffold_v1.py | awk '{print $1}')"
          } > "$E/executable_identities.txt"
          python - <<'PY' > "$E/environment.txt"
          import platform,sys
          print(sys.version)
          print(platform.platform())
          import numpy,fast_simplification,trimesh,skimage,scipy
          print('numpy',numpy.__version__)
          print('fast-simplification',fast_simplification.__version__)
          print('trimesh',trimesh.__version__)
          print('scikit-image',skimage.__version__)
          print('scipy',scipy.__version__)
          PY
          find "$E" -type f ! -name QA_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$E/QA_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobi-p1-c-fpd1-pre-evidence-qa-${{ github.run_id }}
          path: mobi/p1-c-fpd1/qa
          if-no-files-found: error
          retention-days: 30
