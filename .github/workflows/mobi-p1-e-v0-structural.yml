name: Mobi P1-E V0 Structural Prototype

on:
  push:
    branches:
      - 'mobi/run-p1-e-v0-structural-20261015'
    paths:
      - 'mobi/p1-b2/geometry/e_v0_profiles.py'
      - 'mobi/p1-b2/geometry/e_v0_fixture_adapter.py'
      - 'mobi/p1-b2/geometry/e_v0_renderer_adapter.py'
      - 'mobi/p1-b2/geometry/run_e_v0_structural_matrix.py'
      - 'mobi/p1-b2/geometry/test_e_v0_structural.py'
      - '.github/workflows/mobi-p1-e-v0-structural.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-e-v0-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-e/evidence
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "runner=ubuntu-latest"
            python3 --version
          } | tee mobi/p1-e/evidence/environment.txt

      - name: Verify private-public source parity and frozen upstream inputs
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          # Frozen accepted upstream source identities.
          test "$(git hash-object model.py)" = "c4e0334cf5896d0bb7a2ab3e8d89c1cd37f7410b"
          test "$(git hash-object candidates_v2.py)" = "39bcf9759387800c7da60ace45a528d238d4208f"
          test "$(git hash-object motions_v2.py)" = "a3d6c1fd0227216fdf2a69e056e3b177dc398c53"
          test "$(git hash-object orientation_v2.py)" = "33cb9c1e8f3b41f038898345a0aee0642609e812"
          test "$(git hash-object c3_semantic.py)" = "9ebb7192fbd414f134ecd15991ca252af58bfd62"
          test "$(git hash-object c3_renderers.py)" = "19117dfe2e3d093defe8624bb3fc3fb75ccfb63b"
          test "$(git hash-object c3_renderer_validity_v2.py)" = "a4f8def921434dc3e6134866bce4184ecad82189"
          test "$(git hash-object c3_renderer_minimal_v3.py)" = "9b4744ad6ce02867d4b4e525316a7d625b5a5f58"
          test "$(git hash-object c3_renderer_view_resolved_v4.py)" = "87e48c4789a4b2e8c9dd6aebd16b090b22f2b1e0"
          test "$(git hash-object c3w_h6n_fixture_adapter.py)" = "fd3a53be0ef18e8ee4085b031cf8e7d2faa18195"
          test "$(git hash-object c4_hard_motion_fixture_adapter.py)" = "90ccccde16623073f13fc986cebc238c74aa9c13"
          test "$(git hash-object c4_renderer_adapter.py)" = "1cec4470d6e458a1a3a9c6b1d9f6a44b4483af6e"
          test "$(git hash-object h6n_stepped_turn_v2.py)" = "8903145739c5eb0a21b87d192c27cfdab6fc48b0"
          test "$(git hash-object run_c3_matrix.py)" = "8668613e8784406d081bb389a60d92eba23df2c1"
          # Exact private/public parity for P1-E execution-critical files.
          test "$(git hash-object e_v0_profiles.py)" = "087826028fa7a2ad5a9a042ec188f335c9ff18cc"
          test "$(git hash-object e_v0_fixture_adapter.py)" = "96bb5351208c157003ce0a50f828075537c5edb5"
          test "$(git hash-object e_v0_renderer_adapter.py)" = "257f2ec2647b326dbf528146a79f5b2a98f18c37"
          test "$(git hash-object run_e_v0_structural_matrix.py)" = "1c2bf70a5b4bb4d600a0efb0d80471c6906ee37e"
          test "$(git hash-object test_e_v0_structural.py)" = "97b32bb571e1dabec8297955f0cd20207205c5ab"
          git hash-object \
            model.py candidates_v2.py motions_v2.py orientation_v2.py \
            c3_semantic.py c3_renderers.py c3_renderer_validity_v2.py \
            c3_renderer_minimal_v3.py c3_renderer_view_resolved_v4.py \
            c3w_h6n_fixture_adapter.py c4_hard_motion_fixture_adapter.py \
            c4_renderer_adapter.py h6n_stepped_turn_v2.py run_c3_matrix.py \
            e_v0_profiles.py e_v0_fixture_adapter.py e_v0_renderer_adapter.py \
            run_e_v0_structural_matrix.py test_e_v0_structural.py \
            | tee ../../p1-e/evidence/git_blob_shas.txt
          echo "P1-E private/public parity PASS; accepted upstream inputs frozen PASS"

      - name: Run targeted regression and P1-E tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            test_c4_hard_motion.py \
            test_e_v0_structural.py \
            2>&1 | tee ../../p1-e/evidence/unittest.txt

      - name: Run deterministic P1-E matrix across hash seeds
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-e/run1 ../../p1-e/run2
          PYTHONHASHSEED=1 python3 run_e_v0_structural_matrix.py --output-dir ../../p1-e/run1
          PYTHONHASHSEED=777 python3 run_e_v0_structural_matrix.py --output-dir ../../p1-e/run2
          cmp ../../p1-e/run1/results.json ../../p1-e/run2/results.json
          cmp ../../p1-e/run1/summary.json ../../p1-e/run2/summary.json
          (cd ../../p1-e/run1/scorecards && sha256sum *.svg | sort) > ../../p1-e/run1/scorecards.sha256
          (cd ../../p1-e/run2/scorecards && sha256sum *.svg | sort) > ../../p1-e/run2/scorecards.sha256
          cmp ../../p1-e/run1/scorecards.sha256 ../../p1-e/run2/scorecards.sha256
          cp ../../p1-e/run1/results.json ../../p1-e/evidence/
          cp ../../p1-e/run1/summary.json ../../p1-e/evidence/
          cp ../../p1-e/run1/scorecards.sha256 ../../p1-e/evidence/
          cp -R ../../p1-e/run1/scorecards ../../p1-e/evidence/
          echo "hash_seed_repeat_exact=PASS" > ../../p1-e/evidence/deterministic.txt

      - name: Validate P1-E structural decision invariants
        working-directory: mobi/p1-e/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          summary = json.loads(Path('summary.json').read_text())
          if summary['recordCount'] != 1770:
              raise SystemExit(('recordCount', summary['recordCount']))
          if summary['semanticHashMismatchTotal'] != 0:
              raise SystemExit('semantic mismatch')
          if summary['maxVisiblePawCenterErrorDp'] > 1e-9:
              raise SystemExit(('paw error', summary['maxVisiblePawCenterErrorDp']))
          if summary['maxPartitionCount'] > 4:
              raise SystemExit(('partition overflow', summary['maxPartitionCount']))
          if summary['coreDisconnectCount'] != 0:
              raise SystemExit(('core disconnect', summary['coreDisconnectCount']))
          if summary['tailPrimitiveMismatchCount'] != 0:
              raise SystemExit(('tail mismatch', summary['tailPrimitiveMismatchCount']))
          if summary['minimumEarPrimitiveCount'] < 2:
              raise SystemExit(('ear count', summary['minimumEarPrimitiveCount']))
          if summary['correctionFamilies'] != ['H4_CORE_ENVELOPE']:
              raise SystemExit(('correction inventory', summary['correctionFamilies']))
          if summary['nonH4CorrectionUseCount'] != 0:
              raise SystemExit(('non-H4 correction', summary['nonH4CorrectionUseCount']))
          if summary['readabilityAidModes'] != ['NONE_BASELINE']:
              raise SystemExit(('readability aid', summary['readabilityAidModes']))
          probe = summary['compactVsLankyNeutral80']
          if not probe['geometryHashesDiffer']:
              raise SystemExit('compact/lanky geometry equal')
          if abs(probe['forePelvisSpanDeltaDp']) <= 1e-6:
              raise SystemExit(('compact/lanky span delta', probe['forePelvisSpanDeltaDp']))
          if not summary['probeBounds']['pass']:
              raise SystemExit(('probe bounds', summary['probeBounds']))

          scorecards = sorted(Path('scorecards').glob('*.svg'))
          if len(scorecards) != 15:
              raise SystemExit(('scorecard count', len(scorecards)))
          for path in scorecards:
              ET.parse(path)
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('scorecards_xml_valid=15/15')
          PY

      - name: Hash evidence files
        working-directory: mobi/p1-e/evidence
        run: |
          set -euo pipefail
          sha256sum \
            environment.txt git_blob_shas.txt unittest.txt \
            results.json summary.json scorecards.sha256 deterministic.txt \
            | tee EVIDENCE_SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-e-v0-structural-${{ github.run_id }}
          path: mobi/p1-e/evidence/
          if-no-files-found: error
          retention-days: 30
