name: Einstein Recovery Runner Zero-Draw Preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EINSTEIN_RECOVERY_RUNNER_PREFLIGHT_V1 exactly'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-recovery-runner-preflight.yml'

permissions:
  contents: read

concurrency:
  group: einstein-recovery-runner-preflight-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_EINSTEIN_RECOVERY_RUNNER_PREFLIGHT_V1') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: validate Einstein recovery runner preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_SHA: a0feb079218229be755b0c91573584334444e203
      ACCEPTED_SOURCE_SHA: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
      FIXTURE_SHA: b34abb909dd1d154ca964423c6bde3bcb347407d
      FIXTURE_BLOB_SHA: ce555f511ca4003e95a24fbca975081c61109222
      PRIVATE_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      CLASSES_DIR: /tmp/einstein-recovery-runner-classes
      SOURCES_FILE: /tmp/einstein-recovery-runner-sources.txt
      PREFLIGHT_DIR: /tmp/einstein-recovery-runner-preflight
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Checkout exact recovery runner candidate
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: a0feb079218229be755b0c91573584334444e203
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 4
          persist-credentials: false

      - name: Checkout exact frozen bounded fixture
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b34abb909dd1d154ca964423c6bde3bcb347407d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: FrozenFixture
          fetch-depth: 1
          persist-credentials: false

      - name: Hard-gate source and fixture identities
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          git cat-file -e "$ACCEPTED_SOURCE_SHA^{commit}"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionRecoveryRunnerV1.java'
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          test -z "$(git status --porcelain --untracked-files=all)"
          cd ../FrozenFixture
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          FIXTURE='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java'
          test "$(git hash-object "$FIXTURE")" = "$FIXTURE_BLOB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Static runner safety contract
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          R='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionRecoveryRunnerV1.java'
          grep -F 'EXPECTED_REQUEST_ID="d9521bbb56be33762329546cbc13a2002859b57e2f4d606a1eeb19bf367092da"' "$R"
          grep -F 'EXPECTED_CONTEXT_ID="9efbf806670761cabd5a99a54e1066a22fb151dad496cbb381badbec204c4ad3"' "$R"
          grep -F 'EXPECTED_EMPTY_RESUME_ID="c93be4a0a319ca6f35db1ae088a0efe1c56f0072c7f51e87b8bce046fe0f6501"' "$R"
          grep -F 'EXECUTE_TOKEN="RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_2"' "$R"
          grep -F 'StandardOpenOption.CREATE_NEW' "$R"
          grep -F 'channel.force(true)' "$R"
          grep -F 'Files.createDirectory(root)' "$R"
          grep -F 'fixture.request,fixture.context,fixture.resume,sink' "$R"
          test "$(grep -F 'new IntentAcquisitionContinuationCoordinator().acquire(' "$R" | wc -l)" -eq 1
          ! grep -F 'evaluateDraw' "$R"
          ! grep -F 'getDeclaredMethod' "$R"
          ! grep -F 'setAccessible' "$R"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionRecoveryRunnerV1.java')
          s=p.read_text()
          env_gate=s.index('EINSTEIN_FORMAL_RECOVERY_AUTHORIZATION')
          execute_root=s.index('Path root=createFreshEvidenceRoot(args[1]);', s.index('if(!"execute".equals(mode))'))
          assert env_gate < execute_root, (env_gate, execute_root)
          assert s.index('runPreflight(root,fixture)') < s.index('runFormalRecovery(root,fixture)')
          print('STATIC_RUNNER_SAFETY_CONTRACT=PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile accepted production plus exact runner and frozen fixture
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE" "$PREFLIGHT_DIR"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          cat >> "$SOURCES_FILE" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionRecoveryRunnerV1.java
          ../FrozenFixture/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main \
            -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=list(Path('/tmp/einstein-recovery-runner-classes').rglob('*.class'))
          assert files
          bad=[]
          for p in files:
              magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
              if (magic,minor,major)!=(0xCAFEBABE,0,52): bad.append((str(p),magic,minor,major))
          assert not bad, bad[:10]
          print('JAVA8_CLASSFILE_TARGET=PASS count='+str(len(files)))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run zero-draw recovery runner preflight
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
        run: |
          set -euo pipefail
          test -z "${EINSTEIN_FORMAL_RECOVERY_AUTHORIZATION:-}"
          java -Xmx2g -cp "$CLASSES_DIR" \
            com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionRecoveryRunnerV1 \
            preflight "$PREFLIGHT_DIR" | tee /tmp/einstein-recovery-runner-preflight.log
          grep -F 'IntentAcquisitionRecoveryRunnerV1 PREFLIGHT PASS' /tmp/einstein-recovery-runner-preflight.log
          grep -F 'requestIdentity=d9521bbb56be33762329546cbc13a2002859b57e2f4d606a1eeb19bf367092da' /tmp/einstein-recovery-runner-preflight.log
          grep -F 'contextIdentity=9efbf806670761cabd5a99a54e1066a22fb151dad496cbb381badbec204c4ad3' /tmp/einstein-recovery-runner-preflight.log
          grep -F 'resumePrefixIdentity=c93be4a0a319ca6f35db1ae088a0efe1c56f0072c7f51e87b8bce046fe0f6501' /tmp/einstein-recovery-runner-preflight.log
          grep -F 'formalAcquisitionInvocationCount=0' /tmp/einstein-recovery-runner-preflight.log
          test -f "$PREFLIGHT_DIR/preflight-identity.json"
          test -f "$PREFLIGHT_DIR/preflight-identity.json.sha256"
          test -f "$PREFLIGHT_DIR/attempt-draw0.json"
          test -f "$PREFLIGHT_DIR/attempt-draw0.json.sha256"
          grep -F '"formalAcquisitionInvocationCount":0' "$PREFLIGHT_DIR/preflight-identity.json"

      - name: Postflight exact scope and zero-draw boundary
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          printf '%s\n' \
            'EINSTEIN_RECOVERY_RUNNER_PREFLIGHT=PASS' \
            "runner=$RUNNER_SHA" \
            "productionSource=$ACCEPTED_SOURCE_SHA" \
            "fixture=$FIXTURE_SHA" \
            'productionSourceDelta=0' \
            'runnerDelta=1-test-file' \
            'identityHardGates=PASS' \
            'repositoryRootCwd=PASS' \
            'createNewNoOverwrite=PASS' \
            'rereadSha256=PASS' \
            'doubleExecutionGate=PASS' \
            'fourArgumentDurableAcquireStaticContract=PASS' \
            'reflectionPrivateEvaluateDraw=ABSENT' \
            'formalAcquisitionInvocation=0' \
            'artifactUpload=0' \
            'cacheUpload=0'
