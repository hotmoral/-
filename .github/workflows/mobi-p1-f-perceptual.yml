name: Mobi P1-F Perceptual Validation Evidence

on:
  push:
    branches:
      - 'mobi/run-p1-f-perceptual-20261015'
    paths:
      - 'mobi/p1-b2/geometry/run_p1f_perceptual_evidence.py'
      - 'mobi/p1-b2/geometry/test_p1f_perceptual_evidence.py'
      - '.github/workflows/mobi-p1-f-perceptual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-f-perceptual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-f/evidence
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "runner=ubuntu-latest"
            python3 --version
          } | tee mobi/p1-f/evidence/environment.txt

      - name: Verify private-public parity and frozen structural inputs
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          test "$(git hash-object model.py)" = "c4e0334cf5896d0bb7a2ab3e8d89c1cd37f7410b"
          test "$(git hash-object candidates_v2.py)" = "39bcf9759387800c7da60ace45a528d238d4208f"
          test "$(git hash-object motions_v2.py)" = "a3d6c1fd0227216fdf2a69e056e3b177dc398c53"
          test "$(git hash-object orientation_v2.py)" = "33cb9c1e8f3b41f038898345a0aee0642609e812"
          test "$(git hash-object c3_semantic.py)" = "9ebb7192fbd414f134ecd15991ca252af58bfd62"
          test "$(git hash-object c3_renderers.py)" = "19117dfe2e3d093defe8624bb3fc3fb75ccfb63b"
          test "$(git hash-object c3_renderer_validity_v2.py)" = "a4f8def921434dc3e6134866bce4184ecad82189"
          test "$(git hash-object c3_renderer_minimal_v3.py)" = "9b4744ad6ce02867d4b4e525316a7d625b5a5f58"
          test "$(git hash-object c3_renderer_view_resolved_v4.py)" = "87e48c4789a4b2e8c9dd6aebd16b090b22f2b1e0"
          test "$(git hash-object c3w_h6n_fixture_adapter.py)" = "fd3a53be0ef18e8ee4085b031cf8e7d2faa18195"
          test "$(git hash-object c4_hard_motion_fixture_adapter.py)" = "90ccccde16623073f13fc986cebc238c74aa9c13"
          test "$(git hash-object c4_renderer_adapter.py)" = "1cec4470d6e458a1a3a9c6b1d9f6a44b4483af6e"
          test "$(git hash-object h6n_stepped_turn_v2.py)" = "8903145739c5eb0a21b87d192c27cfdab6fc48b0"
          test "$(git hash-object run_c3_matrix.py)" = "8668613e8784406d081bb389a60d92eba23df2c1"
          test "$(git hash-object e_v0_profiles.py)" = "087826028fa7a2ad5a9a042ec188f335c9ff18cc"
          test "$(git hash-object e_v0_fixture_adapter.py)" = "96bb5351208c157003ce0a50f828075537c5edb5"
          test "$(git hash-object e_v0_renderer_adapter.py)" = "257f2ec2647b326dbf528146a79f5b2a98f18c37"
          test "$(git hash-object run_e_v0_structural_matrix.py)" = "1c2bf70a5b4bb4d600a0efb0d80471c6906ee37e"
          test "$(git hash-object test_e_v0_structural.py)" = "97b32bb571e1dabec8297955f0cd20207205c5ab"
          test "$(git hash-object run_p1f_perceptual_evidence.py)" = "e2f6552c0f2bb1f7cd7b85ba560f36e43df2ec25"
          test "$(git hash-object test_p1f_perceptual_evidence.py)" = "666dac6fd1f6530bd9f17b01c03516be64c5aaee"
          git hash-object \
            model.py candidates_v2.py motions_v2.py orientation_v2.py \
            c3_semantic.py c3_renderers.py c3_renderer_validity_v2.py \
            c3_renderer_minimal_v3.py c3_renderer_view_resolved_v4.py \
            c3w_h6n_fixture_adapter.py c4_hard_motion_fixture_adapter.py \
            c4_renderer_adapter.py h6n_stepped_turn_v2.py run_c3_matrix.py \
            e_v0_profiles.py e_v0_fixture_adapter.py e_v0_renderer_adapter.py \
            run_e_v0_structural_matrix.py test_e_v0_structural.py \
            run_p1f_perceptual_evidence.py test_p1f_perceptual_evidence.py \
            | tee ../../p1-f/evidence/git_blob_shas.txt
          echo "P1-F private/public parity PASS; structural inputs frozen PASS"

      - name: Run structural regression and P1-F evidence tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            test_c4_hard_motion.py \
            test_e_v0_structural.py \
            test_p1f_perceptual_evidence.py \
            2>&1 | tee ../../p1-f/evidence/unittest.txt

      - name: Generate deterministic P1-F visual evidence across hash seeds
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-f/run1 ../../p1-f/run2
          PYTHONHASHSEED=1 python3 run_p1f_perceptual_evidence.py --output-dir ../../p1-f/run1
          PYTHONHASHSEED=777 python3 run_p1f_perceptual_evidence.py --output-dir ../../p1-f/run2
          cmp ../../p1-f/run1/manifest.json ../../p1-f/run2/manifest.json
          (cd ../../p1-f/run1 && sha256sum *.svg | sort) > ../../p1-f/run1/svg.sha256
          (cd ../../p1-f/run2 && sha256sum *.svg | sort) > ../../p1-f/run2/svg.sha256
          cmp ../../p1-f/run1/svg.sha256 ../../p1-f/run2/svg.sha256
          cp ../../p1-f/run1/manifest.json ../../p1-f/evidence/
          cp ../../p1-f/run1/svg.sha256 ../../p1-f/evidence/
          cp ../../p1-f/run1/*.svg ../../p1-f/evidence/
          echo "hash_seed_repeat_exact=PASS" > ../../p1-f/evidence/deterministic.txt

      - name: Validate evidence bundle
        working-directory: mobi/p1-f/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = json.loads(Path('manifest.json').read_text())
          if manifest['fileCount'] != 22:
              raise SystemExit(('fileCount', manifest['fileCount']))
          if manifest['totalRenderedFrames'] != 232:
              raise SystemExit(('totalRenderedFrames', manifest['totalRenderedFrames']))
          if manifest['primarySizeDp'] != 80:
              raise SystemExit(('primarySizeDp', manifest['primarySizeDp']))
          paths = sorted(Path('.').glob('*.svg'))
          if len(paths) != 22:
              raise SystemExit(('svg count', len(paths)))
          for path in paths:
              ET.parse(path)
          kinds = [entry['kind'] for entry in manifest['files']]
          if kinds.count('filmstrip') != 20:
              raise SystemExit(('filmstrip count', kinds.count('filmstrip')))
          if kinds.count('morphology_overview') != 1 or kinds.count('scale_overview') != 1:
              raise SystemExit(('overview counts', kinds))
          print(json.dumps(manifest, indent=2, sort_keys=True))
          print('p1f_svg_xml_valid=22/22')
          PY

      - name: Hash evidence files
        working-directory: mobi/p1-f/evidence
        run: |
          set -euo pipefail
          sha256sum \
            environment.txt git_blob_shas.txt unittest.txt \
            manifest.json svg.sha256 deterministic.txt \
            | tee EVIDENCE_SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-f-perceptual-${{ github.run_id }}
          path: mobi/p1-f/evidence/
          if-no-files-found: error
          retention-days: 30
