name: ReceiptLedger Post-V1 Physical OCR Validation

on:
  push:
    branches:
      - receiptledger/run-post-v1-physical-ocr-validation-20261017
    paths:
      - 'receiptledger/CP37_PHYSICAL_DEVICE_REAL_IMAGE_OCR_VALIDATION_PLAN.md'
      - 'receiptledger/PHYSICAL_DEVICE_OCR_VALIDATION_CONSISTENCY_REVIEW.md'
      - 'receiptledger/CP37_PHYSICAL_DEVICE_CAMPAIGN_PROTOCOL.md'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/MainActivity.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/devicevalidation/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/devicevalidation/**'
      - 'receiptledger/harness/android-v1/app/src/main/res/values/cp37_strings.xml'
      - '.github/workflows/receiptledger-post-v1-physical-ocr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-device-ocr-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          set -o pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP37 Phase A bounded scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d0a3a9ec7658808c82247715d58ac106a3778186
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp37-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-post-v1-physical-ocr-validation.yml) ;;
              receiptledger/CP37_PHYSICAL_DEVICE_REAL_IMAGE_OCR_VALIDATION_PLAN.md) ;;
              receiptledger/PHYSICAL_DEVICE_OCR_VALIDATION_CONSISTENCY_REVIEW.md) ;;
              receiptledger/CP37_PHYSICAL_DEVICE_CAMPAIGN_PROTOCOL.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/MainActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/devicevalidation/DeviceValidationReportV1.java) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/devicevalidation/DeviceValidationReportV1Test.java) ;;
              receiptledger/harness/android-v1/app/src/main/res/values/cp37_strings.xml) ;;
              '') ;;
              *) echo "CP37 Phase A scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp37-changed-files.txt

          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || {
            echo 'CP37 must not change manifest'; exit 32;
          }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/ocr" || {
            echo 'CP37 Phase A must not change OCR engine'; exit 33;
          }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/recovery" || {
            echo 'CP37 Phase A must not change recovery logic'; exit 34;
          }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/review" || {
            echo 'CP37 Phase A must not change review policy'; exit 35;
          }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 36' "$APP/build.gradle"
          grep -Fq "versionName '1.0.35-physical-ocr-validation'" "$APP/build.gradle"

      - name: Unit regression lint and APK build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
            if ! grep -Fqx 'No issues found.' "$REPORT"; then
              echo 'CP37 requires lint 0 errors / 0 warnings'
              status=43
            fi
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.evaluation.RealReceiptEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Verify sanitized CP37 report tests
        shell: bash
        run: |
          set -euo pipefail
          XML=receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml
          python3 - <<'PY' "$XML" | tee receiptledger/cp37-test-metrics.txt
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          tests=int(root.attrib.get('tests','0'))
          failures=int(root.attrib.get('failures','0'))
          errors=int(root.attrib.get('errors','0'))
          skipped=int(root.attrib.get('skipped','0'))
          if tests != 4 or failures or errors or skipped:
              raise SystemExit('CP37 test contract mismatch')
          print('CP37_PHASE_A_METRICS report_version=1 tests=4 privacy_leak_tests=1 false_auto_confirm_tests=1 conservative_review_tests=1 structure_delta_tests=1 schema_unchanged=1')
          PY

      - name: Package Phase A device validation artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE=d0a3a9ec7658808c82247715d58ac106a3778186
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/post-v1-physical-ocr-validation
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-post-v1-physical-ocr-validation-debug.apk"
          cp receiptledger/cp37-test-metrics.txt "$OUT/CP37_PHASE_A_METRICS.txt"
          cp receiptledger/CP37_PHYSICAL_DEVICE_REAL_IMAGE_OCR_VALIDATION_PLAN.md "$OUT/"
          cp receiptledger/PHYSICAL_DEVICE_OCR_VALIDATION_CONSISTENCY_REVIEW.md "$OUT/"
          cp receiptledger/CP37_PHYSICAL_DEVICE_CAMPAIGN_PROTOCOL.md "$OUT/"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.devicevalidation.DeviceValidationReportV1Test.xml" "$OUT/DEVICE_VALIDATION_REPORT_V1_TEST.xml"
          unzip -t "$OUT/receiptledger-post-v1-physical-ocr-validation-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 81; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP37_PHASE_A_DIFF.txt"
          sha256sum "$OUT/receiptledger-post-v1-physical-ocr-validation-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_POST_V1_PHYSICAL_OCR_VALIDATION_01_PHASE_A'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'status=READY_FOR_DEVICE_EVIDENCE_CANDIDATE'
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'ocr_engine=UNCHANGED'
            echo 'recovery_policy=UNCHANGED'
            echo 'version_name=1.0.35-physical-ocr-validation'
            echo 'version_code=36'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/APK_PERMISSIONS.txt \
            "$OUT"/CP37_PHASE_A_METRICS.txt "$OUT"/CP37_PHASE_A_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-post-v1-physical-ocr-validation-${{ github.run_id }}
          path: receiptledger/output/post-v1-physical-ocr-validation/
          if-no-files-found: error
          retention-days: 14
