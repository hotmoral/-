name: Einstein CP6 Target Ablation Existence V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-cp6-target-ablation-existence-v1.yml'

permissions:
  contents: read

jobs:
  cp6-target-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 75271577bbb85fbcf264bc45966f6f483de3690c
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 75271577bbb85fbcf264bc45966f6f483de3690c
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile focused CP6 regression sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/EinsteinGame"
          CLASSES=/tmp/einstein-cp6-target-ablation-classes
          SOURCES=/tmp/einstein-cp6-target-ablation-sources.txt
          rm -rf "$CLASSES" "$SOURCES"
          mkdir -p "$CLASSES" build/pss-logical-core
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssFixtureInput.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssTestSupport.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssOpportunityTest.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssGoldenSoundnessDeterminismTest.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssPathExplorerTest.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/path/ConfluenceStopContractProbe.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/PssCp6Test.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/analysis/RequirednessTargetAblationExistenceProofTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo CP6_TARGET_ABLATION_COMPILE=PASS

      - name: Run focused proof and legacy CP6 golden regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/EinsteinGame"
          CLASSES=/tmp/einstein-cp6-target-ablation-classes
          java -Xmx4g -cp "$CLASSES" com.example.einsteingame.authoring.pss.PssGoldenSoundnessDeterminismTest
          java -Xmx6g -cp "$CLASSES" com.example.einsteingame.authoring.pss.PssPathExplorerTest
          java -Xmx2g -cp "$CLASSES" com.example.einsteingame.authoring.pss.analysis.RequirednessTargetAblationExistenceProofTest
          java -Xmx6g -cp "$CLASSES" com.example.einsteingame.authoring.pss.PssCp6Test
          echo CP6_TARGET_ABLATION_REGRESSION=PASS
