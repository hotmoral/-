name: Timing Defense T1 Contiguous 34-36 E1 Static Preflight V0.2

on:
  push:
    branches: [timing-defense-workspace]
    paths:
      - '.github/workflows/timing-defense-t1-contiguous-34-36-e1-static-preflight-v0-2.yml'
      - 'timing-defense-workspace/tools/preflight_t1_contiguous_34_36_e1_v0_2.py'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_contiguous_34_36_e1_authoring_plan_v0_2.yaml'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_contiguous_34_36_e1_candidate_v0_2.yaml'
      - 'timing-defense-workspace/tools/preflight_t1_contiguous_32_d1_v0_1.py'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_wider_exact_authoring_wave_a4_candidate_v0_1.yaml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - name: Record exact source
        run: |
          mkdir -p artifacts/t1-contiguous-34-36-e1-v02
          echo "$GITHUB_SHA" > artifacts/t1-contiguous-34-36-e1-v02/exact-source-sha.txt
      - name: Compile validators
        run: |
          python -m py_compile timing-defense-workspace/tools/preflight_t1_contiguous_32_d1_v0_1.py
          python -m py_compile timing-defense-workspace/tools/preflight_t1_contiguous_34_36_e1_v0_2.py
      - name: Re-materialize canonical Stage15-33 prefix
        run: |
          python timing-defense-workspace/tools/preflight_t1_contiguous_32_d1_v0_1.py \
            --plan timing-defense-workspace/legacy-game-structure/data/t1_contiguous_32_d1_authoring_plan_v0_1.yaml \
            --base timing-defense-workspace/legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_2_pressure_shape_candidate.yaml \
            --a2 timing-defense-workspace/legacy-game-structure/data/t1_wider_exact_authoring_wave_a2_candidate_v0_1.yaml \
            --a3 timing-defense-workspace/legacy-game-structure/data/t1_wider_exact_authoring_wave_a3_candidate_v0_1.yaml \
            --a4 timing-defense-workspace/legacy-game-structure/data/t1_wider_exact_authoring_wave_a4_candidate_v0_1.yaml \
            --b1 timing-defense-workspace/legacy-game-structure/data/t1_contiguous_15_25_b1_stage16_17_candidate_v0_1.yaml \
            --c1 timing-defense-workspace/legacy-game-structure/data/t1_contiguous_26_28_c1_candidate_v0_1.yaml \
            --candidate timing-defense-workspace/legacy-game-structure/data/t1_contiguous_32_d1_candidate_v0_1.yaml \
            --json-out artifacts/t1-contiguous-34-36-e1-v02/prefix-result.json \
            --materialized-out artifacts/t1-contiguous-34-36-e1-v02/materialized-stage15-33.yaml
      - name: Run E1 V0.2 static preflight
        id: preflight
        continue-on-error: true
        run: |
          python timing-defense-workspace/tools/preflight_t1_contiguous_34_36_e1_v0_2.py \
            --plan timing-defense-workspace/legacy-game-structure/data/t1_contiguous_34_36_e1_authoring_plan_v0_2.yaml \
            --materialized15-33 artifacts/t1-contiguous-34-36-e1-v02/materialized-stage15-33.yaml \
            --a4 timing-defense-workspace/legacy-game-structure/data/t1_wider_exact_authoring_wave_a4_candidate_v0_1.yaml \
            --candidate timing-defense-workspace/legacy-game-structure/data/t1_contiguous_34_36_e1_candidate_v0_2.yaml \
            --json-out artifacts/t1-contiguous-34-36-e1-v02/result.json \
            --materialized-out artifacts/t1-contiguous-34-36-e1-v02/materialized-stage15-38.yaml
      - run: echo '${{ steps.preflight.outcome }}' > artifacts/t1-contiguous-34-36-e1-v02/step-outcome.txt
      - uses: actions/upload-artifact@v4
        with:
          name: timing-defense-t1-contiguous-34-36-e1-static-preflight-v02
          path: artifacts/t1-contiguous-34-36-e1-v02
      - if: steps.preflight.outcome != 'success'
        run: exit 1
