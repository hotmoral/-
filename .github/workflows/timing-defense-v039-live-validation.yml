name: Timing Defense v0.39 Live Validation

on:
  push:
    branches:
      - timing-defense-cloudflare-do-poc
    paths:
      - '.github/workflows/timing-defense-v039-live-validation.yml'
      - 'timing-defense-cloudflare-poc/src/v039-*.js'
      - 'timing-defense-v011/v039-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timing-defense-v039-live-validation
  cancel-in-progress: true

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://timing-defense-do-poc.sktjsek.workers.dev
      EXPECTED_VERSION: 0.39-cf.1
    steps:
      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p artifacts

      - name: Wait for Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const base = process.env.BASE_URL;
          const expected = process.env.EXPECTED_VERSION;
          const deadline = Date.now() + 180000;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            let last = '';
            while (Date.now() < deadline) {
              try {
                const r = await fetch(`${base}/api/health?ci=${Date.now()}`, { cache: 'no-store' });
                const text = await r.text();
                last = text;
                fs.writeFileSync('artifacts/health.txt', text);
                let d = null;
                try { d = JSON.parse(text); } catch {}
                console.log(`health status=${r.status} version=${d?.version || 'unknown'}`);
                if (r.ok && d?.version === expected) process.exit(0);
              } catch (e) {
                last = String(e?.stack || e);
                console.log(`health error: ${last}`);
              }
              await sleep(3000);
            }
            fs.writeFileSync('artifacts/health.txt', last || 'no response');
            console.error(`Timed out waiting for ${expected}`);
            process.exit(1);
          })();
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run v0.39 browser validation suite
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const base = process.env.BASE_URL;
          const url = `${base}/v039-validation-suite.html?fix=cf0391&ci=${encodeURIComponent(process.env.GITHUB_SHA || Date.now())}`;
          (async () => {
            const logs = [];
            let browser = null;
            let page = null;
            try {
              browser = await chromium.launch({ headless: true });
              page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              page.on('console', msg => logs.push(`[console:${msg.type()}] ${msg.text()}`));
              page.on('pageerror', err => logs.push(`[pageerror] ${String(err?.stack || err)}`));
              page.on('requestfailed', req => logs.push(`[requestfailed] ${req.method()} ${req.url()} :: ${req.failure()?.errorText || ''}`));
              console.log(`Opening ${url}`);
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForFunction(() => {
                const t = document.body?.innerText || '';
                return t.includes('FINAL · PASS') || t.includes('FINAL · FAIL');
              }, null, { timeout: 240000 });
              const body = await page.locator('body').innerText();
              fs.writeFileSync('artifacts/body.txt', body);
              fs.writeFileSync('artifacts/browser.log', logs.join('\n'));
              await page.screenshot({ path: 'artifacts/validation.png', fullPage: true });
              console.log(body);
              if (!body.includes('FINAL · PASS')) {
                console.error('v0.39 validation did not reach FINAL PASS');
                process.exitCode = 1;
              }
            } catch (e) {
              logs.push(`[runner-error] ${String(e?.stack || e)}`);
              fs.writeFileSync('artifacts/browser.log', logs.join('\n'));
              if (page) {
                try { fs.writeFileSync('artifacts/body.txt', await page.locator('body').innerText()); } catch {}
                try { await page.screenshot({ path: 'artifacts/validation.png', fullPage: true }); } catch {}
              }
              console.error(e);
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close();
            }
          })();
          NODE

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-v039-live-validation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
