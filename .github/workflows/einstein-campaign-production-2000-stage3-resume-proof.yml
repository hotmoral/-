name: Einstein Campaign Production 2000 Stage 0003 Resume Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-stage3-resume-proof.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-stage-0003:
    if: >-
      github.event.head_commit.message == 'production: prove compact Einstein campaign resume at stage 0003'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNNER_SHA: 96d76af29395a1a4c01f022815293af41431e3ce
      ACCEPTED_SOURCE_SHA: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
      BANK_BRANCH: campaign-production-2000-bank-v1
      EXPECTED_BANK_HEAD: ff0d4189ab4dfc171f401aaec6d38fe52a8f29a4
      BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
      EVIDENCE_REMOTE_BASE: production/campaign-2000-bank-v1/evidence
      CLASSES_DIR: /tmp/einstein-campaign-production-resume-classes
      SOURCES_FILE: /tmp/einstein-campaign-production-resume-sources.txt
      BANK_DIR: /tmp/einstein-campaign-production-bank
      EVIDENCE_DIR: /tmp/einstein-campaign-production-evidence
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact compact normal producer source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 96d76af29395a1a4c01f022815293af41431e3ce
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Guard resume boundary and freeze prior stages
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles)"
          cd ../ProductionStore
          test "$(git rev-parse HEAD)" = "$EXPECTED_BANK_HEAD"
          test "$(git ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$EXPECTED_BANK_HEAD"
          ROOT="$BANK_REMOTE_ROOT/bank"
          test -f "$ROOT/stages/stage-0001.json"
          test -f "$ROOT/stages/stage-0002.json"
          test ! -e "$ROOT/stages/stage-0003.json"
          test ! -e "$EVIDENCE_REMOTE_BASE/stage-0003/attempt-draw0.json"
          S1_SHA="$(sha256sum "$ROOT/stages/stage-0001.json" | awk '{print $1}')"
          S2_SHA="$(sha256sum "$ROOT/stages/stage-0002.json" | awk '{print $1}')"
          echo "S1_SHA=$S1_SHA" >> "$GITHUB_ENV"
          echo "S2_SHA=$S2_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BANK_REMOTE_ROOT'])/'bank'
          m=json.loads((root/'manifest.json').read_text())
          assert m['bankedCount']==2 and m['nextOrdinal']==3 and m['failedOrQuarantinedCount']==0, m
          for n in (1,2):
              s=json.loads((root/'stages'/f'stage-{n:04d}.json').read_text())
              assert s['state']=='BANKED'
              assert s['sourceProvenance']['boundedCp12ProjectionStored'] is True
              assert s['sourceProvenance']['fullMetadataStored'] is False
              assert 'cp12MetadataProjection' in s and 'curriculumMetadata' not in s
          print('STAGE_0003_RESUME_BOUNDARY=PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile accepted engine plus compact normal producer
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java' >> "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java' >> "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000N5DirectProducerV1.java' >> "$SOURCES_FILE"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          echo 'STAGE_0003_RESUME_COMPILE=PASS'

      - name: Restore durable bank
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$BANK_DIR" "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          cp -a "$GITHUB_WORKSPACE/ProductionStore/$BANK_REMOTE_ROOT/bank" "$BANK_DIR"
          python3 tools/campaign-production-2000/campaign_production_2000.py status "$BANK_DIR" > /tmp/pre-stage3-status.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pre-stage3-status.json'))
          assert x['bankedCount']==2 and x['nextOrdinal']==3 and x['failedOrQuarantinedCount']==0, x
          print('PRE_STAGE_0003_BANK_GUARD=PASS')
          PY

      - name: Execute exactly one resumed normal stage
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_CAMPAIGN_PRODUCTION_AUTHORIZATION: START_2000_MAINLINE_PRODUCTION_V1
          EINSTEIN_PRODUCTION_PRODUCER_AUTHORIZATION: START_2000_MAINLINE_PRODUCTION_V1
          EINSTEIN_PRODUCTION_SOURCE_HEAD: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
          EINSTEIN_PRODUCTION_PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
          EINSTEIN_PRODUCTION_BANK_ROOT: /tmp/einstein-campaign-production-bank
          EINSTEIN_PRODUCTION_EVIDENCE_DIR: /tmp/einstein-campaign-production-evidence
          EINSTEIN_PRODUCTION_EVIDENCE_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_PRODUCTION_REMOTE_EVIDENCE_BASE: production/campaign-2000-bank-v1/evidence
          EINSTEIN_PRODUCTION_REMOTE_EVIDENCE_BASE_DIR: ${{ github.workspace }}/ProductionStore/production/campaign-2000-bank-v1/evidence
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          export STORE
          git -C "$STORE" config user.name 'Einstein Campaign Production'
          git -C "$STORE" config user.email 'noreply@localhost'
          (
            set -euo pipefail
            while true; do
              handled=0
              while IFS= read -r READY; do
                [ -e "$READY" ] || continue
                NAME="$(basename "$READY" .ready.json)"
                LOCAL_STAGE_DIR="$(dirname "$READY")"
                ACK="$LOCAL_STAGE_DIR/$NAME.remote-ack.json"
                [ -e "$ACK" ] && continue
                handled=1
                export READY NAME ACK LOCAL_STAGE_DIR STORE
                python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['READY']).read_text())
          assert r['recordType']=='CampaignProduction2000RemoteSealRequestV2', r
          assert r['stageId']=='stage-0003', r
          assert r['evidenceBranch']==os.environ['BANK_BRANCH'], r
          assert r['remoteRoot']==os.environ['EVIDENCE_REMOTE_BASE']+'/stage-0003', r
          assert r['remotePath']==r['remoteRoot']+'/'+os.environ['NAME'], r
          assert r['formalProduction'] is True and r['materializationReplay'] is False, r
          assert len(r['sha256'])==64
          PY
                SHA="$(python3 -c 'import json,os;print(json.load(open(os.environ["READY"]))["sha256"])')"
                REMOTE_ROOT="$(python3 -c 'import json,os;print(json.load(open(os.environ["READY"]))["remoteRoot"])')"
                SOURCE="$LOCAL_STAGE_DIR/$NAME"
                test -f "$SOURCE"
                test "$(stat -c %s "$SOURCE")" -lt 10485760
                test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$SHA"
                TARGET="$STORE/$REMOTE_ROOT/$NAME"
                mkdir -p "$(dirname "$TARGET")"
                if [ -e "$TARGET" ]; then
                  cmp "$SOURCE" "$TARGET"
                  COMMIT="$(git -C "$STORE" log -1 --format=%H -- "$REMOTE_ROOT/$NAME")"
                  test -n "$COMMIT"
                else
                  REMOTE_BEFORE="$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)"
                  test "$REMOTE_BEFORE" = "$(git -C "$STORE" rev-parse HEAD)"
                  cp "$SOURCE" "$TARGET"
                  git -C "$STORE" add -- "$REMOTE_ROOT/$NAME"
                  git -C "$STORE" commit -m "evidence: production stage-0003 $NAME"
                  COMMIT="$(git -C "$STORE" rev-parse HEAD)"
                  git -C "$STORE" push origin "HEAD:refs/heads/$BANK_BRANCH"
                  test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$COMMIT"
                fi
                export SHA COMMIT REMOTE_ROOT
                python3 - <<'PY'
          import json, os
          from pathlib import Path
          ack={'status':'REMOTE_SEAL_PASS','sha256':os.environ['SHA'],'evidenceBranch':os.environ['BANK_BRANCH'],
               'remoteRoot':os.environ['REMOTE_ROOT'],'remotePath':os.environ['REMOTE_ROOT']+'/'+os.environ['NAME'],
               'remoteCommitSha':os.environ['COMMIT']}
          with Path(os.environ['ACK']).open('x') as f:
            json.dump(ack,f,separators=(',',':'),sort_keys=True);f.write('\n')
          PY
              done < <(find "$EVIDENCE_DIR" -type f -name '*.ready.json' -print | sort)
              [ "$handled" -eq 0 ] && sleep 0.1
            done
          ) &
          SIDECAR_PID=$!
          set +e
          python3 tools/campaign-production-2000/campaign_production_2000.py run --execute --max-stages 1 "$BANK_DIR" -- \
            java -Xmx8g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000N5DirectProducerV1 \
            | tee /tmp/einstein-campaign-production-stage3.log
          PROD_STATUS=${PIPESTATUS[0]}
          set -e
          kill "$SIDECAR_PID" 2>/dev/null || true
          wait "$SIDECAR_PID" 2>/dev/null || true
          exit "$PROD_STATUS"

      - name: Validate resumed compact stage and persist bank
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          python3 tools/campaign-production-2000/campaign_production_2000.py status "$BANK_DIR" > /tmp/post-stage3-status.json
          export BANK_DIR
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BANK_DIR'])
          m=json.loads((root/'manifest.json').read_text())
          s=json.loads((root/'stages/stage-0003.json').read_text())
          assert m['bankedCount']==3 and m['publishedCount']==0 and m['nextOrdinal']==4, m
          assert m['failedOrQuarantinedCount']==0, m
          assert s['state']=='BANKED' and s['stageId']=='stage-0003' and s['ordinal']==3, s
          assert s['sourceProvenance']['fullMetadataStored'] is False
          assert s['sourceProvenance']['boundedCp12ProjectionStored'] is True
          assert 'curriculumMetadata' not in s and 'cp12MetadataProjection' in s
          assert s['validationRefs']['cp12MetadataProjectionReplayStatus']=='VALID_PREFIX'
          assert (root/'stages/stage-0003.json').stat().st_size < 10485760
          print('STAGE_0003_RESUMED_COMPACT_VALIDATION=PASS')
          print('stageBankBytes='+str((root/'stages/stage-0003.json').stat().st_size))
          PY
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          TARGET="$STORE/$BANK_REMOTE_ROOT/bank"
          rm -rf "$TARGET"
          mkdir -p "$(dirname "$TARGET")"
          cp -a "$BANK_DIR" "$TARGET"
          git -C "$STORE" add -- "$BANK_REMOTE_ROOT/bank"
          git -C "$STORE" commit -m 'production: bank resumed compact stage-0003 proof'
          COMMIT="$(git -C "$STORE" rev-parse HEAD)"
          git -C "$STORE" push origin "HEAD:refs/heads/$BANK_BRANCH"
          test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$COMMIT"
          echo "BANKED_COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - name: Verify prior stages immutable and resume terminal
        shell: bash
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          export STORE
          ROOT="$STORE/$BANK_REMOTE_ROOT/bank"
          test "$(sha256sum "$ROOT/stages/stage-0001.json" | awk '{print $1}')" = "$S1_SHA"
          test "$(sha256sum "$ROOT/stages/stage-0002.json" | awk '{print $1}')" = "$S2_SHA"
          test -f "$ROOT/stages/stage-0003.json"
          test ! -e "$ROOT/requests/stage-0004.json"
          test "$(git -C "$STORE" status --porcelain --untracked-files=all)" = ''
          test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$BANKED_COMMIT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STORE'])/os.environ['BANK_REMOTE_ROOT']/'bank'
          m=json.loads((root/'manifest.json').read_text())
          assert m['bankedCount']==3 and m['nextOrdinal']==4 and m['failedOrQuarantinedCount']==0, m
          print('EINSTEIN_CAMPAIGN_PRODUCTION_STAGE_0003_RESUME_TERMINAL=PASS')
          print('bankedCount=3')
          print('nextOrdinal=4')
          print('failedOrQuarantinedCount=0')
          print('bankCommit='+os.environ['BANKED_COMMIT'])
          PY
