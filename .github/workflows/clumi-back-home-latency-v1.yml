name: Clumi Back Home Latency V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clumi-back-home-latency-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-back-home-latency-v1
  cancel-in-progress: false

jobs:
  back-home-latency:
    if: >-
      github.event.head_commit.message == 'diagnose: Clumi Back Home latency after readiness fix'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_BRANCH: clumi-fixed-viewport-v1
      SOURCE_SHA: fd5fed97c7c384e732287f6a25ce8d783d201a6d
      AVD_NAME: clumi-back-home-latency

    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Install isolated latency runner
        shell: bash
        run: |
          set -euo pipefail
          test -s harness/.github/regression/ClumiBackHomeLatencyRunner.java
          rm -rf source/app/src/androidTest/java/com/example/einsteingame
          mkdir -p source/app/src/androidTest/java/com/example/einsteingame
          cp harness/.github/regression/ClumiBackHomeLatencyRunner.java source/app/src/androidTest/java/com/example/einsteingame/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle')
          text=p.read_text()
          old="testInstrumentationRunner 'com.example.einsteingame.ClumiUiTestRunner'"
          new="testInstrumentationRunner 'com.example.einsteingame.ClumiBackHomeLatencyRunner'"
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          PY
          git -C source diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 34 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-34' 'build-tools;34.0.0' 'system-images;android-34;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force --name "$AVD_NAME" --package 'system-images;android-34;google_apis;x86_64' --device 'pixel_6' >/dev/null

      - name: Build app and diagnostic instrumentation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb shell wm density 320
          adb shell wm size 720x1600
          adb shell input keyevent 82 || true

      - name: Install APKs
        shell: bash
        run: |
          set -euo pipefail
          adb install -r source/app/build/outputs/apk/debug/app-debug.apk
          adb install -r source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list instrumentation | grep -F 'com.example.einsteingame.ClumiBackHomeLatencyRunner'

      - name: Measure Back to Home latency
        shell: bash
        run: |
          set -euo pipefail
          adb shell am instrument -w -r com.example.einsteingame.test/com.example.einsteingame.ClumiBackHomeLatencyRunner | tee latency.log
          grep -F 'CLUMI_BACK_HOME_STATUS=PASS' latency.log
          grep -F 'CLUMI_BACK_HOME_SAMPLE origin=stages' latency.log
          grep -F 'CLUMI_BACK_HOME_SAMPLE origin=rewards' latency.log
          grep -F 'CLUMI_BACK_HOME_SAMPLE origin=settings' latency.log
          grep -F 'CLUMI_BACK_HOME_SAMPLE origin=start' latency.log
          grep -F 'ready_fallbacks=0' latency.log

      - name: Restore source workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C source restore app/build.gradle app/src/androidTest
          git -C source clean -fd -- app/src/androidTest/java/com/example/einsteingame
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Back-Home-Latency-After-Readiness-Fix
          path: |
            latency.log
            emulator.log
          retention-days: 14
          if-no-files-found: warn
