name: Einstein Campaign Phase2 Stage122 Proof Integration V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-phase2-stage122-proof-integration-v1.yml'

permissions:
  contents: read

jobs:
  phase2-stage122-proof-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 2c82927e58eaf5607fb4130f6ce38ee0569fe36f
      BANK_BRANCH: campaign-production-2000-bank-v1
    steps:
      - name: Checkout exact proof-integrated Phase 2 source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 2c82927e58eaf5607fb4130f6ce38ee0569fe36f
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout live Bank read-only
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run guarded 121-122 proof-integrated dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/EinsteinGame"
          echo "liveBankHead=$(git -C "$GITHUB_WORKSPACE/ProductionStore" rev-parse HEAD)"

          CLASSES=/tmp/einstein-phase2-proof-integration-classes
          SOURCES=/tmp/einstein-phase2-proof-integration-sources.txt
          SCRATCH=/tmp/einstein-phase2-proof-integration-bank
          rm -rf "$CLASSES" "$SOURCES" "$SCRATCH"
          mkdir -p "$CLASSES"

          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2ProducerV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2FutureSkillGuardDryRunV1.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo PHASE2_STAGE122_PROOF_INTEGRATION_COMPILE=PASS

          python3 - <<'PY'
          import importlib.util, json
          p='tools/campaign-production-2000/campaign_production_2000.py'
          spec=importlib.util.spec_from_file_location('cp2000',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for n in (121,122):
              with open(f'/tmp/einstein-stage-{n:04d}.json','w',encoding='utf-8') as f:
                  json.dump(m.stage_plan(n),f,sort_keys=True,separators=(',',':')); f.write('\n')
          PY

          cp -a "$GITHUB_WORKSPACE/ProductionStore/production/campaign-2000-bank-v1/bank" "$SCRATCH"
          touch "$SCRATCH/.phase2-dryrun-scratch"
          export EINSTEIN_PHASE2_DRYRUN=true
          export EINSTEIN_PRODUCTION_BANK_ROOT="$SCRATCH"
          export EINSTEIN_STAGE_121_REQUEST=/tmp/einstein-stage-0121.json
          export EINSTEIN_STAGE_122_REQUEST=/tmp/einstein-stage-0122.json

          java -Xmx8g -cp "$CLASSES" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Phase2FutureSkillGuardDryRunV1
          echo PHASE2_STAGE122_PROOF_INTEGRATION_DRYRUN=PASS
