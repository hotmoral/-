name: Einstein Pre4 Runtime Memory Optimization Zero-Draw V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-runtime-memory-optimization-zero-draw-v3.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-runtime-memory-optimization-zero-draw-v3
  cancel-in-progress: false

jobs:
  validate-and-publish-candidate:
    if: >-
      github.event.head_commit.message == 'ci: rerun Einstein pre4 zero-draw optimization with IA cwd fix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: bddc1e741252eec7793d9064a607c495c006ce9c
      CANDIDATE_BRANCH: pre4-zero-draw-runtime-memory-optimization-v1
      BASE_CLASSES: /tmp/einstein-pre4-base-classes
      CANDIDATE_CLASSES: /tmp/einstein-pre4-candidate-classes
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: main
          path: Harness
          persist-credentials: false

      - name: Correct IA fixture working directory in local harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Harness/scripts/einstein-pre4-runtime-memory-optimize.sh')
          s=p.read_text()
          old='java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.PssPathExplorerTest | tee /tmp/pre4-path.log\njava -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionTest'
          new='java -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.PssPathExplorerTest | tee /tmp/pre4-path.log\ncd puzzle-authoring\njava -Xmx2g -cp "$CANDIDATE_CLASSES" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionTest'
          if s.count(old)!=1: raise SystemExit('IA cwd insertion anchor mismatch')
          s=s.replace(old,new,1)
          old2="grep -F 'IntentAcquisitionCheckpointTest PASS assertions=12' /tmp/pre4-checkpoint.log\n\ngit config user.name"
          new2="grep -F 'IntentAcquisitionCheckpointTest PASS assertions=12' /tmp/pre4-checkpoint.log\ncd ..\n\ngit config user.name"
          if s.count(old2)!=1: raise SystemExit('IA cwd restore anchor mismatch')
          p.write_text(s.replace(old2,new2,1))
          PY

      - name: Checkout exact accepted Einstein source with write credential
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bddc1e741252eec7793d9064a607c495c006ce9c
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run corrected zero-draw optimization harness
        shell: bash
        run: bash Harness/scripts/einstein-pre4-runtime-memory-optimize.sh
