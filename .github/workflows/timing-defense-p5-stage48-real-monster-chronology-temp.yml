name: Timing Defense P5 Stage48 real-monster chronology temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-check
    paths:
      - .github/workflows/timing-defense-p5-stage48-real-monster-chronology-temp.yml

permissions:
  contents: write

jobs:
  chronology-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-check
          fetch-depth: 1
      - name: Run chronology search twice
        shell: bash
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p5_stage48_real_monster_chronology_search_temp.py > /tmp/p5_stage48_real_search_1.json
          cp p5_stage48_real_monster_chronology_search_temp.json /tmp/p5_stage48_real_result_1.json
          python3 tools/run_p5_stage48_real_monster_chronology_search_temp.py > /tmp/p5_stage48_real_search_2.json
          cmp /tmp/p5_stage48_real_result_1.json p5_stage48_real_monster_chronology_search_temp.json
          sha256sum /tmp/p5_stage48_real_result_1.json p5_stage48_real_monster_chronology_search_temp.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('p5_stage48_real_monster_chronology_search_temp.json')
          d=json.loads(p.read_text())
          compact={
            'version':d['version'],
            'sourceCanonicalHead':d['sourceCanonicalHead'],
            'physicalSpawnX':d['physicalSpawnX'],
            'stage48CycleSecondsHeldFixed':d['stage48CycleSecondsHeldFixed'],
            'tankCoefficientForCrossClassSearch':d['tankCoefficientForCrossClassSearch'],
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'variants':{}
          }
          for name,v in d['variants'].items():
            compact['variants'][name]={
              'stage48Packet':v['stage48Packet'],
              'aggregate':v['aggregate'],
              'stage48Rows':[
                {
                  'class':r['class'],'profile':r['profile'],'settledThroughStage49':r['settledThroughStage49'],
                  'finalWall':r['finalWall'],
                  'stage48':next((s for s in r['stages'] if s['stage']==48),None)
                } for r in v['rows']
              ]
            }
          Path('p5_stage48_real_monster_chronology_search_temp_compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add p5_stage48_real_monster_chronology_search_temp_compact.json
          git commit -m "[skip ci] Temp Stage48 real-monster chronology result"
          git push origin HEAD:timing-defense-workspace-temp-check
