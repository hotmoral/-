name: ReceiptLedger V1 Target API 36 Core
on:
  push:
    branches: ['receiptledger/run-v1-target-api36-core-20261015']
    paths: ['receiptledger/**', '.github/workflows/receiptledger-v1-target-api36-core.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'receiptledger-v1-target-api36-${{ github.ref }}', cancel-in-progress: false }
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Ensure Android API 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13', cache-disabled: true }
      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh
      - name: Enforce Target API 36 contracts
        run: |
          set -euo pipefail
          ROOT=receiptledger/harness/android-v1
          APP="$ROOT/app"
          grep -Fq "version '8.11.1'" "$ROOT/build.gradle"
          grep -Fq 'compileSdk 36' "$APP/build.gradle"
          grep -Fq 'targetSdk 36' "$APP/build.gradle"
          grep -Fq 'minSdk 23' "$APP/build.gradle"
          grep -Fq 'JavaVersion.VERSION_17' "$APP/build.gradle"
          grep -Fq 'versionCode 19' "$APP/build.gradle"
          grep -Fq "versionName '1.0.18-target-api36-core'" "$APP/build.gradle"
          for activity in MainActivity LibraryActivity ReceiptDetailActivity PriceHistoryActivity; do
            file="$APP/src/main/java/com/receiptledger/v1/${activity}.java"
            grep -Fq 'SystemBarInsetHelper.apply(this,' "$file"
          done
          grep -Fq 'setDecorFitsSystemWindows(false)' "$APP/src/main/java/com/receiptledger/v1/ui/SystemBarInsetHelper.java"
          grep -Fq 'WindowInsets.Type.systemBars()' "$APP/src/main/java/com/receiptledger/v1/ui/SystemBarInsetHelper.java"
          if grep -RInE 'onBackPressed|OnBackPressedDispatcher|OnBackInvokedDispatcher|KEYCODE_BACK|enableOnBackInvokedCallback' "$APP/src/main"; then
            echo 'Unexpected custom back interception found'
            exit 41
          fi
          echo 'predictive_back_audit=STANDARD_ACTIVITY_BACK_ONLY' > receiptledger/predictive-back-audit.txt
      - name: Test lint and build
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
            if grep -q '\[OldTargetApi\]' "$REPORT"; then
              echo 'OldTargetApi remains after API 36 migration'
              status=42
            fi
          else
            echo 'Expected lint text report missing'
            status=43
          fi
          exit "$status"
      - name: Package and verify evidence
        run: |
          set -euo pipefail
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-target-api36-core
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-target-api36-core-debug.apk"
          unzip -t "$OUT/receiptledger-v1-target-api36-core-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then exit 51; fi
          done
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$OUT/APK_MANIFEST.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          grep -q "launchable-activity: name='com.receiptledger.v1.MainActivity'" "$OUT/APK_BADGING.txt"
          python3 - "$OUT/APK_MANIFEST.txt" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding='utf-8').read().splitlines()
          def block(name):
              needles = [f'".{name}"', f'"com.receiptledger.v1.{name}"']
              for i, line in enumerate(lines):
                  if any(n in line for n in needles):
                      return '\n'.join(lines[i:i+12])
              raise SystemExit(f'missing packaged activity {name}')
          main = block('MainActivity')
          if 'android:exported' not in main or not ('0xffffffff' in main or '(type 0x12)0x1' in main):
              raise SystemExit('MainActivity is not packaged exported=true')
          for name in ('LibraryActivity', 'ReceiptDetailActivity', 'PriceHistoryActivity'):
              b = block(name)
              if 'android:exported' not in b or '(type 0x12)0x0' not in b:
                  raise SystemExit(f'{name} is not packaged exported=false')
          print('Packaged activity export audit PASS')
          PY
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp receiptledger/predictive-back-audit.txt "$OUT/PREDICTIVE_BACK_AUDIT.txt"
          sha256sum "$OUT/receiptledger-v1-target-api36-core-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_TARGET_API36_CORE_01'
            echo "public_commit=${GITHUB_SHA}"
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.18-target-api36-core'
            echo 'version_code=19'
            echo 'edge_to_edge=SYSTEM_BAR_INSET_HELPER'
            echo 'predictive_back=STANDARD_ACTIVITY_BACK_ONLY'
            echo 'unit_tests=PASS_REQUIRED'
            echo 'lint_debug=PASS_REQUIRED'
            echo 'old_target_api=FORBIDDEN'
            echo 'network_permission=REMOVED'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/APK_MANIFEST.txt "$OUT"/PREDICTIVE_BACK_AUDIT.txt > "$OUT/EVIDENCE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: 'receiptledger-v1-target-api36-core-${{ github.run_id }}'
          path: 'receiptledger/output/v1-target-api36-core/'
          if-no-files-found: error
          retention-days: 14
