                    }else post(this::showTutorialStep);
                    return true;
                }
                return true;
            }
''' + anchor
          assert text.count(anchor)==1, 'touch anchor mismatch'
          text=text.replace(anchor,insert,1)

          p.write_text(text)
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          grep -F 'stage1.clue1.apply' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F 'tutorialItemLocation(".basketball")' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '연습: 치즈와 농구공은 다른 번호예요. 농구공을 지워보세요' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push clue-application tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: apply Stage 1 first clue in tutorial'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
