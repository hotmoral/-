name: Clumi Confirm Item Reference Match

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

jobs:
  verify-reference-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: 4847229b6509d0686d6e7b19cafbc842c2fc0366
      EXPECTED_TOP213_RGBA_SHA256: 45362585aab4c81a0f32b4ef7267e365fe00d03c0af1e331dce62e68a1420b5c
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Require credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Prove intact prefix matches approved 256 reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib,hashlib,os
          data=Path('source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png').read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8; meta={}
          for expected in (b'IHDR',b'PLTE',b'tRNS'):
              n=struct.unpack('>I',data[pos:pos+4])[0]; kind=data[pos+4:pos+8]
              assert kind==expected
              payload=data[pos+8:pos+8+n]
              stored=struct.unpack('>I',data[pos+8+n:pos+12+n])[0]
              assert stored==(zlib.crc32(kind+payload)&0xffffffff)
              meta[kind]=payload; pos+=12+n
          w,h,depth,ctype,comp,filt,interlace=struct.unpack('>IIBBBBB',meta[b'IHDR'])
          assert (w,h,depth,ctype,comp,filt,interlace)==(256,256,8,3,0,0,0)
          palette=meta[b'PLTE']; alpha=meta[b'tRNS']; palette_count=len(palette)//3
          marker=data.find(b'IDAT',pos); assert marker>=0
          rows_to_check=213; expected_raw=rows_to_check*(w+1)
          inflater=zlib.decompressobj(); raw=inflater.decompress(data[marker+4:],expected_raw)
          assert len(raw)==expected_raw
          prev=bytearray(w); cursor=0; rgba=bytearray(); filters=[]
          def paeth(a,b,c):
              p=a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c)
              return a if pa<=pb and pa<=pc else b if pb<=pc else c
          for y in range(rows_to_check):
              f=raw[cursor]; cursor+=1; filters.append(f); assert f in (0,1,2,3,4),(y,f)
              src=raw[cursor:cursor+w]; cursor+=w; row=bytearray(w)
              for x,v in enumerate(src):
                  a=row[x-1] if x else 0; b=prev[x]; c=prev[x-1] if x else 0
                  if f==0: val=v
                  elif f==1: val=(v+a)&255
                  elif f==2: val=(v+b)&255
                  elif f==3: val=(v+((a+b)//2))&255
                  else: val=(v+paeth(a,b,c))&255
                  assert val<palette_count,(y,x,val,palette_count)
                  row[x]=val
                  base=val*3
                  rgba.extend((palette[base],palette[base+1],palette[base+2],alpha[val] if val<len(alpha) else 255))
              prev=row
          digest=hashlib.sha256(bytes(rgba)).hexdigest()
          expected=os.environ['EXPECTED_TOP213_RGBA_SHA256']
          print('rows=',rows_to_check,'filters=',sorted(set(filters)),'rgba_sha256=',digest)
          assert digest==expected,(digest,expected)
          print('REFERENCE_PREFIX_MATCH=PASS')
          PY
