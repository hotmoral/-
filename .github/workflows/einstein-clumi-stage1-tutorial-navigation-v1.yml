name: Clumi Confirm Item Artwork Codec Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  reencode-confirm-item-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 4847229b6509d0686d6e7b19cafbc842c2fc0366
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Recover exact 256 rows and rebuild confirm-cell artwork as RGBA PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, hashlib

          path=Path('source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png')
          original=path.read_bytes()
          assert original[:8]==b'\x89PNG\r\n\x1a\n'

          pos=8; meta={}
          for expected in (b'IHDR',b'PLTE',b'tRNS'):
              n=struct.unpack('>I',original[pos:pos+4])[0]
              kind=original[pos+4:pos+8]
              assert kind==expected,(pos,kind,expected)
              data=original[pos+8:pos+8+n]
              stored=struct.unpack('>I',original[pos+8+n:pos+12+n])[0]
              actual=zlib.crc32(kind+data)&0xffffffff
              assert stored==actual,(kind,stored,actual)
              meta[kind]=data; pos+=12+n

          width,height,depth,color_type,compression,filter_method,interlace=struct.unpack('>IIBBBBB',meta[b'IHDR'])
          assert (width,height,depth,color_type,compression,filter_method,interlace)==(256,256,8,3,0,0,0)
          palette=meta[b'PLTE']; transparency=meta[b'tRNS']
          palette_count=len(palette)//3
          assert 1<=palette_count<=256 and len(palette)%3==0

          marker=original.find(b'IDAT',pos)
          assert marker>=pos and marker>=4
          declared=struct.unpack('>I',original[marker-4:marker])[0]
          data_start=marker+4
          stream_tail=original[data_start:]
          expected_raw=height*(width+1)

          # Stop decompression exactly at the byte count implied by the trusted IHDR.
          inflater=zlib.decompressobj()
          raw=inflater.decompress(stream_tail,expected_raw)
          assert len(raw)==expected_raw,(len(raw),expected_raw)
          consumed=len(stream_tail)-len(inflater.unconsumed_tail)-len(inflater.unused_data)
          print('file_bytes=',len(original),'idat_marker=',marker,'declared=',declared,
                'tail_bytes=',len(stream_tail),'raw_bytes=',len(raw),'consumed_input=',consumed,
                'unconsumed_tail=',len(inflater.unconsumed_tail),'zlib_eof=',inflater.eof,
                'iend_at=',original.rfind(b'IEND'))
          assert consumed>0 and len(inflater.unconsumed_tail)>0

          # Prove that all 256 complete scanlines are structurally valid indexed-PNG rows.
          rows=[]; prev=bytearray(width); p=0; filters=[]; max_index=0
          def paeth(a,b,c):
              q=a+b-c; pa=abs(q-a); pb=abs(q-b); pc=abs(q-c)
              return a if pa<=pb and pa<=pc else b if pb<=pc else c
          for y in range(height):
              f=raw[p]; p+=1; filters.append(f)
              assert f in (0,1,2,3,4),('filter',f,y)
              src=raw[p:p+width]; p+=width
              assert len(src)==width
              row=bytearray(width)
              for x,v in enumerate(src):
                  a=row[x-1] if x else 0; b=prev[x]; c=prev[x-1] if x else 0
                  if f==0: val=v
                  elif f==1: val=(v+a)&255
                  elif f==2: val=(v+b)&255
                  elif f==3: val=(v+((a+b)//2))&255
                  else: val=(v+paeth(a,b,c))&255
                  assert val<palette_count,('palette-index',val,y,x,palette_count)
                  max_index=max(max_index,val); row[x]=val
              rows.append(row); prev=row
          assert p==expected_raw and len(rows)==height
          print('filters=',sorted(set(filters)),'palette_count=',palette_count,'max_index=',max_index)

          rgba=bytearray(); rgba_scanlines=bytearray()
          for row in rows:
              rgba_scanlines.append(0)
              for idx in row:
                  b=idx*3
                  px=bytes((palette[b],palette[b+1],palette[b+2],transparency[idx] if idx<len(transparency) else 255))
                  rgba.extend(px); rgba_scanlines.extend(px)
          assert len(rgba)==width*height*4

          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          rebuilt=b'\x89PNG\r\n\x1a\n'
          rebuilt+=chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,6,0,0,0))
          rebuilt+=chunk(b'IDAT',zlib.compress(bytes(rgba_scanlines),9))
          rebuilt+=chunk(b'IEND',b'')
          assert rebuilt!=original

          # Self-validate every output chunk and exact RGBA scanline payload.
          q=8; seen=[]; output_idat=[]
          while q<len(rebuilt):
              n=struct.unpack('>I',rebuilt[q:q+4])[0]; kind=rebuilt[q+4:q+8]
              data=rebuilt[q+8:q+8+n]
              stored=struct.unpack('>I',rebuilt[q+8+n:q+12+n])[0]
              assert stored==(zlib.crc32(kind+data)&0xffffffff)
              seen.append(kind)
              if kind==b'IDAT': output_idat.append(data)
              q+=12+n
              if kind==b'IEND': break
          assert q==len(rebuilt)
          assert seen==[b'IHDR',b'IDAT',b'IEND']
          assert zlib.decompress(b''.join(output_idat))==bytes(rgba_scanlines)

          path.write_bytes(rebuilt)
          print('rgba_sha256=',hashlib.sha256(bytes(rgba)).hexdigest())
          print('old_bytes=',len(original),'new_bytes=',len(rebuilt))
          PY
          file source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png | grep -F 'RGBA'
          identify source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png | grep -F '256x256'
          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          test "$(git -C source status --porcelain | sed 's/^...//')" = 'app/src/main/assets/ui/b3-r5/item_confirm_cell.png'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Build fresh debug APK with recovered artwork
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and push artwork codec fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          test "$(git -C source status --porcelain | sed 's/^...//')" = 'app/src/main/assets/ui/b3-r5/item_confirm_cell.png'
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/assets/ui/b3-r5/item_confirm_cell.png
          git -C source commit -m 'fix: reencode confirm-cell item artwork'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
