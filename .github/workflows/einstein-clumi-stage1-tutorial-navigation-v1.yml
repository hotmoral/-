name: Clumi Tutorial Candidate Panel Step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-candidate-panel-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 9bd9bf38e9629f29727431ded17b45a1714870ac
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply candidate-panel tutorial page only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('source/app/src/main/java/com/example/einsteingame/GameView.java')
          text=p.read_text()

          old="\n".join([
              '            else if(!policy.seenBefore("stage1.cellselect"))tutorialStep=2;',
              '            else return;',
              ''
          ])
          new="\n".join([
              '            else if(!policy.seenBefore("stage1.cellselect"))tutorialStep=2;',
              '            else if(!policy.seenBefore("stage1.candidates"))tutorialStep=3;',
              '            else return;',
              ''
          ])
          assert text.count(old)==1, 'resume anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '        if(tutorialStep==2){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialCellBounds(),null,"확인하고 싶은 칸을 눌러보세요",true,false);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<2)tutorialStep++;',
              '        else return;',
              '        post(this::showTutorialStep);',
              '    }',
              ''
          ])
          new="\n".join([
              '        if(tutorialStep==2){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialCellBounds(),null,"확인하고 싶은 칸을 눌러보세요",true,false);return;',
              '        }',
              '        if(tutorialStep==3){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,"stage1.candidates","이 칸에 들어갈 수 있는 후보들이에요",true,true);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<3)tutorialStep++;',
              '        else {tutorialCueShowing=false;tutorialStep=-2;return;}',
              '        post(this::showTutorialStep);',
              '    }',
              ''
          ])
          assert text.count(old)==1, 'tutorial step anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '                    if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.cellselect");',
              '                    tutorialStep=-2;if(listener!=null)listener.changed();invalidate();',
              ''
          ])
          new="\n".join([
              '                    if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.cellselect");',
              '                    tutorialStep=3;if(listener!=null)listener.changed();invalidate();post(this::showTutorialStep);',
              ''
          ])
          assert text.count(old)==1, 'cell completion anchor mismatch'
          text=text.replace(old,new,1)

          p.write_text(text)
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          grep -F 'stage1.candidates' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '이 칸에 들어갈 수 있는 후보들이에요' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push candidate-panel tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: add Stage 1 candidate panel tutorial step'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
