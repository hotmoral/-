name: Clumi Tutorial Candidate Removal Step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-candidate-removal-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: fd6c6914c5beca59ee238801fa06c073a79ff555
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply Stage 1 candidate-removal tutorial only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('source/app/src/main/java/com/example/einsteingame')
          game=root/'GameView.java'
          text=game.read_text()

          old="\n".join([
              '            else if(!policy.seenBefore("stage1.candidates"))tutorialStep=3;',
              '            else return;',
              ''
          ])
          new="\n".join([
              '            else if(!policy.seenBefore("stage1.candidates"))tutorialStep=3;',
              '            else if(!policy.seenBefore("stage1.candidate.remove"))tutorialStep=4;',
              '            else return;',
              ''
          ])
          assert text.count(old)==1, 'resume anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '    private void showTutorialStep(){'
          ])
          new="\n".join([
              '    private int tutorialCheeseSlot(){',
              '        for(int slot=0;slot<GameState.SIZE;slot++){',
              '            String id=state.itemId(0,slot);',
              '            if(id!=null&&id.endsWith(".cheese"))return slot;',
              '        }',
              '        return -1;',
              '    }',
              '    private void showTutorialStep(){'
          ])
          assert text.count(old)==1, 'helper anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '        if(tutorialStep==3){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,"stage1.candidates","이 칸에 들어갈 수 있는 후보들이에요",true,true);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<3)tutorialStep++;',
              '        else {tutorialCueShowing=false;tutorialStep=-2;return;}',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          new="\n".join([
              '        if(tutorialStep==3){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,"stage1.candidates","이 칸에 들어갈 수 있는 후보들이에요",true,true);return;',
              '        }',
              '        if(tutorialStep==4){',
              '            state.select(0,2);',
              '            int cheese=tutorialCheeseSlot();',
              '            if(cheese<0||!state.isUserCandidatePresent(0,2,cheese)){',
              '                tutorialPolicy.seen("stage1.candidate.remove");tutorialStep=-2;return;',
              '            }',
              '            if(state.singleCandidateSlot(0,2)==cheese){',
              '                tutorialPolicy.seen("stage1.candidate.remove");tutorialStep=-2;return;',
              '            }',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,null,"연습: 3번은 치즈로 정하고 나머지를 지워보세요",true,false);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<4)tutorialStep++;',
              '        else return;',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          assert text.count(old)==1, 'tutorial step anchor mismatch'
          text=text.replace(old,new,1)

          anchor="\n".join([
              '            if(nav==ClumiFeedbackController.TutorialNav.PREVIOUS||nav==ClumiFeedbackController.TutorialNav.NEXT||nav==ClumiFeedbackController.TutorialNav.MESSAGE){'
          ])
          insert="\n".join([
              '            if(tutorialStep==4){',
              '                if(nav==ClumiFeedbackController.TutorialNav.PREVIOUS){',
              '                    tutorialCueShowing=false;if(feel!=null)feel.beginInput();moveTutorial(-1);return true;',
              '                }',
              '                int cheese=tutorialCheeseSlot();',
              '                for(int slot=0;slot<GameState.SIZE;slot++)if(candidateSlot(slot).contains(x,y)){',
              '                    if(slot==cheese||!state.isUserCandidatePresent(state.selectedRow,state.selectedColumn,slot))return true;',
              '                    tutorialCueShowing=false;if(feel!=null)feel.beginInput();',
              '                    trace.capture(state);captureRaw();',
              '                    boolean wasContradictory=state.hasPlacementContradiction();',
              '                    boolean present=state.isCandidatePresent(state.selectedRow,state.selectedColumn,slot);',
              '                    if(state.toggleCandidate(slot)){',
              '                        if(feel!=null)feel.emit(this,present?ClumiFeedbackEvent.CANDIDATE_REMOVED:ClumiFeedbackEvent.CANDIDATE_RESTORED,state.selectedRow,state.selectedColumn,slot);',
              '                        presentMutation(false);onCandidateChanged(wasContradictory);',
              '                        if(listener!=null)listener.changed();',
              '                        if(state.singleCandidateSlot(state.selectedRow,state.selectedColumn)==cheese){',
              '                            if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.candidate.remove");',
              '                            tutorialStep=-2;',
              '                        }else post(this::showTutorialStep);',
              '                        invalidate();',
              '                    }else post(this::showTutorialStep);',
              '                    return true;',
              '                }',
              '                return true;',
              '            }',
              anchor
          ])
          assert text.count(anchor)==1, 'touch anchor mismatch'
          text=text.replace(anchor,insert,1)
          game.write_text(text)

          focus=root/'ClumiFocusLayer.java'
          text=focus.read_text()
          old='            canvas.drawText(tutorialNext?"탭해서 계속":"강조된 칸을 터치",cueX+10*d,cueY-(paint.ascent()+paint.descent())/2,paint);'
          new="\n".join([
              '            String tutorialCue=tutorialNext?"탭해서 계속":(label!=null&&label.startsWith("연습:")?"후보를 터치":"강조된 칸을 터치");',
              '            canvas.drawText(tutorialCue,cueX+10*d,cueY-(paint.ascent()+paint.descent())/2,paint);'
          ])
          assert text.count(old)==1, 'focus cue anchor mismatch'
          focus.write_text(text.replace(old,new,1))
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 2
          grep -F 'stage1.candidate.remove' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '연습: 3번은 치즈로 정하고 나머지를 지워보세요' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '후보를 터치' source/app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push candidate-removal tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 2
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add \
            app/src/main/java/com/example/einsteingame/GameView.java \
            app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java
          git -C source commit -m 'ui: add Stage 1 candidate removal tutorial step'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
