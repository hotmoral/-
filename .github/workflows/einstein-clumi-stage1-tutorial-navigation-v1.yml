name: Clumi Confirm Item Exact Asset Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  repair-confirm-item:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 4847229b6509d0686d6e7b19cafbc842c2fc0366
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      EXPECTED_TOP213_RGBA_SHA256: 45362585aab4c81a0f32b4ef7267e365fe00d03c0af1e331dce62e68a1420b5c
      EXPECTED_FULL_RGBA_SHA256: 2485a667e93aab8102e467436665f5d807f3591ae9a90513e1c276f4c1794eed
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
      BOTTOM43_ZLIB_B64: 
    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Restore exact approved confirm-cell pixels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,os,struct,zlib
          path=Path('source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png')
          data=path.read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8; meta={}
          for expected in (b'IHDR',b'PLTE',b'tRNS'):
              n=struct.unpack('>I',data[pos:pos+4])[0]; kind=data[pos+4:pos+8]; assert kind==expected
              payload=data[pos+8:pos+8+n]
              assert struct.unpack('>I',data[pos+8+n:pos+12+n])[0]==(zlib.crc32(kind+payload)&0xffffffff)
              meta[kind]=payload; pos+=12+n
          w,h,depth,ctype,comp,filt,interlace=struct.unpack('>IIBBBBB',meta[b'IHDR'])
          assert (w,h,depth,ctype,comp,filt,interlace)==(256,256,8,3,0,0,0)
          palette=meta[b'PLTE']; alpha=meta[b'tRNS']; palette_count=len(palette)//3
          marker=data.find(b'IDAT',pos); assert marker>=0
          rows=213; raw=zlib.decompressobj().decompress(data[marker+4:],rows*(w+1)); assert len(raw)==rows*(w+1)
          prev=bytearray(w); cur=0; top=bytearray()
          def paeth(a,b,c):
              p=a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c)
              return a if pa<=pb and pa<=pc else b if pb<=pc else c
          for y in range(rows):
              f=raw[cur]; cur+=1; assert f in (0,1,2,3,4)
              src=raw[cur:cur+w]; cur+=w; row=bytearray(w)
              for x,v in enumerate(src):
                  a=row[x-1] if x else 0; b=prev[x]; c=prev[x-1] if x else 0
                  if f==0: val=v
                  elif f==1: val=(v+a)&255
                  elif f==2: val=(v+b)&255
                  elif f==3: val=(v+((a+b)//2))&255
                  else: val=(v+paeth(a,b,c))&255
                  assert val<palette_count; row[x]=val
                  p=val*3; top.extend((palette[p],palette[p+1],palette[p+2],alpha[val] if val<len(alpha) else 255))
              prev=row
          assert hashlib.sha256(top).hexdigest()==os.environ['EXPECTED_TOP213_RGBA_SHA256']
          bottom=zlib.decompress(base64.b64decode(os.environ['BOTTOM43_ZLIB_B64']))
          assert len(bottom)==43*w*4
          rgba=bytes(top)+bottom
          assert len(rgba)==w*h*4
          assert hashlib.sha256(rgba).hexdigest()==os.environ['EXPECTED_FULL_RGBA_SHA256']
          scan=bytearray()
          for y in range(h): scan.append(0); scan.extend(rgba[y*w*4:(y+1)*w*4])
          def chunk(kind,payload):
              return struct.pack('>I',len(payload))+kind+payload+struct.pack('>I',zlib.crc32(kind+payload)&0xffffffff)
          out=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(scan),9))+chunk(b'IEND',b'')
          path.write_bytes(out)
          print('RESTORED_FULL_RGBA_SHA256='+hashlib.sha256(rgba).hexdigest())
          print('RESTORED_PNG_SHA256='+hashlib.sha256(out).hexdigest())
          PY
          file source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png | grep -F 'RGBA'
          identify source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png | grep -F '256x256'
          identify source/app/src/main/assets/ui/b3-r5/item_undo.png | grep -F '256x256'
          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          test "$(git -C source status --porcelain | sed 's/^...//')" = 'app/src/main/assets/ui/b3-r5/item_confirm_cell.png'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Build debug APK with restored artwork
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and push exact asset repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          test "$(git -C source status --porcelain | sed 's/^...//')" = 'app/src/main/assets/ui/b3-r5/item_confirm_cell.png'
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/assets/ui/b3-r5/item_confirm_cell.png
          git -C source commit -m 'fix: restore confirm-cell item PNG'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
