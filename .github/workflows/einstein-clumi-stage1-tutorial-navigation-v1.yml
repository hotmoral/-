name: Clumi Tutorial Timer Step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-timer-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 307212032aa590d71666da359cba443f351e25a8
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply Stage 1 timer tutorial only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('source/app/src/main/java/com/example/einsteingame/GameView.java')
          text=p.read_text()

          old='            else if(!policy.seenBefore("stage1.filters.completed"))tutorialStep=10;\n            else return;'
          new='            else if(!policy.seenBefore("stage1.filters.completed"))tutorialStep=10;\n            else if(!policy.seenBefore("stage1.timer"))tutorialStep=11;\n            else return;'
          assert text.count(old)==1, 'resume anchor mismatch'
          text=text.replace(old,new,1)

          old='        if(tutorialStep==10){\n            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(2),"stage1.filters.completed","완료: 사용완료한 단서를 숨기거나 다시 보여줘요",true,true);\n        }\n    }\n    private void moveTutorial(int direction){\n        if(direction<0){if(tutorialStep>0)tutorialStep--;}\n        else if(tutorialStep<10)tutorialStep++;\n        else {tutorialCueShowing=false;tutorialStep=-2;return;}\n        post(this::showTutorialStep);\n    }'
          new='        if(tutorialStep==10){\n            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(2),"stage1.filters.completed","완료: 사용완료한 단서를 숨기거나 다시 보여줘요",true,true);return;\n        }\n        if(tutorialStep==11){\n            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,timerPanel,"stage1.timer","여기에서 현재 플레이 시간을 확인할 수 있어요",true,true);\n        }\n    }\n    private void moveTutorial(int direction){\n        if(direction<0){if(tutorialStep>0)tutorialStep--;}\n        else if(tutorialStep<11)tutorialStep++;\n        else {tutorialCueShowing=false;tutorialStep=-2;return;}\n        post(this::showTutorialStep);\n    }'
          assert text.count(old)==1, 'tutorial step anchor mismatch'
          text=text.replace(old,new,1)

          p.write_text(text)
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          grep -F 'stage1.timer' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '여기에서 현재 플레이 시간을 확인할 수 있어요' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push timer tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: explain Stage 1 timer in tutorial'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
