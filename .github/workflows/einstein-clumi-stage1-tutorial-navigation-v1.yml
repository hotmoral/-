name: Clumi Tutorial Navigation Controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-tutorial-navigation:
    if: >-
      github.event.head_commit.message == 'ui: Clumi tutorial navigation controls step retry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 9e0ea3f449054863653ca2c52a9584f186fc8272
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply tutorial navigation controls only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/clumi_tutorial_nav_patch.py
          python3 /tmp/clumi_tutorial_nav_patch.py
          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 4
          grep -F '탭해서 계속' source/app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java
          grep -F 'TutorialNav { NONE, PREVIOUS, NEXT, MESSAGE }' source/app/src/main/java/com/example/einsteingame/ClumiFeedbackController.java
          grep -F 'showTutorialPage' source/app/src/main/java/com/example/einsteingame/ClumiSpotlightPolicy.java
          grep -F 'moveTutorial' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push tutorial navigation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 4
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java app/src/main/java/com/example/einsteingame/ClumiFeedbackController.java app/src/main/java/com/example/einsteingame/ClumiSpotlightPolicy.java app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: add tutorial previous next navigation'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
