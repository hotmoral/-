name: Clumi Tutorial Clue Completion Step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-clue-completion-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: f60a1ff5a35e7a3f60a7a4f0a057f7e9edd330fb
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply Stage 1 clue-completion tutorial only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('source/app/src/main/java/com/example/einsteingame')
          game=root/'GameView.java'
          text=game.read_text()

          old="\n".join([
              '            else if(!policy.seenBefore("stage1.clue1.apply"))tutorialStep=5;',
              '            else return;'
          ])
          new="\n".join([
              '            else if(!policy.seenBefore("stage1.clue1.apply"))tutorialStep=5;',
              '            else if(!policy.seenBefore("stage1.clue1.complete"))tutorialStep=6;',
              '            else return;'
          ])
          assert text.count(old)==1, 'resume anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '            if(!state.isUserCandidatePresent(basketball[0],2,basketball[1])){',
              '                tutorialPolicy.seen("stage1.clue1.apply");tutorialStep=-2;return;',
              '            }',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,null,"연습: 치즈와 농구공은 다른 번호예요. 농구공을 지워보세요",false,false);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<5)tutorialStep++;',
              '        else return;',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          new="\n".join([
              '            if(!state.isUserCandidatePresent(basketball[0],2,basketball[1])){',
              '                tutorialPolicy.seen("stage1.clue1.apply");tutorialStep=6;post(this::showTutorialStep);return;',
              '            }',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,candidatePanel,null,"연습: 치즈와 농구공은 다른 번호예요. 농구공을 지워보세요",false,false);return;',
              '        }',
              '        if(tutorialStep==6){',
              '            GameState.Clue clue=state.displayedClue();',
              '            if(clue==null||clue.completed){tutorialPolicy.seen("stage1.clue1.complete");tutorialStep=-2;return;}',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,clueButtons[1],null,"단서를 다 활용했다면 사용완료를 눌러 표시해두세요",false,false);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<6)tutorialStep++;',
              '        else return;',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          assert text.count(old)==1, 'tutorial step anchor mismatch'
          text=text.replace(old,new,1)

          old="\n".join([
              '                        if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.clue1.apply");',
              '                        tutorialStep=-2;invalidate();'
          ])
          new="\n".join([
              '                        if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.clue1.apply");',
              '                        tutorialStep=6;invalidate();post(this::showTutorialStep);'
          ])
          assert text.count(old)==1, 'clue application completion anchor mismatch'
          text=text.replace(old,new,1)

          anchor='            if(nav==ClumiFeedbackController.TutorialNav.PREVIOUS||nav==ClumiFeedbackController.TutorialNav.NEXT||nav==ClumiFeedbackController.TutorialNav.MESSAGE){'
          insert="\n".join([
              '            if(tutorialStep==6){',
              '                if(clueButtons[1].contains(x,y)){',
              '                    tutorialCueShowing=false;if(feel!=null)feel.beginInput();',
              '                    GameState.Clue before=state.displayedClue();int clueIndex=state.currentClue;',
              '                    if(before!=null&&!before.completed){',
              '                        state.toggleCompleted();seenItem("clue");',
              '                        if(feel!=null)feel.clue(this,before.completed?ClumiFeedbackEvent.CLUE_COMPLETED:ClumiFeedbackEvent.CLUE_RESTORED,clueIndex,state.hideCompleted&&before.completed);',
              '                    }',
              '                    if(tutorialPolicy!=null)tutorialPolicy.seen("stage1.clue1.complete");',
              '                    tutorialStep=-2;if(listener!=null)listener.changed();invalidate();return true;',
              '                }',
              '                return true;',
              '            }',
              anchor
          ])
          assert text.count(anchor)==1, 'touch anchor mismatch'
          text=text.replace(anchor,insert,1)
          game.write_text(text)

          focus=root/'ClumiFocusLayer.java'
          text=focus.read_text()
          old='            String tutorialCue=tutorialNext?"탭해서 계속":(label!=null&&label.startsWith("연습:")?"후보를 터치":"강조된 칸을 터치");'
          new='            String tutorialCue=tutorialNext?"탭해서 계속":(label!=null&&label.startsWith("연습:")?"후보를 터치":label!=null&&label.contains("사용완료")?"버튼을 터치":"강조된 칸을 터치");'
          assert text.count(old)==1, 'focus cue anchor mismatch'
          focus.write_text(text.replace(old,new,1))
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 2
          grep -F 'stage1.clue1.complete' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '단서를 다 활용했다면 사용완료를 눌러 표시해두세요' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '"버튼을 터치"' source/app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push clue-completion tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 2
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add \
            app/src/main/java/com/example/einsteingame/GameView.java \
            app/src/main/java/com/example/einsteingame/ClumiFocusLayer.java
          git -C source commit -m 'ui: add Stage 1 clue completion tutorial step'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
