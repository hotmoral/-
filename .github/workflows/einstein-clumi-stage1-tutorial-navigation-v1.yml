name: Clumi Tutorial Clue Filter Step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-clue-filter-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 7892ba608dc8e71c2e67808d118950b93e62d65c
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply Stage 1 clue-filter tutorial only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('source/app/src/main/java/com/example/einsteingame/GameView.java')
          text=p.read_text()

          old='            else if(!policy.seenBefore("stage1.clue1.complete"))tutorialStep=6;\n            else return;'
          new='            else if(!policy.seenBefore("stage1.clue1.complete"))tutorialStep=6;\n            else if(!policy.seenBefore("stage1.filters.overview"))tutorialStep=7;\n            else if(!policy.seenBefore("stage1.filters.positive"))tutorialStep=8;\n            else if(!policy.seenBefore("stage1.filters.negative"))tutorialStep=9;\n            else if(!policy.seenBefore("stage1.filters.completed"))tutorialStep=10;\n            else return;'
          assert text.count(old)==1, 'resume anchor mismatch'
          text=text.replace(old,new,1)

          anchor='    private void showTutorialStep(){'
          helper='\n'.join([
              '    private RectF tutorialFilterBounds(int index){',
              '        float width=filters.width()*ClumiVisualTokens.FILTER_FRACTION;',
              '        if(index<0)return new RectF(filters.left,filters.top,filters.left+width,filters.bottom);',
              '        float segment=width/3f;',
              '        return new RectF(filters.left+index*segment,filters.top,filters.left+(index+1)*segment,filters.bottom);',
              '    }',
              anchor
          ])
          assert text.count(anchor)==1, 'show helper anchor mismatch'
          text=text.replace(anchor,helper,1)

          old='\n'.join([
              '        if(tutorialStep==6){',
              '            GameState.Clue clue=state.displayedClue();',
              '            if(clue==null||clue.completed){tutorialPolicy.seen("stage1.clue1.complete");tutorialStep=-2;return;}',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,clueButtons[1],null,"단서를 다 활용했다면 사용완료를 눌러 표시해두세요",false,false);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<6)tutorialStep++;',
              '        else return;',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          new='\n'.join([
              '        if(tutorialStep==6){',
              '            GameState.Clue clue=state.displayedClue();',
              '            if(clue==null||clue.completed){tutorialPolicy.seen("stage1.clue1.complete");tutorialStep=7;post(this::showTutorialStep);return;}',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,clueButtons[1],null,"단서를 다 활용했다면 사용완료를 눌러 표시해두세요",false,false);return;',
              '        }',
              '        if(tutorialStep==7){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(-1),"stage1.filters.overview","단서가 많아지면 필요한 종류만 골라 볼 수 있어요",false,true);return;',
              '        }',
              '        if(tutorialStep==8){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(0),"stage1.filters.positive","긍정: 같은 번호 단서를 숨기거나 다시 보여줘요",true,true);return;',
              '        }',
              '        if(tutorialStep==9){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(1),"stage1.filters.negative","부정: 다른 번호 단서를 숨기거나 다시 보여줘요",true,true);return;',
              '        }',
              '        if(tutorialStep==10){',
              '            tutorialCueShowing=tutorialPolicy.showTutorialPage(this,tutorialFilterBounds(2),"stage1.filters.completed","완료: 사용완료한 단서를 숨기거나 다시 보여줘요",true,true);',
              '        }',
              '    }',
              '    private void moveTutorial(int direction){',
              '        if(direction<0){if(tutorialStep>0)tutorialStep--;}',
              '        else if(tutorialStep<10)tutorialStep++;',
              '        else {tutorialCueShowing=false;tutorialStep=-2;return;}',
              '        post(this::showTutorialStep);',
              '    }'
          ])
          assert text.count(old)==1, 'tutorial step anchor mismatch'
          text=text.replace(old,new,1)

          old='                    tutorialStep=-2;if(listener!=null)listener.changed();invalidate();return true;'
          new='                    tutorialStep=7;if(listener!=null)listener.changed();invalidate();post(this::showTutorialStep);return true;'
          assert text.count(old)==1, 'clue completion transition anchor mismatch'
          text=text.replace(old,new,1)

          p.write_text(text)
          PY

          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          grep -F 'stage1.filters.overview' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '긍정: 같은 번호 단서를 숨기거나 다시 보여줘요' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '부정: 다른 번호 단서를 숨기거나 다시 보여줘요' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '완료: 사용완료한 단서를 숨기거나 다시 보여줘요' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push clue-filter tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: explain Stage 1 clue filters in tutorial'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
