name: Clumi Confirm Item Fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-navigation-v1.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: 4847229b6509d0686d6e7b19cafbc842c2fc0366
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact source HEAD and fingerprint PNG
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,zlib
          p=Path('source/app/src/main/assets/ui/b3-r5/item_confirm_cell.png')
          d=p.read_bytes(); assert d[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8; chunks={}
          for expected in (b'IHDR',b'PLTE',b'tRNS'):
              n=struct.unpack('>I',d[pos:pos+4])[0]; kind=d[pos+4:pos+8]; assert kind==expected
              payload=d[pos+8:pos+8+n]
              assert struct.unpack('>I',d[pos+8+n:pos+12+n])[0]==(zlib.crc32(kind+payload)&0xffffffff)
              chunks[kind]=payload; pos+=12+n
          marker=d.find(b'IDAT',pos); assert marker>=0
          declared=struct.unpack('>I',d[marker-4:marker])[0]
          payload=d[marker+4:marker+4+declared]
          print('file_bytes',len(d),'idat_marker',marker,'declared',declared)
          for kind in (b'PLTE',b'tRNS'):
              print(kind.decode(),'len',len(chunks[kind]),'sha256',hashlib.sha256(chunks[kind]).hexdigest())
          for n in (64,128,256,512,1024,2048,4096,8192,declared):
              if n<=len(payload): print('IDAT_PREFIX',n,hashlib.sha256(payload[:n]).hexdigest())
          print('IDAT_CRC_STORED',struct.unpack('>I',d[marker+4+declared:marker+8+declared])[0] if marker+8+declared<=len(d) else None)
          print('IDAT_CRC_ACTUAL',zlib.crc32(b'IDAT'+payload)&0xffffffff)
          PY
