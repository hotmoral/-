name: Einstein Recovery Ack Runner Local Zero-Draw Preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EINSTEIN_ACK_RUNNER_LOCAL_PREFLIGHT_V1 exactly'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-recovery-ack-runner-local-preflight.yml'

permissions:
  contents: read

concurrency:
  group: einstein-recovery-ack-runner-local-preflight-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_EINSTEIN_ACK_RUNNER_LOCAL_PREFLIGHT_V1') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: validate Einstein ack recovery runner locally')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_SHA: 0b76652f4a2cdb1dfff5ba2ef6f12ddd4c1b3a78
      ACCEPTED_SOURCE_SHA: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
      FIXTURE_SHA: b34abb909dd1d154ca964423c6bde3bcb347407d
      FIXTURE_BLOB_SHA: ce555f511ca4003e95a24fbca975081c61109222
      PRIVATE_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      CLASSES_DIR: /tmp/einstein-ack-runner-classes
      SOURCES_FILE: /tmp/einstein-ack-runner-sources.txt
      PREFLIGHT_DIR: /tmp/einstein-ack-runner-preflight
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Checkout exact ack runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 0b76652f4a2cdb1dfff5ba2ef6f12ddd4c1b3a78
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 3
          persist-credentials: false

      - name: Checkout exact frozen bounded fixture
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b34abb909dd1d154ca964423c6bde3bcb347407d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: FrozenFixture
          fetch-depth: 1
          persist-credentials: false

      - name: Hard-gate source scope
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          test -z "$(git status --porcelain --untracked-files=all)"
          cd ../FrozenFixture
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          F='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java'
          test "$(git hash-object "$F")" = "$FIXTURE_BLOB_SHA"

      - name: Static safety contract
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          R='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          grep -F 'EXPECTED_REQUEST_ID="d9521bbb56be33762329546cbc13a2002859b57e2f4d606a1eeb19bf367092da"' "$R"
          grep -F 'EXPECTED_CONTEXT_ID="9efbf806670761cabd5a99a54e1066a22fb151dad496cbb381badbec204c4ad3"' "$R"
          grep -F 'EXPECTED_EMPTY_RESUME_ID="c93be4a0a319ca6f35db1ae088a0efe1c56f0072c7f51e87b8bce046fe0f6501"' "$R"
          grep -F 'EVIDENCE_BRANCH="campaign-intent-acquisition-draw0-recovery-evidence-v1"' "$R"
          grep -F 'FORMAL_REMOTE_ROOT="evidence/bounded-acquisition/draw0-recovery-invocation-2"' "$R"
          grep -F 'REMOTE_CALL_BOUNDARY_SEALED' "$R"
          grep -F 'remote acknowledgement timeout' "$R"
          grep -F 'fixture.request,fixture.context,fixture.resume' "$R" >/dev/null || true
          test "$(grep -F 'new IntentAcquisitionContinuationCoordinator().acquire' "$R" | wc -l)" -eq 1
          ! grep -F 'evaluateDraw' "$R"
          ! grep -F 'getDeclaredMethod' "$R"
          ! grep -F 'setAccessible' "$R"
          ! grep -F 'git push' "$R"
          ! grep -F 'Authorization:' "$R"
          echo STATIC_ACK_RUNNER_CONTRACT=PASS

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java 8 target
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE" "$PREFLIGHT_DIR"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          cat >> "$SOURCES_FILE" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          ../FrozenFixture/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=list(Path('/tmp/einstein-ack-runner-classes').rglob('*.class'))
          assert files
          bad=[]
          for p in files:
              magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
              if (magic,minor,major)!=(0xCAFEBABE,0,52): bad.append((str(p),major))
          assert not bad, bad[:10]
          print('JAVA8_CLASSFILE_TARGET=PASS count='+str(len(files)))
          PY

      - name: Run local ack zero-draw preflight
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
        run: |
          set -euo pipefail
          test -z "${EINSTEIN_FORMAL_RECOVERY_AUTHORIZATION:-}"
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionAckDurableRecoveryRunnerV1 preflight "$PREFLIGHT_DIR" | tee /tmp/einstein-ack-local-preflight.log
          grep -F 'ACK_DURABLE_RECOVERY_LOCAL_PREFLIGHT=PASS' /tmp/einstein-ack-local-preflight.log
          grep -F 'formalAcquisitionInvocationCount=0' /tmp/einstein-ack-local-preflight.log

      - name: Postflight
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          printf '%s\n' \
            'EINSTEIN_ACK_RUNNER_LOCAL_PREFLIGHT=PASS' \
            "runner=$RUNNER_SHA" \
            'productionSourceDelta=0' \
            'formalAcquisitionInvocation=0' \
            'artifactUpload=0' \
            'cacheUpload=0'
