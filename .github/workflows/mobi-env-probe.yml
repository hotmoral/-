name: Mobi Environment Signal Probe

on:
  workflow_dispatch:

concurrency:
  group: mobi-env-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api35-environment-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Preinstall API 35 emulator image with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          package='system-images;android-35;google_apis;x86_64'
          sdkmanager_bin="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            echo "sdkmanager not found at $sdkmanager_bin" >&2
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi
          installed=0
          for attempt in 1 2 3; do
            echo "system-image install attempt ${attempt}/3"
            set +e
            set +o pipefail
            yes | "$sdkmanager_bin" --install "$package" --channel=0
            install_rc=${PIPESTATUS[1]}
            set -o pipefail
            set -e
            if [ "$install_rc" -eq 0 ]; then
              installed=1
              break
            fi
            rm -rf "$ANDROID_SDK_ROOT/system-images/android-35/google_apis/x86_64" || true
            rm -rf "$HOME/.android/cache" || true
            sleep 5
          done
          if [ "$installed" -ne 1 ]; then
            echo "API 35 google_apis x86_64 system image failed after 3 attempts" >&2
            exit 1
          fi
          "$sdkmanager_bin" --list_installed | grep -F "$package"

      - name: Build and run public-safe API 35 environment probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          pre-emulator-launch-script: gradle --no-daemon -p mobi/harness :overlayprobe:assembleDebug :hostprobe:assembleDebug
          script: bash mobi/tools/run_env_probe.sh

      - name: Upload Mobi T0-3 environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobi-artifact-t0-env-api35-${{ github.run_id }}
          path: mobi/output/env-probe
          if-no-files-found: warn
