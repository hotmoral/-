name: Einstein Phase2 Stage125 Gate Recovery ReadOnly V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-phase2-stage125-gate-recovery-readonly-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: 73360a3629392a34195de51fb9e0a26d870d3aea
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 73360a3629392a34195de51fb9e0a26d870d3aea
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Bank read-only
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and validate Stage 125 recovery
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/EinsteinGame"
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          SCRATCH=/tmp/einstein-stage125-readonly-bank
          CLASSES=/tmp/einstein-stage125-readonly-classes
          SOURCES=/tmp/einstein-stage125-readonly-sources.txt

          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "LIVE_BANK_HEAD=$(git -C "$STORE" rev-parse HEAD)"
          cd "$SRC"

          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          store=Path('../ProductionStore/production/campaign-2000-bank-v1/bank')
          manifest=json.loads((store/'manifest.json').read_text())
          assert manifest['bankedCount']==124, manifest
          assert manifest['nextOrdinal']==125, manifest
          assert manifest['state']=='OPEN', manifest
          assert manifest['failedOrQuarantinedCount']==1, manifest
          assert manifest['acquiredPending']==[], manifest
          print('LIVE_STAGE125_FRONTIER=PASS')
          spec=importlib.util.spec_from_file_location('cp2000','tools/campaign-production-2000/campaign_production_2000.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          stage=m.stage_plan(125)
          assert stage['ordinal']==125 and stage['primarySkill']=='DIRECT_RELATION', stage
          Path('/tmp/einstein-stage-0125.json').write_text(json.dumps(stage,sort_keys=True,separators=(',',':'))+'\n')
          print('STAGE125_MACRO_REQUEST=PASS')
          PY

          rm -rf "$SCRATCH" "$CLASSES" "$SOURCES"
          cp -a "$STORE/production/campaign-2000-bank-v1/bank" "$SCRATCH"
          touch "$SCRATCH/.phase2-stage125-readonly-scratch"
          mkdir -p "$CLASSES"
          BEFORE_MANIFEST="$(sha256sum "$SCRATCH/manifest.json" | awk '{print $1}')"
          BEFORE_COUNT="$(find "$SCRATCH/stages" -maxdepth 1 -type f -name 'stage-*.json' | wc -l)"

          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES"
          cat >> "$SOURCES" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2ProducerV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2FormalProducerV1.java
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Phase2Stage125GateReadOnlyV1.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES" "@$SOURCES"
          echo RECOVERY_SOURCE_COMPILE=PASS

          export EINSTEIN_PHASE2_STAGE125_READONLY=true
          export EINSTEIN_PRODUCTION_BANK_ROOT="$SCRATCH"
          export EINSTEIN_STAGE_125_REQUEST=/tmp/einstein-stage-0125.json
          java -Xmx8g -cp "$CLASSES" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Phase2Stage125GateReadOnlyV1 | tee /tmp/stage125-readonly.log

          AFTER_MANIFEST="$(sha256sum "$SCRATCH/manifest.json" | awk '{print $1}')"
          AFTER_COUNT="$(find "$SCRATCH/stages" -maxdepth 1 -type f -name 'stage-*.json' | wc -l)"
          test "$BEFORE_MANIFEST" = "$AFTER_MANIFEST"
          test "$BEFORE_COUNT" = "$AFTER_COUNT"
          test ! -e "$SCRATCH/stages/stage-0125.json"
          grep -F 'STAGE125_POST_CP12_GATE_DRAW0=PASS' /tmp/stage125-readonly.log
          grep -F 'STAGE125_CONTINUATION_TO_DRAW1_PLUS=PASS' /tmp/stage125-readonly.log
          grep -F 'durableBankWriteInvoked=false' /tmp/stage125-readonly.log
          grep -F 'manifestWriteInvoked=false' /tmp/stage125-readonly.log
          grep -F 'STAGE125_GATE_RECOVERY_READONLY=PASS' /tmp/stage125-readonly.log
          echo SCRATCH_BANK_UNCHANGED=PASS
