name: ReceiptLedger V1 Performance Reliability

on:
  push:
    branches:
      - receiptledger/run-v1-performance-reliability-20261016
    paths:
      - 'receiptledger/CP36_PERFORMANCE_RELIABILITY_PLAN.md'
      - 'receiptledger/PERFORMANCE_RELIABILITY_CONSISTENCY_REVIEW.md'
      - 'receiptledger/PERFORMANCE_RELIABILITY_VECTORS.md'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/performance/**'
      - 'receiptledger/harness/android-v1/app/src/androidTest/java/com/receiptledger/v1/performance/**'
      - '.github/workflows/receiptledger-v1-performance-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-performance-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'emulator' \
            'system-images;android-34;default;x86_64' >/dev/null
          set -o pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP36 Phase A measurement-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a8a9ee0bb3bcd7e198f76b436087d54170a469d
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp36-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-performance-reliability.yml) ;;
              receiptledger/CP36_PERFORMANCE_RELIABILITY_PLAN.md) ;;
              receiptledger/PERFORMANCE_RELIABILITY_CONSISTENCY_REVIEW.md) ;;
              receiptledger/PERFORMANCE_RELIABILITY_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/performance/PerformanceReliabilityV1Test.java) ;;
              receiptledger/harness/android-v1/app/src/androidTest/java/com/receiptledger/v1/performance/PerformanceReliabilityInstrumentedTest.java) ;;
              '') ;;
              *) echo "CP36 Phase A scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp36-changed-files.txt

          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java" || {
            echo 'CP36 Phase A must not change production Java'; exit 32;
          }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || {
            echo 'CP36 Phase A must not change manifest'; exit 33;
          }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/res" || {
            echo 'CP36 Phase A must not change production resources'; exit 34;
          }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 35' "$APP/build.gradle"
          grep -Fq "versionName '1.0.34-performance-reliability'" "$APP/build.gradle"

      - name: JVM structural scale, regression, lint and APK build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
            if ! grep -Fqx 'No issues found.' "$REPORT"; then
              echo 'CP36 requires lint 0 errors / 0 warnings'
              status=43
            fi
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.performance.PerformanceReliabilityV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.evaluation.RealReceiptEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.review.CaptureReviewUxV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commoditydetail.CommodityDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.detail.ProductDetailV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Extract and verify CP36 JVM metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp36-jvm-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.performance.PerformanceReliabilityV1Test.xml'
          root=ET.parse(path).getroot()
          if int(root.attrib.get('failures','0')) or int(root.attrib.get('errors','0')):
              raise SystemExit('CP36 JVM test failed')
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP36_JVM_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected one CP36_JVM_METRICS line, got %d' % len(lines))
          line=lines[0]
          values={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)', line)}
          expected={
            'version':1,
            'search_1k_products':1000,
            'search_1k_link_reads':1000,
            'search_1k_receipt_reads':1000,
            'search_1k_v2_reads':1000,
            'search_10k_products':10000,
            'search_10k_link_reads':10000,
            'search_10k_receipt_reads':10000,
            'search_10k_v2_reads':10000,
            'history_observations':1000,
            'history_receipt_reads':1000,
            'history_form_reads':1000,
            'recovery_repeats':50,
            'semantic_failures':0,
          }
          for k,v in expected.items():
              if values.get(k)!=v: raise SystemExit('%s expected %d got %r' % (k,v,values.get(k)))
          print(line)
          PY

      - name: Create and boot CP36 emulator
        shell: bash
        run: |
          set -euo pipefail
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          IMAGE='system-images;android-34;default;x86_64'
          echo no | "$AVDMANAGER" create avd --force --name cp36 --package "$IMAGE" >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd cp36 -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 -cores 2 \
            > receiptledger/cp36-emulator.log 2>&1 &
          adb wait-for-device
          ready=0
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Emulator boot timeout'; tail -200 receiptledger/cp36-emulator.log || true; exit 61
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.release > receiptledger/cp36-emulator-android-release.txt
          adb shell getprop ro.product.cpu.abi > receiptledger/cp36-emulator-abi.txt
          adb shell getprop ro.build.version.sdk > receiptledger/cp36-emulator-api.txt

      - name: Install debug and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          APP=receiptledger/harness/android-v1/app/build/outputs/apk/debug/app-debug.apk
          TEST=receiptledger/harness/android-v1/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$APP"; test -f "$TEST"
          adb install -r "$APP" >/dev/null
          adb install -r "$TEST" >/dev/null

      - name: Measure Home cold launch and idle PSS
        shell: bash
        run: |
          set -euo pipefail
          PKG=com.receiptledger.v1
          COMPONENT=com.receiptledger.v1/.HomeActivity
          adb shell pm clear "$PKG" >/dev/null
          : > receiptledger/cp36-startup-raw.txt
          : > receiptledger/cp36-startup-times.txt
          for i in 0 1 2 3 4 5; do
            adb shell am force-stop "$PKG"
            OUT="$(adb shell am start -W -n "$COMPONENT" | tr -d '\r')"
            echo "===== SAMPLE $i =====" >> receiptledger/cp36-startup-raw.txt
            echo "$OUT" >> receiptledger/cp36-startup-raw.txt
            T="$(printf '%s\n' "$OUT" | awk -F': ' '/^TotalTime:/ {print $2; exit}')"
            test -n "$T"
            if [ "$i" -gt 0 ]; then echo "$T" >> receiptledger/cp36-startup-times.txt; fi
            sleep 1
          done
          sleep 2
          adb shell dumpsys meminfo "$PKG" > receiptledger/cp36-home-meminfo.txt
          python3 - <<'PY' | tee receiptledger/cp36-startup-metrics.txt
          import re, statistics
          times=[int(x.strip()) for x in open('receiptledger/cp36-startup-times.txt') if x.strip()]
          if len(times)!=5: raise SystemExit('expected 5 startup samples')
          text=open('receiptledger/cp36-home-meminfo.txt',errors='ignore').read()
          m=re.search(r'TOTAL PSS:\s*(\d+)',text)
          if not m:
              m=re.search(r'^\s*TOTAL\s+(\d+)\s+',text,re.M)
          if not m: raise SystemExit('unable to parse PSS')
          pss=int(m.group(1))
          print('CP36_STARTUP_METRICS samples=5 startup_median_ms=%d startup_max_ms=%d home_pss_kb=%d' % (
              int(statistics.median(times)),max(times),pss))
          PY
          adb shell am force-stop "$PKG"

      - name: Run CP36 Android runtime profile
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200 adb shell am instrument -w -r \
            -e class com.receiptledger.v1.performance.PerformanceReliabilityInstrumentedTest \
            com.receiptledger.v1.test/androidx.test.runner.AndroidJUnitRunner \
            | tee receiptledger/cp36-instrumentation.txt
          if grep -Fq 'FAILURES!!!' receiptledger/cp36-instrumentation.txt; then exit 71; fi
          grep -Fq 'OK (1 test)' receiptledger/cp36-instrumentation.txt
          adb exec-out run-as com.receiptledger.v1 cat files/cp36-android-metrics.txt \
            | tr -d '\r' | tee receiptledger/cp36-android-metrics.txt
          grep -Fq 'CP36_ANDROID_METRICS ' receiptledger/cp36-android-metrics.txt

      - name: Analyze CP36 decision budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp36-budget-analysis.txt
          import re
          def parse(path,prefix):
              text=open(path).read()
              line=next((x.strip() for x in text.splitlines() if x.strip().startswith(prefix)),None)
              if not line: raise SystemExit('missing '+prefix)
              return {k:int(v) for k,v in re.findall(r'(\w+)=(\d+)',line)}
          s=parse('receiptledger/cp36-startup-metrics.txt','CP36_STARTUP_METRICS ')
          a=parse('receiptledger/cp36-android-metrics.txt','CP36_ANDROID_METRICS ')
          required={'version':1,'search_10k_scanned':10000,'history_observations':1000,'migration_rows':1000,
                    'archive_files':2000,'archive_removed':1000,'reopen_cycles':10,'semantic_failures':0}
          for k,v in required.items():
              if a.get(k)!=v: raise SystemExit('%s expected %d got %r' % (k,v,a.get(k)))
          checks=[
              ('startup_median_ms',s['startup_median_ms'],2500),
              ('startup_max_ms',s['startup_max_ms'],5000),
              ('home_pss_kb',s['home_pss_kb'],220*1024),
              ('ocr_cold_ms',a['ocr_cold_ms'],5000),
              ('ocr_warm_median_ms',a['ocr_warm_median_ms'],1500),
              ('search_1k_ms',a['search_1k_ms'],750),
              ('search_10k_ms',a['search_10k_ms'],3000),
              ('recent_10k_ms',a['recent_10k_ms'],3000),
              ('price_1k_ms',a['price_1k_ms'],2000),
              ('detail_1k_ms',a['detail_1k_ms'],2000),
              ('chart_1k_ms',a['chart_1k_ms'],500),
              ('migration_1k_ms',a['migration_1k_ms'],5000),
              ('archive_ms',a['archive_ms'],2000),
          ]
          breaches=[(n,x,b) for n,x,b in checks if x>b]
          ratio=round(a['search_10k_ms']/max(1,a['search_1k_ms']),2)
          print('CP36_BUDGET_ANALYSIS phase=DIAGNOSTIC budget_breaches=%d search_10k_to_1k_ratio_x100=%d' % (
              len(breaches),round(ratio*100)))
          for n,x,b in checks:
              print('%s actual=%d budget=%d status=%s' % (n,x,b,'BREACH' if x>b else 'WITHIN'))
          for n,x,b in breaches:
              print('BREACH %s actual=%d budget=%d' % (n,x,b))
          PY

      - name: Package and verify CP36 diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=8a8a9ee0bb3bcd7e198f76b436087d54170a469d
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-performance-reliability
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-performance-reliability-debug.apk"
          cp receiptledger/cp36-jvm-metrics.txt "$OUT/CP36_JVM_METRICS.txt"
          cp receiptledger/cp36-startup-metrics.txt "$OUT/CP36_STARTUP_METRICS.txt"
          cp receiptledger/cp36-android-metrics.txt "$OUT/CP36_ANDROID_METRICS.txt"
          cp receiptledger/cp36-budget-analysis.txt "$OUT/CP36_BUDGET_ANALYSIS.txt"
          cp receiptledger/cp36-startup-raw.txt "$OUT/CP36_STARTUP_RAW.txt"
          cp receiptledger/cp36-home-meminfo.txt "$OUT/CP36_HOME_MEMINFO.txt"
          cp receiptledger/cp36-instrumentation.txt "$OUT/CP36_INSTRUMENTATION.txt"
          cp receiptledger/cp36-emulator.log "$OUT/CP36_EMULATOR.log"
          cp receiptledger/cp36-emulator-android-release.txt "$OUT/CP36_EMULATOR_ANDROID_RELEASE.txt"
          cp receiptledger/cp36-emulator-api.txt "$OUT/CP36_EMULATOR_API.txt"
          cp receiptledger/cp36-emulator-abi.txt "$OUT/CP36_EMULATOR_ABI.txt"
          cp receiptledger/CP36_PERFORMANCE_RELIABILITY_PLAN.md "$OUT/"
          cp receiptledger/PERFORMANCE_RELIABILITY_CONSISTENCY_REVIEW.md "$OUT/"
          cp receiptledger/PERFORMANCE_RELIABILITY_VECTORS.md "$OUT/"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.performance.PerformanceReliabilityV1Test.xml" "$OUT/PERFORMANCE_RELIABILITY_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.evaluation.RealReceiptEvaluationV1Test.xml" "$OUT/REAL_RECEIPT_EVALUATION_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.shell.CommercialUiShellV1Test.xml" "$OUT/COMMERCIAL_UI_SHELL_V1_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-performance-reliability-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 81; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP36_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-performance-reliability-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_PERFORMANCE_RELIABILITY_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'phase=DIAGNOSTIC_MEASUREMENT_ONLY'
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'production_java=UNCHANGED'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'runtime_emulator_api=34'
            echo 'runtime_emulator_abi=x86_64'
            echo 'runtime_emulator_memory_mib=2048'
            echo 'version_name=1.0.34-performance-reliability'
            echo 'version_code=35'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt \
            "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP36_JVM_METRICS.txt "$OUT"/CP36_STARTUP_METRICS.txt \
            "$OUT"/CP36_ANDROID_METRICS.txt "$OUT"/CP36_BUDGET_ANALYSIS.txt "$OUT"/CP36_DIFF.txt \
            > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-performance-reliability-${{ github.run_id }}
          path: receiptledger/output/v1-performance-reliability/
          if-no-files-found: error
          retention-days: 14
