name: Linkline Android RC APK

on:
  push:
    branches:
      - linkline/android-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      WEB_BASE: 1c17f6ae2899fc2c3c7420ecb81c0ca60e73a0e1
      WEB_DIR: timing-defense-skilled-v2-harness/public
      ANDROID_PROJECT: android-linkline
      GRADLE_VERSION: 8.9
    steps:
      - name: Checkout exact pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=40 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify frozen web bundle baseline
        run: |
          set -euo pipefail
          git cat-file -e "${WEB_BASE}^{commit}"
          git diff --exit-code "${WEB_BASE}" HEAD -- "${WEB_DIR}"
          test -f "${WEB_DIR}/src/settings-preferences.mjs"
          test -f "${WEB_DIR}/src/settings-about.mjs"
          echo "Frozen Preview web bundle PASS: ${WEB_BASE}"

      - name: Embed web bundle into Android assets
        run: |
          set -euo pipefail
          rm -rf "${ANDROID_PROJECT}/app/src/main/assets/www"
          mkdir -p "${ANDROID_PROJECT}/app/src/main/assets/www"
          cp -R "${WEB_DIR}/." "${ANDROID_PROJECT}/app/src/main/assets/www/"
          cmp "${WEB_DIR}/index.html" "${ANDROID_PROJECT}/app/src/main/assets/www/index.html"
          cmp "${WEB_DIR}/src/settings-preferences.mjs" "${ANDROID_PROJECT}/app/src/main/assets/www/src/settings-preferences.mjs"
          echo "Embedded web byte copy PASS"

      - name: Apply Android home layout override
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('android-linkline/app/src/main/assets/www/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '''<style id="linkline-android-app-layout">
          .app-shell[data-view="home"] .home-hero{transform:translateY(-15px)!important}
          .app-shell[data-view="home"] .signal-preview{width:min(84vw,395px)!important}
          .app-shell[data-view="home"] .home-actions{transform:translateY(4px)!important}
          </style>'''
          if 'linkline-android-app-layout' in text:
              raise SystemExit('APP_LAYOUT_ALREADY_PRESENT')
          if '</head>' not in text:
              raise SystemExit('HEAD_CLOSE_NOT_FOUND')
          path.write_text(text.replace('</head>', marker + '\n</head>', 1), encoding='utf-8')
          PY
          grep -F 'linkline-android-app-layout' "${ANDROID_PROJECT}/app/src/main/assets/www/index.html"

      - name: Force validated bitmap launcher icon path
        run: |
          set -euo pipefail
          res="${ANDROID_PROJECT}/app/src/main/res"
          test -s "${res}/drawable-nodpi/linkline_icon.png"
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          p = Path('android-linkline/app/src/main/res/drawable-nodpi/linkline_icon.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          pos = 8
          idat = bytearray()
          width = height = None
          while pos < len(data):
              n = struct.unpack('>I', data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              chunk = data[pos+8:pos+8+n]
              if typ == b'IHDR':
                  width, height = struct.unpack('>II', chunk[:8])
              elif typ == b'IDAT':
                  idat.extend(chunk)
              elif typ == b'IEND':
                  break
              pos += 12 + n
          assert width == 144 and height == 144
          raw = zlib.decompress(bytes(idat))
          assert raw
          print(f'Launcher source PNG decode PASS: {width}x{height}, raw={len(raw)}')
          PY
          rm -rf "${res}/mipmap-anydpi-v26"
          rm -f "${res}/drawable/ic_launcher.xml" "${res}/drawable/ic_launcher_foreground.xml"
          mkdir -p "${res}/mipmap-nodpi"
          cp "${res}/drawable-nodpi/linkline_icon.png" "${res}/mipmap-nodpi/ic_launcher.png"
          cmp "${res}/drawable-nodpi/linkline_icon.png" "${res}/mipmap-nodpi/ic_launcher.png"
          echo "Validated bitmap launcher icon prepared"

      - name: Prepare Android SDK and Gradle
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0"
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Build debug-signed APK
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" -p "${ANDROID_PROJECT}" --no-daemon :app:assembleDebug

      - name: Verify APK identity and decode launcher icon
        run: |
          set -euo pipefail
          apk="${ANDROID_PROJECT}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F "assets/www/index.html"
          unzip -p "$apk" assets/www/index.html | grep -F "linkline-android-app-layout"
          icon_path="$(unzip -Z1 "$apk" | grep -E '^res/mipmap-nodpi-v[0-9]+/ic_launcher\.png$' | head -n 1)"
          test -n "$icon_path"
          unzip -p "$apk" "$icon_path" > /tmp/ic_launcher.png
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          data = Path('/tmp/ic_launcher.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          pos = 8
          idat = bytearray()
          width = height = None
          while pos < len(data):
              n = struct.unpack('>I', data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              chunk = data[pos+8:pos+8+n]
              if typ == b'IHDR':
                  width, height = struct.unpack('>II', chunk[:8])
              elif typ == b'IDAT':
                  idat.extend(chunk)
              elif typ == b'IEND':
                  break
              pos += 12 + n
          assert width == 144 and height == 144
          raw = zlib.decompress(bytes(idat))
          assert raw
          print(f'APK launcher PNG decode PASS: {width}x{height}, raw={len(raw)}')
          PY
          if unzip -l "$apk" | grep -q "res/mipmap-anydpi-v26/ic_launcher"; then
            echo "Unexpected adaptive launcher icon remained" >&2
            exit 1
          fi
          badging="$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='com.linkline.game' versionCode='5' versionName='0.1.4-rc1'"
          echo "$badging" | grep -F "application-label:'Linkline'"
          echo "$badging" | grep -F "application-icon-" | grep -F "ic_launcher.png"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p artifact
          cp "$apk" artifact/Linkline-0.1.4-rc1-debug.apk
          sha256sum artifact/Linkline-0.1.4-rc1-debug.apk | tee artifact/SHA256SUMS.txt
          printf 'web_base=%s\nsource_commit=%s\npackage=com.linkline.game\nversion=0.1.4-rc1\nbuild_type=debug\nlayout_override=android-app\nlauncher_icon=validated-binary-png\n' "$WEB_BASE" "$GITHUB_SHA" > artifact/PROVENANCE.txt

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkline-0.1.4-rc1-debug
          path: artifact/
          if-no-files-found: error
          retention-days: 14
