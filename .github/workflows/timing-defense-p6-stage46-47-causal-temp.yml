name: Timing Defense P6 Stage46-47 causal temp

on:
  push:
    branches:
      - timing-defense-workspace-temp-p6-stage46-47-causal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timing-defense-workspace-temp-p6-stage46-47-causal
          fetch-depth: 1
      - name: Install YAML dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Run twice and verify deterministic bytes
        run: |
          set -euo pipefail
          cd timing-defense-workspace
          python3 tools/run_p6_stage46_47_causal_convergence_temp_v0_1.py > /tmp/run1.txt
          cp p6_stage46_47_causal_convergence_temp_v0_1.json /tmp/result1.json
          python3 tools/run_p6_stage46_47_causal_convergence_temp_v0_1.py > /tmp/run2.txt
          cmp /tmp/result1.json p6_stage46_47_causal_convergence_temp_v0_1.json
          cat /tmp/run2.txt
