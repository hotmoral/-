name: Mobi P0 Galaxy Mobile Package

on:
  workflow_dispatch:

concurrency:
  group: mobi-p0-mobile-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-p0-mobile-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Ensure Android API 35 build platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build P0 Galaxy APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p mobi/p0/harness :app:assembleDebug

      - name: Assemble mobile-only package
        shell: bash
        run: |
          set -euo pipefail
          src=mobi/p0/harness
          apk="$src/app/build/outputs/apk/debug/app-debug.apk"
          out=mobi/output/p0-galaxy-mobile-package
          rm -rf "$out"
          mkdir -p "$out"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" "$out/cat-presence-p0-debug.apk"
          cp mobi/p0/mobile-package/README_KO.md "$out/README_KO.md"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > "$out/AAPT_BADGING.txt"
          (
            cd "$src"
            sha256sum \
              settings.gradle \
              build.gradle \
              gradle.properties \
              app/build.gradle \
              app/src/main/AndroidManifest.xml \
              app/src/main/java/org/example/catpresence/QaState.java \
              app/src/main/java/org/example/catpresence/CatPlaceholderView.java \
              app/src/main/java/org/example/catpresence/PresenceService.java \
              app/src/main/java/org/example/catpresence/MainActivity.java \
              > "$GITHUB_WORKSPACE/$out/SOURCE_SHA256.txt"
          )
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(gradle --version | awk '/^Gradle / {print $2; exit}')"
            echo "compile_sdk=35"
            echo "target_sdk=35"
            echo "package_mode=galaxy_manual_mobile_only"
            echo "prototype=P0_PROTO_V2_ABOVE_IME"
          } > "$out/BUILD_IDENTITY.txt"
          (
            cd "$out"
            sha256sum cat-presence-p0-debug.apk README_KO.md AAPT_BADGING.txt SOURCE_SHA256.txt BUILD_IDENTITY.txt > PACKAGE_SHA256.txt
          )

      - name: Upload P0 Galaxy mobile package
        uses: actions/upload-artifact@v4
        with:
          name: mobi-artifact-p0-galaxy-mobile-${{ github.run_id }}
          path: mobi/output/p0-galaxy-mobile-package
          if-no-files-found: error
