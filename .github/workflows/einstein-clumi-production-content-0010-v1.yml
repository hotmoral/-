name: Clumi Toast Notice Dark Mode V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-toast-notice-dark-mode-v1
  cancel-in-progress: false

jobs:
  patch-verify-toast-consistency:
    if: >-
      github.event.head_commit.message == 'verify: Clumi toast notice dark mode v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: eb0337ff56d5f4fa68bf1136cc2a3538abfb942d
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact live UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply bounded toast consistency patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Shared toast surface: caller must provide the active theme; duration remains explicit for system failures.
          up=Path('app/src/main/java/com/example/einsteingame/ClumiUi.java')
          ul=up.read_text().splitlines()
          indexes=[i for i,line in enumerate(ul) if line.startswith('    static void toast(Context c,String message){')]
          if len(indexes)!=1: raise SystemExit('ClumiUi toast boundary mismatch')
          i=indexes[0]
          ul[i:i+1]=[
              '    static void toast(Context c,String message,boolean dark){toast(c,message,dark,Toast.LENGTH_SHORT);}',
              '    static void toast(Context c,String message,boolean dark,int duration){',
              '        TextView view=text(c,message,14,true,dark);view.setPadding(dp(c,18),dp(c,12),dp(c,18),dp(c,14));',
              '        view.setBackground(surface(c,ClumiSkin.FROST,dark,18));software(view);',
              '        Toast toast=new Toast(c);toast.setView(view);toast.setDuration(duration);toast.setGravity(Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL,0,dp(c,34));toast.show();',
              '    }'
          ]
          up.write_text('\n'.join(ul)+'\n')

          mp=Path('app/src/main/java/com/example/einsteingame/MainActivity.java')
          main=mp.read_text()
          old='Toast.makeText(this,"진행을 저장하지 못했습니다.\\n저장 공간을 확인해 주세요.",Toast.LENGTH_LONG).show()'
          new='ClumiUi.toast(this,"진행을 저장하지 못했습니다.\\n저장 공간을 확인해 주세요.",dark(),Toast.LENGTH_LONG)'
          if main.count(old)!=1: raise SystemExit('persist Toast boundary mismatch')
          main=main.replace(old,new,1)
          old='ClumiUi.toast(this,"이전 스테이지를 먼저 완료하세요.");'
          new='ClumiUi.toast(this,"이전 스테이지를 먼저 완료하세요.",dark());'
          if main.count(old)!=1: raise SystemExit('stage-lock toast boundary mismatch')
          main=main.replace(old,new,1)
          mp.write_text(main)

          gp=Path('app/src/main/java/com/example/einsteingame/GameView.java')
          game=gp.read_text()
          game=game.replace('import android.widget.Toast;\n','')
          old='ClumiUi.toast(getContext(),state.singleCandidateSlot(row,col)>=0?"미확정 칸을 선택하세요.":"후보와 단서를 확인한 뒤 다시 선택하세요.");'
          new='ClumiUi.toast(getContext(),state.singleCandidateSlot(row,col)>=0?"미확정 칸을 선택하세요.":"후보와 단서를 확인한 뒤 다시 선택하세요.",dark);'
          if game.count(old)!=1: raise SystemExit('target rejection toast boundary mismatch')
          game=game.replace(old,new,1)
          old='ClumiUi.toast(getContext(),"아이템이 없어요.");'
          if game.count(old)!=2: raise SystemExit('item toast boundary mismatch')
          game=game.replace(old,'ClumiUi.toast(getContext(),"아이템이 없어요.",dark);')
          gp.write_text(game)
          PY
          git diff --check

      - name: Verify toast notice dark-mode contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/example/einsteingame')
          ui=(root/'ClumiUi.java').read_text()
          main=(root/'MainActivity.java').read_text()
          game=(root/'GameView.java').read_text()
          assert 'static void toast(Context c,String message,boolean dark)' in ui
          assert 'static void toast(Context c,String message,boolean dark,int duration)' in ui
          assert 'surface(c,ClumiSkin.FROST,dark,18)' in ui
          assert 'toast.setDuration(duration)' in ui
          assert 'ClumiUi.toast(this,"진행을 저장하지 못했습니다.\\n저장 공간을 확인해 주세요.",dark(),Toast.LENGTH_LONG)' in main
          assert 'ClumiUi.toast(this,"이전 스테이지를 먼저 완료하세요.",dark())' in main
          assert 'ClumiUi.toast(getContext(),"아이템이 없어요.",dark)' in game
          assert 'android.widget.Toast' not in game
          assert 'private void notice(String title,String message){lastDialog=ClumiUi.dialog(this,title,message,"확인",null,null,null,true,dark());}' in main
          for path in root.glob('*.java'):
              text=path.read_text()
              if path.name!='ClumiUi.java':
                  assert 'Toast.makeText' not in text, f'Android default Toast remains in {path.name}'
          print('Toast / notice / dark-mode static contract: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push exact toast consistency patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain | wc -l)" -eq 3
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/ClumiUi.java'
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/MainActivity.java'
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/GameView.java'
          git config user.name 'Clumi UI Integration'
          git config user.email 'noreply@localhost'
          git add app/src/main/java/com/example/einsteingame/ClumiUi.java app/src/main/java/com/example/einsteingame/MainActivity.java app/src/main/java/com/example/einsteingame/GameView.java
          git commit -m 'ui: unify transient notices across themes'
          git push origin "HEAD:$SOURCE_BRANCH"
