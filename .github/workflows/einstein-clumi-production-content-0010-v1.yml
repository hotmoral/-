name: Clumi Final Responsive Compile Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: write

jobs:
  diagnose-androidtest-compile:
    if: >-
      github.event.head_commit.message == 'diagnose: Clumi final responsive androidTest compile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 7242c767d025c73b7c2892685df74ad5b97a033b
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: true

      - name: Checkout exact private UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Require exact source and inject test-only helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          cp harness/.github/regression/ClumiFinalResponsiveEvidence.java source/app/src/androidTest/java/com/example/einsteingame/ClumiFinalResponsiveEvidence.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/src/androidTest/java/com/example/einsteingame/ClumiUiTestRunner.java')
          text=p.read_text()
          old='private Bundle feelArgs,transitionArgs,destinationArgs,mosaicArgs,visualB0Args;'
          new='private Bundle feelArgs,transitionArgs,destinationArgs,mosaicArgs,visualB0Args,finalResponsiveArgs;'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          old='@Override public void onCreate(Bundle args){super.onCreate(args);if(args.containsKey("b0visual"))visualB0Args=args;'
          new='@Override public void onCreate(Bundle args){super.onCreate(args);if(args.containsKey("finalresponsive"))finalResponsiveArgs=args;if(args.containsKey("b0visual"))visualB0Args=args;'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          old='@Override public void onStart(){if(visualB0Args!=null)'
          new='@Override public void onStart(){if(finalResponsiveArgs!=null){new ClumiFinalResponsiveEvidence(this,finalResponsiveArgs).run();return;}if(visualB0Args!=null)'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          p.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile and capture diagnostic
        id: compile
        working-directory: source
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebugAndroidTest > ../compile-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 ../compile-diagnostic.log
          exit 0

      - name: Commit diagnostic log on failure
        if: steps.compile.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/diagnostics
          cp compile-diagnostic.log harness/diagnostics/clumi-final-responsive-androidtest-compile.log
          cd harness
          git config user.name 'Clumi Regression Diagnostic'
          git config user.email 'noreply@localhost'
          git add diagnostics/clumi-final-responsive-androidtest-compile.log
          git commit -m 'diagnostic: Clumi final responsive androidTest compile error'
          git push origin HEAD:main

      - name: Fail if compilation failed
        if: steps.compile.outputs.exit_code != '0'
        shell: bash
        run: exit 1
