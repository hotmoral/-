name: Clumi Arrival CTA Hierarchy V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-arrival-cta-hierarchy-v1
  cancel-in-progress: false

jobs:
  patch-verify-arrival-cta:
    if: >-
      github.event.head_commit.message == 'verify: Clumi arrival CTA hierarchy v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 767a915f484230de7e259675ad49386366e16b92
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact live UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply bounded arrival and CTA patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Shared post-mosaic arrival grammar. Stage Start remains the stronger variant.
          ap=Path('app/src/main/java/com/example/einsteingame/ClumiStageArrival.java')
          ap.write_text('\n'.join([
              'package com.example.einsteingame;',
              'import android.view.View;',
              '/** Post-transition arrival grammar. Mosaic remains authoritative; transforms start only after a canonical live frame. */',
              'final class ClumiStageArrival {',
              '    static ClumiSceneMotion common(View root,ClumiFeedbackController feel,ClumiSceneMotion.Gate valid,ClumiSceneMotion.Gate ready){',
              '        return build(root,feel,valid,ready,false);',
              '    }',
              '    static ClumiSceneMotion start(View root,ClumiFeedbackController feel,ClumiSceneMotion.Gate valid,ClumiSceneMotion.Gate ready){',
              '        return build(root,feel,valid,ready,true);',
              '    }',
              '    private static ClumiSceneMotion build(View root,ClumiFeedbackController feel,ClumiSceneMotion.Gate valid,ClumiSceneMotion.Gate ready,boolean strong){',
              '        ClumiSceneMotion motion=new ClumiSceneMotion(root,feel,valid,ready);',
              '        View header=root.findViewWithTag("brand-header");if(header==null)header=root.findViewWithTag("home-logo");',
              '        motion.add(header,0,strong?190:170,ClumiSceneMotion.emphasis(strong?.003f:.005f,ClumiUi.dp(root.getContext(),strong?.7f:1f)));',
              '        if(strong)for(String tag:new String[]{"hero-clumi","b3-art-title-start"})',
              '            motion.add(root.findViewWithTag(tag),20,240,ClumiSceneMotion.emphasis(.009f,0));',
              '        motion.start();return motion;',
              '    }',
              '    private ClumiStageArrival(){}',
              '}',
              ''
          ]))

          # Dynamic Hero CTA treatment for primary progression buttons that cannot use fixed-text raster artwork.
          up=Path('app/src/main/java/com/example/einsteingame/ClumiUi.java')
          ul=up.read_text().splitlines()
          button_index=next((i for i,line in enumerate(ul) if line.startswith('    static Button button(Context c,String value,boolean blue,boolean dark){')),None)
          if button_index is None: raise SystemExit('ClumiUi button boundary mismatch')
          hero=[
              '    static void heroButton(Button button,boolean dark){',
              '        Context c=button.getContext();',
              '        button.setTextSize(20);button.setTextColor(Color.WHITE);',
              '        button.setBackground(surface(c,ClumiSkin.PRIMARY,dark,34));',
              '        button.setShadowLayer(dp(c,.9f),0,dp(c,1.2f),0x9a0648a8);',
              '        button.setPadding(dp(c,24),dp(c,3),dp(c,20),dp(c,6));',
              '    }'
          ]
          ul[button_index+1:button_index+1]=hero
          up.write_text('\n'.join(ul)+'\n')

          # Wire common arrivals only at actual navigation/restore boundaries; rerenders from Settings/Rewards state changes do not replay arrival.
          mp=Path('app/src/main/java/com/example/einsteingame/MainActivity.java')
          ml=mp.read_text().splitlines()

          scroll_index=next((i for i,line in enumerate(ml) if line.startswith('    private LinearLayout scrollBody(LinearLayout page){')),None)
          if scroll_index is None: raise SystemExit('scrollBody boundary mismatch')
          arrive=[
              '    private void arrive(String expected){',
              '        ClumiSceneReady arrivalScene=scene;',
              '        ClumiStageArrival.common(arrivalScene.root,feel,()->expected.equals(screen)&&scene==arrivalScene,()->(navigation==null||!navigation.active())&&arrivalScene.complete());',
              '    }'
          ]
          ml[scroll_index+1:scroll_index+1]=arrive

          def replace_one(old,new,label):
              matches=[i for i,line in enumerate(ml) if line==old]
              if len(matches)!=1: raise SystemExit(f'{label}: expected 1 exact line, got {len(matches)}')
              ml[matches[0]]=new

          replace_one('            case "rewards":renderRewards(rewardScroll);break;',
                      '            case "rewards":renderRewards(rewardScroll);arrive("rewards");break;',
                      'restore rewards arrival')
          replace_one('            case "settings":enter("settings");renderSettings();break;',
                      '            case "settings":enter("settings");renderSettings();arrive("settings");break;',
                      'restore settings arrival')

          for marker,target in [('scene.require("home-logo"','home'),('scene.require("stage-panel"','stages')]:
              matches=[i for i,line in enumerate(ml) if marker in line]
              if len(matches)!=1: raise SystemExit(f'{target} arrival boundary mismatch')
              idx=matches[0]
              if 'scene.bindComplete();' not in ml[idx]: raise SystemExit(f'{target} scene completion missing')
              ml[idx]=ml[idx].replace('scene.bindComplete();',f'scene.bindComplete();arrive("{target}");',1)

          old='    private void showRewards(int scrollY){route("rewards",backNavigation,()->renderRewards(scrollY));}'
          new='    private void showRewards(int scrollY){route("rewards",backNavigation,()->{renderRewards(scrollY);arrive("rewards");});}'
          replace_one(old,new,'showRewards arrival boundary')

          old='    private void showSettings(){String previous=screen;route("settings",false,()->{settingsReturn=previous;enter("settings");renderSettings();});}'
          new='    private void showSettings(){String previous=screen;route("settings",false,()->{settingsReturn=previous;enter("settings");renderSettings();arrive("settings");});}'
          replace_one(old,new,'showSettings arrival boundary')

          stage_lines=[i for i,line in enumerate(ml) if 'Button start=button(ClumiStagePresentation.action' in line]
          if len(stage_lines)!=1: raise SystemExit('Stage Start CTA boundary mismatch')
          idx=stage_lines[0]
          old_fragment='start.setTag("stage-cta");ClumiUi.actionIcon(start,"play",true);'
          new_fragment='start.setTag("stage-cta");ClumiUi.heroButton(start,dark());ClumiUi.actionIcon(start,"play",true);'
          if old_fragment not in ml[idx]: raise SystemExit('Stage Start CTA fragment changed')
          ml[idx]=ml[idx].replace(old_fragment,new_fragment,1)

          mp.write_text('\n'.join(ml)+'\n')
          PY
          git diff --check

      - name: Verify arrival and CTA contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          arrival=Path('app/src/main/java/com/example/einsteingame/ClumiStageArrival.java').read_text()
          ui=Path('app/src/main/java/com/example/einsteingame/ClumiUi.java').read_text()
          assert 'static ClumiSceneMotion common(' in arrival
          assert 'root.findViewWithTag("brand-header")' in arrival
          assert 'root.findViewWithTag("home-logo")' in arrival
          assert 'strong?190:170' in arrival
          assert '"hero-clumi","b3-art-title-start"' in arrival
          assert 'private void arrive(String expected)' in main
          assert 'scene.bindComplete();arrive("home");' in main
          assert 'scene.bindComplete();arrive("stages");' in main
          assert 'renderRewards(scrollY);arrive("rewards");' in main
          assert 'renderSettings();arrive("settings");' in main
          assert 'ClumiStageArrival.start(arrivalScene.root' in main
          assert 'static void heroButton(Button button,boolean dark)' in ui
          assert 'ClumiUi.heroButton(start,dark());ClumiUi.actionIcon(start,"play",true);' in main
          assert 'ClumiVisualAssets.buttonArt(play,' in main
          assert 'ClumiVisualAssets.buttonArt(current,"cta_current_stage")' in main
          print('Arrival / CTA hierarchy static contract: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push exact arrival and CTA patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain | wc -l)" -eq 3
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/MainActivity.java'
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/ClumiStageArrival.java'
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/ClumiUi.java'
          git config user.name 'Clumi UI Integration'
          git config user.email 'noreply@localhost'
          git add app/src/main/java/com/example/einsteingame/MainActivity.java app/src/main/java/com/example/einsteingame/ClumiStageArrival.java app/src/main/java/com/example/einsteingame/ClumiUi.java
          git commit -m 'ui: unify screen arrival and hero CTA grammar'
          git push origin "HEAD:$SOURCE_BRANCH"
