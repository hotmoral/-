name: Clumi Solve To Clear Bridge V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-solve-to-clear-bridge-v1
  cancel-in-progress: false

jobs:
  patch-verify-solve-bridge:
    if: >-
      github.event.head_commit.message == 'verify: Clumi solve to clear bridge v1 retry'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 7a86254cf3b9d2cb9ae2cfbf8e32a52d1a1be3c0
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact live UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply bounded solve bridge patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # GameView: local solve bridge animation only.
          gp=Path('app/src/main/java/com/example/einsteingame/GameView.java')
          gl=gp.read_text().splitlines()
          field='    private boolean compactGameplay,mediumGameplay;'
          if gl.count(field)!=1: raise SystemExit('GameView field boundary mismatch')
          i=gl.index(field)+1
          gl[i:i]=[
              '    static final int SOLVE_BRIDGE_MS=520;',
              '    private long solveBridgeAt=-1;'
          ]

          anchor='    public GameState gameState(){return state;}'
          if gl.count(anchor)!=1: raise SystemExit('GameView method boundary mismatch')
          i=gl.index(anchor)+1
          bridge=[
              '    void beginSolveBridge(){',
              '        if(feel==null||!feel.motion()){solveBridgeAt=-1;return;}',
              '        solveBridgeAt=SystemClock.elapsedRealtime();postInvalidateOnAnimation();',
              '    }',
              '    private float solveBridgeProgress(){',
              '        if(solveBridgeAt<0||feel==null||!feel.motion())return -1;',
              '        float phase=(SystemClock.elapsedRealtime()-solveBridgeAt)/(float)SOLVE_BRIDGE_MS;',
              '        if(phase>=1){solveBridgeAt=-1;return -1;}',
              '        return ClumiMotionTokens.unit(phase);',
              '    }',
              '    private void drawSolveBridge(Canvas canvas,float phase){',
              '        if(phase<0)return;float elapsed=phase*SOLVE_BRIDGE_MS;',
              '        canvas.save();canvas.clipRect(board);',
              '        for(int row=0;row<GameState.SIZE;row++){',
              '            float local=ClumiMotionTokens.unit((elapsed-row*38f)/220f);',
              '            float pulse=ClumiMotionTokens.impulse(local);if(pulse<=0)continue;',
              '            float left=board.left+boardPadding+panX,right=left+boardContentWidth*scale;',
              '            float top=board.top+boardPadding+panY+(boardHeaderHeight+row*cellHeight)*scale;',
              '            float bottom=board.top+boardPadding+panY+(boardHeaderHeight+(row+1)*cellHeight)*scale;',
              '            effectBounds.set(left+d(1),top+d(1),right-d(1),bottom-d(1));',
              '            effectPaint.reset();effectPaint.setAntiAlias(true);effectPaint.setStyle(Paint.Style.FILL);',
              '            effectPaint.setColor(Color.argb((int)(24*pulse),25,189,53));canvas.drawRoundRect(effectBounds,d(7),d(7),effectPaint);',
              '            effectPaint.setStyle(Paint.Style.STROKE);effectPaint.setStrokeWidth(d(1.3f));effectPaint.setColor(Color.argb((int)(155*pulse),25,189,53));',
              '            canvas.drawRoundRect(effectBounds,d(7),d(7),effectPaint);',
              '        }',
              '        canvas.restore();postInvalidateOnAnimation();',
              '    }'
          ]
          gl[i:i]=bridge

          old='        canvas.save();if(feel!=null&&feel.motion()){long now=SystemClock.elapsedRealtime();int clear=feel.timeline.find(ClumiFeedbackEvent.STAGE_CLEARED,-1,-1,-1,now);if(clear>=0){float phase=(now-feel.timeline.starts[clear])/(float)ClumiMotionTokens.BOARD_SETTLE,settle=ClumiMotionTokens.impulse(phase);canvas.scale(1-.006f*settle,1-.006f*settle,board.centerX(),board.centerY());}}drawBoard(canvas);canvas.restore();'
          if gl.count(old)!=1: raise SystemExit('GameView board draw boundary mismatch')
          j=gl.index(old)
          gl[j:j+1]=[
              '        float solvePhase=solveBridgeProgress();',
              '        canvas.save();if(solvePhase>=0){float settle=ClumiMotionTokens.impulse(Math.min(1,solvePhase*1.55f));canvas.scale(1-.008f*settle,1-.008f*settle,board.centerX(),board.centerY());}drawBoard(canvas);canvas.restore();',
              '        drawSolveBridge(canvas,solvePhase);'
          ]
          gp.write_text('\n'.join(gl)+'\n')

          # MainActivity: delay result presentation only; completion persistence remains immediate.
          mp=Path('app/src/main/java/com/example/einsteingame/MainActivity.java')
          ml=mp.read_text().splitlines()
          result_field='    private int resultStars,resultPreviousBest;private long resultElapsed;'
          if ml.count(result_field)!=1: raise SystemExit('MainActivity result field boundary mismatch')
          i=ml.index(result_field)+1
          ml[i:i]=[
              '    private boolean resultPending;',
              '    private final Runnable revealPendingResult=this::revealPendingResultNow;'
          ]

          save_attempt='    private void saveAttempt(){if(session!=null&&!session.board.isSolved()){progress.saveAttempt(session.stage.number,session.encode());persist();}}'
          if ml.count(save_attempt)!=1: raise SystemExit('saveAttempt boundary mismatch')
          i=ml.index(save_attempt)+1
          ml[i:i]=[
              '    private void revealPendingResultNow(){',
              '        if(!resultPending)return;',
              '        if(session==null||completedSession!=session||!"play".equals(screen)){resultPending=false;return;}',
              '        resultPending=false;showResult(session.stage.number,resultStars,resultElapsed,resultPreviousBest);',
              '    }'
          ]

          dispatch='    @Override public boolean dispatchTouchEvent(MotionEvent event){'
          if ml.count(dispatch)!=1: raise SystemExit('dispatch boundary mismatch')
          i=ml.index(dispatch)+1
          ml.insert(i,'        if(resultPending)return true;')

          save='        state.putString("clumi.ui.screen",completedSession==session&&session!=null&&lastDialog!=null&&lastDialog.isShowing()?"clear":screen);'
          if ml.count(save)!=1: raise SystemExit('save boundary mismatch')
          ml[ml.index(save)]='        state.putString("clumi.ui.screen",completedSession==session&&session!=null&&(resultPending||(lastDialog!=null&&lastDialog.isShowing()))?"clear":screen);'

          resume='    @Override protected void onResume(){super.onResume();resumed=true;updateTimer();if(feel!=null)feel.foreground(true);}'
          pause='    @Override protected void onPause(){resumed=false;updateTimer();saveAttempt();if(navigation!=null)navigation.snap();if(feel!=null)feel.foreground(false);super.onPause();}'
          destroy='    @Override protected void onDestroy(){if(navigation!=null)navigation.snap();if(feel!=null)feel.dispose();super.onDestroy();}'
          if ml.count(resume)!=1 or ml.count(pause)!=1 or ml.count(destroy)!=1: raise SystemExit('lifecycle boundary mismatch')
          ml[ml.index(resume)]='    @Override protected void onResume(){super.onResume();resumed=true;updateTimer();if(feel!=null)feel.foreground(true);if(resultPending&&game!=null)game.post(revealPendingResult);}'
          ml[ml.index(pause)]='    @Override protected void onPause(){if(resultPending&&game!=null)game.removeCallbacks(revealPendingResult);resumed=false;updateTimer();saveAttempt();if(navigation!=null)navigation.snap();if(feel!=null)feel.foreground(false);super.onPause();}'
          ml[ml.index(destroy)]='    @Override protected void onDestroy(){if(game!=null)game.removeCallbacks(revealPendingResult);if(navigation!=null)navigation.snap();if(feel!=null)feel.dispose();super.onDestroy();}'

          back='    @Override public void onBackPressed(){if(lastDialog!=null&&lastDialog.isShowing()){lastDialog.onBackPressed();if(!lastDialog.isShowing())semantic(ClumiHapticPolicy.Control.NAVIGATION);return;}if(navigation!=null){if(navigation.active())return;if("home".equals(screen)&&navigation.recent("home"))return;}backNavigation=true;try{handleBack();}finally{backNavigation=false;}semantic(ClumiHapticPolicy.Control.NAVIGATION);}'
          if ml.count(back)!=1: raise SystemExit('back boundary mismatch')
          ml[ml.index(back)]='    @Override public void onBackPressed(){if(resultPending)return;if(lastDialog!=null&&lastDialog.isShowing()){lastDialog.onBackPressed();if(!lastDialog.isShowing())semantic(ClumiHapticPolicy.Control.NAVIGATION);return;}if(navigation!=null){if(navigation.active())return;if("home".equals(screen)&&navigation.recent("home"))return;}backNavigation=true;try{handleBack();}finally{backNavigation=false;}semantic(ClumiHapticPolicy.Control.NAVIGATION);}'

          start=ml.index('    @Override public void completed(){')
          end=ml.index('    private void showResult(int stage,int stars,long elapsed,int previousBest){',start)
          completed=[
              '    @Override public void completed(){',
              '        if(session==null||completedSession==session||!"play".equals(screen)||!session.board.isSolved())return;',
              '        completedSession=session;session.timer.pause();int stage=session.stage.number,stars=session.stars(),previousBest=progress.bestStars(stage);',
              '        long elapsed=session.timer.elapsed();progress.complete(stage,stars,elapsed);persist();',
              '        resultStars=stars;resultElapsed=elapsed;resultPreviousBest=previousBest;resultActionTaken=false;',
              '        if(feel!=null)feel.action(game,ClumiFeedbackEvent.STAGE_CLEARED,stars);',
              '        if(feel!=null&&feel.motion()&&game!=null&&game.isAttachedToWindow()){',
              '            resultPending=true;game.beginSolveBridge();game.removeCallbacks(revealPendingResult);game.postDelayed(revealPendingResult,GameView.SOLVE_BRIDGE_MS);',
              '        }else showResult(stage,stars,elapsed,previousBest);',
              '    }'
          ]
          ml[start:end]=completed

          show='    private void showResult(int stage,int stars,long elapsed,int previousBest){'
          if ml.count(show)!=1: raise SystemExit('show result boundary mismatch')
          i=ml.index(show)+1
          ml.insert(i,'        resultPending=false;if(game!=null)game.removeCallbacks(revealPendingResult);')
          mp.write_text('\n'.join(ml)+'\n')
          PY
          git diff --check

      - name: Verify solve bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()
          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          assert 'static final int SOLVE_BRIDGE_MS=520;' in view
          assert 'void beginSolveBridge()' in view
          assert 'drawSolveBridge(Canvas canvas,float phase)' in view
          assert 'elapsed-row*38f' in view
          assert 'canvas.scale(1-.008f*settle' in view
          assert 'private boolean resultPending;' in main
          assert 'private final Runnable revealPendingResult=this::revealPendingResultNow;' in main
          assert 'private void revealPendingResultNow()' in main
          assert 'if(resultPending)return true;' in main
          assert 'resultPending||(lastDialog!=null&&lastDialog.isShowing())' in main
          assert 'game.postDelayed(revealPendingResult,GameView.SOLVE_BRIDGE_MS)' in main
          assert 'if(resultPending)return;' in main
          assert 'progress.complete(stage,stars,elapsed);persist();' in main
          assert 'feel.action(game,ClumiFeedbackEvent.STAGE_CLEARED,stars)' in main
          assert 'new GameView(MainActivity.this,pack.get(selected))' in main
          print('Solve-to-Clear bridge static contract: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push exact solve bridge patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain | wc -l)" -eq 2
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/GameView.java'
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/MainActivity.java'
          git config user.name 'Clumi UI Integration'
          git config user.email 'noreply@localhost'
          git add app/src/main/java/com/example/einsteingame/GameView.java app/src/main/java/com/example/einsteingame/MainActivity.java
          git commit -m 'ui: bridge solved board into clear result'
          git push origin "HEAD:$SOURCE_BRANCH"
