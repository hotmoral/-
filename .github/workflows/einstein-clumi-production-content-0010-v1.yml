name: Clumi Stage Start One Screen V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-stage-start-one-screen-v1
  cancel-in-progress: false

jobs:
  verify-stage-start-one-screen:
    if: >-
      github.event.head_commit.message == 'verify: Clumi Stage Start one screen v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 607bc2a975346a4321ab2199aef13c108e4fa0cc
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 607bc2a975346a4321ab2199aef13c108e4fa0cc
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Verify Stage Start one-screen contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          header=Path('app/src/main/java/com/example/einsteingame/ClumiHeaderBrand.java').read_text()
          start=Path('app/src/main/java/com/example/einsteingame/ClumiStageStartOneScreen.java').read_text()
          settings=Path('app/src/main/java/com/example/einsteingame/ClumiSettingsScrollPanel.java').read_text()
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()

          assert '"스테이지 시작".equals(label)' in header
          assert 'ClumiStageStartOneScreen.install(this)' in header
          assert 'scroll.removeView(body)' in start
          assert 'page.removeViewAt(index)' in start
          assert 'page.addView(body,index,bodyParams)' in start
          assert 'setTag("start-one-screen-body")' in start
          assert 'height<560' in start and 'height<720' in start
          assert 'compact((LinearLayout)panel,cta' in start
          assert 'ClumiSettingsScrollPanel.install(this,dark)' in header
          assert 'setTag("settings-scroll-shell")' in settings
          assert 'GameView next=new GameView(MainActivity.this,pack.get(selected));' in main
          assert 'state=new GameState(publishedPuzzle.puzzle);' in view
          print('Stage Start one-screen static contract: PASS')
          PY
          git diff --check

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac
