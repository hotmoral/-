name: Clumi Stage Clear One Screen V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-stage-clear-one-screen-v1
  cancel-in-progress: false

jobs:
  verify-stage-clear-one-screen:
    if: >-
      github.event.head_commit.message == 'verify: Clumi Stage Clear one screen v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: bc6809e6666894ee1c33570763f6de1d67e7bfff
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bc6809e6666894ee1c33570763f6de1d67e7bfff
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Verify Stage Clear one-screen contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          clear=Path('app/src/main/java/com/example/einsteingame/ClumiClearOneScreen.java').read_text()
          hero=Path('app/src/main/java/com/example/einsteingame/ClumiClearHero.java').read_text()
          seq=Path('app/src/main/java/com/example/einsteingame/ClumiResultSequence.java').read_text()
          start=Path('app/src/main/java/com/example/einsteingame/ClumiStageStartOneScreen.java').read_text()
          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()

          assert 'ClumiClearOneScreen.install(dialog,panel,records,actions);' in seq
          assert 'parent instanceof ScrollView' in clear
          assert 'dialog.setContentView(content)' in clear
          assert 'setTag("clear-one-screen")' in clear
          assert 'height<560' in clear and 'height<720' in clear
          assert 'size(hero,165' in clear and 'size(hero,210' in clear
          assert 'Math.min(w*.75f,h*.76f)' in hero
          assert 'Math.min(w*.47f,h*.56f)' in hero
          assert 'ClumiStageStartOneScreen' in start
          assert 'GameView next=new GameView(MainActivity.this,pack.get(selected));' in main
          assert 'state=new GameState(publishedPuzzle.puzzle);' in view
          print('Stage Clear one-screen static contract: PASS')
          PY
          git diff --check

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac
