name: Clumi Header Settings Surface V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-header-settings-surface-v1
  cancel-in-progress: false

jobs:
  verify-header-settings-surface:
    if: >-
      github.event.head_commit.message == 'verify: Clumi header settings surface v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: da3f43baef4c9252c9132018b96ab5cee5fea03e
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: da3f43baef4c9252c9132018b96ab5cee5fea03e
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Verify header and Settings surface contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          header=Path('app/src/main/java/com/example/einsteingame/ClumiHeaderBrand.java').read_text()
          settings=Path('app/src/main/java/com/example/einsteingame/ClumiSettingsScrollPanel.java').read_text()
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()

          assert 'ClumiHeaderBrand.height(this)' in main
          assert 'new ClumiHeaderBrand(this,title,dark())' in main
          assert 'headerRatio=' not in main
          assert '"설정".equals(label)' in header
          assert 'new DynamicTitle(context,label,dark)' in header
          assert 'ClumiSettingsScrollPanel.install(this,dark)' in header
          assert 'setTag("settings-scroll-shell")' in settings
          assert 'page.removeViewAt(index)' in settings
          assert 'shell.addView(scroll' in settings
          assert 'legacyPanel.setBackground(new ColorDrawable(Color.TRANSPARENT))' in settings
          assert 'GameView next=new GameView(MainActivity.this,pack.get(selected));' in main
          assert 'state=new GameState(publishedPuzzle.puzzle);' in view
          print('Header / Settings surface static contract: PASS')
          PY
          git diff --check

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac
