name: Clumi Final Responsive Regression V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-final-responsive-regression-v1
  cancel-in-progress: false

jobs:
  final-responsive-regression:
    if: >-
      github.event.head_commit.message == 'verify: Clumi final responsive regression v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 7242c767d025c73b7c2892685df74ad5b97a033b
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BUILD_TOOLS: '34.0.0'
      AVD_NAME: clumi-final-regression

    steps:
      - name: Require private source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout public harness assets
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact accepted UI HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Inject final responsive route and quarantine stale GameFeel evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s harness/.github/regression/ClumiFinalResponsiveEvidence.java
          cp harness/.github/regression/ClumiFinalResponsiveEvidence.java \
            source/app/src/androidTest/java/com/example/einsteingame/ClumiFinalResponsiveEvidence.java
          python3 - <<'PY'
          from pathlib import Path
          runner=Path('source/app/src/androidTest/java/com/example/einsteingame/ClumiUiTestRunner.java')
          text=runner.read_text()
          old='private Bundle feelArgs,transitionArgs,destinationArgs,mosaicArgs,visualB0Args;'
          new='private Bundle feelArgs,transitionArgs,destinationArgs,mosaicArgs,visualB0Args,finalResponsiveArgs;'
          if text.count(old)!=1: raise SystemExit('Runner field boundary changed')
          text=text.replace(old,new,1)
          old='@Override public void onCreate(Bundle args){super.onCreate(args);if(args.containsKey("b0visual"))visualB0Args=args;'
          new='@Override public void onCreate(Bundle args){super.onCreate(args);if(args.containsKey("finalresponsive"))finalResponsiveArgs=args;if(args.containsKey("b0visual"))visualB0Args=args;'
          if text.count(old)!=1: raise SystemExit('Runner onCreate boundary changed')
          text=text.replace(old,new,1)
          old='@Override public void onStart(){if(visualB0Args!=null)'
          new='@Override public void onStart(){if(finalResponsiveArgs!=null){new ClumiFinalResponsiveEvidence(this,finalResponsiveArgs).run();return;}if(visualB0Args!=null)'
          if text.count(old)!=1: raise SystemExit('Runner onStart boundary changed')
          text=text.replace(old,new,1)
          runner.write_text(text)

          legacy=Path('source/app/src/androidTest/java/com/example/einsteingame/ClumiGameFeelEvidence.java')
          if not legacy.exists(): raise SystemExit('Legacy GameFeel evidence missing')
          legacy.write_text('''package com.example.einsteingame;\n\nimport android.os.Bundle;\n\n/** Runner-only quarantine: historical GameFeel evidence targets a retired haptic test API. */\nfinal class ClumiGameFeelEvidence {\n    ClumiGameFeelEvidence(ClumiUiTestRunner host, Bundle args) {}\n    void run() { throw new AssertionError("Legacy GameFeel evidence is quarantined in final-responsive regression"); }\n}\n''')
          PY
          git -C source diff --check
          git -C source diff --quiet -- app/src/main
          test "$(git -C source status --porcelain | wc -l)" -eq 3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build, emulator and API 34 system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'system-images;android-34;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force \
            --name "$AVD_NAME" \
            --package 'system-images;android-34;google_apis;x86_64' >/dev/null
          test -f "$HOME/.android/avd/$AVD_NAME.ini"

      - name: Build debug app and Android instrumentation APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain \
              :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Boot API 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-regression/evidence
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics \
            > final-regression/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb shell input keyevent 82 || true
          adb devices -l

      - name: Install regression APKs
        shell: bash
        run: |
          set -euo pipefail
          adb install -r source/app/build/outputs/apk/debug/app-debug.apk
          adb install -r source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list instrumentation | grep -F 'com.example.einsteingame.ClumiUiTestRunner'

      - name: Run four-profile real-render regression
        shell: bash
        run: |
          set -euo pipefail
          profiles=(360x460 360x640 360x800 412x915)
          pixels=(720x920 720x1280 720x1600 824x1830)
          for i in "${!profiles[@]}"; do
            profile="${profiles[$i]}"
            pixel="${pixels[$i]}"
            echo "=== PROFILE $profile ($pixel @ 320dpi) ==="
            adb shell am force-stop com.example.einsteingame || true
            adb shell pm clear com.example.einsteingame >/dev/null
            adb shell wm density 320
            adb shell wm size "$pixel"
            sleep 2
            mkdir -p "final-regression/evidence/$profile"
            set +e
            adb shell am instrument -w -r \
              -e finalresponsive 1 \
              -e profile "$profile" \
              com.example.einsteingame.test/com.example.einsteingame.ClumiUiTestRunner \
              | tee "final-regression/evidence/$profile/instrumentation.log"
            code=${PIPESTATUS[0]}
            set -e
            test "$code" -eq 0
            grep -F "Clumi FINAL RESPONSIVE:" "final-regression/evidence/$profile/instrumentation.log"
            grep -F "assertions PASS ($profile)" "final-regression/evidence/$profile/instrumentation.log"
            device_dir="/sdcard/Android/data/com.example.einsteingame/files/final-regression/$profile"
            adb pull "$device_dir" "final-regression/evidence/" >/dev/null
            test -s "final-regression/evidence/$profile/summary.json"
            for screen in 01_home 02_stage_select 03_stage_start 04_gameplay 05_rewards 06_settings_light 07_settings_dark 08_clear_dark; do
              test -s "final-regression/evidence/$profile/$screen.png"
            done
          done
          adb shell wm size reset || true
          adb shell wm density reset || true

      - name: Aggregate regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          profiles=['360x460','360x640','360x800','412x915']
          output={'source_sha':'7242c767d025c73b7c2892685df74ad5b97a033b','profiles':{},'status':'PASS'}
          total=0
          for profile in profiles:
              path=Path('final-regression/evidence')/profile/'summary.json'
              data=json.loads(path.read_text())
              if data.get('status')!='PASS': raise SystemExit(f'{profile} did not pass')
              if data.get('profile')!=profile: raise SystemExit(f'{profile} report identity mismatch')
              shots=list(path.parent.glob('*.png'))
              if len(shots)!=8: raise SystemExit(f'{profile} expected 8 screenshots, got {len(shots)}')
              total+=int(data['assertions'])
              output['profiles'][profile]=data
          output['assertions_total']=total
          Path('final-regression/summary.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          PY

      - name: Build fresh Preview 1-10 APK from accepted UI HEAD
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build=Path('app/build.gradle')
          text=build.read_text()
          assert text.count("applicationId 'com.example.einsteingame'")==1
          assert text.count("versionName '0.2.7.1'")==1
          text=text.replace("applicationId 'com.example.einsteingame'","applicationId 'com.example.einsteingame.preview0010'",1)
          text=text.replace("versionName '0.2.7.1'","versionName '0.2.7.1-preview0010-ui-polish-v1'",1)
          build.write_text(text)
          strings=Path('app/src/main/res/values/strings.xml')
          value=strings.read_text()
          assert '<string name="app_name">Clumi</string>' in value
          strings.write_text(value.replace('<string name="app_name">Clumi</string>','<string name="app_name">Clumi Preview 1-10 UI</string>',1))
          PY
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify and stage Preview APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-regression/preview
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | tee final-regression/preview/apk-badging.txt
          grep -F "package: name='com.example.einsteingame.preview0010' versionCode='13' versionName='0.2.7.1-preview0010-ui-polish-v1'" final-regression/preview/apk-badging.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee final-regression/preview/apksigner.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' final-regression/preview/apksigner.txt
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          apk=Path('source/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              pack=json.loads(z.read('assets/puzzles/campaign-pack-0010-v1.json'))
              cfg=z.read('assets/stages/campaign-stage-config-v1.properties').decode()
          ids=[p['publishedPuzzleId'] for p in pack['puzzles']]
          assert ids==[f'PZ_CAMPAIGN_{i:06d}' for i in range(1,11)]
          assert 'stageCount=10' in cfg
          print('Preview campaign asset contract: PASS')
          PY
          cp "$APK" final-regression/preview/Clumi-Campaign-0010-UI-Polish-Preview.apk
          sha256sum final-regression/preview/Clumi-Campaign-0010-UI-Polish-Preview.apk \
            | tee final-regression/preview/Clumi-Campaign-0010-UI-Polish-Preview.apk.sha256

      - name: Upload final responsive regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-UI-Final-Responsive-Regression-V1
          path: final-regression/evidence
          retention-days: 14
          if-no-files-found: error

      - name: Upload Preview 1-10 UI polish APK
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Campaign-0010-UI-Polish-Preview
          path: final-regression/preview
          retention-days: 14
          if-no-files-found: error

      - name: Final contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -s final-regression/summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('final-regression/summary.json').read_text())
          assert data['status']=='PASS'
          assert set(data['profiles'])=={'360x460','360x640','360x800','412x915'}
          print('Clumi final responsive regression: PASS')
          print('Accepted production UI source remained unchanged:',data['source_sha'])
          PY
