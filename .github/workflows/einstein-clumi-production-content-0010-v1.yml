name: Clumi Campaign Runtime Binding V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-campaign-runtime-binding-v1
  cancel-in-progress: false

jobs:
  verify-runtime-binding:
    if: >-
      github.event.head_commit.message == 'verify: Clumi campaign runtime binding v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 6cfbb37666c2baa66838e3cd980a6298d5592cef
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact UI source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 6cfbb37666c2baa66838e3cd980a6298d5592cef
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Verify campaign runtime binding contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path

          main=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()
          pack=json.loads(Path('app/src/main/assets/puzzles/campaign-pack-0010-v1.json').read_text())
          cfg=Path('app/src/main/assets/stages/campaign-stage-config-v1.properties').read_text()

          assert len(pack['puzzles']) == 10
          assert [p['publishedPuzzleId'] for p in pack['puzzles']] == [f'PZ_CAMPAIGN_{i:06d}' for i in range(1,11)]
          assert 'stageCount=10' in cfg
          assert 'GameView next=new GameView(MainActivity.this,pack.get(selected));' in main
          assert 'GameView next=new GameView(this,pack.get(catalog.stage(stage).pilotIndex(pack)));' in main
          assert 'public GameView(Context context,PublishedRuntimePuzzleLoader.PublishedPuzzle publishedPuzzle)' in view
          assert 'state=new GameState(publishedPuzzle.puzzle);' in view
          assert 'private static PublishedRuntimePuzzleLoader.PublishedPuzzle loadPilot' in view
          assert 'puzzles/pilot-pack-v1.json' in view
          assert 'new GameView(MainActivity.this,selected)' not in main
          assert 'new GameView(this,catalog.stage(stage).pilotIndex(pack))' not in main
          print('Campaign runtime binding static contract: PASS')
          PY
          git diff --check

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac
