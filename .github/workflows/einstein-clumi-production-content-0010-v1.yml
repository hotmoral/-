name: Clumi Clue Completion Feedback V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-production-content-0010-v1.yml'

permissions:
  contents: read

concurrency:
  group: clumi-clue-completion-feedback-v1
  cancel-in-progress: false

jobs:
  patch-verify-clue-feedback:
    if: >-
      github.event.head_commit.message == 'verify: Clumi clue completion feedback v1 retry'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 160c1c0f5e67c5d7f67f413a6e0cf41f90ecc325
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact live UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply bounded clue completion feedback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/src/main/java/com/example/einsteingame/GameView.java')
          lines=path.read_text().splitlines()

          needle='    private float impulse(ClumiFeedbackEvent event,int row,int col,int slot){return feel==null?0:feel.impulse(event,row,col,slot);}'
          if lines.count(needle)!=1:
              raise SystemExit('impulse helper boundary mismatch')
          i=lines.index(needle)+1
          helper=[
              '    /** Latest active clue lane is presentation-only; completion may advance currentClue when completed clues are hidden. */',
              '    private int latestClueLane(ClumiFeedbackEvent kind,long now){',
              '        if(feel==null)return -1;int found=-1;long newest=Long.MIN_VALUE;',
              '        for(int lane=0;lane<ClumiFeedbackTimeline.CAPACITY;lane++)if(feel.timeline.types[lane]==kind',
              '                && now<feel.timeline.starts[lane]+kind.duration()&&feel.timeline.starts[lane]>=newest){',
              '            newest=feel.timeline.starts[lane];found=lane;',
              '        }',
              '        return found;',
              '    }'
          ]
          lines[i:i]=helper

          clue_line='        GameState.Clue clue = state.displayedClue();'
          if lines.count(clue_line)!=1:
              raise SystemExit('clue presentation boundary mismatch')
          j=lines.index(clue_line)
          expected=[
              clue_line,
              '        float clueSettle=impulse(ClumiFeedbackEvent.CLUE_COMPLETED,-1,-1,state.currentClue)+impulse(ClumiFeedbackEvent.CLUE_RESTORED,-1,-1,state.currentClue);if(clueSettle>0)strokeRound(c,clueBody,d(10),Color.argb((int)(90*clueSettle),32,180,234),d(1));',
              '        clueStrike=clue==null?0:feel==null?(clue.completed?1:0):feel.strike(true,-1,-1,state.currentClue,clue.completed);'
          ]
          if lines[j:j+3]!=expected:
              raise SystemExit('clue presentation source changed')
          replacement=[
              clue_line,
              '        long clueNow=SystemClock.elapsedRealtime();',
              '        int completedLane=latestClueLane(ClumiFeedbackEvent.CLUE_COMPLETED,clueNow);',
              '        int restoredLane=latestClueLane(ClumiFeedbackEvent.CLUE_RESTORED,clueNow);',
              '        float completion=completedLane<0?0:ClumiMotionTokens.impulse(feel.timeline.phase(completedLane,clueNow));',
              '        float restoration=restoredLane<0?0:ClumiMotionTokens.impulse(feel.timeline.phase(restoredLane,clueNow));',
              '        float clueSettle=Math.max(completion,restoration);',
              '        boolean handedOff=completedLane>=0&&feel.timeline.slots[completedLane]!=state.currentClue;',
              '        if(clueSettle>0)strokeRound(c,clueBody,d(10),Color.argb((int)(90*clueSettle),32,180,234),d(1));',
              '        if(completion>0){',
              '            effectPaint.reset();effectPaint.setAntiAlias(true);effectPaint.setStyle(Paint.Style.FILL);',
              '            if(!handedOff){effectPaint.setColor(Color.argb((int)(35*completion),25,189,53));c.drawRoundRect(clueBody,d(10),d(10),effectPaint);}',
              '            else strokeRound(c,clueBody,d(10),Color.argb((int)(135*completion),0,163,236),d(1.4f));',
              '            float badge=d(compactGameplay?17:19),cx=cluePanel.left+d(compactGameplay?10:12)+badge/2,cy=cluePanel.top+d(compactGameplay?7:9)+badge/2;',
              '            effectPaint.setColor(Color.argb((int)(220*completion),25,189,53));c.drawCircle(cx,cy,badge/2,effectPaint);',
              '            effectPaint.setStyle(Paint.Style.STROKE);effectPaint.setStrokeCap(Paint.Cap.ROUND);effectPaint.setStrokeJoin(Paint.Join.ROUND);effectPaint.setStrokeWidth(d(2));effectPaint.setColor(Color.argb((int)(255*completion),255,255,255));',
              '            c.drawLine(cx-badge*.23f,cy,cx-badge*.05f,cy+badge*.18f,effectPaint);c.drawLine(cx-badge*.05f,cy+badge*.18f,cx+badge*.27f,cy-badge*.22f,effectPaint);',
              '            effectPaint.setStyle(Paint.Style.FILL);',
              '        }',
              '        clueStrike=clue==null?0:feel==null?(clue.completed?1:0):feel.strike(true,-1,-1,state.currentClue,clue.completed);'
          ]
          lines[j:j+3]=replacement
          path.write_text('\n'.join(lines)+'\n')
          PY
          git diff --check

      - name: Verify clue feedback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          view=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()
          state=Path('app/src/main/java/com/example/einsteingame/GameState.java').read_text()
          feedback=Path('app/src/main/java/com/example/einsteingame/ClumiFeedbackController.java').read_text()
          assert 'latestClueLane(ClumiFeedbackEvent kind,long now)' in view
          assert 'completedLane=latestClueLane(ClumiFeedbackEvent.CLUE_COMPLETED' in view
          assert 'handedOff=completedLane>=0&&feel.timeline.slots[completedLane]!=state.currentClue' in view
          assert 'Color.argb((int)(35*completion),25,189,53)' in view
          assert 'Color.argb((int)(135*completion),0,163,236)' in view
          assert 'c.drawCircle(cx,cy,badge/2,effectPaint)' in view
          assert 'public void toggleCompleted()' in state
          assert 'displayed.completed = !displayed.completed;' in state
          assert 'filtersChanged();' in state
          assert 'void clue(GameView view,ClumiFeedbackEvent event,int index,boolean hidden)' in feedback
          assert 'state.toggleCompleted();seenItem("clue")' in view
          print('Clue completion feedback static contract: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push exact clue feedback patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -F 'app/src/main/java/com/example/einsteingame/GameView.java'
          git config user.name 'Clumi UI Integration'
          git config user.email 'noreply@localhost'
          git add app/src/main/java/com/example/einsteingame/GameView.java
          git commit -m 'ui: strengthen clue completion feedback'
          git push origin "HEAD:$SOURCE_BRANCH"
