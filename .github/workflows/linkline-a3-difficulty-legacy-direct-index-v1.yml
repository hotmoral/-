name: Linkline A3 Difficulty Legacy Direct Index v1
on:
  push:
    branches: [linkline/difficulty-selector-v2]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          git init repo && cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Build direct legacy source index
        working-directory: repo/linkline
        env: { PYTHONPATH: ".", PYTHONDONTWRITEBYTECODE: "1", PYTHONHASHSEED: "1" }
        run: |
          set -euo pipefail
          rm -rf public_output/a3_difficulty_legacy_direct_index_v1
          python tools/a3_difficulty_legacy_direct_index_v1.py \
            --plan public_output/a3_difficulty_selection_v4_final128/selection_plan.json \
            --output-dir public_output/a3_difficulty_legacy_direct_index_v1
          cat public_output/a3_difficulty_legacy_direct_index_v1/manifest.json
      - name: Commit public-safe direct index
        working-directory: repo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linkline/public_output/a3_difficulty_legacy_direct_index_v1
          git commit -m "Linkline A3: materialize direct legacy source index"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:linkline/difficulty-selector-v2
