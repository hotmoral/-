name: Mobi P1-B2.2 Android Footprint Feasibility

on:
  push:
    branches:
      - 'mobi/run-p1-b2-geometry-20261015'
    paths:
      - 'mobi/p1-b2/android-footprint/**'
      - '.github/workflows/mobi-p1-b22-android-footprint.yml'
  workflow_dispatch:

concurrency:
  group: mobi-p1-b22-android-footprint-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api35-footprint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify exact private-canonical source parity
        working-directory: mobi/p1-b2/android-footprint
        run: |
          set -euo pipefail
          test "$(git hash-object build.gradle)" = "5b7ccba7c566afb5057eaea1b10b99b083851fe4"
          test "$(git hash-object settings.gradle)" = "b610b35bf5875d7a9c95caacb29501fccf104d7a"
          test "$(git hash-object gradle.properties)" = "ed2d02acdd57b96d06bba03e812cb4bb053be633"
          test "$(git hash-object app/build.gradle)" = "ef624bee12cc7beeae5b99e6fc67dff1ee34d5df"
          test "$(git hash-object app/src/main/AndroidManifest.xml)" = "eae9e41876423a206e7e428a64824ad8104f6bf4"
          test "$(git hash-object app/src/main/java/org/example/mobifootprint/MainActivity.java)" = "0942d9c5fb1e63270ba4318abc2b6a019a524dc4"
          test "$(git hash-object app/src/main/java/org/example/mobifootprint/MultiWindowService.java)" = "640d85da08b0b9d9e6ecc8d9513346f1c07bc25a"
          test "$(git hash-object app/src/main/java/org/example/mobifootprint/FootprintPartView.java)" = "b1db53929aa1f18b477cfa3c9b9c8218886958c1"
          test "$(git hash-object app/src/main/java/org/example/mobifootprint/QaState.java)" = "43bfa1ad7860d6a93fabbd4fffd9af2042c90146"
          git hash-object build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/org/example/mobifootprint/*.java
          echo "P1-B2.2 Android source parity PASS"

      - name: Enforce permission firewall
        working-directory: mobi/p1-b2/android-footprint
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          for forbidden in BIND_ACCESSIBILITY_SERVICE PACKAGE_USAGE_STATS READ_SMS READ_CONTACTS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_CALL_LOG RECORD_AUDIO CAMERA; do
            if grep -q "$forbidden" "$manifest"; then
              echo "Forbidden capability present: $forbidden"
              exit 20
            fi
          done
          grep -q 'SYSTEM_ALERT_WINDOW' "$manifest"
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          echo "P1-B2.2 permission firewall PASS"

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build and run API 35 multi-window smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          pre-emulator-launch-script: gradle --no-daemon -p mobi/p1-b2/android-footprint :app:assembleDebug
          script: bash mobi/p1-b2/android-footprint/run_emulator_smoke.sh

      - name: Upload Android footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-b22-android-footprint-${{ github.run_id }}
          path: mobi/output/p1-b22-android-footprint
          if-no-files-found: warn
          retention-days: 30
