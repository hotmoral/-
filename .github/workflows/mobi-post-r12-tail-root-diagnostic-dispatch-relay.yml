name: Mobi Post-R12 Tail-Root Diagnostic One-Shot Dispatch Relay

on:
  push:
    branches:
      - mobi/ops-post-r12-tail-root-diagnostic-dispatch-20261017

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen post-R12 tail-root diagnostic workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hotmoral/-/actions/workflows/mobi-p1-c-post-r12-tail-root-diagnostic.yml/dispatches"
          body='{"ref":"mobi/run-p1-c-post-r12-tail-root-diagnostic-20261017","inputs":{"confirm_diagnostic":"RUN_POST_R12_TAIL_ROOT_DIAGNOSTIC_AFTER_PRIVATE_IMPORT"}}'
          code="$(curl -sS -o /tmp/dispatch_response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            -d "$body")"
          if [ "$code" != '204' ]; then
            cat /tmp/dispatch_response.txt >&2 || true
            echo "dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo 'Post-R12 tail-root diagnostic workflow_dispatch accepted (HTTP 204).'
