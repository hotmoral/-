name: Mobi P1-C DAR1 Pre-Evidence QA

on:
  push:
    branches:
      - mobi/run-p1-c-dar1-diagnostic-axis-revision-20261017
    paths:
      - 'mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py'
      - 'mobi/p1-b2/geometry/test_p1_c_dar1_diagnostic_axis_revision_v1.py'
      - '.github/workflows/mobi-p1-c-dar1-pre-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: mobi-p1-c-dar1-pre-evidence-qa
  cancel-in-progress: false

jobs:
  dar1-pre-evidence-qa:
    if: github.ref == 'refs/heads/mobi/run-p1-c-dar1-diagnostic-axis-revision-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch and inherited executable identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/mobi/run-p1-c-dar1-diagnostic-axis-revision-20261017'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)" = '837f4abe7ff474a527893b099be8087a104f7aaa'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_r10_morphology_reduction_v1.py)" = 'f281aad3e3a6c740c38c0a3f015718996dc45157'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_d_projection_v1.py)" = '5c8820fb7270e7727ececb1bb37d3a24331b24ab'
          test "$(git hash-object mobi/p1-b2/geometry/p1_c_3d_cat_stage_b_inspector_v1.py)" = '9b7899bc1c39d02291813a826df01d3697192846'
          test "$(sha256sum mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py | awk '{print $1}')" = 'fc4096162607dbf59859749562ec5ab9ea7d0e09551aa7cd3cd1ad05e9f5594c'

      - name: Assemble and verify exact frozen R11 implementation
        shell: bash
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          ./assemble_p1_c_r11_semantic_scaffold_v1.sh
          echo 'af2d8ccafb1878ad96cf6fae60167ae2a33f82480aa76710ce97c8fd95a6ad87  p1_c_r11_semantic_scaffold_v1.py' | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip

      - name: Install frozen inherited runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.4' \
            'fast-simplification==0.2.0' \
            'trimesh==4.11.1' \
            'scikit-image==0.26.0' \
            'scipy==1.17.0'
          python - <<'PY'
          import sys, numpy, fast_simplification, trimesh, skimage, scipy
          expected={
              'numpy':'2.5.4','fast_simplification':'0.2.0','trimesh':'4.11.1',
              'skimage':'0.26.0','scipy':'1.17.0'
          }
          actual={
              'numpy':numpy.__version__,'fast_simplification':fast_simplification.__version__,
              'trimesh':trimesh.__version__,'skimage':skimage.__version__,'scipy':scipy.__version__
          }
          if sys.version_info[:3] != (3,12,15): raise SystemExit(sys.version)
          if actual != expected: raise SystemExit(f'dependency drift: {actual}')
          print(sys.version)
          print(actual)
          PY

      - name: Run inherited and DAR1 synthetic contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd mobi/p1-b2/geometry
          python -m unittest -v test_p1_c_r11_semantic_scaffold_v1.py
          python -m unittest -v test_p1_c_r12_surface_terminal_bind_alias_v1.py
          python -m unittest -v test_p1_c_dar1_diagnostic_axis_revision_v1.py

      - name: Acquire exact frozen standing-cat source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c-dar1/qa/source
          E=mobi/p1-c-dar1/qa/source
          UA='Mobi DAR1 bounded pre-evidence QA/1.0'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -A "$UA" \
            'https://www.innerscene.com/api/library/standing-cat-cda42538/download' \
            -o "$E/cat-original.glb"
          echo '6870facdd3c7784581382af0ede14e5d6fc8f2092ac9ff15cda1f8c3feb315e5  mobi/p1-c-dar1/qa/source/cat-original.glb' | sha256sum -c -

      - name: Run DAR1 pre-evidence structural isolation audit under both seeds
        shell: bash
        run: |
          set -euo pipefail
          G=mobi/p1-b2/geometry
          SRC=mobi/p1-c-dar1/qa/source/cat-original.glb
          E=mobi/p1-c-dar1/qa
          mkdir -p "$E/seed1" "$E/seed777"
          PYTHONHASHSEED=1 python "$G/p1_c_dar1_diagnostic_axis_revision_v1.py" "$SRC" \
            --geometry-dir "$G" --stage0-audit --out "$E/seed1/stage0_audit.json"
          PYTHONHASHSEED=777 python "$G/p1_c_dar1_diagnostic_axis_revision_v1.py" "$SRC" \
            --geometry-dir "$G" --stage0-audit --out "$E/seed777/stage0_audit.json"
          diff -u "$E/seed1/stage0_audit.json" "$E/seed777/stage0_audit.json" > "$E/deterministic_diff.txt"
          test ! -s "$E/deterministic_diff.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mobi/p1-c-dar1/qa/seed1/stage0_audit.json')
          x=json.loads(p.read_text())
          assert x['version']=='P1_C_DAR1_DIAGNOSTIC_AXIS_REVISION_V1'
          assert x['variant']=='DAR1_HIERARCHY_CONTINUATION_ON_EXACT_PARENT_DEGENERACY'
          assert x['decisionToken']=='POST_R12_DIAGNOSTIC_AXIS_SINGLE_CHILD_CONTINUATION_SELECTED'
          assert x['contractToken']=='POST_R12_DIAGNOSTIC_AXIS_REVISION_CONTRACT_FROZEN'
          assert x['preflightToken']=='POST_R12_DIAGNOSTIC_AXIS_REVISION_PREFLIGHT_PASS'
          assert x['identity']['vertexCount']==3125 and x['identity']['faceCount']==6246
          assert x['identity']['meshArraySha256']=='839968886420707267d0e546c080f1af62c262391bf5e7a13babdbec1be32d77'
          assert x['controlCount']==30
          assert x['controlSnapshotByteIdenticalBeforeAfter'] is True
          assert x['weightByteIdenticalBeforeAfter'] is True
          assert x['r12DeltaAudit']['changedRoleCount']==4
          assert x['r12DeltaAudit']['unchangedNonPawRoleCount']==26
          assert x['r12DeltaAudit']['parentDomainProvenanceUnchanged'] is True
          a=x['axisIsolation']
          assert a['hierarchy']['edgeCount']==29
          assert a['hierarchy']['degenerateEdgeCount']==1
          assert a['hierarchy']['degenerateEdges']==[['PELVIS_CTRL','TAIL_ROOT_CTRL']]
          assert a['hierarchy']['directChildren']==['TAIL_1_CTRL']
          assert a['changedDiagnosticAxisRoles']==['TAIL_ROOT_CTRL']
          assert a['changedDiagnosticAxisRoleCount']==1
          assert a['allNonTailRootAxesExactInherited'] is True
          assert a['selectedTangentMatchesFrozenIdentity'] is True
          assert a['selectedAxisMatchesFrozenIdentity'] is True
          assert x['structuralStage1EvidenceExecuted'] is False
          assert x['jacobianDerivativeExecuted'] is False
          assert x['rasterEvidenceExecuted'] is False
          assert x['weightAudit']['domainBleedCount']==0
          assert x['weightAudit']['unweightedVertexCount']==0
          assert x['rest']['maxNormalized'] <= 1e-9
          assert x['rest']['rmsNormalized'] <= 1e-10
          print('DAR1 pre-evidence structural isolation PASS')
          PY

      - name: Record exact QA executable identities and manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=mobi/p1-c-dar1/qa
          mkdir -p "$E"
          {
            echo "git_head=$GITHUB_SHA"
            echo "dar1_adapter_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py)"
            echo "dar1_adapter_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_dar1_diagnostic_axis_revision_v1.py | awk '{print $1}')"
            echo "dar1_tests_blob=$(git hash-object mobi/p1-b2/geometry/test_p1_c_dar1_diagnostic_axis_revision_v1.py)"
            echo "dar1_tests_sha256=$(sha256sum mobi/p1-b2/geometry/test_p1_c_dar1_diagnostic_axis_revision_v1.py | awk '{print $1}')"
            echo "qa_workflow_blob=$(git hash-object .github/workflows/mobi-p1-c-dar1-pre-evidence-qa.yml)"
            echo "qa_workflow_sha256=$(sha256sum .github/workflows/mobi-p1-c-dar1-pre-evidence-qa.yml | awk '{print $1}')"
            echo "r12_adapter_blob=$(git hash-object mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py)"
            echo "r12_adapter_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_r12_surface_terminal_bind_alias_v1.py | awk '{print $1}')"
            echo "r11_assembled_sha256=$(sha256sum mobi/p1-b2/geometry/p1_c_r11_semantic_scaffold_v1.py | awk '{print $1}')"
          } > "$E/executable_identities.txt"
          python - <<'PY' > "$E/environment.txt"
          import platform,sys
          print(sys.version)
          print(platform.platform())
          try:
              import numpy,fast_simplification,trimesh,skimage,scipy
              print('numpy',numpy.__version__)
              print('fast-simplification',fast_simplification.__version__)
              print('trimesh',trimesh.__version__)
              print('scikit-image',skimage.__version__)
              print('scipy',scipy.__version__)
          except Exception as exc:
              print('dependency-report-error',repr(exc))
          PY
          find "$E" -type f ! -name QA_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$E/QA_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobi-p1-c-dar1-pre-evidence-qa-${{ github.run_id }}
          path: mobi/p1-c-dar1/qa
          if-no-files-found: error
          retention-days: 30
