name: Einstein Campaign 2000 Runner Adopt Optimized Source V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-runner-adopt-optimized-source-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  adopt-source:
    if: >-
      github.event.head_commit.message == 'optimization: adopt validated Einstein source in production runner v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_SOURCE_SHA: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      NEW_SOURCE_SHA: 9d981bc9048bc024c59ee6ede3ae04abe4c833d8
      RUNNER_BRANCH: campaign-production-2000-run-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout live production runner branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-run-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard old runner and adopt exact validated production source
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          OLD_RUNNER_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/$RUNNER_BRANCH)" = "$OLD_RUNNER_SHA"
          git cat-file -e "$NEW_SOURCE_SHA^{commit}"
          test -z "$(git diff --name-only "$OLD_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles)"
          grep -F "SOURCE_SHA='$OLD_SOURCE_SHA'" tools/campaign-production-2000/run_compact_n5_batch.sh >/dev/null
          grep -F 'test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"' tools/campaign-production-2000/run_compact_n5_batch.sh >/dev/null

          git checkout "$NEW_SOURCE_SHA" -- \
            puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/curriculum/CurriculumMetadataBuilder.java \
            puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java

          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/campaign-production-2000/run_compact_n5_batch.sh')
          s=p.read_text()
          old="SOURCE_SHA='cdb66a3e0509bfec050a907bb43efb4e01b4ffeb'"
          new="SOURCE_SHA='9d981bc9048bc024c59ee6ede3ae04abe4c833d8'"
          ancestry='test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"\n'
          if s.count(old)!=1 or s.count(ancestry)!=1:
              raise SystemExit('runner source guard anchors changed')
          s=s.replace(old,new).replace(ancestry,'git cat-file -e "$SOURCE_SHA^{commit}"\n')
          p.write_text(s)
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/curriculum/CurriculumMetadataBuilder.java'
          test "${changed[1]}" = 'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java'
          test "${changed[2]}" = 'tools/campaign-production-2000/run_compact_n5_batch.sh'
          test -z "$(git diff --name-only "$NEW_SOURCE_SHA" -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles)"
          grep -F "SOURCE_SHA='$NEW_SOURCE_SHA'" tools/campaign-production-2000/run_compact_n5_batch.sh >/dev/null
          grep -F 'git cat-file -e "$SOURCE_SHA^{commit}"' tools/campaign-production-2000/run_compact_n5_batch.sh >/dev/null
          echo "OLD_RUNNER_SHA=$OLD_RUNNER_SHA"
          echo 'OPTIMIZED_SOURCE_TREE_GUARD=PASS'

      - name: Compile exact runner production and producer sources
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf /tmp/einstein-runner-adopt-classes /tmp/einstein-runner-adopt-sources.txt
          mkdir -p /tmp/einstein-runner-adopt-classes
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > /tmp/einstein-runner-adopt-sources.txt
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataCodecV1.java' >> /tmp/einstein-runner-adopt-sources.txt
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/curriculum/CampaignProductionMetadataProjectionV1.java' >> /tmp/einstein-runner-adopt-sources.txt
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000N5DirectProducerV1.java' >> /tmp/einstein-runner-adopt-sources.txt
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d /tmp/einstein-runner-adopt-classes @/tmp/einstein-runner-adopt-sources.txt
          python3 tools/campaign-production-2000/campaign_production_2000.py plan >/tmp/einstein-runner-plan.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/einstein-runner-plan.json'))
          assert x['planHash']=='a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5', x
          PY
          echo 'OPTIMIZED_RUNNER_COMPILE_AND_PLAN=PASS'

      - name: Commit and push runner source adoption
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          git config user.name 'einstein-production-bot'
          git config user.email 'einstein-production-bot@users.noreply.github.com'
          git add \
            puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/curriculum/CurriculumMetadataBuilder.java \
            puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/difficulty/StaticDifficultyAnalyzer.java \
            tools/campaign-production-2000/run_compact_n5_batch.sh
          test -z "$(git diff --name-only)"
          git diff --cached --quiet && { echo 'expected staged runner diff missing' >&2; exit 1; } || true
          git commit -m 'production: adopt validated CP9 reuse source'
          NEW_RUNNER_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$RUNNER_BRANCH"
          echo "NEW_RUNNER_SHA=$NEW_RUNNER_SHA"
          echo 'OPTIMIZED_RUNNER_SOURCE_ADOPTION=PASS'
