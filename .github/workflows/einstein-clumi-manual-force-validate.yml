name: Clumi Manual Force + Board Reset Validation

on:
  push:
    branches:
      - clumi/manual-force-longpress-dev
    paths:
      - '.github/workflows/einstein-clumi-manual-force-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURE_SHA: 775e55aea61bf8cfdbb6dae32d9dd39950d626dc
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Require private source credential
        shell: bash
        run: test -n "$READ_TOKEN"

      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private feature checkpoint
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.FEATURE_SHA }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Apply staged feature transforms
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FEATURE_SHA"
          cd source
          git apply --check dev/manual-force-longpress.patch
          git apply dev/manual-force-longpress.patch
          python3 dev/board-reset-preserve-resources.py
          git diff --check
          grep -F 'public boolean forceCandidate(int slot)' app/src/main/java/com/example/einsteingame/GameState.java
          grep -F 'public boolean resetBoardPreservingResources()' app/src/main/java/com/example/einsteingame/GameState.java
          grep -F 'confirmUsed++' app/src/main/java/com/example/einsteingame/StageSession.java
          grep -F 'String[] glyphs={"back","reset","minus","fit","plus"};' app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '칸 확정 효과도 사라지며 이미 사용한 아이템은 돌아오지 않습니다.' app/src/main/java/com/example/einsteingame/MainActivity.java

      - name: Add behavior probe
        shell: bash
        run: |
          cat > source/app/src/main/java/com/example/einsteingame/ManualForceResetProbe.java <<'JAVA'
          package com.example.einsteingame;

          import java.lang.reflect.Field;

          public final class ManualForceResetProbe {
              private static void check(boolean value,String message){if(!value)throw new AssertionError(message);}
              private static int rawMask(GameState s,int row,int col){int mask=0;for(int i=0;i<GameState.SIZE;i++)if(s.isUserCandidatePresent(row,col,i))mask|=1<<i;return mask;}
              private static void allFresh(GameState s,String label){
                  for(int r=0;r<GameState.SIZE;r++)for(int c=0;c<GameState.SIZE;c++)
                      if(!s.isGiven(r,c))check(rawMask(s,r,c)==31,label+" @"+r+","+c+" mask="+rawMask(s,r,c));
              }
              public static void main(String[] args) throws Exception {
                  GameState s=new GameState();
                  s.select(0,2);
                  check(s.forceCandidate(1),"manual force must mutate");
                  check(rawMask(s,0,2)==2,"forced target singleton");
                  check(s.canUndo(),"force creates undo history");

                  Field assistsField=GameState.class.getDeclaredField("assistedSlot");
                  assistsField.setAccessible(true);
                  int[][] assists=(int[][])assistsField.get(s);
                  assists[1][1]=2;
                  check(s.assistedConfirmationCount()==1,"synthetic CONFIRM CELL effect staged");

                  check(s.resetBoardPreservingResources(),"reset must mutate board");
                  allFresh(s,"reset candidates");
                  check(s.assistedConfirmationCount()==0,"CONFIRM CELL board effect must clear");
                  check(!s.canUndo(),"reset must clear board undo history");
                  check(!s.hasPlacementContradiction(),"reset must clear contradiction");

                  GameState wrong=new GameState();
                  wrong.select(0,0);
                  check(wrong.toggleCandidate(0),"prep0");check(wrong.toggleCandidate(2),"prep2");check(wrong.toggleCandidate(3),"prep3");check(wrong.toggleCandidate(4),"prep4");
                  wrong.select(0,2);check(wrong.forceCandidate(1),"wrong force accepted");
                  check(wrong.hasPlacementContradiction(),"wrong force contradiction");
                  check(wrong.resetBoardPreservingResources(),"contradictory board reset");
                  allFresh(wrong,"contradiction reset candidates");
                  check(!wrong.hasPlacementContradiction(),"contradiction gone after reset");

                  String saved=wrong.saveBoard();GameState restored=new GameState();restored.restoreBoard(saved);
                  allFresh(restored,"saved reset state");check(!restored.canUndo(),"reset save has no old undo history");

                  System.out.println("MANUAL_FORCE_RESET_PROBE_PASS");
              }
          }
          JAVA

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile patched app source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac

      - name: Run behavior probe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP_CLASSES=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          CORE_CLASSES=puzzle-core/build/classes/java/main
          java -cp "$APP_CLASSES:$CORE_CLASSES:$ANDROID_HOME/platforms/android-34/android.jar" com.example.einsteingame.ManualForceResetProbe | tee ../manual-force-reset-probe.txt
          grep -F 'MANUAL_FORCE_RESET_PROBE_PASS' ../manual-force-reset-probe.txt

      - name: Verify feature scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee ../manual-force-reset-changed-files.txt
          test "$(git diff --name-only | grep -v '^app/src/main/java/com/example/einsteingame/ManualForceResetProbe.java$' | sort)" = $'app/src/main/java/com/example/einsteingame/GameState.java\napp/src/main/java/com/example/einsteingame/GameView.java\napp/src/main/java/com/example/einsteingame/MainActivity.java\napp/src/main/java/com/example/einsteingame/StageSession.java'

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: clumi-manual-force-reset-validation
          path: |
            manual-force-reset-probe.txt
            manual-force-reset-changed-files.txt
          retention-days: 3
          if-no-files-found: error
