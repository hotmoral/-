name: Einstein Campaign Production 2000 Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact private infrastructure commit
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: d1afb1cf049adb3c3e9eb2c0f20976b2ad227e90
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen production sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd1afb1cf049adb3c3e9eb2c0f20976b2ad227e90'
          test "$(git rev-parse HEAD~2)" = 'cdb66a3e0509bfec050a907bb43efb4e01b4ffeb'
          git merge-base --is-ancestor e6e18b8f796fa38c9bcbbb785d13bdd5f5835445 HEAD
          test -z "$(git diff --name-only cdb66a3e0509bfec050a907bb43efb4e01b4ffeb HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/java app/src/main/assets)"

      - name: Set up runner tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run synthetic infrastructure preflight
        shell: bash
        run: bash tools/campaign-production-2000/run-preflight.sh

      - name: Compile current accepted Campaign source and tests
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/build/campaign-2000-regression"
          mkdir -p "$out/core" "$out/authoring" "$out/tests"
          rg --files puzzle-core/src/main/java -g '*.java' | sort > "$out/core-sources.txt"
          rg --files puzzle-authoring/src/main/java -g '*.java' | sort > "$out/authoring-sources.txt"
          rg --files puzzle-authoring/src/test/java -g '*.java' | sort > "$out/test-sources.txt"
          java -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 -source 8 -target 8 -d "$out/core" @"$out/core-sources.txt"
          java -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 -source 8 -target 8 -cp "$out/core" -d "$out/authoring" @"$out/authoring-sources.txt"
          java -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 -source 8 -target 8 -cp "$out/core:$out/authoring" -d "$out/tests" @"$out/test-sources.txt"

      - name: Run current accepted Campaign determinism and durability regressions
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/build/campaign-2000-regression"
          cp_path="$out/core:$out/authoring:$out/tests"
          for seed in 7 23; do
            PYTHONHASHSEED="$seed" python3 -c 'import json; print(json.dumps({"candidateOrder":list({"A_RARE","B_COMMON","C_FINAL"})},separators=(",",":")))' > "$out/process-order-$seed.json"
          done
          cmp -s "$out/process-order-7.json" "$out/process-order-23.json" && exit 1 || true
          mkdir -p build/campaign-core
          java -Xmx2g -Dcampaign.inputOrder="$out/process-order-7.json" -cp "$cp_path" com.example.einsteingame.authoring.pss.CampaignCoreTest
          cp build/campaign-core/golden-summary.json "$out/normal-summary.json"
          cp build/campaign-core/integration-evidence.json "$out/normal-integration-evidence.json"
          java -Xmx2g -Dcampaign.inputOrder="$out/process-order-23.json" -cp "$cp_path" com.example.einsteingame.authoring.pss.CampaignCoreTest reverse
          cmp build/campaign-core/golden-summary.json "$out/normal-summary.json"
          cmp build/campaign-core/integration-evidence.json "$out/normal-integration-evidence.json"
          (cd puzzle-authoring && java -Xmx2g -cp "$cp_path" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionCheckpointTest)

      - name: Run Android publication bridge regression
        shell: bash
        run: bash tools/test-phase-e13.sh

      - name: Terminal boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'TEST_OUTPUT_STATUS_BEGIN'
          git status --porcelain --untracked-files=all || true
          echo 'TEST_OUTPUT_STATUS_END'
          git diff --quiet HEAD --
          test -z "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only cdb66a3e0509bfec050a907bb43efb4e01b4ffeb HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/java app/src/main/assets)"
          echo 'NEW_PRODUCTION_PUZZLES=0'
          echo 'NEW_FORMAL_DRAWS=0'
          echo 'NEW_BANKED_PRODUCTION_STAGES=0'
          echo 'NEW_PUBLISHED_PRODUCTION_STAGES=0'
          echo 'READY_FOR_PRODUCTION_START_INSTRUCTION'
