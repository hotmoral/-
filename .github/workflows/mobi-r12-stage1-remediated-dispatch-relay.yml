name: Mobi R12 Stage-1 Remediated One-Shot Dispatch Relay

on:
  push:
    branches:
      - mobi/ops-r12-stage1-remediated-dispatch-20261017

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen remediated R12 Stage-1 workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hotmoral/-/actions/workflows/mobi-p1-c-r12-surface-terminal-bind.yml/dispatches"
          body='{"ref":"mobi/run-p1-c-r12-surface-terminal-bind-20261017","inputs":{"confirm_stage1":"RUN_R12_STAGE1_AFTER_STAGE0_FREEZE"}}'
          code="$(curl -sS -o /tmp/dispatch_response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            -d "$body")"
          if [ "$code" != '204' ]; then
            cat /tmp/dispatch_response.txt >&2 || true
            echo "dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo 'Remediated R12 Stage-1 workflow_dispatch accepted (HTTP 204).'
