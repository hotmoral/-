name: ReceiptLedger V1 Design System Foundation

on:
  push:
    branches:
      - receiptledger/run-v1-design-system-foundation-20261016
    paths:
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/design/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/design/**'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/LibraryActivity.java'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/PriceHistoryActivity.java'
      - '.github/workflows/receiptledger-v1-design-system-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-design-system-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-design-system-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce CP30 scope and frozen contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=3727db04d2207fe92c0552d4691dbf421d71444c
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp30-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-design-system-foundation.yml) ;;
              receiptledger/CP30_DESIGN_SYSTEM_FOUNDATION_PLAN.md) ;;
              receiptledger/DESIGN_SYSTEM_FOUNDATION_CONSISTENCY_REVIEW.md) ;;
              receiptledger/DESIGN_SYSTEM_FOUNDATION_GOLDEN_VECTORS.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/design/*) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/design/*) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/LibraryActivity.java) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/PriceHistoryActivity.java) ;;
              '') ;;
              *) echo "CP30 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp30-changed-files.txt
          for frozen in catalog product semantics identity category commodity persistence price priceintel priceeval search; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/$frozen" || { echo "Frozen upstream package changed: $frozen"; exit 32; }
          done
          for frozen_file in \
            "$APP/src/main/AndroidManifest.xml" \
            "$APP/src/main/java/com/receiptledger/v1/MainActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/ReceiptDetailActivity.java" \
            "$APP/src/main/java/com/receiptledger/v1/review/ReceiptReviewDialog.java" \
            "$APP/src/main/res/values/strings.xml"; do
            git diff --quiet "$BASE" "$GITHUB_SHA" -- "$frozen_file" || { echo "Frozen UI flow file changed: $frozen_file"; exit 33; }
          done
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 29' "$APP/build.gradle"
          grep -Fq "versionName '1.0.28-design-system-foundation'" "$APP/build.gradle"
          grep -Fq 'UiKitV1' "$APP/src/main/java/com/receiptledger/v1/LibraryActivity.java"
          grep -Fq 'UiKitV1' "$APP/src/main/java/com/receiptledger/v1/PriceHistoryActivity.java"

      - name: Test lint and build
        shell: bash
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.price.PriceHistoryServiceTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml; do
            if [ ! -f "$TEST_XML" ]; then echo "Expected test result missing: $TEST_XML"; status=42; fi
          done
          exit "$status"

      - name: Extract and verify CP30 design metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp30-design-metrics.txt
          import re, xml.etree.ElementTree as ET
          path='receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml'
          root=ET.parse(path).getroot()
          text='\n'.join((n.text or '') for n in root.iter('system-out'))
          lines=[x.strip() for x in text.splitlines() if x.strip().startswith('CP30_METRICS ')]
          if len(lines)!=1: raise SystemExit('Expected exactly one CP30_METRICS line, got %d' % len(lines))
          line=lines[0]
          v={k:int(x) for k,x in re.findall(r'(\w+)=(\d+)',line)}
          expected={
            'typography_roles':6,
            'semantic_tones':8,
            'price_presentations':8,
            'validation_presentations':4,
            'ui_states':8,
            'contrast_pairs':9,
            'responsive_cases':5,
            'chart_cross_basis_rejections':1,
            'min_touch_dp':48,
            'representative_activities':2,
          }
          missing=[k for k in expected if k not in v]
          if missing: raise SystemExit('Missing metrics: '+','.join(missing))
          for k,val in expected.items():
            if v[k] != val: raise SystemExit('%s expected %d got %d' % (k,val,v[k]))
          print(line)
          PY

      - name: Package and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=3727db04d2207fe92c0552d4691dbf421d71444c
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-design-system-foundation
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-design-system-foundation-debug.apk"
          cp receiptledger/cp30-design-metrics.txt "$OUT/CP30_DESIGN_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.design.DesignSystemFoundationV1Test.xml" "$OUT/DESIGN_SYSTEM_FOUNDATION_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.search.SearchBrowseV1Test.xml" "$OUT/SEARCH_BROWSE_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceeval.PriceEvaluationV1Test.xml" "$OUT/PRICE_EVALUATION_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.priceintel.PriceIntelligenceV2Test.xml" "$OUT/PRICE_INTELLIGENCE_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.price.PriceHistoryServiceTest.xml" "$OUT/LEGACY_PRICE_HISTORY_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.commodity.CommodityNonStandardV2Test.xml" "$OUT/COMMODITY_NONSTANDARD_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.category.CategorySystemV1Test.xml" "$OUT/CATEGORY_SYSTEM_V1_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.identity.IdentityResolverV2Test.xml" "$OUT/IDENTITY_RESOLVER_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml" "$OUT/RECEIPT_PRODUCT_SEMANTICS_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml" "$OUT/CATALOG_DOMAIN_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml" "$OUT/PERSISTENCE_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-design-system-foundation-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden permission packaged: $forbidden"; exit 51; fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP30_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-design-system-foundation-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_DESIGN_SYSTEM_FOUNDATION_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'ui_architecture=PROGRAMMATIC_ANDROID_WIDGET_PRESERVED'
            echo 'compose_migration=NONE'
            echo 'material_dependency_added=NO'
            echo 'min_touch_target_dp=48'
            echo 'small_text_contrast_min=4.5'
            echo 'responsive_breakpoints=600_840'
            echo 'cross_basis_chart_series=FORBIDDEN'
            echo 'domain_semantics_mutation=NONE'
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.28-design-system-foundation'
            echo 'version_code=29'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP30_DESIGN_METRICS.txt "$OUT"/DESIGN_SYSTEM_FOUNDATION_V1_TEST.xml "$OUT"/CP30_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-design-system-foundation-${{ github.run_id }}
          path: receiptledger/output/v1-design-system-foundation/
          if-no-files-found: error
          retention-days: 14
