name: Einstein Campaign Production 2000 Batch 0014-0016 Optimized V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-batch-0014-0016-optimized-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-batch-0014-0016:
    if: >-
      github.event.head_commit.message == 'production: run optimized Einstein campaign batch 0014-0016'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNNER_SHA: c4b591918072a09eb62c9f80f85a5df6b924c785
      EXPECTED_BANK_HEAD: 03f62c311864ee1559ce41e1222b381c7e8ab598
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact optimized bounded batch runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: c4b591918072a09eb62c9f80f85a5df6b924c785
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute bounded optimized compact N5 batch
        shell: bash
        env:
          EINSTEIN_RUNNER_SHA: c4b591918072a09eb62c9f80f85a5df6b924c785
          EINSTEIN_BANK_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
        run: |
          set -euo pipefail
          bash EinsteinGame/tools/campaign-production-2000/run_compact_n5_batch.sh 14 3 "$EXPECTED_BANK_HEAD"
