name: DeepHold I1 path diagnostic

on:
  push:
    branches:
      - timing-defense-skilled-v2-harness-v01
    paths:
      - '.github/workflows/deephold-i1-path-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-index:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/deephold-i1/' -o /tmp/body
          grep -q 'DeepHold I1 QA' /tmp/body

  explicit-index:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/deephold-i1/index.html' -o /tmp/body
          grep -q 'DeepHold I1 QA' /tmp/body

  app-js:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/deephold-i1/app.js' -o /tmp/body
          grep -q '__DEEPHOLD_I1_QA__' /tmp/body

  root-baseline:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 10 'https://timing-defense-skilled-v2-harness.sktjsek.workers.dev/api/health' -o /tmp/body
          grep -q 'skilled-v2-harness-v0.1' /tmp/body
