name: Timing Defense v0.42 CHARGER Candidate CI

on:
  push:
    branches:
      - timing-defense-cloudflare-v042-charger-state
    paths:
      - '.github/workflows/timing-defense-v042-charger-ci.yml'
      - 'timing-defense-cloudflare-poc/src/**'
      - 'timing-defense-cloudflare-poc/wrangler.jsonc'

permissions:
  contents: read

jobs:
  candidate-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check timing-defense-cloudflare-poc/src/v042-charger-entry.js
          node --check timing-defense-cloudflare-poc/src/v042-charger-selftest.js
          node --check timing-defense-cloudflare-poc/src/v042-charger-audit-entry.js
      - name: Pure capability regression
        run: |
          node --input-type=module <<'NODE'
          import { runMonsterCapabilityV1SelfTest } from './timing-defense-cloudflare-poc/src/monster-capability-v1-selftest.js';
          const r=runMonsterCapabilityV1SelfTest();console.log(JSON.stringify(r,null,2));if(!r.ok)process.exit(1);
          NODE
      - name: Worker bundle dry-run
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config timing-defense-cloudflare-poc/wrangler.jsonc
      - name: CHARGER diagnostics under local Worker runtime
        run: |
          set -euo pipefail
          LOG=/tmp/v042-wrangler.log
          npx --yes wrangler@4.45.0 dev --config timing-defense-cloudflare-poc/wrangler.jsonc --ip 127.0.0.1 --port 8787 >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/v042-health.json 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$LOG"; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$LOG"; exit 1; fi
          curl -fsS http://127.0.0.1:8787/api/diagnostics/v042-charger >/tmp/v042-diagnostics.json || { cat /tmp/v042-diagnostics.json 2>/dev/null || true; cat "$LOG"; exit 1; }
          cat /tmp/v042-diagnostics.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/v042-diagnostics.json','utf8'));
          const ok=d?.ok&&d?.foundation?.ok&&d?.v039?.ok&&d?.shield?.ok&&d?.flyer?.ok&&d?.charger?.ok;
          if(!ok){console.error(JSON.stringify({failed:{foundation:d?.foundation?.failed,v039:d?.v039?.failed,shield:d?.shield?.failed,flyer:d?.flyer?.failed,charger:d?.charger?.failed}},null,2));process.exit(1)}
          console.log(`CHARGER ${d.charger.passed}/${d.charger.total} PASS`);
          NODE
