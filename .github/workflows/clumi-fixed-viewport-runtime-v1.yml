name: Clumi Fixed Viewport Runtime V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clumi-fixed-viewport-runtime-v1.yml'
      - '.github/regression/ClumiFixedViewportRuntimeRunner.java'

permissions:
  contents: read

concurrency:
  group: clumi-fixed-viewport-runtime-v1
  cancel-in-progress: false

jobs:
  runtime-fixed-viewport:
    if: >-
      github.event.head_commit.message == 'verify: Clumi fixed viewport runtime v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: clumi-fixed-viewport-v1
      SOURCE_SHA: 28a8001173948d1797f7bc8b3ec0fb99c7a9dbc3
      AVD_NAME: clumi-fixed-viewport

    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private fixed viewport source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact private source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"
          test -z "$(git -C source status --porcelain)"

      - name: Install isolated fixed viewport runner
        shell: bash
        run: |
          set -euo pipefail
          test -s harness/.github/regression/ClumiFixedViewportRuntimeRunner.java
          rm -rf source/app/src/androidTest/java/com/example/einsteingame
          mkdir -p source/app/src/androidTest/java/com/example/einsteingame
          cp harness/.github/regression/ClumiFixedViewportRuntimeRunner.java source/app/src/androidTest/java/com/example/einsteingame/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle')
          text=p.read_text()
          old="testInstrumentationRunner 'com.example.einsteingame.ClumiUiTestRunner'"
          new="testInstrumentationRunner 'com.example.einsteingame.ClumiFixedViewportRuntimeRunner'"
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          PY
          git -C source diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build emulator and API 34 image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-34' 'build-tools;34.0.0' 'system-images;android-34;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force --name "$AVD_NAME" --package 'system-images;android-34;google_apis;x86_64' --device 'pixel_6' >/dev/null

      - name: Build debug app and isolated instrumentation APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Boot API 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixed-runtime/evidence
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > fixed-runtime/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb shell input keyevent 82 || true

      - name: Install runtime APKs
        shell: bash
        run: |
          set -euo pipefail
          adb install -r source/app/build/outputs/apk/debug/app-debug.apk
          adb install -r source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list instrumentation | grep -F 'com.example.einsteingame.ClumiFixedViewportRuntimeRunner'

      - name: Run fixed viewport contract on three profiles
        shell: bash
        run: |
          set -euo pipefail
          profiles=(360x640 360x800 360x900)
          pixels=(720x1280 720x1600 720x1800)
          adb shell wm density 320
          for i in "${!profiles[@]}"; do
            profile="${profiles[$i]}"
            pixel="${pixels[$i]}"
            adb shell am force-stop com.example.einsteingame || true
            adb shell pm clear com.example.einsteingame >/dev/null
            adb shell wm size "$pixel"
            sleep 2
            mkdir -p "fixed-runtime/evidence/$profile"
            adb shell am instrument -w -r -e profile "$profile" com.example.einsteingame.test/com.example.einsteingame.ClumiFixedViewportRuntimeRunner | tee "fixed-runtime/evidence/$profile/instrumentation.log"
            grep -F "CLUMI_FIXED_VIEWPORT_STATUS=PASS profile=$profile" "fixed-runtime/evidence/$profile/instrumentation.log"
            device_dir="/sdcard/Android/data/com.example.einsteingame/files/fixed-viewport/$profile"
            adb pull "$device_dir" "fixed-runtime/evidence/" >/dev/null
            test -s "fixed-runtime/evidence/$profile/summary.txt"
            test -s "fixed-runtime/evidence/$profile/01_home.png"
            test -s "fixed-runtime/evidence/$profile/02_stage_start.png"
            grep -F 'status=PASS' "fixed-runtime/evidence/$profile/summary.txt"
            grep -F 'logical_dp=360x800' "fixed-runtime/evidence/$profile/summary.txt"
            grep -F 'touch=PASS' "fixed-runtime/evidence/$profile/summary.txt"
          done
          adb shell wm size reset || true
          adb shell wm density reset || true

      - name: Aggregate fixed viewport evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          profiles=['360x640','360x800','360x900']
          rows=[]
          for profile in profiles:
              values=dict(line.split('=',1) for line in (Path('fixed-runtime/evidence')/profile/'summary.txt').read_text().splitlines() if '=' in line)
              assert values['status']=='PASS'
              assert values['profile']==profile
              assert values['logical_dp']=='360x800'
              assert values['touch']=='PASS'
              rows.append(f"{profile}: scale={values['home_scale']} translation={values['home_translation_px']} assertions={values['assertions']}")
          Path('fixed-runtime/summary.txt').write_text('status=PASS\nsource_sha=28a8001173948d1797f7bc8b3ec0fb99c7a9dbc3\n'+'\n'.join(rows)+'\n')
          print(Path('fixed-runtime/summary.txt').read_text())
          PY

      - name: Restore private source workspace after test-only injection
        shell: bash
        run: |
          set -euo pipefail
          git -C source restore app/build.gradle app/src/androidTest
          git -C source clean -fd -- app/src/androidTest/java/com/example/einsteingame
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload bounded runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Fixed-Viewport-Runtime-V1
          path: |
            fixed-runtime/evidence
            fixed-runtime/summary.txt
            fixed-runtime/emulator.log
          retention-days: 14
          if-no-files-found: error
