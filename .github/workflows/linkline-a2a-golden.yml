name: Linkline A3-C1 Universe Fingerprint Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - linkline/a3-calibration-set-validation
    paths:
      - .github/workflows/linkline-a2a-golden.yml

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Reconstruct exact C1 source and independent oracle
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def fetch_blob(sha):
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'linkline-a3-c1-fingerprint',
                  },
              )
              with urlopen(req) as r:
                  payload = json.load(r)
              return base64.b64decode(payload['content'])

          def git_blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          chunks = [
              '2aecd8f72529b2c750478ff21e75fefabe1eb004',
              '5a15526e6a33e446c7e120c2d4ac3d07ced09032',
              '71e104af5c14789fd88a69c668faf44d7baa0a36',
              'fff112d3bbce89779d3b908a578db8f99640af07',
          ]
          source = b''.join(fetch_blob(sha) for sha in chunks)
          if git_blob_sha(source) != '919f2413a3ca82d643f24dc000187c9e7bc7b3f2':
              raise SystemExit('C1 source reconstruction mismatch')
          Path('linkline/analysis/a3_calibration_set.py').write_bytes(source)

          oracle_sha = 'edbe248b19fc48683f1a0b19ca989f5f91e2c317'
          oracle = fetch_blob(oracle_sha)
          if git_blob_sha(oracle) != oracle_sha:
              raise SystemExit('oracle blob mismatch')
          target = Path('linkline/tests/oracles/a3_calibration_selection_oracle.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(oracle)
          PY

      - name: Compare independent and production universe fingerprints
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from itertools import combinations
          import json

          from analysis.a3_calibration_set import candidate_universe, universe_fingerprint
          from tests.oracles import a3_calibration_selection_oracle as oracle

          domain = {3: tuple(range(3, 9)), 4: tuple(range(3, 11))}

          production = candidate_universe(domain)
          production_ids = [row['researchEquivalenceIdV1'] for row in production]
          production_fp = universe_fingerprint(production)

          independent_ids = set()
          for n in sorted(domain):
              for length in domain[n]:
                  for path in oracle.canonical_paths(n, length):
                      endpoints = frozenset((path[0], path[-1]))
                      for targets in combinations(range(n * n), 2):
                          if frozenset(targets) == endpoints:
                              continue
                          independent_ids.add(
                              oracle.research_equivalence_id(n, length, path, targets)
                          )
          independent_ordered = sorted(independent_ids)
          independent_fp = sha256(
              json.dumps(independent_ordered, separators=(',', ':')).encode('utf-8')
          ).hexdigest()

          print(f'PRODUCTION_COUNT={len(production_ids)}')
          print(f'INDEPENDENT_COUNT={len(independent_ordered)}')
          print(f'PRODUCTION_FP={production_fp}')
          print(f'INDEPENDENT_FP={independent_fp}')
          print(f'ID_LISTS_EQUAL={production_ids == independent_ordered}')

          if len(production_ids) != 84320 or len(independent_ordered) != 84320:
              raise SystemExit('unexpected universe count')
          if production_ids != independent_ordered:
              raise SystemExit('production/independent universe identities differ')
          if production_fp != independent_fp:
              raise SystemExit('production/independent fingerprints differ')
          PY
