name: Linkline A3-C1 Persist Calibration Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - linkline/a3-calibration-set-validation
    paths:
      - .github/workflows/linkline-a2a-golden.yml

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Recover and validate manifest from successful C1 run
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/120708030036/logs" \
            -o /tmp/c1-job.log

          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from collections import Counter
          from pathlib import Path

          text = Path('/tmp/c1-job.log').read_text(encoding='utf-8-sig', errors='strict')
          found = {}
          for line in text.splitlines():
              match = re.search(r'C1_MANIFEST_B64_(\d{4})=([A-Za-z0-9+/=]+)', line)
              if match:
                  found[int(match.group(1))] = match.group(2)
          if not found:
              raise SystemExit('manifest chunks not found in source job log')
          expected_indexes = list(range(max(found) + 1))
          if sorted(found) != expected_indexes:
              raise SystemExit('manifest chunk sequence incomplete')

          encoded = ''.join(found[index] for index in expected_indexes)
          raw = gzip.decompress(base64.b64decode(encoded))
          manifest = json.loads(raw)

          def fingerprint(payload):
              clean = dict(payload)
              clean.pop('manifestFingerprint', None)
              data = json.dumps(clean, sort_keys=True, separators=(',', ':')).encode('utf-8')
              return hashlib.sha256(data).hexdigest()

          expected_manifest = '2c3615516ad5caea431ec98bc1ec985a1dd6996d17c013c8e0fabe047932c2b1'
          expected_universe = 'ce78c38e4110a7bd21ba5413677bdfcb3e8e764002db7fd35bb7aa1c110e1ca0'
          if manifest.get('manifestFingerprint') != expected_manifest:
              raise SystemExit('manifest fingerprint differs from successful run summary')
          if fingerprint(manifest) != expected_manifest:
              raise SystemExit('manifest self-fingerprint mismatch')
          if manifest.get('identityUniverseCount') != 84320:
              raise SystemExit('identity universe count mismatch')
          if manifest.get('identityUniverseFingerprint') != expected_universe:
              raise SystemExit('identity universe fingerprint mismatch')
          if manifest.get('resultStatus') != 'CALIBRATION_SET_COMPLETE':
              raise SystemExit('calibration set is not complete')
          if manifest.get('analysisBudgetUsed') != 20000:
              raise SystemExit('unexpected analysis budget')
          if manifest.get('exactEligibleCount') != 9218:
              raise SystemExit('unexpected exact eligible count')
          if manifest.get('incompleteFeatureCount') != 0:
              raise SystemExit('unexpected incomplete feature count')
          if manifest.get('coverage', {}).get('unmetTargets') != []:
              raise SystemExit('coverage target is unmet')

          roles = Counter(row['role'] for row in manifest.get('selected', []))
          if roles != Counter({'PILOT_ELIGIBLE': 24, 'RESERVE_HOLDOUT': 12}):
              raise SystemExit(f'unexpected role counts: {roles}')
          if manifest.get('coverage', {}).get('matchedPairCounts') != {
              'MP1': 3, 'MP2': 3, 'MP3': 3, 'MP4': 3, 'MP5': 2
          }:
              raise SystemExit('matched pair target mismatch')

          target = Path('linkline/evidence/a3_c1_calibration_set_manifest_v1.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(f'manifestFingerprint={expected_manifest}')
          print(f'manifestChunks={len(found)}')
          print(f'manifestBytes={target.stat().st_size}')
          PY

      - name: Commit manifest only
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="linkline/evidence/a3_c1_calibration_set_manifest_v1.json"
          test -f "$target"
          git add "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git config user.name "linkline-validation"
          git config user.email "linkline-validation@users.noreply.github.com"
          git commit -m "Linkline A3-C1: record calibration-set manifest"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/linkline/a3-calibration-set-validation
