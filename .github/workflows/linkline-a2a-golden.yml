name: Linkline A3-C1 Calibration Selection

on:
  workflow_dispatch:
  push:
    branches:
      - linkline/a3-calibration-set-validation
    paths:
      - .github/workflows/linkline-a2a-golden.yml

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Reconstruct exact C1 bundle
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def fetch_blob(sha):
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'linkline-a3-c1-validation',
                  },
              )
              with urlopen(req) as r:
                  payload = json.load(r)
              if payload.get('sha') != sha or payload.get('encoding') != 'base64':
                  raise SystemExit(f'blob identity mismatch: {sha}')
              return base64.b64decode(payload['content'])

          def git_blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          chunks = [
              '2aecd8f72529b2c750478ff21e75fefabe1eb004',
              '5a15526e6a33e446c7e120c2d4ac3d07ced09032',
              '71e104af5c14789fd88a69c668faf44d7baa0a36',
              'fff112d3bbce89779d3b908a578db8f99640af07',
          ]
          source = b''.join(fetch_blob(sha) for sha in chunks)
          expected = '919f2413a3ca82d643f24dc000187c9e7bc7b3f2'
          if git_blob_sha(source) != expected:
              raise SystemExit('reconstructed C1 source mismatch')
          Path('linkline/analysis/a3_calibration_set.py').write_bytes(source)

          small = {
              'edbe248b19fc48683f1a0b19ca989f5f91e2c317': 'linkline/tests/oracles/a3_calibration_selection_oracle.py',
              'bd328d78e661d29b43af91bc60279084f7bd42b0': 'linkline/tests/fixtures/a3_calibration_selection_golden_v1.json',
              '0483fa1c01e862649211ccb84c215536ac705eb6': 'linkline/tests/test_a3_calibration_selection_oracle.py',
          }
          for sha, path in small.items():
              data = fetch_blob(sha)
              if git_blob_sha(data) != sha:
                  raise SystemExit(f'decoded blob mismatch: {path}')
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
          test "$(git hash-object linkline/analysis/a3_calibration_set.py)" = "919f2413a3ca82d643f24dc000187c9e7bc7b3f2"
          test "$(git hash-object linkline/tests/oracles/a3_calibration_selection_oracle.py)" = "edbe248b19fc48683f1a0b19ca989f5f91e2c317"
          test "$(git hash-object linkline/tests/fixtures/a3_calibration_selection_golden_v1.json)" = "bd328d78e661d29b43af91bc60279084f7bd42b0"
          test "$(git hash-object linkline/tests/test_a3_calibration_selection_oracle.py)" = "0483fa1c01e862649211ccb84c215536ac705eb6"
          test "$(git hash-object linkline/tests/test_a3_calibration_set.py)" = "542d2aaf5cd0f27782b61f64d8b4e24ae258de10"

      - name: Verify frozen dependencies
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          test "$(git hash-object linkline/reference/m2_state_model.py)" = "c2bf85974d317eb18a8b02a1ac4ee7eb244fcb77"
          test "$(git hash-object linkline/reference/m3_solver.py)" = "16b170656bbdffa8e836a891ffbf221de6c2935f"
          test "$(git hash-object linkline/analysis/a2_cognitive.py)" = "880aa4d8668fd71e2ce8222331f0da0368229400"
          test "$(git hash-object linkline/analysis/a3_structural_features.py)" = "35a6b997816ee3608d4d8064febd059159030796"

      - name: Validate seed 1
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
        run: |
          set -euo pipefail
          python --version
          python -m unittest tests.test_a3_calibration_selection_oracle tests.test_a3_calibration_set -v

      - name: Validate seed 777
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "777"
        run: |
          set -euo pipefail
          python -m unittest tests.test_a3_calibration_selection_oracle tests.test_a3_calibration_set -v

      - name: Construct exact calibration set
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from collections import Counter
          from analysis.a3_calibration_set import construct_calibration_set, normalized_manifest_fingerprint

          manifest = construct_calibration_set(max_analysis_budget=50_000, state_cap=100_000)

          roles = Counter(row['role'] for row in manifest['selected'])
          print('C1_RESULT_STATUS=' + manifest['resultStatus'])
          print('C1_ANALYSIS_BUDGET=' + str(manifest['analysisBudgetUsed']))
          print('C1_EXACT_ELIGIBLE=' + str(manifest['exactEligibleCount']))
          print('C1_OUTSIDE=' + str(manifest['outsideDomainCount']))
          print('C1_INCOMPLETE=' + str(manifest['incompleteFeatureCount']))
          print('C1_SELECTED=' + str(len(manifest['selected'])))
          print('C1_ROLES=' + json.dumps(dict(sorted(roles.items())), sort_keys=True))
          print('C1_PAIRS=' + json.dumps(manifest['coverage']['matchedPairCounts'], sort_keys=True))
          print('C1_UNMET=' + json.dumps(manifest['coverage']['unmetTargets'], sort_keys=True))
          print('C1_MANIFEST_FINGERPRINT=' + manifest['manifestFingerprint'])
          print('C1_UNIVERSE_FINGERPRINT=' + manifest['identityUniverseFingerprint'])

          raw = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode()
          encoded = base64.b64encode(gzip.compress(raw, mtime=0)).decode()
          chunk_size = 3000
          for index in range(0, len(encoded), chunk_size):
              print(f'C1_MANIFEST_B64_{index // chunk_size:04d}=' + encoded[index:index + chunk_size])

          if manifest['identityUniverseCount'] != 84320:
              raise SystemExit('identity universe count mismatch')
          expected_universe = 'ce78c38e4110a7bd21ba5413677bdfcb3e8e764002db7fd35bb7aa1c110e1ca0'
          if manifest['identityUniverseFingerprint'] != expected_universe:
              raise SystemExit('identity universe fingerprint mismatch')
          if manifest['manifestFingerprint'] != normalized_manifest_fingerprint(manifest):
              raise SystemExit('manifest fingerprint mismatch')
          PY
