name: Linkline A3 Target-Pair Selection Diagnostic v1

on:
  push:
    branches:
      - linkline/a3-target-pair-diversity-v1
    paths:
      - .github/workflows/linkline-a3-target-pair-selection-diagnostic-v1.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Capture selection failure safely
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -u
          OUT="public_output/a3_target_pair_selection_diagnostic_v1"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python tools/a3_target_pair_selection_plan_exec_v1.py \
            --n5-pool public_output/a3_target_pair_n5_expansion_v1/candidate_pool.json \
            --n6-pool public_output/a3_target_pair_acquisition_v1/candidate_pool.json \
            --output-dir public_output/a3_target_pair_selection_plan_v1 \
            >"$OUT/stdout.txt" 2>"$OUT/stderr.txt"
          STATUS=$?
          printf '%s\n' "$STATUS" > "$OUT/exit_status.txt"
          cat "$OUT/stdout.txt" || true
          cat "$OUT/stderr.txt" || true
          exit 0

      - name: Commit public-safe diagnostic
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/public_output/a3_target_pair_selection_diagnostic_v1
          git commit -m "Linkline A3: materialize target-pair selection diagnostic"
          git push origin HEAD:linkline/a3-target-pair-diversity-v1
