name: Mobi R11 Post-Failure Diagnostic One-Shot Dispatch Relay

on:
  push:
    branches:
      - mobi/ops-r11-post-failure-diagnostic-dispatch-20261016

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen R11 post-failure diagnostic workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hotmoral/-/actions/workflows/mobi-p1-c-r11-post-failure-diagnostic.yml/dispatches"
          body='{"ref":"mobi/run-p1-c-r11-post-failure-diagnostic-20261016","inputs":{"confirm_diagnostic":"RUN_R11_POST_FAILURE_DIAGNOSTIC_AFTER_FREEZE"}}'
          code="$(curl -sS -o /tmp/dispatch_response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            -d "$body")"
          if [ "$code" != '204' ]; then
            cat /tmp/dispatch_response.txt >&2 || true
            echo "dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo 'R11 post-failure diagnostic workflow_dispatch accepted (HTTP 204).'
