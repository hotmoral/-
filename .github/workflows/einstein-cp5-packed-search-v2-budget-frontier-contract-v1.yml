name: Einstein CP5 packed search v2 budget frontier contract v1

on:
  push:
    branches:
      - einstein-cp5-packed-search-v2-budget-frontier-contract-v1
    paths:
      - 'einstein/cp5-packed-search-v2-budget-frontier-contract-v1/**'
      - '.github/workflows/einstein-cp5-packed-search-v2-budget-frontier-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Python
        run: python3 --version
      - name: Run packed v2 budget frontier synthetic contract
        run: python3 einstein/cp5-packed-search-v2-budget-frontier-contract-v1/contract_test.py
