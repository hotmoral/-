name: Timing Defense T1 Transition Micro-Sim

on:
  push:
    branches:
      - timing-defense-workspace
    paths:
      - '.github/workflows/timing-defense-t1-transition-microsim.yml'
      - 'timing-defense-workspace/tools/run_t1_transition_slice_microsim_v0_1.py'
      - 'timing-defense-workspace/tools/run_t1_transition_slice_microsim_settlement_fix_v0_1.py'
      - 'timing-defense-workspace/tools/t1_transition_microsim_core_v0_1.py'
      - 'timing-defense-workspace/tools/t1_transition_microsim_skills_v0_1.py'
      - 'timing-defense-workspace/tools/t1_transition_microsim_engine_v0_1.py'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_1.yaml'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_2_pressure_shape_candidate.yaml'
      - 'timing-defense-workspace/legacy-game-structure/data/p3_ten_stage_fixture_v0_1.json'
      - 'timing-defense-workspace/legacy-game-structure/data/p4d2_lv31_pressure_probe_fixture_v0_1.json'
      - 'timing-defense-workspace/legacy-game-structure/data/p4d2_stage46_temporal_pressure_fixture_v0_1.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  T1_RECIPE: legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_2_pressure_shape_candidate.yaml

jobs:
  exact-source-microsim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runner dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Record exact source identity
        working-directory: timing-defense-workspace
        run: |
          mkdir -p artifacts
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA" > artifacts/source-identity.txt
          sha256sum \
            tools/run_t1_transition_slice_microsim_v0_1.py \
            tools/run_t1_transition_slice_microsim_settlement_fix_v0_1.py \
            tools/t1_transition_microsim_core_v0_1.py \
            tools/t1_transition_microsim_skills_v0_1.py \
            tools/t1_transition_microsim_engine_v0_1.py \
            legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_1.yaml \
            "$T1_RECIPE" \
            legacy-game-structure/data/p3_ten_stage_fixture_v0_1.json \
            legacy-game-structure/data/p4d2_lv31_pressure_probe_fixture_v0_1.json \
            legacy-game-structure/data/p4d2_stage46_temporal_pressure_fixture_v0_1.json \
            >> artifacts/source-identity.txt
          cat artifacts/source-identity.txt

      - name: Enforce bounded pressure-shape static gate
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          old = yaml.safe_load(Path('legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_1.yaml').read_text())
          new = yaml.safe_load(Path(os.environ['T1_RECIPE']).read_text())
          by_old = {int(r['stage']): r for r in old['recipes']}
          by_new = {int(r['stage']): r for r in new['recipes']}
          assert by_new[5] == by_old[5], 'Stage5 must remain unchanged'
          assert by_new[18] == by_old[18], 'Stage18 must remain unchanged'
          assert by_new[41] == by_old[41], 'Stage41 relief must remain unchanged'
          assert set(by_new) == {5,18,20,21,22,23,*range(39,51)}
          normal = int(new['guards']['authored4sNormalMax'])
          def dens(stage, window=4000):
              ts=[int(x['tMs']) for x in by_new[stage]['spawns']]
              return max(sum(1 for o in ts if s <= o < s+window) for s in ts)
          rows=[]
          for stage in sorted(by_new):
              d4=dens(stage)
              d6=dens(stage,6000)
              rows.append((stage,len(by_new[stage]['spawns']),d4,d6))
              if d4 > normal:
                  raise SystemExit(f'STATIC_DENSITY_FAIL stage={stage} max4={d4} normal={normal}')
          if not dens(41) < dens(40):
              raise SystemExit(f'STAGE41_RELIEF_FAIL S40={dens(40)} S41={dens(41)}')
          print('stage authored max4 max6')
          for row in rows: print(*row)
          print('STATIC_PRESSURE_SHAPE_GATE=PASS')
          PY

      - name: Execute A-E exact-source diagnostic
        working-directory: timing-defense-workspace
        run: |
          python tools/run_t1_transition_slice_microsim_settlement_fix_v0_1.py \
            --recipes "$T1_RECIPE" \
            --seeds 101,211,307 \
            --json-out artifacts/t1-transition-microsim-v0_2.json

      - name: Enforce runner admission gate
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/t1-transition-microsim-v0_2.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          admission = d.get('admission', {})
          print('status=', d.get('status'))
          print('admission.pass=', admission.get('pass'))
          for key in (
              'exactRecipeIdentity',
              'stageSettledOrTerminalFailure',
              'noEnemyCarryAtSettledBoundary',
              'noTransientLeakageAtSettledBoundary',
              'persistentStateContinuity',
              'deterministicReplay',
              'pairedIsolation',
              'explicitSkillStateTrace',
          ):
              print(f'{key}={admission.get(key)}')
          if admission.get('pass') is not True:
              raise SystemExit('RUNNER_FIDELITY_FAIL_NO_BALANCE_INTERPRETATION')
          PY

      - name: Execute paired Stage46-50 Lv31 absence probe
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import run_t1_transition_slice_microsim_settlement_fix_v0_1 as bridge
          r = bridge.runner
          recipe_doc = r.load_yaml(os.environ['T1_RECIPE'])
          p3 = r.load_json('legacy-game-structure/data/p3_ten_stage_fixture_v0_1.json')
          base = r.load_json('legacy-game-structure/data/p4d2_lv31_pressure_probe_fixture_v0_1.json')
          temporal = r.load_json('legacy-game-structure/data/p4d2_stage46_temporal_pressure_fixture_v0_1.json')
          runtime = r.build_runtime(recipe_doc, p3, base, temporal)
          by_stage = {int(x['stage']): x for x in recipe_doc['recipes']}
          stages = [46,47,48,49,50]
          rows=[]
          failures=[]
          for cls in r.CLASSES:
              for seed in (101,211,307):
                  def run(active):
                      return r.execute_chain(runtime, by_stage, cls, seed, stages, active)
                  off1=run([6,11,16,21,26]); off2=run([6,11,16,21,26])
                  on1=run([6,11,16,21,26,31]); on2=run([6,11,16,21,26,31])
                  det_off=r.sha256_obj(off1)==r.sha256_obj(off2)
                  det_on=r.sha256_obj(on1)==r.sha256_obj(on2)
                  if not (det_off and det_on): failures.append(f'determinism/{cls}/{seed}')
                  if off1['continuityErrors'] or on1['continuityErrors']: failures.append(f'continuity/{cls}/{seed}')
                  if not off1['results'] or not on1['results']: failures.append(f'empty/{cls}/{seed}'); continue
                  eoff=off1['results'][0]['entryState']; eon=on1['results'][0]['entryState']
                  same_entry=all(eoff[k]==eon[k] for k in ('baseHp','baseMaxHp','wallDeficit','combo','charge','judgmentRng','combatProcRng'))
                  if not same_entry: failures.append(f'pair-entry/{cls}/{seed}')
                  def slim(case):
                      return {
                          'stagesExecuted': case['stagesExecuted'],
                          'finalStatus': case['finalRunState']['status'],
                          'finalBaseHp': case['finalRunState']['baseHp'],
                          'totalWallDamage': round(sum(x['wallDamage'] for x in case['results']),3),
                          'totalSettledSeconds': round(sum(x['stageSettledTime'] for x in case['results']),3),
                          'stageRows': [
                              {'stage':x['stage'],'outcome':x['combatOutcome'],'wallDamage':x['wallDamage'],'wallReserve':x['wallReserve'],'settled':x['stageSettledTime'],'actions':x['rootTimingActionCount'],'peakActive':x['peakActive']}
                              for x in case['results']
                          ],
                      }
                  rows.append({'class':cls,'seed':seed,'sameInitialLifecycle':same_entry,'deterministicOFF':det_off,'deterministicON':det_on,'OFF':slim(off1),'ON':slim(on1)})
          result={'version':'t1-stage46-50-lv31-absence-probe-v0.1','recipeVersion':recipe_doc['version'],'recipeSourceSha256':r.sha256_bytes(Path(os.environ['T1_RECIPE']).read_bytes()),'failures':failures,'pass':not failures,'rows':rows}
          Path('artifacts/t1-stage46-50-lv31-absence-v0_2.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'pass':result['pass'],'failures':failures,'cases':len(rows)},indent=2))
          if failures: raise SystemExit('LV31_ABSENCE_PROBE_FIDELITY_FAIL')
          PY

      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-t1-transition-microsim
          path: |
            timing-defense-workspace/artifacts/t1-transition-microsim-v0_2.json
            timing-defense-workspace/artifacts/t1-stage46-50-lv31-absence-v0_2.json
            timing-defense-workspace/artifacts/source-identity.txt
          if-no-files-found: error
