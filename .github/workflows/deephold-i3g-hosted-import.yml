name: DeepHold I3G hosted import

on:
  push:
    branches:
      - deephold/i3g-hosted-preview-v1
    paths:
      - '.github/workflows/deephold-i3g-hosted-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deephold/i3g-hosted-preview-v1
      - name: Fetch and verify validated hosted bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://freckled-chaffinch-89.beacon.host/deephold-i3g-hosted.tar.gz' \
            -o /tmp/deephold-i3g-hosted.tar.gz
          echo '9dbbb3fc7ccc4c04507dff1419bbcfcf3d42461049d3cc22bd1dda859e1df707  /tmp/deephold-i3g-hosted.tar.gz' | sha256sum -c -
          rm -rf /tmp/deephold-i3g-hosted
          tar -C /tmp -xzf /tmp/deephold-i3g-hosted.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('/tmp/deephold-i3g-hosted')
          manifest = json.loads((root/'hosted-manifest.json').read_text())
          assert manifest['schema'] == 'DEEPHOLD_HOSTED_BUNDLE'
          assert manifest['sourceMainSha'] == '2c89eb6cfb7ec97198aabb5dee4eab4f253bf5de'
          assert manifest['slice'] == 'I3G_CLOSED_VALIDATED'
          assert manifest['appSha256'] == '9f1730cf58ab64beabff92ba0c4e5d428cab40f06b9a2ce8daafef02cb5b54af'
          assert manifest['cssSha256'] == '4685e1aed7f601440bc251018d4f91687a89864eabb71b858d40995f575a8b7f'
          app = root/'assets/app.js'
          css = root/'assets/app.css'
          assert hashlib.sha256(app.read_bytes()).hexdigest() == manifest['appSha256']
          assert hashlib.sha256(css.read_bytes()).hexdigest() == manifest['cssSha256']
          assert (root/'index.html').is_file()
          print('validated hosted bundle parity PASS')
          PY
      - name: Replace only DeepHold isolated public path
        shell: bash
        run: |
          set -euo pipefail
          target='timing-defense-skilled-v2-harness/public/deephold-i1'
          rm -rf "$target"
          mkdir -p "$(dirname "$target")"
          cp -R /tmp/deephold-i3g-hosted "$target"
          git status --short
      - name: Commit hosted bundle to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A timing-defense-skilled-v2-harness/public/deephold-i1
          if git diff --cached --quiet; then
            echo 'No DeepHold hosted changes'
            exit 0
          fi
          git commit -m 'Update DeepHold hosted preview to I3G snapshot [skip deephold-import]'
          git push origin HEAD:deephold/i3g-hosted-preview-v1
