name: ReceiptLedger V1 Image Document Core

on:
  push:
    branches:
      - 'receiptledger/run-v1-image-document-core-20261015'
    paths:
      - 'receiptledger/**'
      - '.github/workflows/receiptledger-v1-image-document-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receiptledger-v1-image-document-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public work unit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up isolated Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh

      - name: Enforce image-intake permission firewall
        shell: bash
        run: |
          set -euo pipefail
          manifest=receiptledger/harness/android-v1/app/src/main/AndroidManifest.xml
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECORD_AUDIO READ_CONTACTS READ_SMS; do
            if grep -q "$forbidden" "$manifest"; then
              echo "Forbidden capability present: $forbidden"
              exit 30
            fi
          done
          grep -q 'android:exported="false"' "$manifest"
          grep -q 'android:grantUriPermissions="true"' "$manifest"

      - name: Run document-core tests and build debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:assembleDebug

      - name: Verify built APK permissions and integrity
        shell: bash
        run: |
          set -euo pipefail
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-image-document-core
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-image-document-debug.apk"
          unzip -t "$OUT/receiptledger-v1-image-document-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then echo "Forbidden packaged permission: $forbidden"; exit 31; fi
          done
          sha256sum "$OUT/receiptledger-v1-image-document-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo "checkpoint=RL_V1_IMAGE_DOCUMENT_CORE_01"
            echo "public_commit=${GITHUB_SHA}"
            echo "application_id=com.receiptledger.v1"
            echo "version_name=1.0.1-image-document"
            echo "version_code=2"
            echo "compile_sdk=35"
            echo "target_sdk=35"
            echo "min_sdk=23"
            echo "ocr=NOT_INCLUDED"
            echo "camera_permission=NOT_REQUESTED"
            echo "storage_permission=NOT_REQUESTED"
            echo "signing=debug_only"
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt > "$OUT/EVIDENCE_SHA256.txt"

      - name: Upload ReceiptLedger image/document artifact
        uses: actions/upload-artifact@v4
        with:
          name: receiptledger-v1-image-document-${{ github.run_id }}
          path: receiptledger/output/v1-image-document-core/
          if-no-files-found: error
          retention-days: 14
