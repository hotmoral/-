name: Einstein Formal Draw0 Recovery Invocation 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-formal-draw0-recovery-invocation-3.yml'

permissions:
  contents: read

concurrency:
  group: einstein-formal-draw0-recovery-invocation-3
  cancel-in-progress: false

jobs:
  formal-recovery:
    if: >-
      github.event.head_commit.message == 'formal: execute authorized Einstein draw0 recovery invocation 3'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNNER_SHA: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
      ACCEPTED_SOURCE_SHA: 1d56f63da7217f2a96e72ddf5782d70fc1416c5f
      FIXTURE_SHA: b34abb909dd1d154ca964423c6bde3bcb347407d
      FIXTURE_BLOB_SHA: ce555f511ca4003e95a24fbca975081c61109222
      EVIDENCE_BRANCH: campaign-intent-acquisition-draw0-recovery-evidence-v1
      EXPECTED_EVIDENCE_HEAD: c49034059168d21bbafd61f6e016a0ac0c007c24
      FORMAL_REMOTE_ROOT: evidence/bounded-acquisition/draw0-recovery-invocation-3
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
      CLASSES_DIR: /tmp/einstein-formal-recovery3-classes
      SOURCES_FILE: /tmp/einstein-formal-recovery3-sources.txt
      EXEC_DIR: /tmp/einstein-formal-recovery-invocation-3
    steps:
      - name: Require separate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact invocation3 runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: false

      - name: Checkout exact frozen bounded fixture
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b34abb909dd1d154ca964423c6bde3bcb347407d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: FrozenFixture
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private evidence branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-intent-acquisition-draw0-recovery-evidence-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EvidenceStore
          fetch-depth: 0
          persist-credentials: true

      - name: Final zero-cost hard gates
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          test -z "$(git status --porcelain --untracked-files=all)"
          grep -F 'EXPECTED_PRODUCTION_SOURCE="1d56f63da7217f2a96e72ddf5782d70fc1416c5f"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F 'EXECUTE_TOKEN="RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_3"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F 'FORMAL_REMOTE_ROOT="evidence/bounded-acquisition/draw0-recovery-invocation-3"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F '"historicalDraw0InvocationCount",2,"recoveryInvocationOrdinal",3' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java

          cd ../FrozenFixture
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          F='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java'
          test "$(git hash-object "$F")" = "$FIXTURE_BLOB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

          cd ../EvidenceStore
          test "$(git rev-parse --abbrev-ref HEAD)" = "$EVIDENCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVIDENCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | cut -f1)" = "$EXPECTED_EVIDENCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e "$FORMAL_REMOTE_ROOT"
          test -z "$(git ls-tree -r --name-only HEAD -- "$FORMAL_REMOTE_ROOT")"
          test -f 'evidence/bounded-acquisition/draw0-recovery-invocation-2/invocation-start.json'
          test -f 'evidence/bounded-acquisition/draw0-recovery-invocation-2/invocation-start.json.sha256'
          test ! -e 'evidence/bounded-acquisition/draw0-recovery-invocation-2/attempt-draw0.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile exact Java 8 execution set
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE" "$EXEC_DIR"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          cat >> "$SOURCES_FILE" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          ../FrozenFixture/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          test ! -e "$EXEC_DIR"

      - name: Execute authorized formal recovery with synchronous private remote seals
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: 1d56f63da7217f2a96e72ddf5782d70fc1416c5f
          EINSTEIN_FORMAL_RECOVERY_AUTHORIZATION: RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_3
          EINSTEIN_REMOTE_EVIDENCE_ROOT: evidence/bounded-acquisition/draw0-recovery-invocation-3
        run: |
          set -euo pipefail
          export EVIDENCE_STORE="$GITHUB_WORKSPACE/EvidenceStore"
          git -C "$EVIDENCE_STORE" config user.name 'Einstein Recovery Evidence'
          git -C "$EVIDENCE_STORE" config user.email 'noreply@localhost'

          (
            set -euo pipefail
            state=0
            deadline=$((SECONDS+10400))
            while [ "$SECONDS" -lt "$deadline" ]; do
              handled=0
              if [ -d "$EXEC_DIR" ]; then
                for READY in "$EXEC_DIR"/*.ready.json; do
                  [ -e "$READY" ] || continue
                  NAME="$(basename "$READY" .ready.json)"
                  ACK="$EXEC_DIR/$NAME.remote-ack.json"
                  [ -e "$ACK" ] && continue
                  handled=1

                  case "$state:$NAME" in
                    0:invocation-start.json) state=1 ;;
                    1:draw-start-0.json) state=2 ;;
                    2:attempt-draw0.json) state=3 ;;
                    3:draw-start-1.json) state=4 ;;
                    3:continuation-result.json) state=8 ;;
                    4:attempt-draw1.json) state=5 ;;
                    5:draw-start-2.json) state=6 ;;
                    5:continuation-result.json) state=8 ;;
                    6:attempt-draw2.json) state=7 ;;
                    7:continuation-result.json) state=8 ;;
                    8:completion-manifest.json) state=9 ;;
                    *) echo "unexpected formal seal sequence state=$state name=$NAME" >&2; exit 91 ;;
                  esac

                  export READY NAME ACK
                  python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['READY']).read_text())
          assert p['recordType']=='RemoteSealRequestV1'
          assert p['file']==os.environ['NAME']
          assert p['evidenceBranch']==os.environ['EVIDENCE_BRANCH']
          assert p['remoteRoot']==os.environ['FORMAL_REMOTE_ROOT']
          assert p['formalDraw'] is True
          assert len(p['sha256'])==64
          PY
                  SHA="$(python3 -c 'import json,os;print(json.load(open(os.environ["READY"]))["sha256"])')"
                  SOURCE="$EXEC_DIR/$NAME"
                  SIDECAR="$EXEC_DIR/$NAME.sha256"
                  test -f "$SOURCE"
                  test -f "$SIDECAR"
                  test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$SHA"
                  test "$(cat "$SIDECAR")" = "$SHA  $NAME"

                  TARGET_ROOT="$EVIDENCE_STORE/$FORMAL_REMOTE_ROOT"
                  TARGET="$TARGET_ROOT/$NAME"
                  TARGET_SHA="$TARGET.sha256"
                  test ! -e "$TARGET"
                  test ! -e "$TARGET_SHA"
                  test -z "$(git -C "$EVIDENCE_STORE" ls-tree -r --name-only HEAD -- "$FORMAL_REMOTE_ROOT/$NAME")"
                  REMOTE_BEFORE="$(git -C "$EVIDENCE_STORE" ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | cut -f1)"
                  test "$REMOTE_BEFORE" = "$(git -C "$EVIDENCE_STORE" rev-parse HEAD)"
                  mkdir -p "$TARGET_ROOT"
                  cp "$SOURCE" "$TARGET"
                  cp "$SIDECAR" "$TARGET_SHA"
                  cmp "$SOURCE" "$TARGET"
                  cmp "$SIDECAR" "$TARGET_SHA"
                  git -C "$EVIDENCE_STORE" add -- "$FORMAL_REMOTE_ROOT/$NAME" "$FORMAL_REMOTE_ROOT/$NAME.sha256"
                  git -C "$EVIDENCE_STORE" commit -m "evidence: formal recovery invocation 3 $NAME"
                  COMMIT="$(git -C "$EVIDENCE_STORE" rev-parse HEAD)"
                  git -C "$EVIDENCE_STORE" push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
                  test "$(git -C "$EVIDENCE_STORE" ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | cut -f1)" = "$COMMIT"
                  git -C "$EVIDENCE_STORE" show "$COMMIT:$FORMAL_REMOTE_ROOT/$NAME" > /tmp/formal3-remote-main
                  git -C "$EVIDENCE_STORE" show "$COMMIT:$FORMAL_REMOTE_ROOT/$NAME.sha256" > /tmp/formal3-remote-sha
                  cmp "$SOURCE" /tmp/formal3-remote-main
                  cmp "$SIDECAR" /tmp/formal3-remote-sha
                  test -z "$(git -C "$EVIDENCE_STORE" status --porcelain --untracked-files=all)"

                  export SHA COMMIT
                  python3 - <<'PY'
          import json, os
          from pathlib import Path
          ack={
            'status':'REMOTE_SEAL_PASS',
            'sha256':os.environ['SHA'],
            'evidenceBranch':os.environ['EVIDENCE_BRANCH'],
            'remoteRoot':os.environ['FORMAL_REMOTE_ROOT'],
            'remotePath':os.environ['FORMAL_REMOTE_ROOT']+'/'+os.environ['NAME'],
            'remoteCommitSha':os.environ['COMMIT']
          }
          with Path(os.environ['ACK']).open('x') as f:
            json.dump(ack,f,separators=(',',':'),sort_keys=True)
            f.write('\n')
          PY
                  if [ "$state" -eq 9 ]; then exit 0; fi
                done
              fi
              if [ "$handled" -eq 0 ]; then sleep 0.1; fi
            done
            echo 'remote seal sidecar timeout' >&2
            exit 92
          ) &
          SIDECAR_PID=$!

          set +e
          java -Xmx4g -cp "$CLASSES_DIR" \
            com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionAckDurableRecoveryRunnerV1 \
            execute "$EXEC_DIR" RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_3 | tee /tmp/einstein-formal-recovery3.log
          JAVA_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$JAVA_STATUS" -ne 0 ]; then
            kill "$SIDECAR_PID" 2>/dev/null || true
            wait "$SIDECAR_PID" 2>/dev/null || true
            exit "$JAVA_STATUS"
          fi
          wait "$SIDECAR_PID"
          grep -F 'FORMAL_RECOVERY_COMPLETE status=' /tmp/einstein-formal-recovery3.log

      - name: Successful terminal postflight
        shell: bash
        run: |
          set -euo pipefail
          cd EvidenceStore
          test -z "$(git status --porcelain --untracked-files=all)"
          REMOTE="$(git ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | cut -f1)"
          test "$REMOTE" = "$(git rev-parse HEAD)"
          test -f "$FORMAL_REMOTE_ROOT/invocation-start.json"
          test -f "$FORMAL_REMOTE_ROOT/draw-start-0.json"
          test -f "$FORMAL_REMOTE_ROOT/attempt-draw0.json"
          test -f "$FORMAL_REMOTE_ROOT/continuation-result.json"
          test -f "$FORMAL_REMOTE_ROOT/completion-manifest.json"
          printf '%s\n' 'EINSTEIN_FORMAL_RECOVERY_INVOCATION3_TERMINAL=PASS' "evidenceHead=$REMOTE"
