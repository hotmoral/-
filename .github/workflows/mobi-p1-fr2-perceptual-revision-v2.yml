name: Mobi P1-FR2 Perceptual Revision V2

on:
  push:
    branches:
      - 'mobi/run-p1-fr2-perceptual-revision-20261015'
    paths:
      - 'mobi/p1-b2/geometry/p1_fr2_layered_view_prototype_v2.py'
      - 'mobi/p1-b2/geometry/run_p1_fr2_perceptual_revision_v2.py'
      - 'mobi/p1-b2/geometry/test_p1_fr2_perceptual_revision_v2.py'
      - '.github/workflows/mobi-p1-fr2-perceptual-revision-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-fr2-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-fr2-v2/evidence
          { echo "git_commit=${GITHUB_SHA}"; echo "runner=ubuntu-latest"; python3 --version; } | tee mobi/p1-fr2-v2/evidence/environment.txt

      - name: Verify exact source parity
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          test "$(git hash-object p1_fr2_layered_view_prototype.py)" = "39050b80c460fa8f7bb193975a765ab4552de49b"
          test "$(git hash-object run_p1_fr2_perceptual_revision.py)" = "7756e71a10f908f866b8db4b714255c4c1f7f8bb"
          test "$(git hash-object p1_fr2_layered_view_prototype_v2.py)" = "afe5cd48aea38f870cc41eee9fd7cb61190543c8"
          test "$(git hash-object run_p1_fr2_perceptual_revision_v2.py)" = "fa1a812d59fc37588461eeb544a1ecc748310281"
          test "$(git hash-object test_p1_fr2_perceptual_revision_v2.py)" = "ebe6be1ef989e7c0f4f9aad44ef90b5cb0234ee0"
          test "$(git hash-object p1_fr1_mesh_probe.py)" = "009bf23dc8100abd192c4179cef0c14b56b6de3d"
          test "$(git hash-object p1_fr1_mesh_probe_v2.py)" = "7c8370f843723795e8c77e4374180b2f5eccb210"
          test "$(git hash-object p1_fr1_mesh_probe_v3.py)" = "530accae24cea3aad75dac73b30fa1592a53d03e"
          test "$(git hash-object e_v0_fixture_adapter.py)" = "96bb5351208c157003ce0a50f828075537c5edb5"
          test "$(git hash-object e_v0_profiles.py)" = "087826028fa7a2ad5a9a042ec188f335c9ff18cc"
          test "$(git hash-object run_p1f_perceptual_evidence.py)" = "e2f6552c0f2bb1f7cd7b85ba560f36e43df2ec25"
          git hash-object p1_fr2_layered_view_prototype.py run_p1_fr2_perceptual_revision.py p1_fr2_layered_view_prototype_v2.py run_p1_fr2_perceptual_revision_v2.py test_p1_fr2_perceptual_revision_v2.py p1_fr1_mesh_probe.py p1_fr1_mesh_probe_v2.py p1_fr1_mesh_probe_v3.py e_v0_fixture_adapter.py e_v0_profiles.py run_p1f_perceptual_evidence.py | tee ../../p1-fr2-v2/evidence/git_blob_shas.txt

      - name: Run retained regression and V2 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_c4_hard_motion.py test_e_v0_structural.py test_p1_fr1_mesh_feasibility.py test_p1f_perceptual_evidence.py test_p1_fr2_perceptual_revision_v2.py 2>&1 | tee ../../p1-fr2-v2/evidence/unittest.txt

      - name: Generate deterministic V2 evidence
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-fr2-v2/run1 ../../p1-fr2-v2/run2
          PYTHONHASHSEED=1 python3 run_p1_fr2_perceptual_revision_v2.py --output-dir ../../p1-fr2-v2/run1
          PYTHONHASHSEED=777 python3 run_p1_fr2_perceptual_revision_v2.py --output-dir ../../p1-fr2-v2/run2
          (cd ../../p1-fr2-v2/run1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr2-v2/run1.sha256
          (cd ../../p1-fr2-v2/run2 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr2-v2/run2.sha256
          cmp ../../p1-fr2-v2/run1.sha256 ../../p1-fr2-v2/run2.sha256
          cp -R ../../p1-fr2-v2/run1/. ../../p1-fr2-v2/evidence/
          cp ../../p1-fr2-v2/run1.sha256 ../../p1-fr2-v2/evidence/files.sha256
          echo "hash_seed_repeat_exact=PASS" > ../../p1-fr2-v2/evidence/deterministic.txt

      - name: Validate V2 evidence
        working-directory: mobi/p1-fr2-v2/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          s=json.loads(Path('summary.json').read_text())
          assert s['structuralPass'] is True, s
          assert s['recordCount']==1770, s
          assert s['topologySignatureCount']==1, s
          assert s['semanticMutationCount']==0, s
          assert s['coreSelfIntersectionCount']==0, s
          assert s['correctionUseCount']==0, s
          assert s['meshDomainCounts']==[6], s
          assert s['maxPawPinError']<=1e-9, s
          svgs=sorted(Path('debug').glob('*.svg'))
          baseline=sorted(Path('frozen_p1f_baseline').glob('*.svg'))
          assert len(svgs)==6, len(svgs)
          assert baseline, 'missing baseline'
          for p in svgs+baseline: ET.parse(p)
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Hash evidence
        working-directory: mobi/p1-fr2-v2/evidence
        run: sha256sum environment.txt git_blob_shas.txt unittest.txt summary.json manifest.json records.json files.sha256 deterministic.txt | tee EVIDENCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-fr2-perceptual-revision-v2-${{ github.run_id }}
          path: mobi/p1-fr2-v2/evidence/
          if-no-files-found: error
          retention-days: 30
