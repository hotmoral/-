name: Clumi Fixed Viewport Compile V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clumi-fixed-viewport-compile-v1.yml'

permissions:
  contents: read

jobs:
  compile-fixed-viewport:
    if: >-
      github.event.head_commit.message == 'verify: Clumi fixed viewport compile v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: clumi-fixed-viewport-v1
      SOURCE_SHA: 28a8001173948d1797f7bc8b3ec0fb99c7a9dbc3
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BUILD_TOOLS: '34.0.0'

    steps:
      - name: Require private read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private fixed viewport source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact private source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"
          test -z "$(git -C source status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug APK without permanent signing material
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../compile-evidence
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 \
              | tee ../compile-evidence/gradle-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -E '^> Task :app:compileDebugJavaWithJavac( |$)' ../compile-evidence/gradle-build.log
          grep -E '^> Task :puzzle-core:compileJava( |$)' ../compile-evidence/gradle-build.log
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            | tee ../compile-evidence/app-debug.apk.sha256

      - name: Verify source remained read-only and exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"
          printf 'source_branch=%s\nsource_sha=%s\nstatus=PASS\npermanent_signing_material=NOT_LOADED\n' \
            "$SOURCE_BRANCH" "$SOURCE_SHA" > compile-evidence/summary.txt

      - name: Upload bounded compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: Clumi-Fixed-Viewport-Compile-V1
          path: |
            compile-evidence/gradle-build.log
            compile-evidence/app-debug.apk.sha256
            compile-evidence/summary.txt
          retention-days: 14
          if-no-files-found: error
