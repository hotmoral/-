name: Mobi P1-FR4 Internal CORE Scaffold

on:
  push:
    branches:
      - 'mobi/run-p1-fr4-internal-core-scaffold-20261016'
    paths:
      - 'mobi/p1-b2/geometry/p1_fr4_internal_core_scaffold*.py'
      - 'mobi/p1-b2/geometry/run_p1_fr4_internal_core_scaffold*.py'
      - 'mobi/p1-b2/geometry/test_p1_fr4_internal_core_scaffold*.py'
      - '.github/workflows/mobi-p1-fr4-internal-core-scaffold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-fr4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-fr4/evidence
          { echo "git_commit=${GITHUB_SHA}"; echo "runner=ubuntu-latest"; python3 --version; } | tee mobi/p1-fr4/evidence/environment.txt

      - name: Verify exact private parity and frozen upstream inputs
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          test "$(git hash-object p1_fr4_internal_core_scaffold.py)" = "4c46d9b0cccc64a834fcc446e96caeae363f08a1"
          test "$(git hash-object run_p1_fr4_internal_core_scaffold.py)" = "ed09cdba5ccc34456ffe94a88a395f48bf961aff"
          test "$(git hash-object p1_fr4_internal_core_scaffold_v3.py)" = "e1f65753f7164a621c43ef3c8b88d37406a688d9"
          test "$(git hash-object run_p1_fr4_internal_core_scaffold_v3.py)" = "542031a6b5217106d30e786b394ba30ae971cf20"
          test "$(git hash-object test_p1_fr4_internal_core_scaffold_v3.py)" = "435103ebc45bbbc8f2b5afc8815e6db798ee503f"
          test "$(git hash-object p1_fr3_feline_core_topology_v5.py)" = "67a139d126822ba81a9c3e96e6c55ca559b6b71c"
          test "$(git hash-object test_p1_fr3_feline_core_topology_v5.py)" = "7385cec59bf9f37c759ee17b542ff50b8a73612c"
          test "$(git hash-object test_p1_fr3_feline_core_topology.py)" = "58d5cf46cec60c44b8b530eacbb4b6775137b9a1"
          test "$(git hash-object p1_fr3_feline_core_topology.py)" = "3d4c9285d0fb31cd4268420b62c534760ec72af9"
          test "$(git hash-object p1_fr3_feline_core_topology_v2.py)" = "3e5c2216544f7a942d41aeda99592a71c67eeacd"
          test "$(git hash-object p1_fr2_layered_view_prototype_v5.py)" = "dc153ae1fff3d0ae4bd3ba02ca31ba9182dcd608"
          test "$(git hash-object test_p1_fr2_perceptual_revision_v5.py)" = "2a6c877383863a679ffdac6f78c06308a4bf8fe9"
          test "$(git hash-object run_p1_fr2_perceptual_revision.py)" = "7756e71a10f908f866b8db4b714255c4c1f7f8bb"
          test "$(git hash-object p1_fr1_mesh_probe.py)" = "009bf23dc8100abd192c4179cef0c14b56b6de3d"
          test "$(git hash-object p1_fr1_mesh_probe_v2.py)" = "7c8370f843723795e8c77e4374180b2f5eccb210"
          test "$(git hash-object p1_fr1_mesh_probe_v3.py)" = "530accae24cea3aad75dac73b30fa1592a53d03e"
          test "$(git hash-object e_v0_profiles.py)" = "087826028fa7a2ad5a9a042ec188f335c9ff18cc"
          test "$(git hash-object e_v0_fixture_adapter.py)" = "96bb5351208c157003ce0a50f828075537c5edb5"
          test "$(git hash-object run_p1f_perceptual_evidence.py)" = "e2f6552c0f2bb1f7cd7b85ba560f36e43df2ec25"
          git hash-object p1_fr4_internal_core_scaffold.py run_p1_fr4_internal_core_scaffold.py p1_fr4_internal_core_scaffold_v3.py run_p1_fr4_internal_core_scaffold_v3.py test_p1_fr4_internal_core_scaffold_v3.py p1_fr3_feline_core_topology_v5.py test_p1_fr3_feline_core_topology_v5.py p1_fr2_layered_view_prototype_v5.py run_p1_fr2_perceptual_revision.py p1_fr1_mesh_probe_v3.py e_v0_fixture_adapter.py e_v0_profiles.py run_p1f_perceptual_evidence.py | tee ../../p1-fr4/evidence/git_blob_shas.txt

      - name: Run retained regression and FR4 V3 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_c4_hard_motion.py test_e_v0_structural.py test_p1_fr1_mesh_feasibility.py test_p1f_perceptual_evidence.py test_p1_fr2_perceptual_revision_v5.py test_p1_fr3_feline_core_topology_v5.py test_p1_fr4_internal_core_scaffold_v3.py 2>&1 | tee ../../p1-fr4/evidence/unittest.txt

      - name: Generate deterministic FR4 V3 evidence
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-fr4/run1 ../../p1-fr4/run2
          PYTHONHASHSEED=1 python3 run_p1_fr4_internal_core_scaffold_v3.py --output-dir ../../p1-fr4/run1
          PYTHONHASHSEED=777 python3 run_p1_fr4_internal_core_scaffold_v3.py --output-dir ../../p1-fr4/run2
          (cd ../../p1-fr4/run1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr4/run1.sha256
          (cd ../../p1-fr4/run2 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr4/run2.sha256
          cmp ../../p1-fr4/run1.sha256 ../../p1-fr4/run2.sha256
          cp -R ../../p1-fr4/run1/. ../../p1-fr4/evidence/
          cp ../../p1-fr4/run1.sha256 ../../p1-fr4/evidence/files.sha256
          echo "hash_seed_repeat_exact=PASS" > ../../p1-fr4/evidence/deterministic.txt

      - name: Validate FR4 V3 evidence
        working-directory: mobi/p1-fr4/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          s=json.loads(Path('summary.json').read_text())
          assert s['structuralPass'] is True, s
          assert s['recordCount']==1770, s
          assert s['externalTopologySignatureCount']==1, s
          assert s['scaffoldSignatureCount']==1, s
          assert s['patchVertexCountSets']==[[8,6,8]], s
          assert s['semanticMutationCount']==0, s
          assert s['maxPawPinError']<=1e-9, s
          assert s['externalCoreSelfIntersectionCount']==0, s
          assert s['patchSelfIntersectionCount']==0, s
          assert s['patchOutsideVertexCount']==0, s
          assert s['correctionUseCount']==0, s
          assert s['meshDomainCounts']==[6], s
          assert s['externalCoreMismatchVsFr3V5Count']==0, s
          assert s['appendageMismatchVsFr3V5Count']==0, s
          assert s['stressLimbCrossingDeltaVsFr3V5']==0, s
          svgs=sorted(Path('debug').glob('*.svg'))
          baseline=sorted(Path('frozen_p1f_baseline').glob('*.svg'))
          assert len(svgs)==6, len(svgs)
          assert len(baseline)==22, len(baseline)
          for p in svgs+baseline: ET.parse(p)
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Hash evidence
        working-directory: mobi/p1-fr4/evidence
        run: sha256sum environment.txt git_blob_shas.txt unittest.txt summary.json manifest.json records.json files.sha256 deterministic.txt | tee EVIDENCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-fr4-internal-core-scaffold-v3-${{ github.run_id }}
          path: mobi/p1-fr4/evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
