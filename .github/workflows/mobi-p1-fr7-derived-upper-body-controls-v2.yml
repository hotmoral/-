name: Mobi P1-FR7 Derived Upper-Body Controls V2

on:
  push:
    branches:
      - 'mobi/run-p1-fr7-derived-upper-body-controls-v2-20261016'
    paths:
      - 'mobi/p1-b2/geometry/p1_fr7_derived_upper_body_controls_v2.py'
      - 'mobi/p1-b2/geometry/run_p1_fr7_derived_upper_body_controls_v2.py'
      - 'mobi/p1-b2/geometry/test_p1_fr7_derived_upper_body_controls_v2.py'
      - '.github/workflows/mobi-p1-fr7-derived-upper-body-controls-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-fr7-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-fr7-v2/evidence
          { echo "git_commit=${GITHUB_SHA}"; echo "runner=ubuntu-latest"; python3 --version; } | tee mobi/p1-fr7-v2/evidence/environment.txt

      - name: Verify exact private parity and frozen V1/upstream inputs
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'p1_fr7_derived_upper_body_controls_v2.py': '4af5233cc1afc0015bf64273b2052ab91ccea639',
              'run_p1_fr7_derived_upper_body_controls_v2.py': 'eb247ab02f8ea2aacc1fdbe5f45e6d65bc2802ed',
              'test_p1_fr7_derived_upper_body_controls_v2.py': '093f0c9def126cd63a50557fbf45e7c75234cd1a',
              'p1_fr7_derived_upper_body_controls_v1.py': '01b305abe654b4e3cceec06865fe8af88f7e26e6',
              'run_p1_fr7_derived_upper_body_controls_v1.py': '50b9c093ed163a4234e28a18c0deee20ace53179',
              'test_p1_fr7_derived_upper_body_controls_v1.py': '8a5d001babc60f83aa6e87488834d8ff64780209',
              'p1_fr5_core_mass_silhouette_v1.py': 'fab2789d36c94ac859dabfd31ad4d4ff72c098b8',
              'run_p1_fr5_core_mass_silhouette_v1.py': '502a7e1e17d1dccc4b130294ef44b613aac674d9',
              'test_p1_fr5_core_mass_silhouette_v1.py': 'b38df8324d89dac8c572d3c3200c856479ef7a65',
              'p1_fr4_internal_core_scaffold_v3.py': 'e1f65753f7164a621c43ef3c8b88d37406a688d9',
              'test_p1_fr4_internal_core_scaffold_v3.py': '435103ebc45bbbc8f2b5afc8815e6db798ee503f',
              'p1_fr3_feline_core_topology_v5.py': '67a139d126822ba81a9c3e96e6c55ca559b6b71c',
              'test_p1_fr3_feline_core_topology_v5.py': '7385cec59bf9f37c759ee17b542ff50b8a73612c',
              'e_v0_profiles.py': '087826028fa7a2ad5a9a042ec188f335c9ff18cc',
              'e_v0_fixture_adapter.py': '96bb5351208c157003ce0a50f828075537c5edb5',
          }
          lines=[]; mismatches=[]
          for path,wanted in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              lines.append(f'{actual}  {path}')
              if actual != wanted: mismatches.append((path,wanted,actual))
          Path('../../p1-fr7-v2/evidence/git_blob_shas.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          if mismatches: raise SystemExit('blob mismatch: '+repr(mismatches))
          print('exact_private_public_and_frozen_inputs=PASS')
          PY

      - name: Run retained regressions and frozen V1 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_c4_hard_motion.py test_e_v0_structural.py test_p1_fr1_mesh_feasibility.py test_p1f_perceptual_evidence.py test_p1_fr2_perceptual_revision_v5.py test_p1_fr3_feline_core_topology_v5.py test_p1_fr4_internal_core_scaffold_v3.py test_p1_fr5_core_mass_silhouette_v1.py test_p1_fr7_derived_upper_body_controls_v1.py 2>&1 | tee ../../p1-fr7-v2/evidence/unittest_v1_retained.txt

      - name: Run isolated final V2 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v test_p1_fr7_derived_upper_body_controls_v2.py 2>&1 | tee ../../p1-fr7-v2/evidence/unittest_v2.txt

      - name: Generate deterministic final V2 evidence
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-fr7-v2/run1 ../../p1-fr7-v2/run2
          PYTHONHASHSEED=1 python3 run_p1_fr7_derived_upper_body_controls_v2.py --output-dir ../../p1-fr7-v2/run1
          PYTHONHASHSEED=777 python3 run_p1_fr7_derived_upper_body_controls_v2.py --output-dir ../../p1-fr7-v2/run2
          (cd ../../p1-fr7-v2/run1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr7-v2/run1.sha256
          (cd ../../p1-fr7-v2/run2 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../../p1-fr7-v2/run2.sha256
          cmp ../../p1-fr7-v2/run1.sha256 ../../p1-fr7-v2/run2.sha256
          cp -R ../../p1-fr7-v2/run1/. ../../p1-fr7-v2/evidence/
          cp ../../p1-fr7-v2/run1.sha256 ../../p1-fr7-v2/evidence/files.sha256
          echo "hash_seed_repeat_exact=PASS" > ../../p1-fr7-v2/evidence/deterministic.txt

      - name: Validate final V2 evidence
        working-directory: mobi/p1-fr7-v2/evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          s=json.loads(Path('summary.json').read_text())
          assert s['structuralPass'] is True, s
          assert s['recordCount']==1770, s
          assert s['externalTopologySignatureCount']==1, s
          assert s['integrationSignatureCount']==1, s
          assert s['semanticMutationCount']==0, s
          assert s['maxPawPinError']<=1e-9, s
          assert s['finalCoreSelfIntersectionCount']==0, s
          assert s['patchSelfIntersectionCount']==0, s
          assert s['patchOutsideVertexCount']==0, s
          assert s['correctionUseCount']==0, s
          assert s['meshDomainCounts']==[6], s
          assert s['appendageMismatchVsFr3V5Count']==0, s
          assert s['profileCoreMismatchVsFr3V5Count']==0, s
          assert s['maxNormalizedCoreDisplacement']<=0.18+1e-12, s
          assert s['earAttachmentRegressionRecordCount']==0, s
          assert s['earAttachmentRegressionRecordCountVsFr5V1']==0, s
          assert s['stressLimbCrossingDeltaVsFr3V5']==0, s
          assert s['minimumPriorFoldCorridorMarginDp']>0.0, s
          svgs=sorted(Path('debug').glob('*.svg'))
          baseline=sorted(Path('frozen_p1f_baseline').glob('*.svg'))
          assert len(svgs)==6, len(svgs)
          assert len(baseline)==22, len(baseline)
          for p in svgs+baseline: ET.parse(p)
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Hash evidence
        working-directory: mobi/p1-fr7-v2/evidence
        run: sha256sum environment.txt git_blob_shas.txt unittest_v1_retained.txt unittest_v2.txt summary.json manifest.json records.json files.sha256 deterministic.txt | tee EVIDENCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-fr7-derived-upper-body-controls-v2-${{ github.run_id }}
          path: mobi/p1-fr7-v2/evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
