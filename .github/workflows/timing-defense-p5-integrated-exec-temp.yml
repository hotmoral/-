name: timing-defense-p5-integrated-exec-temp

on:
  push:
    branches:
      - timing-defense-p5-integrated-exec-temp-20261023
    paths:
      - '.github/workflows/timing-defense-p5-integrated-exec-temp.yml'
      - 'timing-defense-workspace/**'

permissions:
  contents: read

jobs:
  integrated-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact temp branch
        uses: actions/checkout@v4

      - name: Show checkout identity
        run: |
          git rev-parse HEAD
          python --version

      - name: Compile exact committed runner and fidelity probes
        working-directory: timing-defense-workspace
        run: |
          python -m py_compile tools/run_p4d2_stage46_temporal_pressure_probe_v0_1.py
          python -m py_compile tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py
          python -m py_compile tools/run_p5_identity_aware_stage46_49_continuous_probe_temp.py
          python -m py_compile tools/run_p5_identity_aware_stage46_49_settled_tail_probe_temp.py

      - name: Run integrated probe twice and require deterministic bytes
        working-directory: timing-defense-workspace
        run: |
          python tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py --json-out /tmp/p5-run1.json > /tmp/p5-run1.stdout
          python tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py --json-out /tmp/p5-run2.json > /tmp/p5-run2.stdout
          cmp /tmp/p5-run1.json /tmp/p5-run2.json
          sha256sum /tmp/p5-run1.json /tmp/p5-run2.json

      - name: Run Stage-settled tail probe twice and require deterministic bytes
        working-directory: timing-defense-workspace
        run: |
          python tools/run_p5_identity_aware_stage46_49_settled_tail_probe_temp.py > /tmp/p5-settled-tail-1.stdout
          cp /tmp/p5-settled-tail.json /tmp/p5-settled-tail-1.json
          python tools/run_p5_identity_aware_stage46_49_settled_tail_probe_temp.py > /tmp/p5-settled-tail-2.stdout
          cp /tmp/p5-settled-tail.json /tmp/p5-settled-tail-2.json
          cmp /tmp/p5-settled-tail-1.json /tmp/p5-settled-tail-2.json
          sha256sum /tmp/p5-settled-tail-1.json /tmp/p5-settled-tail-2.json

      - name: Print Stage-settled summary
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/p5-run1.json').read_text())
          s = json.loads(Path('/tmp/p5-settled-tail-1.json').read_text())
          print('EXACT_IDENTITY', json.dumps(p['identityRegressions'], sort_keys=True))
          for row in s['chains']:
              stages = row['stages']
              print('SETTLED_CHAIN', row['class'], row['profile'], row['tankShockwaveCoefficient'],
                    'through49=', row['settledThroughStage49'],
                    'finalWall=', row['finalWall'],
                    'settleSeconds=', [x.get('settleSeconds') for x in stages],
                    'tails=', [x.get('tailBeyond60Seconds') for x in stages],
                    'wall=', [x.get('endWall') for x in stages],
                    'wallHits=', [x.get('wallHits') for x in stages],
                    'siegerShots=', [x.get('siegerShots') for x in stages],
                    'buried=', [x.get('buried') for x in stages])
          PY

      - name: Upload exact outputs
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-p5-integrated-exec-temp
          path: |
            /tmp/p5-run1.json
            /tmp/p5-run2.json
            /tmp/p5-run1.stdout
            /tmp/p5-run2.stdout
            /tmp/p5-settled-tail-1.json
            /tmp/p5-settled-tail-2.json
            /tmp/p5-settled-tail-1.stdout
            /tmp/p5-settled-tail-2.stdout
          if-no-files-found: error
          retention-days: 1
