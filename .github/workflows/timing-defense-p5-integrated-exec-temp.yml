name: timing-defense-p5-integrated-exec-temp

on:
  push:
    branches:
      - timing-defense-p5-integrated-exec-temp-20261023
    paths:
      - '.github/workflows/timing-defense-p5-integrated-exec-temp.yml'
      - 'timing-defense-workspace/**'

permissions:
  contents: read

jobs:
  stage48-factor-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact temp branch
        uses: actions/checkout@v4

      - name: Compile diagnostic
        working-directory: timing-defense-workspace
        run: |
          git rev-parse HEAD
          python -m py_compile tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py
          python -m py_compile tools/run_p5_stage48_factor_isolation_temp.py

      - name: Run factor isolation twice and require deterministic bytes
        working-directory: timing-defense-workspace
        run: |
          python tools/run_p5_stage48_factor_isolation_temp.py > /tmp/p5-stage48-factor-1.stdout
          cp /tmp/p5-stage48-factor.json /tmp/p5-stage48-factor-1.json
          python tools/run_p5_stage48_factor_isolation_temp.py > /tmp/p5-stage48-factor-2.stdout
          cp /tmp/p5-stage48-factor.json /tmp/p5-stage48-factor-2.json
          cmp /tmp/p5-stage48-factor-1.json /tmp/p5-stage48-factor-2.json
          sha256sum /tmp/p5-stage48-factor-1.json /tmp/p5-stage48-factor-2.json

      - name: Print bounded summary
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          p = json.loads(Path('/tmp/p5-stage48-factor-1.json').read_text())
          by = defaultdict(list)
          for r in p['rows']:
              by[r['variant']].append(r)
          for variant in p['variants']:
              rows = by[variant]
              print('VARIANT', variant, 'spawn=', rows[0]['spawnCount'], rows[0]['spawnTypes'])
              for cls in ['Knight','Rogue','Tank','Archer','Mage']:
                  rr = [x for x in rows if x['class']==cls]
                  print(' ', cls,
                        'settled=', sum(1 for x in rr if x['settledWithin240']), '/', len(rr),
                        'buried=', [(x['profile'],x['burialTime']) for x in rr if x['burialTime'] is not None],
                        'endWall=', [(x['profile'],x['endWall']) for x in rr],
                        'wallHits=', [(x['profile'],x['wallHits']) for x in rr],
                        'siegerShots=', [(x['profile'],x['siegerShots']) for x in rr])
          PY

      - name: Upload factor output
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-p5-stage48-factor-temp
          path: |
            /tmp/p5-stage48-factor-1.json
            /tmp/p5-stage48-factor-2.json
            /tmp/p5-stage48-factor-1.stdout
            /tmp/p5-stage48-factor-2.stdout
          if-no-files-found: error
          retention-days: 1
