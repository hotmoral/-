name: timing-defense-p5-integrated-exec-temp

on:
  push:
    branches:
      - timing-defense-p5-integrated-exec-temp-20261023
    paths:
      - '.github/workflows/timing-defense-p5-integrated-exec-temp.yml'
      - 'timing-defense-workspace/**'

permissions:
  contents: read

jobs:
  integrated-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact temp branch
        uses: actions/checkout@v4

      - name: Show checkout identity
        run: |
          git rev-parse HEAD
          python --version

      - name: Compile exact committed runner, base kernel, and temp fidelity probe
        working-directory: timing-defense-workspace
        run: |
          python -m py_compile tools/run_p4d2_stage46_temporal_pressure_probe_v0_1.py
          python -m py_compile tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py
          python -m py_compile tools/run_p5_identity_aware_stage46_49_continuous_probe_temp.py

      - name: Run integrated probe twice and require deterministic bytes
        working-directory: timing-defense-workspace
        run: |
          python tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py --json-out /tmp/p5-run1.json > /tmp/p5-run1.stdout
          python tools/run_p5_identity_aware_stage46_49_integrated_probe_v0_1.py --json-out /tmp/p5-run2.json > /tmp/p5-run2.stdout
          cmp /tmp/p5-run1.json /tmp/p5-run2.json
          sha256sum /tmp/p5-run1.json /tmp/p5-run2.json

      - name: Run continuous backlog fidelity probe
        working-directory: timing-defense-workspace
        run: |
          python tools/run_p5_identity_aware_stage46_49_continuous_probe_temp.py > /tmp/p5-continuous.stdout
          sha256sum /tmp/p5-continuous.json

      - name: Print bounded interpretation summary
        working-directory: timing-defense-workspace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/p5-run1.json').read_text())
          c = json.loads(Path('/tmp/p5-continuous.json').read_text())
          print('normalRightEdgeSpawnX=', p['normalRightEdgeSpawnX'])
          print('midFieldPopInAllowed=', p['midFieldPopInAllowed'])
          print('stageWindowSeconds=', p['stageWindowSeconds'])
          print('chains=', len(p['chains']))
          for row in p['chains']:
              if row['class'] in ('Tank','Rogue'):
                  ends = [s['result']['endActive'] for s in row['stages']]
                  walls = [s['endCurrentWall'] for s in row['stages']]
                  print('RESET_CHAIN', row['class'], row['profile'], row['tankShockwaveCoefficient'], 'survive49=', row['survivedThroughStage49'], 'walls=', walls, 'endActive=', ends)
          print('IDENTITY', json.dumps(p['identityRegressions'], sort_keys=True))
          for row in c['chains']:
              snaps = row['continuousSnapshots']
              print('CONT_CHAIN', row['class'], row['profile'], row['tankShockwaveCoefficient'],
                    'resetFinalWall=', row['resetBoundaryFinalWall'],
                    'continuousSurvive240=', row['continuousSurvives240'],
                    'continuousFinalWall=', row['continuousFinalWall'],
                    'continuousFinalActive=', row['continuousFinalActive'],
                    'snapWalls=', [x['endWall'] for x in snaps],
                    'snapActive=', [x['endActive'] for x in snaps],
                    'burials=', [x['burialTime'] for x in snaps])
          PY

      - name: Upload exact outputs
        uses: actions/upload-artifact@v4
        with:
          name: timing-defense-p5-integrated-exec-temp
          path: |
            /tmp/p5-run1.json
            /tmp/p5-run2.json
            /tmp/p5-run1.stdout
            /tmp/p5-run2.stdout
            /tmp/p5-continuous.json
            /tmp/p5-continuous.stdout
          if-no-files-found: error
          retention-days: 1
