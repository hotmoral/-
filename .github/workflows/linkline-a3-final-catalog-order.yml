name: Linkline A3 Final Catalog Candidate Materialization

on:
  push:
    branches:
      - linkline/a3-final-catalog-order-v1
    paths:
      - linkline/tools/a3_final_candidate_pool_public.py
      - .github/workflows/linkline-a3-final-catalog-order.yml

permissions:
  contents: write

concurrency:
  group: linkline-a3-final-catalog-order-v1
  cancel-in-progress: true

jobs:
  candidate-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify approved execution closure
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          test "$(git hash-object linkline/reference/m2_state_model.py)" = "c2bf85974d317eb18a8b02a1ac4ee7eb244fcb77"
          test "$(git hash-object linkline/reference/m3_solver.py)" = "16b170656bbdffa8e836a891ffbf221de6c2935f"
          test "$(git hash-object linkline/analysis/a2_cognitive.py)" = "880aa4d8668fd71e2ce8222331f0da0368229400"
          test "$(git hash-object linkline/analysis/a3_structural_features.py)" = "35a6b997816ee3608d4d8064febd059159030796"
          test "$(git hash-object linkline/tools/a3_final_candidate_pool_public.py)" = "86635edf7266f2f2524ed031467cf4e3045c69c9"

      - name: Cheap syntax check
        shell: bash
        working-directory: repo/linkline
        run: |
          set -euo pipefail
          python --version
          python -m py_compile tools/a3_final_candidate_pool_public.py

      - name: Materialize de-identified candidate pool
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          rm -rf public_output/a3_final_candidate_pool_v1
          python -c 'import tools.a3_final_candidate_pool_public as m; m.LEGACY_BUFFER_FACTOR=2.0; m.main()'
          test -s public_output/a3_final_candidate_pool_v1/candidate_pool.json
          test -s public_output/a3_final_candidate_pool_v1/summary.json
          sha256sum public_output/a3_final_candidate_pool_v1/candidate_pool.json public_output/a3_final_candidate_pool_v1/summary.json

      - name: Commit public-safe measured output
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/public_output/a3_final_candidate_pool_v1
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Linkline A3: materialize public-safe final candidate pool"
          git push origin HEAD:linkline/a3-final-catalog-order-v1
