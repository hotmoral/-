name: Clumi Tutorial Choice V1 Verify

on:
  push:
    branches:
      - clumi/tutorial-choice-v1-verify
    paths:
      - '.github/workflows/einstein-clumi-tutorial-choice-v1-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: fbbecb2a6bc5d8951d3e39b9da5aadeb6dcf63b4
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      BUILD_TOOLS: '34.0.0'
      TUTORIAL_ART_SHA256: 3979153f9753c02fbcb89dfd75dbe092d61c5a2e3178c087e2a4eceeb4766528
    steps:
      - name: Require private source credential
        run: test -n "$READ_TOKEN"

      - name: Checkout exact private feature source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Apply Stable v7 tutorial and visual-button transforms
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --check dev/manual-force-longpress.patch
          git apply dev/manual-force-longpress.patch
          python3 dev/board-reset-preserve-resources.py
          python3 dev/board-render-resume-fix.py
          python3 dev/tutorial-choice-onboarding-v2.py
          python3 dev/tutorial-button-visual-v1.py
          git diff --check

      - name: Verify tutorial-mode visual asset and arrival contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          echo "$TUTORIAL_ART_SHA256  app/src/main/assets/ui/b3-r5/cta_tutorial.png" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          ma=Path('app/src/main/java/com/example/einsteingame/MainActivity.java').read_text()
          gv=Path('app/src/main/java/com/example/einsteingame/GameView.java').read_text()
          sp=Path('app/src/main/java/com/example/einsteingame/ClumiSpotlightPolicy.java').read_text()
          cc=Path('app/src/main/java/com/example/einsteingame/ClumiConditionCard.java').read_text()
          va=Path('app/src/main/java/com/example/einsteingame/ClumiVisualAssets.java').read_text()
          arrival=Path('app/src/main/java/com/example/einsteingame/ClumiStageArrival.java').read_text()
          home=ma[ma.index('private void renderHome()'):ma.index('private void showStages()')]
          assert 'Button tutorial=button("튜토리얼",true,this::startTutorial)' in home
          assert home.index('home-tutorial') < home.index('home-continue')
          assert 'ClumiVisualAssets.buttonArt(tutorial,"cta-tutorial")' in home
          assert 'ClumiUi.actionIcon(tutorial,"help",true)' not in home
          assert '"cta_start","cta_continue","cta_tutorial","cta_stage_select"' in va
          assert 'FILES.put("cta-tutorial","cta_tutorial")' in va
          assert 'file.equals("cta_tutorial")' in va and 'return 1;' in va
          assert 'private void saveAttempt(){if(!tutorialMode&&session!=null' in ma
          assert 'if(tutorialMode)game.post' in ma
          assert 'tutorialMode=true;spotlight.beginTutorial();route("play",false,this::prepareTutorialStage)' in ma
          assert 'finishTutorialAndStartStageOne' in ma
          assert 'PlayTimer.setStage1TutorialPending(false);' in sp
          assert 'explicitTutorial' in sp and 'FILTER_ALL_LABEL' in sp
          assert 'stage1.candidate.force' in gv and 'stage1.undo.practice' in gv
          assert ma.count('game.spotlight(spotlight)') == 1
          assert 'new String[]{"CLEAR","GREAT","PERFECT"}' in cc
          i_logo=arrival.index('motion.add(homeLogo')
          i_settings=arrival.index('motion.add(settings')
          i_tutorial=arrival.index('motion.add(tutorial')
          i_play=arrival.index('motion.add(play')
          i_stages=arrival.index('motion.add(stages')
          i_rewards=arrival.index('motion.add(rewards')
          assert i_logo < i_settings < i_tutorial < i_play < i_stages < i_rewards
          assert 'laidOut(root,homeLogo,settings,tutorial,play,stages,rewards)' in arrival
          assert 'if(tutorial!=null)tutorial.setEnabled(false);' in arrival
          print('TUTORIAL_VISUAL_ASSET_AND_ARRIVAL_CONTRACT_PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile Android release
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD ./gradlew --no-daemon --console=plain :app:assembleRelease -x :app:lintVitalRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -F 'assets/ui/b3-r5/cta_tutorial.png'
          echo TUTORIAL_VISUAL_ANDROID_COMPILE_PASS

# trigger: tutorial-visual-v1-resolution
