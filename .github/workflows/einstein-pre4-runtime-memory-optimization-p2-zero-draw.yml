name: Einstein Pre4 P2 Evidence Memoization Zero-Draw

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-pre4-runtime-memory-optimization-p2-zero-draw.yml'

permissions:
  contents: read

concurrency:
  group: einstein-pre4-runtime-memory-optimization-p2-zero-draw-v1
  cancel-in-progress: false

jobs:
  validate-and-publish-candidate:
    if: >-
      github.event.head_commit.message == 'ci: rerun Einstein pre4 P2 evidence memoization zero draw'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE_SHA: ee12dfe369ff48858f865c2b01429fedfa7b409c
      CANDIDATE_BRANCH: pre4-zero-draw-runtime-memory-optimization-v3
      BASE_CLASSES: /tmp/einstein-pre4-p2-base-classes
      CANDIDATE_CLASSES: /tmp/einstein-pre4-p2-candidate-classes
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: hotmoral/-
          ref: main
          path: Harness
          persist-credentials: false

      - name: Correct static helper qualification in local harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Harness/scripts/einstein-pre4-runtime-memory-optimize-p2.sh')
          s=p.read_text()
          old='Collections.unmodifiableMap(productive(ops.get(k)))'
          new='Collections.unmodifiableMap(StructuralAhaAnalyzer.productive(ops.get(k)))'
          if s.count(old)!=1: raise SystemExit('productive helper correction anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Checkout exact P1 candidate with write credential
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ee12dfe369ff48858f865c2b01429fedfa7b409c
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run P2 evidence memoization harness
        shell: bash
        run: bash Harness/scripts/einstein-pre4-runtime-memory-optimize-p2.sh
