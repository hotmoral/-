name: Einstein Campaign Transfer Boundary Preflight V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-transfer-boundary-preflight-v1.yml'

permissions:
  contents: read

jobs:
  inspect-transfer-fixture:
    if: >-
      github.event.head_commit.message == 'verify: inspect Einstein transfer fixture v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Checkout proven runner source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: c4b591918072a09eb62c9f80f85a5df6b924c785
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 1
          persist-credentials: false

      - name: Find canonical transfer definitions
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          echo '=== N5_FOUNDATION_TRANSFER exact references ==='
          grep -RIn --exclude-dir=.git -E 'N5_FOUNDATION_TRANSFER|RELATION_TRANSFER.*Role|Role\.TRANSFER.*RELATION_TRANSFER|new IntentSpec' . | head -n 1000 || true
          echo '=== Transfer-context constructors ==='
          grep -RIn --include='*.java' -E 'new TransferContext\(' puzzle-authoring/src/main puzzle-authoring/src/test | head -n 500 || true
          echo '=== campaign plan builder candidates ==='
          find . -type f \( -name '*.java' -o -name '*.py' -o -name '*.json' -o -name '*.md' \) -print | grep -Ei 'campaign|production|plan' | head -n 500
