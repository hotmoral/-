name: Linkline V4 exact first chunk repair

on:
  push:
    branches:
      - linkline/cloudflare-product-v4-smoke-v1

permissions:
  contents: write

jobs:
  repair-first-chunk:
    if: ${{ !contains(github.event.head_commit.message, 'repair exact V4 first chunk') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Restore six canonical rows and verify exact SHA-256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          p=Path('timing-defense-skilled-v2-harness/public/data/campaign-0001-0260.chunk.json')
          expected='241e711a70f928f7de6aabd6b3f1167709d42d57e546d5d44067e92c2104d362'
          root=json.loads(p.read_text())
          rows=root['rows']
          current=hashlib.sha256(p.read_bytes()).hexdigest()
          if current == expected:
              print('already exact')
              raise SystemExit(0)
          if len(rows) != 255:
              raise SystemExit(f'UNEXPECTED_PRE_REPAIR_ROW_COUNT:{len(rows)}')

          fixes={
            45:[3,4,[8,7,4,1],[6,7]],
            148:[5,6,[6,5,10,15,16,11],[18,23]],
            149:[4,8,[15,11,7,3,2,6,10,9],[4,7]],
            150:[5,6,[8,7,6,11,16,17],[2,13]],
            151:[5,6,[7,6,5,10,11,16],[1,4]],
            152:[4,8,[2,3,7,11,15,14,10,9],[6,10]],
          }
          rows[44]=fixes[45]
          rows[147:147]=[fixes[s] for s in range(148,153)]
          if len(rows) != 260:
              raise SystemExit(f'BAD_POST_REPAIR_ROW_COUNT:{len(rows)}')
          raw=json.dumps(root,separators=(',',':')).encode()
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'BAD_REBUILT_SHA256:{actual}')
          git_sha=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
          if git_sha != '9a956554fecd77f17829370e51a9caca3e65db52':
              raise SystemExit(f'BAD_REBUILT_GIT_SHA:{git_sha}')
          p.write_bytes(raw)
          print(f'EXACT_REPAIR_PASS size={len(raw)} gitBlobSha={git_sha}')
          PY

      - name: Commit exact first chunk only
        run: |
          set -euo pipefail
          expected=241e711a70f928f7de6aabd6b3f1167709d42d57e546d5d44067e92c2104d362
          test "$(sha256sum timing-defense-skilled-v2-harness/public/data/campaign-0001-0260.chunk.json | awk '{print $1}')" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timing-defense-skilled-v2-harness/public/data/campaign-0001-0260.chunk.json
          if git diff --cached --quiet; then
            echo 'No repair commit required'
            exit 0
          fi
          git commit -m "linkline: repair exact V4 first chunk"
          git push origin HEAD:linkline/cloudflare-product-v4-smoke-v1
