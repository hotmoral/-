name: Mobi P1-C4 Hard-Motion Morphology Stress

on:
  push:
    branches:
      - 'mobi/run-p1-c4-hard-motion-20261015'
    paths:
      - 'mobi/p1-b2/geometry/c4_hard_motion_fixture_adapter.py'
      - 'mobi/p1-b2/geometry/c4_renderer_adapter.py'
      - 'mobi/p1-b2/geometry/run_c4_hard_motion_matrix.py'
      - 'mobi/p1-b2/geometry/test_c4_hard_motion.py'
      - '.github/workflows/mobi-p1-c4-hard-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-c4-hard-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p mobi/p1-c4/evidence
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "runner=ubuntu-latest"
            python3 --version
          } | tee mobi/p1-c4/evidence/environment.txt

      - name: Verify private-public source parity and frozen accepted sources
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          test "$(git hash-object model.py)" = "c4e0334cf5896d0bb7a2ab3e8d89c1cd37f7410b"
          test "$(git hash-object candidates_v2.py)" = "39bcf9759387800c7da60ace45a528d238d4208f"
          test "$(git hash-object motions_v2.py)" = "a3d6c1fd0227216fdf2a69e056e3b177dc398c53"
          test "$(git hash-object orientation_v2.py)" = "33cb9c1e8f3b41f038898345a0aee0642609e812"
          test "$(git hash-object c3_semantic.py)" = "9ebb7192fbd414f134ecd15991ca252af58bfd62"
          test "$(git hash-object c3_renderers.py)" = "19117dfe2e3d093defe8624bb3fc3fb75ccfb63b"
          test "$(git hash-object c3_renderer_validity_v2.py)" = "a4f8def921434dc3e6134866bce4184ecad82189"
          test "$(git hash-object c3_renderer_minimal_v3.py)" = "9b4744ad6ce02867d4b4e525316a7d625b5a5f58"
          test "$(git hash-object c3_renderer_view_resolved_v4.py)" = "87e48c4789a4b2e8c9dd6aebd16b090b22f2b1e0"
          test "$(git hash-object run_c3_matrix.py)" = "8668613e8784406d081bb389a60d92eba23df2c1"
          test "$(git hash-object h6n_stepped_turn.py)" = "62ee60e58120b4db537cb8247f507d7ede67afcb"
          test "$(git hash-object h6n_stepped_turn_v2.py)" = "8903145739c5eb0a21b87d192c27cfdab6fc48b0"
          test "$(git hash-object c3w_h6n_fixture_adapter.py)" = "fd3a53be0ef18e8ee4085b031cf8e7d2faa18195"
          test "$(git hash-object c4_hard_motion_fixture_adapter.py)" = "90ccccde16623073f13fc986cebc238c74aa9c13"
          test "$(git hash-object c4_renderer_adapter.py)" = "1cec4470d6e458a1a3a9c6b1d9f6a44b4483af6e"
          test "$(git hash-object run_c4_hard_motion_matrix.py)" = "e864b9a29d52514e61690a95caf2c0a217b3fec9"
          test "$(git hash-object test_c4_hard_motion.py)" = "41e41f9160d66049f6e43bf62e33f531bb80d6fc"
          git hash-object \
            model.py candidates_v2.py motions_v2.py orientation_v2.py \
            c3_semantic.py c3_renderers.py c3_renderer_validity_v2.py \
            c3_renderer_minimal_v3.py c3_renderer_view_resolved_v4.py \
            run_c3_matrix.py h6n_stepped_turn.py h6n_stepped_turn_v2.py \
            c3w_h6n_fixture_adapter.py \
            c4_hard_motion_fixture_adapter.py c4_renderer_adapter.py \
            run_c4_hard_motion_matrix.py test_c4_hard_motion.py \
            | tee ../../p1-c4/evidence/git_blob_shas.txt
          sha256sum \
            model.py candidates_v2.py motions_v2.py orientation_v2.py \
            c3_semantic.py c3_renderers.py c3_renderer_validity_v2.py \
            c3_renderer_minimal_v3.py c3_renderer_view_resolved_v4.py \
            run_c3_matrix.py h6n_stepped_turn.py h6n_stepped_turn_v2.py \
            c3w_h6n_fixture_adapter.py \
            c4_hard_motion_fixture_adapter.py c4_renderer_adapter.py \
            run_c4_hard_motion_matrix.py test_c4_hard_motion.py \
            | tee ../../p1-c4/evidence/source_sha256.txt
          echo "P1-C4 source parity PASS; accepted upstream sources frozen PASS"

      - name: Run C3-C3W regressions and C4 tests
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            test_c3_v3.py \
            test_c3r_h6_view.py \
            test_c3v_h6_basis.py \
            test_h6n_stepped_turn.py \
            test_h6n_stepped_turn_v2.py \
            test_c3w_h6n_representation.py \
            test_c4_hard_motion.py \
            2>&1 | tee ../../p1-c4/evidence/unittest.txt

      - name: Run deterministic C4 matrix twice
        working-directory: mobi/p1-b2/geometry
        run: |
          set -euo pipefail
          rm -rf ../../p1-c4/run1 ../../p1-c4/run2
          python3 run_c4_hard_motion_matrix.py --output-dir ../../p1-c4/run1
          python3 run_c4_hard_motion_matrix.py --output-dir ../../p1-c4/run2
          cmp ../../p1-c4/run1/results.json ../../p1-c4/run2/results.json
          cmp ../../p1-c4/run1/summary.json ../../p1-c4/run2/summary.json
          diff -qr ../../p1-c4/run1/scorecards ../../p1-c4/run2/scorecards
          cp ../../p1-c4/run1/results.json ../../p1-c4/evidence/results.json
          cp ../../p1-c4/run1/summary.json ../../p1-c4/evidence/summary.json
          cp -R ../../p1-c4/run1/scorecards ../../p1-c4/evidence/scorecards
          rm -rf ../../p1-c4/run1 ../../p1-c4/run2
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('../../p1-c4/evidence/summary.json').read_text())
          if summary['records'] != 48:
              raise SystemExit(f"expected 48 records, got {summary['records']}")
          if summary['semanticHashMismatchTotal'] != 0:
              raise SystemExit('semantic mismatch')
          expected = {
              'VIEW_RESOLVED_RF_B': [],
              'VIEW_RESOLVED_RF_C_H4': ['H4_CORE_ENVELOPE'],
          }
          if summary['correctionFamiliesByCandidate'] != expected:
              raise SystemExit(f"correction budget mismatch: {summary['correctionFamiliesByCandidate']}")
          if any(value > 4 for value in summary['maxPartitionGroupCountByCandidate'].values()):
              raise SystemExit(f"partition group overflow: {summary['maxPartitionGroupCountByCandidate']}")
          for case_id, count in summary['geometryMismatchByCase'].items():
              if case_id == 'H4_SIT_TO_STAND':
                  if count <= 0:
                      raise SystemExit('H4 candidates unexpectedly identical')
              elif count != 0:
                  raise SystemExit(f"unexpected candidate geometry divergence: {case_id}={count}")
          summary['deterministicRepeatExact'] = True
          Path('../../p1-c4/evidence/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Validate scorecards
        working-directory: mobi/p1-c4/evidence
        run: |
          set -euo pipefail
          test "$(find scorecards -maxdepth 1 -name '*.svg' | wc -l)" -eq 48
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = sorted(Path('scorecards').glob('*.svg'))
          if len(paths) != 48:
              raise SystemExit(len(paths))
          for path in paths:
              ET.parse(path)
          print(f"scorecards_xml_pass={len(paths)}")
          PY
          find scorecards -maxdepth 1 -name '*.svg' -print0 | sort -z | xargs -0 sha256sum > scorecard_sha256.txt

      - name: Hash evidence files
        working-directory: mobi/p1-c4/evidence
        run: |
          set -euo pipefail
          sha256sum environment.txt git_blob_shas.txt source_sha256.txt unittest.txt results.json summary.json scorecard_sha256.txt | tee EVIDENCE_SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-c4-hard-motion-${{ github.run_id }}
          path: mobi/p1-c4/evidence/
          if-no-files-found: error
          retention-days: 30
