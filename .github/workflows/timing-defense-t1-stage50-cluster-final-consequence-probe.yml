name: Timing Defense T1 Stage50 Cluster Final Consequence Probe

on:
  push:
    branches: [timing-defense-workspace]
    paths:
      - 'timing-defense-workspace/tools/probe_t1_stage50_cluster_final_consequence_translation_v0_1.py'
      - 'timing-defense-workspace/tools/admit_t1_stage49_50_stagger1800_authoring_candidate_dynamic_v0_1.py'
      - 'timing-defense-workspace/legacy-game-structure/data/t1_stage49_50_stagger1800_authoring_candidate_v0_1.yaml'
      - '.github/workflows/timing-defense-t1-stage50-cluster-final-consequence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: timing-defense-workspace
    env:
      BASE_RECIPE: legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_2_pressure_shape_candidate.yaml
      CANDIDATE: legacy-game-structure/data/t1_stage49_50_stagger1800_authoring_candidate_v0_1.yaml
      SEEDS: 101,211,307,409,503
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Record exact source identity
        run: |
          mkdir -p artifacts
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA" > artifacts/stage50-cluster-final-consequence-source-identity.txt
          sha256sum \
            tools/probe_t1_stage50_cluster_final_consequence_translation_v0_1.py \
            tools/admit_t1_stage49_50_stagger1800_authoring_candidate_dynamic_v0_1.py \
            tools/preflight_t1_stage49_50_stagger1800_authoring_candidate_v0_1.py \
            "$CANDIDATE" \
            "$BASE_RECIPE" \
            tools/probe_t1_stage49_50_sustain_integration_compare_v0_1.py \
            tools/probe_t1_stage49_50_order_robustness_v0_1.py \
            tools/probe_t1_stage49_50_target_phase_clearance_v0_1.py \
            tools/probe_t1_stage49_50_class_rotation_shape_v0_1.py \
            tools/probe_t1_archer_lv31_continuous_corridor_bridge_v0_1.py \
            tools/t1_transition_microsim_mage_lv31_fidelity_bridge_v0_1.py \
            tools/run_t1_transition_slice_microsim_settlement_fix_v0_1.py \
            tools/t1_transition_microsim_core_v0_1.py \
            tools/t1_transition_microsim_skills_v0_1.py \
            tools/t1_transition_microsim_engine_v0_1.py \
            >> artifacts/stage50-cluster-final-consequence-source-identity.txt
          cat artifacts/stage50-cluster-final-consequence-source-identity.txt
      - name: Compile probe
        run: python -m py_compile tools/probe_t1_stage50_cluster_final_consequence_translation_v0_1.py
      - name: Run bounded consequence probe
        run: |
          PYTHONPATH=tools python tools/probe_t1_stage50_cluster_final_consequence_translation_v0_1.py \
            --base "$BASE_RECIPE" \
            --candidate "$CANDIDATE" \
            --seeds "$SEEDS" \
            --json-out artifacts/t1-stage50-cluster-final-consequence-translation-v0_1.json
      - name: Fidelity assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/t1-stage50-cluster-final-consequence-translation-v0_1.json').read_text())
          assert d['status']=='DIAGNOSTIC_EXECUTION_PASS', d['errors']
          assert d['errors']==[], d['errors']
          assert d['fidelityErrors']==[], d['fidelityErrors']
          assert d['stage49Unchanged'] is True
          assert d['stage50MetadataUnchanged'] is True
          assert d['grammarTemplatesUnchanged'] is True
          assert d['stageStatic']['49']['max4s']<=8
          assert d['stageStatic']['50']['max4s']<=8
          assert d['productionGameplayChange'] is False
          assert d['authoringAdopted'] is False
          assert d['numericalFreeze'] is False
          print('T1_STAGE50_CLUSTER_FINAL_CONSEQUENCE_PROBE=EXECUTION_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-defense-t1-stage50-cluster-final-consequence-probe
          path: |
            timing-defense-workspace/artifacts/t1-stage50-cluster-final-consequence-translation-v0_1.json
            timing-defense-workspace/artifacts/stage50-cluster-final-consequence-source-identity.txt
          if-no-files-found: error
