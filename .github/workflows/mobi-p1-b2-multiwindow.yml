name: Mobi P1-B2.2 Multi-Window Runtime

on:
  push:
    branches:
      - 'mobi/run-p1-b2-multiwindow-20261015'
    paths:
      - 'mobi/p1-b2-android/**'
      - '.github/workflows/mobi-p1-b2-multiwindow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobi-p1-b2-multiwindow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api35-multiwindow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Record source identity
        run: |
          set -euo pipefail
          mkdir -p mobi/output/p1-b2-multiwindow
          {
            echo "git_commit=${GITHUB_SHA}"
            echo "prototype=P1_B2_2_MULTIWINDOW_V01"
            echo "runner=ubuntu-latest"
            java -version 2>&1 | head -1
            gradle --version | grep '^Gradle '
            sha256sum \
              mobi/p1-b2-android/harness/app/src/main/java/org/example/catpresence/MainActivity.java \
              mobi/p1-b2-android/harness/app/src/main/java/org/example/catpresence/PresenceService.java \
              mobi/p1-b2-android/harness/app/src/main/java/org/example/catpresence/FootprintWindowView.java \
              mobi/p1-b2-android/harness/app/src/main/java/org/example/catpresence/QaState.java \
              mobi/p1-b2-android/tools/run_multiwindow_smoke.sh
          } | tee mobi/output/p1-b2-multiwindow/build_identity.txt

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build and run API 35 P1-B2.2 multi-window smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          pre-emulator-launch-script: gradle --no-daemon -p mobi/p1-b2-android/harness :app:assembleDebug
          script: bash mobi/p1-b2-android/tools/run_multiwindow_smoke.sh

      - name: Hash evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -d mobi/output/p1-b2-multiwindow ]; then
            find mobi/output/p1-b2-multiwindow -type f -print0 | sort -z | xargs -0 sha256sum > mobi/output/p1-b2-multiwindow/SHA256SUMS.txt || true
          fi

      - name: Upload P1-B2.2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobi-p1-b2-multiwindow-${{ github.run_id }}
          path: mobi/output/p1-b2-multiwindow
          if-no-files-found: warn
          retention-days: 30
