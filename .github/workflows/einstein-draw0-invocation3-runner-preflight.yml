name: Einstein Draw0 Invocation3 Runner Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-draw0-invocation3-runner-preflight.yml'

permissions:
  contents: read

concurrency:
  group: einstein-draw0-invocation3-runner-preflight
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.head_commit.message == 'ci: validate Einstein draw0 invocation3 runner preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_SHA: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
      ACCEPTED_SOURCE_SHA: 1d56f63da7217f2a96e72ddf5782d70fc1416c5f
      FIXTURE_SHA: b34abb909dd1d154ca964423c6bde3bcb347407d
      FIXTURE_BLOB_SHA: ce555f511ca4003e95a24fbca975081c61109222
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      CLASSES_DIR: /tmp/einstein-invocation3-preflight-classes
      SOURCES_FILE: /tmp/einstein-invocation3-preflight-sources.txt
      EXEC_DIR: /tmp/einstein-invocation3-preflight
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact invocation3 runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 8d8fa546a55d0e0280eb67fe52adb49d8c67cca2
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: false

      - name: Checkout exact frozen bounded fixture
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: b34abb909dd1d154ca964423c6bde3bcb347407d
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: FrozenFixture
          fetch-depth: 1
          persist-credentials: false

      - name: Hard-gate source and fixture identity
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java'
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java)"
          test -z "$(git status --porcelain --untracked-files=all)"
          grep -F 'EXPECTED_PRODUCTION_SOURCE="1d56f63da7217f2a96e72ddf5782d70fc1416c5f"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F 'EXECUTE_TOKEN="RUN_AUTHORIZED_DRAW0_RECOVERY_INVOCATION_3"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F 'FORMAL_REMOTE_ROOT="evidence/bounded-acquisition/draw0-recovery-invocation-3"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F '"historicalDraw0InvocationCount",2,"recoveryInvocationOrdinal",3' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          grep -F 'SPLIT_RESUME_CONTRACT=PASS' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          cd ../FrozenFixture
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          F='puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java'
          test "$(git hash-object "$F")" = "$FIXTURE_BLOB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile exact Java 8 preflight set
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE" "$EXEC_DIR"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          cat >> "$SOURCES_FILE" <<'EOF'
          puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionAckDurableRecoveryRunnerV1.java
          ../FrozenFixture/puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/BoundedAcquisitionContextEpochPreflightTest.java
          EOF
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=list(Path('/tmp/einstein-invocation3-preflight-classes').rglob('*.class'))
          assert files
          bad=[]
          for p in files:
              magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
              if (magic,minor,major)!=(0xCAFEBABE,0,52): bad.append((str(p),major))
          assert not bad, bad[:10]
          print('JAVA8_CLASSFILE_TARGET=PASS count='+str(len(files)))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run zero-draw local protocol and split-resume preflight
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: 1d56f63da7217f2a96e72ddf5782d70fc1416c5f
          EINSTEIN_REMOTE_EVIDENCE_ROOT: preflight/invocation3-local
        run: |
          set -euo pipefail
          java -Xmx512m -cp "$CLASSES_DIR" \
            com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionAckDurableRecoveryRunnerV1 \
            preflight "$EXEC_DIR" | tee /tmp/einstein-invocation3-preflight.log
          grep -F 'ACK_DURABLE_RECOVERY_LOCAL_PREFLIGHT=PASS' /tmp/einstein-invocation3-preflight.log
          grep -F 'SPLIT_RESUME_CONTRACT=PASS' /tmp/einstein-invocation3-preflight.log
          grep -F 'formalAcquisitionInvocationCount=0' /tmp/einstein-invocation3-preflight.log

      - name: Postflight zero-draw boundary
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' \
            'EINSTEIN_DRAW0_INVOCATION3_RUNNER_PREFLIGHT=PASS' \
            "runner=$RUNNER_SHA" \
            "acceptedSource=$ACCEPTED_SOURCE_SHA" \
            'splitResume=PASS' \
            'localRemoteAck=PASS' \
            'formalAcquisitionInvocation=0'
