name: Einstein Frontier Evidence Bounded-Memory Zero-Draw Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-frontier-evidence-bounded-memory-zero-draw.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EINSTEIN_FRONTIER_BOUNDED_MEMORY_ZERO_DRAW_V1 exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: einstein-frontier-evidence-bounded-memory-zero-draw-v1
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: validate Einstein bounded frontier evidence zero draw') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_EINSTEIN_FRONTIER_BOUNDED_MEMORY_ZERO_DRAW_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: bddc1e741252eec7793d9064a607c495c006ce9c
      ACCEPTED_BASE_SHA: 1d56f63da7217f2a96e72ddf5782d70fc1416c5f
      PRIVATE_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      CLASSES_DIR: /tmp/einstein-frontier-bounded-classes
      SOURCES_FILE: /tmp/einstein-frontier-bounded-sources.txt
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bddc1e741252eec7793d9064a607c495c006ce9c
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 5
          persist-credentials: false

      - name: Hard-gate reviewed delta
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$ACCEPTED_BASE_SHA^{commit}"
          test "$(git merge-base "$ACCEPTED_BASE_SHA" HEAD)" = "$ACCEPTED_BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD | sort)
          expected=(
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/aha/StructuralAhaAnalysisResult.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/contract/RecordSupport.java'
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/path/PathExplorerResult.java'
            'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/contract/BoundedCanonicalRecordViewTest.java'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test -z "$(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD -- puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/acquisition)"
          test -z "$(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD -- puzzle-authoring/build.gradle)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java 8 main and PSS test surface
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          find puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss -type f -name '*.java' -print | sort >> "$SOURCES_FILE"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=list(Path('/tmp/einstein-frontier-bounded-classes').rglob('*.class'))
          assert files
          bad=[]
          for p in files:
              magic,minor,major=struct.unpack('>IHH',p.read_bytes()[:8])
              if (magic,minor,major)!=(0xCAFEBABE,0,52): bad.append((str(p),major))
          assert not bad, bad[:10]
          print('JAVA8_CLASSFILE_TARGET=PASS count='+str(len(files)))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove lazy projection exact canonical equivalence
        shell: bash
        working-directory: EinsteinGame/puzzle-authoring
        run: |
          set -euo pipefail
          java -Xmx512m -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.contract.BoundedCanonicalRecordViewTest | tee /tmp/einstein-frontier-view-equivalence.log
          grep -F 'BoundedCanonicalRecordViewTest PASS assertions=4' /tmp/einstein-frontier-view-equivalence.log
          java -Xmx512m -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.contract.CanonicalJsonStreamingHashTest | tee /tmp/einstein-streaming-hash-equivalence.log
          grep -F 'CanonicalJsonStreamingHashTest PASS assertions=11' /tmp/einstein-streaming-hash-equivalence.log

      - name: Prove constrained-heap bounded materialization
        shell: bash
        working-directory: EinsteinGame/puzzle-authoring
        run: |
          set -euo pipefail
          java -Xmx64m -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.contract.BoundedCanonicalRecordViewTest stress | tee /tmp/einstein-frontier-view-stress.log
          grep -F 'BoundedCanonicalRecordViewStress PASS assertions=2 logicalMinimumBytes=100663296' /tmp/einstein-frontier-view-stress.log

      - name: Run PSS Aha regression
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.PssAhaTest | tee /tmp/einstein-pss-aha.log
          grep -F 'CP8 STRUCTURAL AHA ANALYZER: PASS; assertions=3511' /tmp/einstein-pss-aha.log
          grep -F 'Golden=ef1e05b89179ac3ca0025c6a51ea81b092a61a8287a6777c8385f70e893a129f Result=752ffdfac9f83b7e3136f1f48a0ba3ca63aed82da25f71c9c77a3881d1330f3c' /tmp/einstein-pss-aha.log

      - name: Run IA regressions
        shell: bash
        working-directory: EinsteinGame/puzzle-authoring
        run: |
          set -euo pipefail
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionTest | tee /tmp/einstein-ia1.log
          grep -F 'IntentAcquisitionTest PASS assertions=22' /tmp/einstein-ia1.log
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionIA2Test | tee /tmp/einstein-ia2.log
          grep -F 'IntentAcquisitionIA2Test PASS assertions=33' /tmp/einstein-ia2.log
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionIA3Test | tee /tmp/einstein-ia3.log
          grep -F 'IntentAcquisitionIA3Test PASS assertions=43' /tmp/einstein-ia3.log
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionCheckpointTest | tee /tmp/einstein-checkpoint.log
          grep -F 'IntentAcquisitionCheckpointTest PASS assertions=12' /tmp/einstein-checkpoint.log

      - name: Postflight zero-draw boundary
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' \
            'EINSTEIN_FRONTIER_BOUNDED_MEMORY_ZERO_DRAW=PASS' \
            "candidate=$CANDIDATE_SHA" \
            'lazyProjectionCanonicalEquivalence=PASS' \
            'constrainedHeap64MiBLogicalPayload=100663296' \
            'PssAha=PASS assertions=3511 Golden=PASS Result=PASS' \
            'IA1=PASS IA2=PASS IA3=PASS checkpoint=PASS' \
            'formalAcquisitionInvocation=0' \
            'artifactUpload=0' \
            'cacheUpload=0'
