name: ReceiptLedger V1 Receipt Product Semantics
on:
  push:
    branches: ['receiptledger/run-v1-receipt-product-semantics-20261016']
    paths:
      - '.github/workflows/receiptledger-v1-receipt-product-semantics.yml'
      - 'receiptledger/harness/android-v1/app/build.gradle'
      - 'receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/semantics/**'
      - 'receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/semantics/**'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'receiptledger-v1-receipt-product-semantics-${{ github.ref }}', cancel-in-progress: false }
jobs:
  validate-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Ensure Android API 36 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13', cache-disabled: true }
      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh
      - name: Enforce CP23 scope and frozen contracts
        run: |
          set -euo pipefail
          BASE=913150c7acb06cb80a18833a10680657213239ec
          APP=receiptledger/harness/android-v1/app
          git diff --name-only "$BASE" "$GITHUB_SHA" > receiptledger/cp23-changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/receiptledger-v1-receipt-product-semantics.yml) ;;
              receiptledger/CP23_*.md|receiptledger/RECEIPT_PRODUCT_SEMANTICS_*.md) ;;
              receiptledger/harness/android-v1/app/build.gradle) ;;
              receiptledger/harness/android-v1/app/src/main/java/com/receiptledger/v1/semantics/*) ;;
              receiptledger/harness/android-v1/app/src/test/java/com/receiptledger/v1/semantics/*) ;;
              '') ;;
              *) echo "CP23 scope violation: $f"; exit 31 ;;
            esac
          done < receiptledger/cp23-changed-files.txt
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/product" || { echo 'Product persistence/identity runtime changed'; exit 32; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/catalog" || { echo 'Frozen catalog domain changed'; exit 33; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/java/com/receiptledger/v1/persistence" || { echo 'Receipt persistence changed'; exit 34; }
          git diff --quiet "$BASE" "$GITHUB_SHA" -- "$APP/src/main/AndroidManifest.xml" || { echo 'Manifest changed'; exit 35; }
          grep -Fq 'VERSION = 2' "$APP/src/main/java/com/receiptledger/v1/product/ProductCatalogSchema.java"
          grep -Fq 'VERSION=1' "$APP/src/main/java/com/receiptledger/v1/persistence/ReceiptSchema.java"
          grep -Fq 'versionCode 22' "$APP/build.gradle"
          grep -Fq "versionName '1.0.21-receipt-product-semantics'" "$APP/build.gradle"
      - name: Test lint and build
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          else
            echo 'Expected lint report missing'
            status=41
          fi
          for TEST_XML in \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml \
            receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml; do
            if [ ! -f "$TEST_XML" ]; then
              echo "Expected test result missing: $TEST_XML"
              status=42
            fi
          done
          exit "$status"
      - name: Extract CP23 semantic metrics
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee receiptledger/cp23-semantics-metrics.txt
          import xml.etree.ElementTree as ET
          path = 'receiptledger/harness/android-v1/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml'
          root = ET.parse(path).getroot()
          text = '\n'.join((node.text or '') for node in root.iter('system-out'))
          lines = [line.strip() for line in text.splitlines() if line.strip().startswith('CP23_METRICS ')]
          if len(lines) != 1:
              raise SystemExit('Expected exactly one CP23_METRICS line, got %d' % len(lines))
          print(lines[0])
          PY
      - name: Package and verify evidence
        run: |
          set -euo pipefail
          BASE=913150c7acb06cb80a18833a10680657213239ec
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-receipt-product-semantics
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-receipt-product-semantics-debug.apk"
          cp receiptledger/cp23-semantics-metrics.txt "$OUT/CP23_SEMANTICS_METRICS.txt"
          cp "$SRC/app/build/reports/lint-results-debug.txt" "$OUT/lint-results-debug.txt"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.semantics.ReceiptProductSemanticParserTest.xml" "$OUT/RECEIPT_PRODUCT_SEMANTICS_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.catalog.CatalogDomainV2Test.xml" "$OUT/CATALOG_DOMAIN_V2_TEST.xml"
          cp "$SRC/app/build/test-results/testDebugUnitTest/TEST-com.receiptledger.v1.product.CatalogPersistenceContractV2Test.xml" "$OUT/PERSISTENCE_V2_TEST.xml"
          unzip -t "$OUT/receiptledger-v1-receipt-product-semantics-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then
              echo "Forbidden permission packaged: $forbidden"
              exit 51
            fi
          done
          git diff --name-status "$BASE" "$GITHUB_SHA" > "$OUT/CP23_DIFF.txt"
          sha256sum "$OUT/receiptledger-v1-receipt-product-semantics-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_RECEIPT_PRODUCT_SEMANTICS_01'
            echo "public_commit=${GITHUB_SHA}"
            echo "predecessor_handoff=${BASE}"
            echo 'product_schema=2_UNCHANGED'
            echo 'receipt_schema=1_UNCHANGED'
            echo 'identity_authority=NONE_IN_CP23'
            echo 'semantic_source=PARSED_FROM_RECEIPT_UNCONFIRMED'
            echo 'standalone_physical_measure=AMBIGUOUS_REVIEW_REQUIRED'
            echo 'price_truth=RECEIPT_DERIVED'
            echo 'agp=8.11.1'
            echo 'gradle=8.13'
            echo 'jdk=17'
            echo 'compile_sdk=36'
            echo 'target_sdk=36'
            echo 'min_sdk=23'
            echo 'version_name=1.0.21-receipt-product-semantics'
            echo 'version_code=22'
            echo 'network_permission=REMOVED'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt "$OUT"/CP23_SEMANTICS_METRICS.txt "$OUT"/RECEIPT_PRODUCT_SEMANTICS_TEST.xml "$OUT"/CP23_DIFF.txt > "$OUT/EVIDENCE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: 'receiptledger-v1-receipt-product-semantics-${{ github.run_id }}'
          path: 'receiptledger/output/v1-receipt-product-semantics/'
          if-no-files-found: error
          retention-days: 14
