name: Einstein Campaign Production 2000 Batch 0004-0006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-batch-0004-0006.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-batch-0004-0006:
    if: >-
      github.event.head_commit.message == 'production: run Einstein campaign compact batch 0004-0006'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNNER_SHA: e5291e551cf6c27e772180f2c0333b0c117b34c2
      EXPECTED_BANK_HEAD: e1fd92a1cf876160b9b182bac34b281e35d25d78
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact bounded batch runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: e5291e551cf6c27e772180f2c0333b0c117b34c2
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute bounded compact N5 batch
        shell: bash
        env:
          EINSTEIN_RUNNER_SHA: e5291e551cf6c27e772180f2c0333b0c117b34c2
          EINSTEIN_BANK_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
        run: |
          set -euo pipefail
          bash EinsteinGame/tools/campaign-production-2000/run_compact_n5_batch.sh 4 3 "$EXPECTED_BANK_HEAD"
