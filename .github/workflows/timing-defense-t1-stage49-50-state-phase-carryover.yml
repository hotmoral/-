name: Timing Defense T1 Stage49-50 State Phase Carryover

on:
  push:
    branches: [timing-defense-workspace]
    paths:
      - 'timing-defense-workspace/tools/probe_t1_stage49_50_state_phase_carryover_v0_1.py'
      - '.github/workflows/timing-defense-t1-stage49-50-state-phase-carryover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-phase-carryover:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: timing-defense-workspace
    env:
      T1_RECIPE: legacy-game-structure/data/t1_representative_transition_slice_recipes_v0_2_pressure_shape_candidate.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Record exact source identity
        run: |
          mkdir -p artifacts
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA" > artifacts/state-phase-carryover-source-identity.txt
          sha256sum \
            tools/probe_t1_stage49_50_state_phase_carryover_v0_1.py \
            tools/probe_t1_stage49_50_transition_aware_integration_v0_1.py \
            tools/probe_t1_stage49_50_transition_aware_integration_v0_2.py \
            tools/probe_t1_stage49_50_target_phase_clearance_v0_1.py \
            tools/probe_t1_archer_lv31_continuous_corridor_bridge_v0_1.py \
            tools/t1_transition_microsim_mage_lv31_fidelity_bridge_v0_1.py \
            "$T1_RECIPE" \
            >> artifacts/state-phase-carryover-source-identity.txt
          cat artifacts/state-phase-carryover-source-identity.txt
      - run: python -m py_compile tools/probe_t1_stage49_50_state_phase_carryover_v0_1.py
      - name: Execute carryover trace
        run: |
          PYTHONPATH=tools python tools/probe_t1_stage49_50_state_phase_carryover_v0_1.py \
            --recipes "$T1_RECIPE" --seeds 101,211,307,409,503 \
            --json-out artifacts/t1-stage49-50-state-phase-carryover-v0_1.json
      - name: Fidelity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/t1-stage49-50-state-phase-carryover-v0_1.json').read_text())
          assert not d['fidelityErrors'], d['fidelityErrors']
          assert set(d['versions'])=={'V01','V02'}
          print('STATE_PHASE_CARRYOVER_FIDELITY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-defense-t1-stage49-50-state-phase-carryover
          path: |
            timing-defense-workspace/artifacts/t1-stage49-50-state-phase-carryover-v0_1.json
            timing-defense-workspace/artifacts/state-phase-carryover-source-identity.txt
          if-no-files-found: error
