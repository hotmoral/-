name: ReceiptLedger V1 Build Hygiene Core
on:
  push:
    branches: ['receiptledger/run-v1-build-hygiene-core-20261015']
    paths: ['receiptledger/**', '.github/workflows/receiptledger-v1-build-hygiene-core.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'receiptledger-v1-build-hygiene-${{ github.ref }}', cancel-in-progress: false }
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9', cache-disabled: true }
      - name: Audit public namespace
        run: bash receiptledger/tools/audit_public_tree.sh
      - name: Enforce formatting and version contracts
        run: |
          set -euo pipefail
          grep -Fq 'confidence %1$.2f · %2$d×%3$d · EXIF %4$d' receiptledger/harness/android-v1/app/src/main/res/values/strings.xml
          grep -q "versionCode 18" receiptledger/harness/android-v1/app/build.gradle
          grep -q "1.0.17-build-hygiene-core" receiptledger/harness/android-v1/app/build.gradle
      - name: Test lint and build
        run: |
          set +e
          gradle --no-daemon -p receiptledger/harness/android-v1 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          status=$?
          REPORT=receiptledger/harness/android-v1/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo '===== COMPLETE ANDROID LINT REPORT ====='
            cat "$REPORT"
            echo '===== END ANDROID LINT REPORT ====='
          fi
          exit "$status"
      - name: Package evidence
        run: |
          set -euo pipefail
          SRC=receiptledger/harness/android-v1
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          OUT=receiptledger/output/v1-build-hygiene-core
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$APK" "$OUT/receiptledger-v1-build-hygiene-core-debug.apk"
          unzip -t "$OUT/receiptledger-v1-build-hygiene-core-debug.apk" > "$OUT/APK_ZIP_INTEGRITY.txt"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK_PERMISSIONS.txt"
          for forbidden in CAMERA READ_MEDIA_IMAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" "$OUT/APK_PERMISSIONS.txt"; then exit 31; fi
          done
          for candidate in "$SRC/app/build/reports/lint-results-debug.txt" "$SRC/app/build/reports/lint-results-debug.xml" "$SRC/app/build/reports/lint-results-debug.html"; do
            if [ -f "$candidate" ]; then cp "$candidate" "$OUT/"; fi
          done
          test -f "$OUT/lint-results-debug.txt" || test -f "$OUT/lint-results-debug.xml" || test -f "$OUT/lint-results-debug.html"
          sha256sum "$OUT/receiptledger-v1-build-hygiene-core-debug.apk" > "$OUT/APK_SHA256.txt"
          {
            echo 'checkpoint=RL_V1_BUILD_HYGIENE_CORE_01'
            echo "public_commit=${GITHUB_SHA}"
            echo 'version_name=1.0.17-build-hygiene-core'
            echo 'version_code=18'
            echo 'unit_tests=REQUIRED'
            echo 'lint_debug=REQUIRED'
            echo 'android_format_placeholders=POSITIONAL'
            echo 'network_permission=REMOVED'
            echo 'signing=debug_only'
          } > "$OUT/BUILD_IDENTITY.txt"
          (cd "$SRC" && find . -type f -not -path './app/build/*' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SOURCE_SHA256.txt"
          sha256sum "$OUT"/APK_SHA256.txt "$OUT"/BUILD_IDENTITY.txt "$OUT"/SOURCE_SHA256.txt "$OUT"/APK_PERMISSIONS.txt > "$OUT/EVIDENCE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: 'receiptledger-v1-build-hygiene-core-${{ github.run_id }}'
          path: 'receiptledger/output/v1-build-hygiene-core/'
          if-no-files-found: error
          retention-days: 14
