name: Einstein Campaign Production 2000 Batch 0121-0123 Phase2 V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-batch-0121-0123-phase2-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-batch-0121-0123:
    if: >-
      github.event.head_commit.message == 'production: run Phase 2 batch 0121-0123 commit-head'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNNER_SHA: 2c1d21ef4f6e22e5d2e5b24146dba98075b32a46
      EXPECTED_BANK_HEAD: f58b303283c3cd7696489b50d2964e01746ac0ab
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact Phase 2 bounded runner
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 2c1d21ef4f6e22e5d2e5b24146dba98075b32a46
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute bounded Phase 2 batch 121-123
        shell: bash
        env:
          EINSTEIN_RUNNER_SHA: 2c1d21ef4f6e22e5d2e5b24146dba98075b32a46
          EINSTEIN_BANK_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
        run: |
          set -euo pipefail
          bash EinsteinGame/tools/campaign-production-2000/run_compact_phase2_batch.sh 121 3 "$EXPECTED_BANK_HEAD"
