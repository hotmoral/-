name: Clumi Stage 1 Tutorial Step 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-clumi-stage1-tutorial-step2.yml'

permissions:
  contents: read

concurrency:
  group: clumi-ui-tutorial-edit
  cancel-in-progress: false

jobs:
  apply-stage1-column-rule:
    if: >-
      github.event.head_commit.message == 'ui: Clumi Stage 1 tutorial column rule step'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 8aa57b768b96640b7a53e4f08ed25fed3f0d3a2d
      SOURCE_BRANCH: clumi-ui-presentation-polish-v1
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"

      - name: Checkout exact private UI branch
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: clumi-ui-presentation-polish-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source branch --show-current)" = "$SOURCE_BRANCH"

      - name: Apply Stage 1 column tutorial only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          game = Path('source/app/src/main/java/com/example/einsteingame/GameView.java')
          text = game.read_text()

          old = '''    private final RectF[] clueButtons = {new RectF(), new RectF(), new RectF(), new RectF()};

    private float headerBottom, boardHeaderHeight, cellWidth, cellHeight, boardPadding, boardContentWidth;
'''
          new = '''    private final RectF[] clueButtons = {new RectF(), new RectF(), new RectF(), new RectF()};
    private ClumiSpotlightPolicy tutorialPolicy;
    private boolean tutorialCueShowing,tutorialTapConsumed;

    private float headerBottom, boardHeaderHeight, cellWidth, cellHeight, boardPadding, boardContentWidth;
'''
          assert text.count(old) == 1, 'tutorial field anchor mismatch'
          text = text.replace(old, new, 1)

          old = '''    void spotlight(ClumiSpotlightPolicy policy){
    if(policy==null||session==null||session.stage.number!=1||state.currentClue!=0)return;
    policy.showTutorial(this,clueBody,"stage1.clue1","× = 서로 다른 번호예요");
}
'''
          new = '''    void spotlight(ClumiSpotlightPolicy policy){
        tutorialPolicy=policy;tutorialCueShowing=false;
        if(policy==null||session==null||session.stage.number!=1||state.currentClue!=0)return;
        if(policy.showTutorial(this,clueBody,"stage1.clue1","× = 서로 다른 번호예요")){tutorialCueShowing=true;return;}
        int col=state.selectedColumn;
        RectF column=new RectF(board.left+boardPadding+panX+col*cellWidth*scale,
                board.top+boardPadding+panY,
                board.left+boardPadding+panX+(col+1)*cellWidth*scale,
                board.top+boardPadding+panY+(boardHeaderHeight+GameState.SIZE*cellHeight)*scale);
        if(policy.showTutorial(this,column,"stage1.column","위 숫자와 같은 세로칸은 같은 번호예요"))tutorialCueShowing=true;
    }
'''
          assert text.count(old) == 1, 'spotlight block mismatch'
          text = text.replace(old, new, 1)

          old = '''    @Override public boolean onTouchEvent(MotionEvent event) {
        float x = event.getX(), y = event.getY();
        switch (event.getActionMasked()) {
'''
          new = '''    @Override public boolean onTouchEvent(MotionEvent event) {
        float x = event.getX(), y = event.getY();int action=event.getActionMasked();
        if(tutorialTapConsumed){if(action==MotionEvent.ACTION_UP||action==MotionEvent.ACTION_CANCEL)tutorialTapConsumed=false;return true;}
        if(action==MotionEvent.ACTION_DOWN&&tutorialCueShowing){
            tutorialCueShowing=false;tutorialTapConsumed=true;downArea=Area.NONE;
            if(feel!=null)feel.beginInput();post(()->spotlight(tutorialPolicy));return true;
        }
        switch (action) {
'''
          assert text.count(old) == 1, 'touch gate anchor mismatch'
          text = text.replace(old, new, 1)
          game.write_text(text)
          PY
          git -C source diff --check
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          grep -F 'stage1.column' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F '위 숫자와 같은 세로칸은 같은 번호예요' source/app/src/main/java/com/example/einsteingame/GameView.java
          grep -F 'tutorialTapConsumed' source/app/src/main/java/com/example/einsteingame/GameView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile debug Java
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:compileDebugJavaWithJavac

      - name: Commit and push exact tutorial step
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C source status --porcelain | wc -l)" -eq 1
          git -C source config user.name 'hotmoral'
          git -C source config user.email 'sktjsek@gmail.com'
          git -C source add app/src/main/java/com/example/einsteingame/GameView.java
          git -C source commit -m 'ui: add Stage 1 column tutorial rule'
          git -C source push origin "HEAD:$SOURCE_BRANCH"
          echo "PRIVATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "private_source_sha=$PRIVATE_SOURCE_SHA"
