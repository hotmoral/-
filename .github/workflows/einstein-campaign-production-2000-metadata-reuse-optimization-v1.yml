name: Einstein Campaign 2000 Metadata Reuse Optimization V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-metadata-reuse-optimization-v1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  fixed-bank-ab:
    if: >-
      github.event.head_commit.message == 'diagnostic: benchmark Einstein metadata CP9 reuse v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPT_SHA: 2bd214477eb6fed513eafe18c2c6da5679d67087
      BANK_SHA: bbb2f5043b7eda70daaa2328b301a8f3d51c37ec
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}

    steps:
      - name: Require private repository read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact private optimization source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 2bd214477eb6fed513eafe18c2c6da5679d67087
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact immutable production Bank snapshot
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: bbb2f5043b7eda70daaa2328b301a8f3d51c37ec
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run fixed Bank stage 0004-0006 metadata reuse A-B benchmark
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C EinsteinGame rev-parse HEAD)" = "$OPT_SHA"
          test "$(git -C ProductionStore rev-parse HEAD)" = "$BANK_SHA"
          bash EinsteinGame/tools/campaign-production-2000/run_n5_metadata_reuse_optimization_v1.sh
