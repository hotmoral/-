name: Einstein Durability Zero-Draw Validation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_EINSTEIN_DURABILITY_ZERO_DRAW_V1 exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: einstein-durability-zero-draw-v1
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm == 'RUN_EINSTEIN_DURABILITY_ZERO_DRAW_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: hotmoral/EinsteinGame
      CANDIDATE_SHA: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
      ACCEPTED_BASE_SHA: 08270c5e9875cb5fa765102cfd0f5da477d4f34e
      PRIVATE_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
    steps:
      - name: Require private read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN" || {
            echo 'EINSTEINGAME_READ_TOKEN is not configured; refusing validation.' >&2
            exit 2
          }

      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ee82e3748b28e0a4389e5221ff66aafe47fa22e6
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 3
          persist-credentials: false

      - name: Hard-gate source identity and reviewed delta
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$ACCEPTED_BASE_SHA^{commit}"
          test "$(git merge-base "$ACCEPTED_BASE_SHA" HEAD)" = "$ACCEPTED_BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD | sort)
          expected=(
            'puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionContinuationCoordinator.java'
            'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionCheckpointTest.java'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(grep -F 'public static final String VERSION="1.1.0";' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionContinuationCoordinator.java | wc -l)" -eq 1
          test "$(grep -F 'CompletedAttemptSink' puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/acquisition/IntentAcquisitionContinuationCoordinator.java | wc -l)" -ge 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile puzzle-authoring tests
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :puzzle-authoring:testClasses

      - name: Run IA-1 contract regression
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :puzzle-authoring:verifyIntentAcquisitionIA1 | tee /tmp/einstein-ia1.log
          grep -F 'IntentAcquisitionTest PASS assertions=22' /tmp/einstein-ia1.log

      - name: Run IA-2 contract regression
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :puzzle-authoring:verifyIntentAcquisitionIA2 | tee /tmp/einstein-ia2.log
          grep -F 'IntentAcquisitionIA2Test PASS assertions=33' /tmp/einstein-ia2.log

      - name: Run IA-3 contract and Golden regression
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :puzzle-authoring:verifyIntentAcquisitionIA3 | tee /tmp/einstein-ia3.log
          grep -F 'IntentAcquisitionIA3Test PASS assertions=43' /tmp/einstein-ia3.log

      - name: Run completed-attempt checkpoint regression
        shell: bash
        working-directory: EinsteinGame/puzzle-authoring
        run: |
          set -euo pipefail
          java -cp 'build/classes/java/test:build/classes/java/main:../puzzle-core/build/classes/java/main' \
            com.example.einsteingame.authoring.pss.acquisition.IntentAcquisitionCheckpointTest \
            | tee /tmp/einstein-checkpoint.log
          grep -F 'IntentAcquisitionCheckpointTest PASS assertions=12' /tmp/einstein-checkpoint.log

      - name: Postflight clean-tree and zero-draw boundary
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD | sort)
          test "${#changed[@]}" -eq 2
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git diff --name-only -- puzzle-authoring/build.gradle)"
          test -z "$(git diff --name-only -- puzzle-authoring/src/main/java/com/example/einsteingame/authoring/pss/aha/StructuralAhaAnalyzer.java)"
          printf '%s\n' \
            'EINSTEIN_DURABILITY_ZERO_DRAW_VALIDATION=PASS' \
            "candidate=$CANDIDATE_SHA" \
            "acceptedBase=$ACCEPTED_BASE_SHA" \
            'compile=PASS' \
            'IA1=PASS assertions=22' \
            'IA2=PASS assertions=33' \
            'IA3=PASS assertions=43' \
            'checkpoint=PASS assertions=12' \
            'formalDrawInvocation=0' \
            'artifactUpload=0' \
            'cacheUpload=0'
