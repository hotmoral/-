name: Clumi Fixed Viewport Compile V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clumi-fixed-viewport-compile-v2.yml'

permissions:
  contents: read

jobs:
  compile-fixed-viewport:
    if: >-
      github.event.head_commit.message == 'verify: Clumi fixed viewport compile v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: clumi-fixed-viewport-v1
      SOURCE_SHA: 97c73563a1bed2502aac027d746e669ac4566027

    steps:
      - name: Checkout exact private fixed viewport source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact private source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 34 build tools
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      - name: Compile without permanent signing material
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u GITHUB_ACTIONS -u CI \
            -u CI_TEST_KEYSTORE_PATH -u CI_TEST_KEYSTORE_PASSWORD \
            -u CI_TEST_KEY_ALIAS -u CI_TEST_KEY_PASSWORD \
            -u CLUMI_RELEASE_KEYSTORE_PATH -u CLUMI_RELEASE_KEYSTORE_PASSWORD \
            -u CLUMI_RELEASE_KEY_ALIAS -u CLUMI_RELEASE_KEY_PASSWORD \
            ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug | tee ../compile-v2.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -F '> Task :app:compileDebugJavaWithJavac' ../compile-v2.log
          grep -F 'BUILD SUCCESSFUL' ../compile-v2.log

      - name: Require source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"
