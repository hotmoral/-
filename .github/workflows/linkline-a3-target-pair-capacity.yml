name: Linkline A3 Target-Pair Capacity Summary

on:
  push:
    branches:
      - linkline/a3-target-pair-diversity-v1
    paths:
      - linkline/tools/a3_target_pair_capacity_public.py
      - .github/workflows/linkline-a3-target-pair-capacity.yml

permissions:
  contents: write

concurrency:
  group: linkline-a3-target-pair-capacity
  cancel-in-progress: true

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact public commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify acquisition source closure
        shell: bash
        working-directory: repo/linkline
        run: |
          set -euo pipefail
          python -m py_compile tools/a3_target_pair_capacity_public.py
          test -s public_output/a3_target_pair_acquisition_v1/candidate_pool.json

      - name: Compute aggregate exact-pair capacity
        shell: bash
        working-directory: repo/linkline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "1"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          python tools/a3_target_pair_capacity_public.py
          test -s public_output/a3_target_pair_acquisition_v1/pair_capacity_summary.json
          cat public_output/a3_target_pair_acquisition_v1/pair_capacity_summary.json

      - name: Commit aggregate public-safe summary
        shell: bash
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkline/public_output/a3_target_pair_acquisition_v1/pair_capacity_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Linkline A3: materialize aggregate target-pair capacity"
          git push origin HEAD:linkline/a3-target-pair-diversity-v1
