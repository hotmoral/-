name: Einstein Campaign Production 2000 Stage 0001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/einstein-campaign-production-2000-stage1.yml'

permissions:
  contents: read

concurrency:
  group: einstein-campaign-production-2000
  cancel-in-progress: false

jobs:
  produce-stage-0001:
    if: >-
      github.event.head_commit.message == 'production: retry Einstein campaign stage 0001 after cli guard correction'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNNER_SHA: 67888e38ccbb175120d4f3c8ff0e6a6227a51ee2
      ACCEPTED_SOURCE_SHA: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
      PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
      BANK_BRANCH: campaign-production-2000-bank-v1
      EXPECTED_BANK_HEAD: d4bb694021533fbf0266c2e41fea014d547579aa
      BANK_REMOTE_ROOT: production/campaign-2000-bank-v1
      EVIDENCE_STAGE_ROOT: production/campaign-2000-bank-v1/evidence/stage-0001
      AUTH_TOKEN: START_2000_MAINLINE_PRODUCTION_V1
      CLASSES_DIR: /tmp/einstein-campaign-production-classes
      SOURCES_FILE: /tmp/einstein-campaign-production-sources.txt
      BANK_DIR: /tmp/einstein-campaign-production-bank
      EVIDENCE_DIR: /tmp/einstein-campaign-production-evidence
      READ_TOKEN: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}

    steps:
      - name: Require private repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact production adapter source
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: 67888e38ccbb175120d4f3c8ff0e6a6227a51ee2
          token: ${{ secrets.EINSTEINGAME_READ_TOKEN }}
          path: EinsteinGame
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout durable private production bank
        uses: actions/checkout@v4
        with:
          repository: hotmoral/EinsteinGame
          ref: campaign-production-2000-bank-v1
          token: ${{ secrets.EINSTEINGAME_EVIDENCE_WRITE_TOKEN }}
          path: ProductionStore
          fetch-depth: 0
          persist-credentials: true

      - name: Zero-cost source and bank guards
        shell: bash
        run: |
          set -euo pipefail
          cd EinsteinGame
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          test "$(git merge-base "$ACCEPTED_SOURCE_SHA" HEAD)" = "$ACCEPTED_SOURCE_SHA"
          test -z "$(git diff --name-only "$ACCEPTED_SOURCE_SHA" HEAD -- puzzle-core/src/main/java puzzle-authoring/src/main/java app/src/main/assets/puzzles)"
          grep -F "AUTH_TOKEN='START_2000_MAINLINE_PRODUCTION_V1'" tools/campaign-production-2000/campaign_production_2000.py
          grep -F 'EXPECTED_SOURCE="cdb66a3e0509bfec050a907bb43efb4e01b4ffeb"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Stage1ProducerV1.java
          grep -F 'EXPECTED_PLAN_HASH="a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5"' puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Stage1ProducerV1.java
          cd ../ProductionStore
          test "$(git rev-parse --abbrev-ref HEAD)" = "$BANK_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BANK_HEAD"
          test "$(git ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$EXPECTED_BANK_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e "$BANK_REMOTE_ROOT/bank/stages/stage-0001.json"
          test ! -e "$EVIDENCE_STAGE_ROOT/attempt-draw0.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile accepted engine plus thin production adapter
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$CLASSES_DIR" "$SOURCES_FILE"
          mkdir -p "$CLASSES_DIR"
          find puzzle-core/src/main/java puzzle-authoring/src/main/java -type f -name '*.java' -print | sort > "$SOURCES_FILE"
          echo 'puzzle-authoring/src/test/java/com/example/einsteingame/authoring/pss/acquisition/CampaignProduction2000Stage1ProducerV1.java' >> "$SOURCES_FILE"
          java -Xmx2g -m jdk.compiler/com.sun.tools.javac.Main -encoding UTF-8 --release 8 -d "$CLASSES_DIR" "@$SOURCES_FILE"

      - name: Restore durable bank and materialize stage request
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          rm -rf "$BANK_DIR" "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          cp -a "$GITHUB_WORKSPACE/ProductionStore/$BANK_REMOTE_ROOT/bank" "$BANK_DIR"
          export BANK_DIR
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p=Path('tools/campaign-production-2000/campaign_production_2000.py')
          spec=importlib.util.spec_from_file_location('prod2000',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          req=m.stage_plan(1)
          m.write_json_atomic(Path('/tmp/einstein-stage-0001-request.json'),req)
          status=m.status(Path(os.environ['BANK_DIR']))
          assert status['bankedCount']==0 and status['nextOrdinal']==1, status
          assert req['stageId']=='stage-0001' and req['seed']==4677536571236490358, req
          print('STAGE_0001_REQUEST_PREFLIGHT=PASS')
          print('planHash='+m.materialize_plan()['planHash'])
          PY

      - name: Zero-draw production adapter preflight
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_PRODUCTION_SOURCE_HEAD: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
          EINSTEIN_PRODUCTION_PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
          EINSTEIN_STAGE_REQUEST: /tmp/einstein-stage-0001-request.json
          EINSTEIN_PRODUCTION_REMOTE_EVIDENCE_STAGE_DIR: ${{ github.workspace }}/ProductionStore/production/campaign-2000-bank-v1/evidence/stage-0001
        run: |
          set -euo pipefail
          java -Xmx2g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Stage1ProducerV1 preflight

      - name: Execute authorized stage-0001 production with synchronous private seals
        shell: bash
        working-directory: EinsteinGame
        env:
          EINSTEIN_CAMPAIGN_PRODUCTION_AUTHORIZATION: START_2000_MAINLINE_PRODUCTION_V1
          EINSTEIN_PRODUCTION_PRODUCER_AUTHORIZATION: START_2000_MAINLINE_PRODUCTION_V1
          EINSTEIN_PRODUCTION_SOURCE_HEAD: cdb66a3e0509bfec050a907bb43efb4e01b4ffeb
          EINSTEIN_PRODUCTION_PLAN_HASH: a403a59aa537052f8a65d8ac335a7c0676d283f8a88f7425b6927143f21ffde5
          EINSTEIN_PRODUCTION_EVIDENCE_DIR: /tmp/einstein-campaign-production-evidence
          EINSTEIN_PRODUCTION_EVIDENCE_BRANCH: campaign-production-2000-bank-v1
          EINSTEIN_PRODUCTION_REMOTE_EVIDENCE_ROOT: production/campaign-2000-bank-v1/evidence/stage-0001
          EINSTEIN_PRODUCTION_REMOTE_EVIDENCE_STAGE_DIR: ${{ github.workspace }}/ProductionStore/production/campaign-2000-bank-v1/evidence/stage-0001
        run: |
          set -euo pipefail
          export STORE="$GITHUB_WORKSPACE/ProductionStore"
          git -C "$STORE" config user.name 'Einstein Campaign Production'
          git -C "$STORE" config user.email 'noreply@localhost'

          (
            set -euo pipefail
            while true; do
              handled=0
              for READY in "$EVIDENCE_DIR"/*.ready.json; do
                [ -e "$READY" ] || continue
                NAME="$(basename "$READY" .ready.json)"
                ACK="$EVIDENCE_DIR/$NAME.remote-ack.json"
                [ -e "$ACK" ] && continue
                handled=1
                export READY NAME ACK STORE
                python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['READY']).read_text())
          assert r['recordType']=='CampaignProduction2000RemoteSealRequestV1'
          assert r['stageId']=='stage-0001'
          assert r['formalProduction'] is True
          assert r['evidenceBranch']==os.environ['BANK_BRANCH']
          assert r['remoteRoot']==os.environ['EVIDENCE_STAGE_ROOT']
          assert r['remotePath']==os.environ['EVIDENCE_STAGE_ROOT']+'/'+os.environ['NAME']
          assert len(r['sha256'])==64
          PY
                SHA="$(python3 -c 'import json,os;print(json.load(open(os.environ["READY"]))["sha256"])')"
                SOURCE="$EVIDENCE_DIR/$NAME"
                test -f "$SOURCE"
                test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$SHA"
                TARGET="$STORE/$EVIDENCE_STAGE_ROOT/$NAME"
                mkdir -p "$(dirname "$TARGET")"
                if [ -e "$TARGET" ]; then
                  cmp "$SOURCE" "$TARGET"
                  COMMIT="$(git -C "$STORE" log -1 --format=%H -- "$EVIDENCE_STAGE_ROOT/$NAME")"
                  test -n "$COMMIT"
                else
                  REMOTE_BEFORE="$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)"
                  test "$REMOTE_BEFORE" = "$(git -C "$STORE" rev-parse HEAD)"
                  cp "$SOURCE" "$TARGET"
                  git -C "$STORE" add -- "$EVIDENCE_STAGE_ROOT/$NAME"
                  git -C "$STORE" commit -m "evidence: production stage-0001 $NAME"
                  COMMIT="$(git -C "$STORE" rev-parse HEAD)"
                  git -C "$STORE" push origin "HEAD:refs/heads/$BANK_BRANCH"
                  test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$COMMIT"
                fi
                export SHA COMMIT
                python3 - <<'PY'
          import json, os
          from pathlib import Path
          ack={
            'status':'REMOTE_SEAL_PASS',
            'sha256':os.environ['SHA'],
            'evidenceBranch':os.environ['BANK_BRANCH'],
            'remoteRoot':os.environ['EVIDENCE_STAGE_ROOT'],
            'remotePath':os.environ['EVIDENCE_STAGE_ROOT']+'/'+os.environ['NAME'],
            'remoteCommitSha':os.environ['COMMIT']
          }
          with Path(os.environ['ACK']).open('x') as f:
            json.dump(ack,f,separators=(',',':'),sort_keys=True);f.write('\n')
          PY
              done
              [ "$handled" -eq 0 ] && sleep 0.1
            done
          ) &
          SIDECAR_PID=$!

          set +e
          python3 tools/campaign-production-2000/campaign_production_2000.py run --execute --max-stages 1 "$BANK_DIR" -- \
            java -Xmx8g -cp "$CLASSES_DIR" com.example.einsteingame.authoring.pss.acquisition.CampaignProduction2000Stage1ProducerV1 \
            | tee /tmp/einstein-campaign-production-stage1.log
          PROD_STATUS=${PIPESTATUS[0]}
          set -e
          kill "$SIDECAR_PID" 2>/dev/null || true
          wait "$SIDECAR_PID" 2>/dev/null || true
          exit "$PROD_STATUS"

      - name: Persist durable bank state
        shell: bash
        run: |
          set -euo pipefail
          STORE="$GITHUB_WORKSPACE/ProductionStore"
          TARGET="$STORE/$BANK_REMOTE_ROOT/bank"
          rm -rf "$TARGET"
          mkdir -p "$(dirname "$TARGET")"
          cp -a "$BANK_DIR" "$TARGET"
          git -C "$STORE" add -- "$BANK_REMOTE_ROOT/bank"
          if ! git -C "$STORE" diff --cached --quiet; then
            git -C "$STORE" commit -m 'production: persist stage-0001 bank state'
            COMMIT="$(git -C "$STORE" rev-parse HEAD)"
            git -C "$STORE" push origin "HEAD:refs/heads/$BANK_BRANCH"
            test "$(git -C "$STORE" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$COMMIT"
          fi

      - name: Stage-0001 terminal acceptance
        shell: bash
        working-directory: EinsteinGame
        run: |
          set -euo pipefail
          python3 tools/campaign-production-2000/campaign_production_2000.py status "$BANK_DIR" | tee /tmp/einstein-campaign-stage1-status.json
          export BANK_DIR
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BANK_DIR'])
          manifest=json.loads((root/'manifest.json').read_text())
          stage=json.loads((root/'stages/stage-0001.json').read_text())
          assert manifest['bankedCount']==1, manifest
          assert manifest['publishedCount']==0, manifest
          assert manifest['nextOrdinal']==2, manifest
          assert stage['stageId']=='stage-0001' and stage['ordinal']==1 and stage['state']=='BANKED', stage
          assert stage['runtimeEntry']['publishedPuzzleId']=='PZ_CAMPAIGN_000001', stage
          assert len(stage['contentFingerprint'])==64
          print('EINSTEIN_CAMPAIGN_PRODUCTION_STAGE_0001_TERMINAL=PASS')
          print('bankedCount=1')
          print('publishedCount=0')
          print('nextOrdinal=2')
          print('contentFingerprint='+stage['contentFingerprint'])
          PY
          test -z "$(git -C "$GITHUB_WORKSPACE/ProductionStore" status --porcelain --untracked-files=all)"
          test "$(git -C "$GITHUB_WORKSPACE/ProductionStore" ls-remote origin "refs/heads/$BANK_BRANCH" | cut -f1)" = "$(git -C "$GITHUB_WORKSPACE/ProductionStore" rev-parse HEAD)"
