plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linkline.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.linkline.game.qa2'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-qa2'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
