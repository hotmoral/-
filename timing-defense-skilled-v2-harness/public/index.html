<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6f5f0"><title>Linkline — Mobile Validation</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171716;background:#ecebe6;--ink:#171716;--muted:#6c6a62;--line:#dddcd5;--paper:#fbfaf6;--cell:#f3f2ed;--chain:#cfcfc8;--danger:#8a3131}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#ecebe6}body{min-height:100dvh}.shell{width:min(100%,540px);min-height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fbfaf6f2;backdrop-filter:blur(12px);z-index:4}.brand{font-weight:850;letter-spacing:.14em;font-size:15px}.mode{font-size:11px;padding:6px 9px;border:1px solid #cfcec6;border-radius:999px;color:#5e5c55;background:#fff}.screen{flex:1;padding:22px 18px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:17px}.panel{margin:auto 0;padding:23px;border:1px solid var(--line);background:#fff;border-radius:20px;box-shadow:0 10px 35px #00000009}.panel h1,.panel h2{margin:0 0 12px}.panel p{line-height:1.65;color:#525149}.notice{padding:12px 14px;border-radius:12px;background:#f0efe9;color:#545249;font-size:13px;line-height:1.55}.primary,.secondary,.danger,.rate{min-height:50px;border-radius:13px;padding:0 16px;font-size:16px;font-weight:750;touch-action:manipulation}.primary{border:0;background:#1e1e1b;color:#fff}.secondary{border:1px solid #cfcec7;background:#fff}.danger{border:1px solid #d9b7b7;background:#fff;color:var(--danger)}.stack,.rating{display:grid;gap:10px;margin-top:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress,.label{text-align:center;font-weight:750;color:#68665e}.label{min-height:48px;line-height:1.5}.board-wrap{position:relative;width:min(88vw,450px);aspect-ratio:1;margin:3px auto 6px}.board{position:absolute;inset:0;display:grid;gap:6px;z-index:2}.cell{position:relative;border:1px solid #d4d3cc;border-radius:13px;background:var(--cell);min-width:0;padding:0;touch-action:manipulation}.cell.chain{background:var(--chain);border-color:#b8b7b0}.cell.endpoint{box-shadow:inset 0 0 0 3px #696861}.cell.selected{box-shadow:inset 0 0 0 4px #111}.cell.legal{background:#fff;border:3px solid #161613}.cell.guide{outline:4px solid #2e674c52;outline-offset:-5px}.cell.target:after{content:"";position:absolute;width:16px;height:16px;border:3px solid #151512;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}.cell.chain.target:after{background:#fff}.links{position:absolute;inset:0;pointer-events:none;z-index:1}.links line{stroke:#77766f;stroke-width:7;stroke-linecap:round}.status{text-align:center;min-height:27px;font-weight:750;color:#3f3e39}.operator{margin-top:17px;padding-top:16px;border-top:1px dashed #d5d4cc}.operator select{width:100%;min-height:46px;border:1px solid #cfcec7;border-radius:11px;background:#fff;padding:0 12px;font-size:16px}.rate{border:1px solid #d2d1ca;background:#fff;text-align:left}.rate span{display:inline-block;width:24px;color:#77756d}@media(max-width:390px){.screen{padding-left:13px;padding-right:13px}.board-wrap{width:92vw}.actions{grid-template-columns:1fr}.panel{padding:19px}}</style></head><body><main class="shell"><header class="top"><span class="brand">LINKLINE</span><span class="mode">기술 검증 전용</span></header><section id="screen" class="screen"></section></main><script>
const HUMAN_COLLECTION_ENABLED=false,RUNTIME_MODE='PRE_HUMAN_VALIDATION',ELIGIBILITY='TECHNICAL_VALIDATION_ONLY';
const P=[
[[1,5,6,7,11],[1,6],4],[[9,5,6,2,3,7,11,15,14,13],[1,5],8],[[4,0,1,2,6,10,9,8],[1,10],7],[[3,2,1,0,4,5,9,13,14,15],[0,11],5],[[2,3,7,6,5,4,8],[0,2],2],[[1,5,6,7,11,10,14,13,12,8],[0,6],2],[[0,4,5,6,2],[1,6],1],[[8,9,5,6,10,11,15,14,13,12],[1,5],12],[[8,9,13,14,15,11,7,6,10],[1,9],3],[[11,7,3,2,6,5,4,8,12],[1,9],4],[[6,7,3,2,1,5,9,13],[0,11],4],[[0,4,8,9,5,6,10,14,15,11],[0,6],5],[[3,2,1,0,4,8,9,13,14,10],[1,7],2],[[1,2,6,5,9,8],[1,2],7],[[2,6,10,14,15,11,7,3],[0,11],2],[[4,0,1,2,6,10,14],[1,6],4],[[7,3,2,1,5,6,10,9,13,14],[0,1],5],[[12,8,4,0,1,5,9,10,11,15],[1,7],5],[[4,8,9,5,1,2,6,7,11,10],[0,12],5],[[3,7,6,5,4,8,9,10],[1,13],4],[[3,2,6,10,14,13,12,8],[0,11],4],[[0,4,5,1,2,3,7,11,10],[0,13],4],[[5,4,0,1,2,3,7],[0,13],4],[[10,9,8,12,13,14],[0,1],7]];
const FORMS={F1:[23,3,20,12,8,4,11,16,15,13,19,0],F2:[12,10,6,14,11,16,13,4,17,18,1,20],F3:[2,9,5,22,7,21,17,14,6,1,10,18],F4:[8,15,23,0,3,7,5,21,2,19,22,9]};
const W=[{n:3,p:[0,1,2],t:[1,3],label:'연습 1/3 — 왼쪽 끝을 눌러 표시되는 목표 칸으로 움직여 보세요.',g:[0,3]},{n:3,p:[0,1,2],t:[1,5],label:'연습 2/3 — 이번에는 반대쪽 끝을 눌러 표시되는 목표 칸으로 움직여 보세요.',g:[2,5]},{n:3,p:[0,1,2],t:[0,6],label:'연습 3/3 — 이번에는 안내 없이 두 끝을 목표 칸에 놓아 보세요.'}];
const screen=document.querySelector('#screen');let form=null,rows=[],wi=0,wfail=0,passed=false,ci=0,cur=null,path=[],sel=null,attempts=[],sessionId='';
function E(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}function B(x,c='primary'){const b=E('button',c,x);b.type='button';return b}function clear(){screen.replaceChildren()}function panel(t,b){clear();const p=E('div','panel');p.append(E('h1','',t));if(b)p.append(E('p','',b));screen.append(p);return p}
function neigh(n,c){const r=Math.floor(c/n),q=c%n,a=[];if(r>0)a.push(c-n);if(r+1<n)a.push(c+n);if(q>0)a.push(c-1);if(q+1<n)a.push(c+1);return a}function canon(p){const r=[...p].reverse();for(let i=0;i<p.length;i++){if(p[i]<r[i])return [...p];if(p[i]>r[i])return r}return [...p]}function legal(n,p,i){if(i!==0&&i!==p.length-1)return[];const o=new Set(p);return neigh(n,p[i]).filter(x=>!o.has(x))}function move(n,p,i,d){if(!legal(n,p,i).includes(d))return p;if(i===0)return canon([d,...p.slice(0,-1)]);return canon([...p.slice(1),d])}function solved(p,t){const a=[p[0],p[p.length-1]].sort((x,y)=>x-y),b=[...t].sort((x,y)=>x-y);return a[0]===b[0]&&a[1]===b[1]}
function overlay(p,n){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 100 100');s.classList.add('links');for(let i=1;i<p.length;i++){const l=document.createElementNS('http://www.w3.org/2000/svg','line'),pos=c=>[(c%n+.5)*100/n,(Math.floor(c/n)+.5)*100/n],[x1,y1]=pos(p[i-1]),[x2,y2]=pos(p[i]);for(const[k,v]of Object.entries({x1,y1,x2,y2}))l.setAttribute(k,v);s.append(l)}return s}
function board(n,t,on,g){const w=E('div','board-wrap'),grid=E('div','board');grid.style.gridTemplateColumns=`repeat(${n},1fr)`;grid.style.gridTemplateRows=`repeat(${n},1fr)`;const occ=new Map(path.map((c,i)=>[c,i])),ls=new Set(sel===null?[]:legal(n,path,sel));for(let c=0;c<n*n;c++){const x=B('','cell');if(t.includes(c))x.classList.add('target');if(occ.has(c)){const i=occ.get(c);x.classList.add('chain');if(i===0||i===path.length-1)x.classList.add('endpoint');if(i===sel)x.classList.add('selected')}if(ls.has(c))x.classList.add('legal');if(g&&((sel===null&&c===g[0])||(sel!==null&&c===g[1]&&ls.has(c))))x.classList.add('guide');x.onclick=()=>on(c,occ.get(c),ls.has(c));grid.append(x)}w.append(overlay(path,n),grid);return w}
function intro(){const p=panel('Linkline 사전 검증','실제 사람 데이터 수집 전의 모바일 기술 검증용 웹앱입니다.');p.append(E('div','notice',`HUMAN_COLLECTION_ENABLED=${HUMAN_COLLECTION_ENABLED} · ${RUNTIME_MODE} · ${ELIGIBILITY}`));const d=E('div','operator');d.append(E('p','','연결된 줄의 두 끝을 두 목표 칸에 하나씩 놓으면 해결됩니다. 어느 끝이 어느 목표에 들어가도 됩니다. 끝을 누르면 갈 수 있는 빈칸이 표시됩니다.'));const s=document.createElement('select');for(const f of Object.keys(FORMS)){const o=document.createElement('option');o.value=f;o.textContent='기술 검증용 '+f;s.append(o)}const go=B('안내 확인하고 시작');go.onclick=()=>{form=s.value;rows=FORMS[form];sessionId=crypto.randomUUID();startW(0)};d.append(s,go);p.append(d)}
function startW(i){wi=i;cur=W[i];path=canon(cur.p);sel=null;renderW()}function renderW(msg=''){clear();screen.append(E('div','label',cur.label));const st=E('div','status',msg);screen.append(board(cur.n,cur.t,onW,wi<2?cur.g:null),st);if(wi===2){const end=B('연습 종료','secondary');end.onclick=failW;screen.append(end)}}function onW(c,i,l){if(i===0||i===path.length-1){if(wi<2&&path[i]!==cur.g[0])return renderW('표시된 끝을 눌러 보세요.');sel=i;return renderW()}if(l&&sel!==null){if(wi<2&&c!==cur.g[1])return renderW('표시된 목표 칸을 눌러 보세요.');path=move(cur.n,path,sel,c);sel=null;if(solved(path,cur.t)){const p=panel('연습 완료');const n=B(wi<2?'다음 연습':'문제 시작');n.onclick=()=>wi<2?startW(wi+1):(passed=true,startC(0));p.append(n)}else renderW()}}function failW(){wfail++;if(wfail===1){const p=panel('움직이는 방법을 한 번 더 확인한 뒤 다시 해보세요.','줄의 두 끝 중 하나를 누르면 갈 수 있는 빈칸이 표시됩니다. 표시된 칸을 누르면 줄 전체가 따라 움직입니다.');const b=B('연습 3 다시 하기');b.onclick=()=>startW(2);p.append(b)}else panel('이번 테스트는 여기서 종료됩니다.','Calibration은 시작되지 않았습니다.')}
function puzzle(k){const [p,t,d]=P[k];return{n:4,p,t,d}}function startC(i){if(!passed)throw Error('gate');ci=i;if(i>=12)return done();if(i===6)return brk();cur=puzzle(rows[i]);path=canon(cur.p);sel=null;renderC()}function renderC(msg=''){clear();screen.append(E('div','progress',`문제 ${ci+1} / 12`));screen.append(board(cur.n,cur.t,onC),E('div','status',msg));const a=E('div','actions'),r=B('처음부터','secondary'),q=B('문제 끝내기','danger');r.onclick=()=>{path=canon(cur.p);sel=null;renderC()};q.onclick=()=>{if(confirm('현재 문제를 여기서 끝낼까요?'))rate('문제를 종료했습니다.',false)};a.append(r,q);screen.append(a)}function onC(c,i,l){if(i===0||i===path.length-1){sel=i;return renderC()}if(l&&sel!==null){path=move(cur.n,path,sel,c);sel=null;if(solved(path,cur.t))rate('완료',true);else renderC()}}function rate(title,ok){const p=panel(title,'방금 문제는 얼마나 어렵게 느껴졌나요?'),r=E('div','rating'),labs=['매우 쉬웠다','쉬웠다','보통이었다','어려웠다','매우 어려웠다'];labs.forEach((x,i)=>{const b=B(`${i+1}  ${x}`,'rate');b.onclick=()=>commit(i+1,ok);r.append(b)});const s=B('응답하지 않기','secondary');s.onclick=()=>commit(null,ok);p.append(r,s)}function commit(v,ok){attempts.push({problem:ci+1,outcome:ok?'SOLVED':'ABANDONED',selfRatedDifficulty:v});startC(ci+1)}function brk(){const p=panel('여기까지 6문제를 풀었습니다.','원하면 잠시 쉬었다가 계속하세요.');const b=B('계속하기');b.onclick=()=>{ci=6;cur=puzzle(rows[6]);path=canon(cur.p);sel=null;renderC()};p.append(b)}function done(){const p=panel('모든 문제가 끝났습니다.','참여해 주셔서 감사합니다.');const n=E('div','notice','기술 검증 자료는 서버로 자동 전송되지 않습니다.');const b=B('검증 JSON 내보내기','secondary');b.onclick=()=>{const data={eligibility:ELIGIBILITY,humanCollectionEnabled:false,runtimeMode:RUNTIME_MODE,formId:form,sessionId,attempts};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='linkline-technical-validation.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),0)};p.append(n,b)}intro();
</script></body></html>
