<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f4f4">
  <title>Linkline</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./polish.css">
</head>
<body class="is-booting">
  <section id="boot-splash" class="boot-splash" aria-label="Linkline loading" aria-live="polite">
    <div class="boot-splash-inner">
      <div class="boot-brand">LINKLINE</div>
      <svg class="boot-signal" viewBox="0 0 96 96" aria-hidden="true">
        <path d="M20 25h29v21h27v25H49" />
        <path class="boot-pulse" d="M20 25h29v21h27v25H49" />
        <circle cx="20" cy="25" r="4.2" />
        <circle cx="49" cy="71" r="4.2" />
      </svg>
      <div class="boot-status">CONNECTING SIGNAL</div>
    </div>
  </section>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">LINKLINE</div>
        <div id="stage-label" class="stage">Stage ---</div>
      </div>
      <div id="campaign-label" class="campaign">- / 1300</div>
    </header>
    <div class="foundation-note">정식 캠페인 1–1300 연결 · v0.4 연속 드래그 복원</div>
    <section id="screen" class="screen" aria-live="polite"></section>
    <footer class="footer">
      <button id="reset-progress" class="text-button" type="button">진행 초기화</button>
    </footer>
  </main>
  <noscript><style>.boot-splash{display:none}.app-shell{visibility:visible!important;opacity:1!important}</style></noscript>
  <script>
    (()=>{
      const nativeSetTimeout=window.setTimeout.bind(window);
      window.setTimeout=(fn,delay,...args)=>nativeSetTimeout(fn,delay===140?48:delay,...args);
    })();
  </script>
  <script type="module" src="./src/polish.mjs"></script>
  <script type="module" src="./src/app.mjs"></script>
  <script type="module">
    const CELL='.cell', BOARD='.board-wrap';
    const FIRST_RETRY_MS=52, RETRY_MS=8, MAX_RETRIES=24;
    const SAMPLE_RATIO=.12, MIN_SAMPLE_PX=3, MAX_SAMPLE_PX=8;
    const DRAG_INTENT_EVENT='linkline:drag-intent-v1';
    let drag=null, suppressTrustedClickUntil=0;

    const style=document.createElement('style');
    style.textContent='.board-wrap,.board,.cell{touch-action:none;-webkit-user-select:none;user-select:none}.board-wrap.dragging .cell.endpoint{filter:brightness(.96)}';
    document.head.append(style);

    function publishDragIntent(phase){
      if(!drag){
        document.dispatchEvent(new CustomEvent(DRAG_INTENT_EVENT,{detail:{version:1,phase,active:false}}));
        return;
      }
      document.dispatchEvent(new CustomEvent(DRAG_INTENT_EVENT,{detail:{
        version:1,
        phase,
        active:true,
        pointerId:drag.pointerId,
        endpointCell:drag.endpointCell,
        traceCell:drag.traceCell,
        queue:[...drag.queue],
        waiting:drag.waiting,
        moved:drag.moved,
        released:drag.released,
        headingAxis:drag.headingAxis,
        clientX:drag.lastX,
        clientY:drag.lastY,
      }}));
    }

    function cellNumber(cell){
      const data=Number(cell?.dataset?.cell);
      if(Number.isInteger(data))return data;
      const match=String(cell?.getAttribute('aria-label')||'').match(/^칸\s+(\d+)/);
      return match?Number(match[1]):null;
    }
    function currentCell(number){
      for(const cell of document.querySelectorAll(CELL)) if(cellNumber(cell)===number) return cell;
      return null;
    }
    function gridInfo(){
      const grid=document.querySelector('.board');
      if(!grid)return null;
      const cells=grid.querySelectorAll(CELL);
      const n=Math.round(Math.sqrt(cells.length));
      if(!n||n*n!==cells.length)return null;
      const rect=grid.getBoundingClientRect();
      return {grid,n,rect,cellW:rect.width/n,cellH:rect.height/n,cellSize:Math.min(rect.width/n,rect.height/n)};
    }
    function gridCellAt(x,y){
      const info=gridInfo();
      if(!info)return null;
      const {rect,n,cellW,cellH}=info;
      if(x<rect.left||x>=rect.right||y<rect.top||y>=rect.bottom)return null;
      const col=Math.max(0,Math.min(n-1,Math.floor((x-rect.left)/cellW)));
      const row=Math.max(0,Math.min(n-1,Math.floor((y-rect.top)/cellH)));
      return row*n+col;
    }
    function pushQueued(number){
      if(number===null||!drag)return;
      const last=drag.queue.length?drag.queue.at(-1):drag.traceCell;
      if(last===number)return;
      drag.queue.push(number);
    }
    function appendTraceCell(number,segDx,segDy){
      if(!drag||number===null||number===drag.traceCell)return;
      const info=gridInfo();
      if(!info){drag.traceCell=number;return;}
      const n=info.n, from=drag.traceCell;
      if(from===null){drag.traceCell=number;return;}
      let fr=Math.floor(from/n),fc=from%n,tr=Math.floor(number/n),tc=number%n;
      while(fr!==tr||fc!==tc){
        if(fr!==tr&&fc!==tc){
          const axis=drag.headingAxis||(Math.abs(segDx)>Math.abs(segDy)?'H':'V');
          if(axis==='H'){fc+=Math.sign(tc-fc);drag.headingAxis='H';}
          else{fr+=Math.sign(tr-fr);drag.headingAxis='V';}
        }else if(fr!==tr){fr+=Math.sign(tr-fr);drag.headingAxis='V';}
        else{fc+=Math.sign(tc-fc);drag.headingAxis='H';}
        pushQueued(fr*n+fc);
      }
      drag.traceCell=number;
    }
    function sampleTo(x,y){
      if(!drag)return;
      const x0=drag.lastX,y0=drag.lastY,dx=x-x0,dy=y-y0;
      const distance=Math.hypot(dx,dy);
      const info=gridInfo();
      const step=info?Math.max(MIN_SAMPLE_PX,Math.min(MAX_SAMPLE_PX,info.cellSize*SAMPLE_RATIO)):4;
      const count=Math.max(1,Math.ceil(distance/step));
      for(let i=1;i<=count;i++){
        const t=i/count;
        appendTraceCell(gridCellAt(x0+dx*t,y0+dy*t),dx,dy);
      }
      drag.lastX=x;drag.lastY=y;
    }
    function maybeFinish(){
      if(!drag||!drag.released||drag.waiting||drag.queue.length)return;
      suppressTrustedClickUntil=performance.now()+350;
      document.querySelectorAll(`${BOARD}.dragging`).forEach(node=>node.classList.remove('dragging'));
      publishDragIntent('finish');
      drag=null;
    }
    function reselect(attempt=0){
      if(!drag)return;
      const endpoint=currentCell(drag.endpointCell);
      if(!endpoint){
        drag.waiting=false;
        drag.queue.length=0;
        publishDragIntent('abort');
        maybeFinish();
        return;
      }
      if(endpoint.classList.contains('selected')){
        drag.waiting=false;
        publishDragIntent('reselected');
        pumpQueue();
        return;
      }
      endpoint.click();
      publishDragIntent('reselect');
      const fresh=currentCell(drag.endpointCell);
      if(fresh?.classList.contains('selected')){
        drag.waiting=false;
        publishDragIntent('reselected');
        pumpQueue();
        return;
      }
      if(attempt<MAX_RETRIES){setTimeout(()=>reselect(attempt+1),RETRY_MS);return;}
      drag.waiting=false;
      publishDragIntent('retry-exhausted');
      pumpQueue();
    }
    function pumpQueue(){
      if(!drag||drag.waiting)return;
      while(drag.queue.length){
        const number=drag.queue[0];
        if(number===drag.endpointCell){drag.queue.shift();continue;}
        const endpoint=currentCell(drag.endpointCell);
        if(!endpoint){
          drag.queue.length=0;
          publishDragIntent('abort');
          maybeFinish();
          return;
        }
        if(!endpoint.classList.contains('selected')){reselect();return;}
        const cell=currentCell(number);
        if(!cell){drag.queue.shift();continue;}
        if(!cell.classList.contains('legal')){
          drag.queue.length=0;
          drag.traceCell=gridCellAt(drag.lastX,drag.lastY);
          publishDragIntent('blocked');
          maybeFinish();
          return;
        }
        drag.queue.shift();
        drag.waiting=true;
        drag.moved=true;
        drag.endpointCell=number;
        cell.click();
        publishDragIntent('commit');
        setTimeout(()=>reselect(),FIRST_RETRY_MS);
        return;
      }
      maybeFinish();
    }
    function updatePointer(event){
      if(!drag||event.pointerId!==drag.pointerId||drag.released)return;
      event.preventDefault();
      const points=typeof event.getCoalescedEvents==='function'?event.getCoalescedEvents():[];
      const stream=points.length?points:[event];
      for(const point of stream)sampleTo(point.clientX,point.clientY);
      if(stream.at(-1)!==event)sampleTo(event.clientX,event.clientY);
      publishDragIntent('trace');
      pumpQueue();
    }
    function releaseDrag(event){
      if(!drag||event.pointerId!==drag.pointerId)return;
      event.preventDefault();
      if(Number.isFinite(event.clientX)&&Number.isFinite(event.clientY))sampleTo(event.clientX,event.clientY);
      drag.released=true;
      publishDragIntent('release');
      try{document.documentElement.releasePointerCapture(event.pointerId);}catch{}
      pumpQueue();
      maybeFinish();
    }

    document.addEventListener('pointerdown',event=>{
      const cell=event.target.closest?.(CELL);
      const board=cell?.closest?.(BOARD);
      if(!cell?.classList.contains('endpoint')||!board)return;
      const number=cellNumber(cell);
      if(number===null)return;
      event.preventDefault();
      drag={pointerId:event.pointerId,endpointCell:number,traceCell:number,lastX:event.clientX,lastY:event.clientY,queue:[],waiting:false,moved:false,released:false,headingAxis:null};
      suppressTrustedClickUntil=Infinity;
      board.classList.add('dragging');
      try{document.documentElement.setPointerCapture(event.pointerId);}catch{}
      cell.click();
      publishDragIntent('start');
    },{capture:true,passive:false});

    document.addEventListener('pointermove',updatePointer,{capture:true,passive:false});
    document.addEventListener('pointerup',releaseDrag,{capture:true,passive:false});
    document.addEventListener('pointercancel',releaseDrag,{capture:true,passive:false});

    document.addEventListener('click',event=>{
      if(!event.isTrusted)return;
      if((drag||performance.now()<suppressTrustedClickUntil)&&event.target.closest?.(BOARD)){
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    },true);
  </script>
</body>
</html>
