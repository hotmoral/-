<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6f5f0"><title>Linkline Mobile Validation</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171716;background:#ecebe6}*{box-sizing:border-box}body{margin:0;min-height:100dvh}.shell{width:min(100%,540px);min-height:100dvh;margin:auto;background:#fbfaf6;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #dddcd5;position:sticky;top:0;background:#fbfaf6eF;backdrop-filter:blur(10px);z-index:5}.brand{font-weight:900;letter-spacing:.14em}.mode{font-size:11px;border:1px solid #ccc;padding:6px 9px;border-radius:999px}.screen{flex:1;padding:20px 16px 30px;display:flex;flex-direction:column;gap:16px}.panel{margin:auto 0;background:#fff;border:1px solid #dddcd5;border-radius:20px;padding:22px}.panel h1,.panel h2{margin:0 0 12px}.panel p{line-height:1.6;color:#555}.notice{background:#f0efe9;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}.primary,.secondary,.danger,.rate{min-height:50px;border-radius:13px;padding:0 16px;font-size:16px;font-weight:750}.primary{background:#1e1e1b;color:#fff;border:0}.secondary{background:#fff;border:1px solid #ccc}.danger{background:#fff;border:1px solid #d7b0b0;color:#8a3131}.stack{display:grid;gap:10px;margin-top:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.boardwrap{width:min(88vw,450px);aspect-ratio:1;margin:4px auto;position:relative}.board{position:absolute;inset:0;display:grid;gap:6px}.cell{border:1px solid #d4d3cc;border-radius:13px;background:#f3f2ed;position:relative;padding:0;touch-action:manipulation}.cell.chain{background:#cfcfc8}.cell.endpoint{box-shadow:inset 0 0 0 3px #696861}.cell.selected{box-shadow:inset 0 0 0 4px #111}.cell.legal{background:white;border:3px solid #161613}.cell.guide{outline:4px solid rgba(46,103,76,.3);outline-offset:-5px}.cell.target:after{content:"";position:absolute;width:16px;height:16px;border:3px solid #111;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.progress,.label,.status{text-align:center;font-weight:750}.rating{display:grid;gap:8px}.rate{background:#fff;border:1px solid #ccc;text-align:left}.break{font-size:13px;letter-spacing:.12em;color:#777;font-weight:800}@media(max-width:390px){.screen{padding-left:13px;padding-right:13px}.actions{grid-template-columns:1fr}.boardwrap{width:92vw}}</style></head><body><main class="shell"><header class="top"><span class="brand">LINKLINE</span><span class="mode">기술 검증 전용</span></header><section id="screen" class="screen"></section></main><script>const screen=document.getElementById('screen');const W=[{n:3,p:[0,1,2],t:[1,3],guide:[0,3],label:'연습 1/3 — 왼쪽 끝을 눌러 표시되는 목표 칸으로 움직여 보세요.'},{n:3,p:[0,1,2],t:[1,5],guide:[2,5],label:'연습 2/3 — 이번에는 반대쪽 끝을 눌러 표시되는 목표 칸으로 움직여 보세요.'},{n:3,p:[0,1,2],t:[0,6],guide:null,label:'연습 3/3 — 이번에는 안내 없이 두 끝을 목표 칸에 놓아 보세요.'}];const P=[{n:4,p:[10,9,8,12,13,14],t:[0,1]},{n:4,p:[3,2,1,0,4,5,9,13,14,15],t:[0,11]},{n:4,p:[3,2,6,10,14,13,12,8],t:[0,11]},{n:4,p:[3,2,1,0,4,8,9,13,14,10],t:[1,7]},{n:4,p:[8,9,13,14,15,11,7,6,10],t:[1,9]},{n:4,p:[2,3,7,6,5,4,8],t:[0,2]},{n:4,p:[0,4,8,9,5,6,10,14,15,11],t:[0,6]},{n:4,p:[7,3,2,1,5,6,10,9,13,14],t:[0,1]},{n:4,p:[4,0,1,2,6,10,14],t:[1,6]},{n:4,p:[1,2,6,5,9,8],t:[1,2]},{n:4,p:[3,7,6,5,4,8,9,10],t:[1,13]},{n:4,p:[1,5,6,7,11],t:[1,6]}];let mode='intro',wi=0,pi=0,path=[],sel=null,wfail=0,records=[];const clone=a=>a.slice();const neigh=(n,c)=>{const r=Math.floor(c/n),x=c%n,o=[];if(r>0)o.push(c-n);if(r<n-1)o.push(c+n);if(x>0)o.push(c-1);if(x<n-1)o.push(c+1);return o};const legal=(q,i)=>{if(i!==0&&i!==q.length-1)return[];const occ=new Set(q);return neigh(cur().n,q[i]).filter(x=>!occ.has(x))};const solved=()=>{const a=[path[0],path[path.length-1]].sort((a,b)=>a-b),b=cur().t.slice().sort((a,b)=>a-b);return a[0]===b[0]&&a[1]===b[1]};const cur=()=>mode==='warm'?W[wi]:P[pi];function panel(title,body){screen.innerHTML='<div class="panel"><h1>'+title+'</h1><p>'+body+'</p><div id="slot"></div></div>';return document.getElementById('slot')}function btn(t,c='primary'){const b=document.createElement('button');b.className=c;b.textContent=t;return b}function intro(){mode='intro';const s=panel('Linkline 사전 검증','실제 사람 연구 데이터를 수집하지 않는 모바일 기술검증용 웹앱입니다.');const n=document.createElement('div');n.className='notice';n.textContent='HUMAN_COLLECTION_ENABLED=false · PRE_HUMAN_VALIDATION · TECHNICAL_VALIDATION_ONLY';const p=document.createElement('p');p.textContent='목표: 연결된 줄의 두 끝을 두 목표 칸에 하나씩 놓으면 해결됩니다. 어느 끝이 어느 목표 칸에 들어가도 됩니다.';const p2=document.createElement('p');p2.textContent='움직이는 방법: 줄의 두 끝 중 하나를 누른 뒤 표시되는 빈칸을 누르면 줄 전체가 한 칸씩 따라 움직입니다.';const b=btn('안내 확인하고 시작');b.onclick=()=>startWarm(0);s.append(n,p,p2,b)}function startWarm(i){mode='warm';wi=i;path=clone(W[i].p);sel=null;render()}function startPuzzle(i){mode='puzzle';pi=i;path=clone(P[i].p);sel=null;render()}function board(){const q=cur(),wrap=document.createElement('div');wrap.className='boardwrap';const g=document.createElement('div');g.className='board';g.style.gridTemplateColumns=`repeat(${q.n},1fr)`;g.style.gridTemplateRows=`repeat(${q.n},1fr)`;const occ=new Map(path.map((c,i)=>[c,i]));const lg=new Set(sel==null?[]:legal(path,sel));for(let c=0;c<q.n*q.n;c++){const e=document.createElement('button');e.className='cell';if(q.t.includes(c))e.classList.add('target');if(occ.has(c)){const i=occ.get(c);e.classList.add('chain');if(i===0||i===path.length-1)e.classList.add('endpoint');if(i===sel)e.classList.add('selected')}if(lg.has(c))e.classList.add('legal');if(mode==='warm'&&W[wi].guide){const [gs,gd]=W[wi].guide;if((sel==null&&c===gs)||(sel!=null&&c===gd&&lg.has(c)))e.classList.add('guide')}e.onclick=()=>tap(c,occ.get(c),lg.has(c));g.append(e)}wrap.append(g);return wrap}function tap(c,i,isLegal){const q=cur();if(i===0||i===path.length-1){if(mode==='warm'&&W[wi].guide&&path[i]!==W[wi].guide[0])return;sel=i;render();return}if(isLegal&&sel!=null){if(mode==='warm'&&W[wi].guide&&c!==W[wi].guide[1])return;path=sel===0?[c,...path.slice(0,-1)]:[...path.slice(1),c];sel=null;if(solved()){if(mode==='warm')warmDone();else puzzleDone()}else render()}}function render(){screen.innerHTML='';if(mode==='warm'){const l=document.createElement('div');l.className='label';l.textContent=W[wi].label;screen.append(l,board());if(wi===2){const b=btn('연습 종료','secondary');b.onclick=failWarm;screen.append(b)}}else{const p=document.createElement('div');p.className='progress';p.textContent=`문제 ${pi+1} / 12`;screen.append(p,board());const a=document.createElement('div');a.className='actions';const r=btn('처음부터','secondary');r.onclick=()=>{path=clone(P[pi].p);sel=null;render()};const e=btn('문제 끝내기','danger');e.onclick=()=>{if(confirm('현재 문제를 여기서 끝낼까요?'))rating('ABANDONED')};a.append(r,e);screen.append(a)}}function warmDone(){const s=panel('연습 완료','');const b=btn(wi<2?'다음 연습':'문제 시작');b.onclick=()=>wi<2?startWarm(wi+1):startPuzzle(0);s.append(b)}function failWarm(){wfail++;if(wfail===1){const s=panel('움직이는 방법을 한 번 더 확인한 뒤 다시 해보세요.','줄의 두 끝 중 하나를 누르면 갈 수 있는 빈칸이 표시됩니다. 표시된 칸을 누르면 줄 전체가 따라 움직입니다.');const b=btn('연습 3 다시 하기');b.onclick=()=>startWarm(2);s.append(b)}else panel('이번 테스트는 여기서 종료됩니다.','Calibration은 시작되지 않았습니다.')}function puzzleDone(){rating('SOLVED')}function rating(outcome){const s=panel(outcome==='SOLVED'?'완료':'문제를 종료했습니다.','방금 문제는 얼마나 어렵게 느껴졌나요?');const r=document.createElement('div');r.className='rating';['매우 쉬웠다','쉬웠다','보통이었다','어려웠다','매우 어려웠다'].forEach((x,i)=>{const b=btn(`${i+1}  ${x}`,'rate');b.onclick=()=>commit(outcome,i+1);r.append(b)});const skip=btn('응답하지 않기','secondary');skip.onclick=()=>commit(outcome,null);s.append(r,skip)}function commit(outcome,rate){records.push({puzzle:pi+1,outcome,selfRatedDifficulty:rate});if(pi===5){const s=panel('여기까지 6문제를 풀었습니다.','원하면 잠시 쉬었다가 계속하세요.');const b=btn('계속하기');b.onclick=()=>startPuzzle(6);s.append(b)}else if(pi===11)finish();else startPuzzle(pi+1)}function finish(){const s=panel('모든 문제가 끝났습니다.','참여해 주셔서 감사합니다.');const n=document.createElement('div');n.className='notice';n.textContent='기술검증 결과만 로컬 JSON으로 저장할 수 있습니다.';const b=btn('JSON 내보내기','secondary');b.onclick=()=>{const data={schema:'LINKLINE_MOBILE_TECHNICAL_VALIDATION',humanCollectionEnabled:false,runtimeMode:'PRE_HUMAN_VALIDATION',eligibility:'TECHNICAL_VALIDATION_ONLY',records};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='linkline-mobile-validation.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),0)};s.append(n,b)}intro();</script></body></html>
