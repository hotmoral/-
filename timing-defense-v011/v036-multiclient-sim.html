<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timing Defense v0.36 multi-client simulation</title>
<style>body{font:14px system-ui;background:#101714;color:#e7eee9;padding:18px}pre{white-space:pre-wrap;background:#17211c;padding:14px;border-radius:10px;max-width:980px}.pass{color:#9ee6ad}.fail{color:#ff9e9e}</style>
<h1>v0.36 live multi-client simulation</h1><div id="status">RUNNING…</div><pre id="log"></pre><pre id="out"></pre>
<script>
(async()=>{
  const status=document.getElementById('status'),logEl=document.getElementById('log'),out=document.getElementById('out');
  const log=[];const checks=[];let code='',hostSession='',guestSession='',host=null,guest=null;
  const say=s=>{log.push(s);logEl.textContent=log.join('\n')};
  const add=(name,pass,actual,expected)=>{checks.push({name,pass:!!pass,actual,expected});say(`${pass?'PASS':'FAIL'} · ${name}`)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(`${path}: ${d?.error||r.status}`);return d}
  class SimClient{
    constructor(name,cls,session=''){this.name=name;this.cls=cls;this.session=session;this.slot=0;this.ws=null;this.state=null;this.messages=[];this.errors=[];this.waiters=[]}
    connect(){return new Promise((resolve,reject)=>{const proto=location.protocol==='https:'?'wss:':'ws:',u=new URL(`${proto}//${location.host}/ws/${code}`);if(this.session)u.searchParams.set('session',this.session);u.searchParams.set('nickname',this.name);u.searchParams.set('classId',this.cls);const ws=new WebSocket(u);this.ws=ws;const timer=setTimeout(()=>reject(new Error(`${this.name} connect timeout`)),5000);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}this.messages.push(m);if(m.type==='welcome'){this.session=m.session;this.slot=m.slot;this.state=m.state;clearTimeout(timer);resolve(m)}if(m.type==='state')this.state=m.state;if(m.type==='error')this.errors.push(m.error);for(const w of [...this.waiters]){if(w.pred(m,this)){this.waiters.splice(this.waiters.indexOf(w),1);w.resolve(m)}}});ws.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(`${this.name} websocket error`))})})}
    send(x){if(this.ws?.readyState!==WebSocket.OPEN)throw new Error(`${this.name} socket not open`);this.ws.send(JSON.stringify(x))}
    wait(pred,timeout=5000){return new Promise((resolve,reject)=>{for(const m of [...this.messages].reverse())if(pred(m,this))return resolve(m);const w={pred,resolve};this.waiters.push(w);setTimeout(()=>{const i=this.waiters.indexOf(w);if(i>=0)this.waiters.splice(i,1);reject(new Error(`${this.name} wait timeout`))},timeout)})}
    waitState(pred,timeout=5000){if(this.state&&pred(this.state))return Promise.resolve(this.state);return this.wait((m,c)=>m.type==='state'&&pred(c.state),timeout).then(()=>this.state)}
    close(){try{this.ws?.close(1000,'sim-reconnect')}catch{}}
  }
  async function attackUntilShop(c,maxMs=18000){const t0=performance.now();let seq=1;while(performance.now()-t0<maxMs){const st=c.state,run=st?.run;if(run?.status==='shop')return{ok:true,seq};if(run?.status==='gameover'||run?.status==='stage2-clear')return{ok:false,seq,status:run.status};if(run?.status==='combat'&&(run.monsters?.length||0)>0){c.send({type:'action',seq:seq++,xJudge:'PERFECT',yJudge:'PERFECT'});await sleep(45)}else await sleep(80)}return{ok:false,seq,status:c.state?.run?.status||'timeout'}}
  try{
    say('creating room');
    const cr=await post('/api/room/create',{method:'friend',nickname:'SIM_A',classId:'rogue',aiFill:[]});code=cr.code;hostSession=cr.session;
    host=new SimClient('SIM_A','rogue',hostSession);guest=new SimClient('SIM_B','knight','');
    const hw=await host.connect(),gw=await guest.connect();guestSession=gw.session;
    add('TWO_CLIENT_JOIN',hw.slot===1&&gw.slot===2,{host:hw.slot,guest:gw.slot},{host:1,guest:2});
    host.send({type:'ready',ready:true});guest.send({type:'ready',ready:true});
    await host.waitState(s=>s.canStart===true,5000);await guest.waitState(s=>s.canStart===true,5000);
    add('READY_PROPAGATES',host.state.canStart&&guest.state.canStart,{host:host.state.canStart,guest:guest.state.canStart},{host:true,guest:true});
    host.send({type:'start'});
    await host.waitState(s=>s.run?.status==='combat',7000);await guest.waitState(s=>s.run?.status==='combat',7000);
    add('SYNCHRONIZED_START',host.state.run.id===guest.state.run.id&&host.state.run.stage===1&&guest.state.run.stage===1,{hostRun:host.state.run.id,guestRun:guest.state.run.id,hostStage:host.state.run.stage,guestStage:guest.state.run.stage},'same run / stage 1');

    await post(`/api/room/${code}/debug-level`,{session:host.session,level:6});
    await host.waitState(s=>s.run?.players?.find(p=>p.slot===1)?.level===6,3000);
    await host.waitState(s=>(s.run?.monsters?.length||0)>0,4000);
    const beforeEvent=Math.max(0,...(host.state.run.events||[]).map(e=>Number(e.id)||0));
    host.send({type:'action',seq:1,xJudge:'NORMAL'});
    await host.waitState(s=>(s.run?.events||[]).some(e=>e.id>beforeEvent&&e.type==='skill'&&e.skillKind==='rogue-double-dagger'),4000);
    await guest.waitState(s=>(s.run?.events||[]).some(e=>e.id>beforeEvent&&e.type==='skill'&&e.skillKind==='rogue-double-dagger'),4000);
    const hev=(host.state.run.events||[]).filter(e=>e.id>beforeEvent&&e.actionId),gev=(guest.state.run.events||[]).filter(e=>e.id>beforeEvent&&e.actionId);
    const hIds=hev.map(e=>`${e.actionId}:${e.hitIndex}:${e.damage}`),gIds=gev.map(e=>`${e.actionId}:${e.hitIndex}:${e.damage}`);
    add('ROGUE_SECONDARY_SYNC_EXACT_ONCE',hev.filter(e=>e.type==='skill').length===1&&gev.filter(e=>e.type==='skill').length===1&&hIds.join('|')===gIds.join('|'),{host:hIds,guest:gIds},'identical primary+one secondary');

    host.send({type:'action',seq:1,xJudge:'NORMAL'});
    await host.wait((m)=>m.type==='error'&&m.error==='stale-seq',2500);
    add('LIVE_DUPLICATE_SEQ_REJECTED',host.errors.includes('stale-seq'),host.errors,'contains stale-seq');

    const resume=await post(`/api/room/${code}/resume`,{session:guest.session});
    const latest=Math.max(0,...(host.state.run.events||[]).map(e=>Number(e.id)||0));
    add('RESUME_EVENT_FLOOR',Array.isArray(resume.state?.run?.events)&&resume.state.run.events.length===0&&Number(resume.eventFloor)>=latest,{eventFloor:resume.eventFloor,latest,events:resume.state?.run?.events?.length},'events=0 and floor>=latest');

    const oldGuestSession=guest.session,oldRun=host.state.run.id;guest.close();await sleep(250);
    guest=new SimClient('SIM_B','knight',oldGuestSession);const rw=await guest.connect();
    add('WEBSOCKET_RECONNECT_SAME_SLOT_RUN',rw.slot===2&&rw.state?.run?.id===oldRun,{slot:rw.slot,run:rw.state?.run?.id},{slot:2,run:oldRun});

    say('clearing stage 1 automatically');
    const clear=await attackUntilShop(host,19000);await host.waitState(s=>s.run?.status==='shop',3000);await guest.waitState(s=>s.run?.status==='shop',3000);
    add('STAGE1_TO_SHARED_SHOP',clear.ok&&host.state.run.status==='shop'&&guest.state.run.status==='shop',{clear,host:host.state.run.status,guest:guest.state.run.status},'shop / shop');
    await post(`/api/room/${code}/shop-ready`,{session:host.session,ready:true});await post(`/api/room/${code}/shop-ready`,{session:guest.session,ready:true});
    await host.waitState(s=>s.run?.shop?.canNext===true,3000);
    await post(`/api/room/${code}/shop-next`,{session:host.session});
    await host.waitState(s=>s.run?.stage===2&&['stage-starting','intro','combat'].includes(s.run.status),4000);await guest.waitState(s=>s.run?.stage===2&&['stage-starting','intro','combat'].includes(s.run.status),4000);
    add('SHOP_TO_STAGE2_SYNC',host.state.run.stage===2&&guest.state.run.stage===2&&host.state.run.id===guest.state.run.id,{hostStage:host.state.run.stage,guestStage:guest.state.run.stage,run:host.state.run.id},'same run / stage 2');
  }catch(e){say(`EXCEPTION · ${e?.stack||e}`);checks.push({name:'SIM_EXCEPTION',pass:false,actual:String(e?.stack||e),expected:'no exception'})}
  finally{
    try{host?.close();guest?.close()}catch{}
    try{if(code&&guestSession)await post(`/api/room/${code}/leave`,{session:guestSession})}catch{}
    try{if(code&&hostSession)await post(`/api/room/${code}/leave`,{session:hostSession})}catch{}
  }
  const passed=checks.filter(x=>x.pass).length,result={ok:passed===checks.length,version:'0.36-cf.3-live-multiclient',room:code,passed,total:checks.length,failed:checks.filter(x=>!x.pass).map(x=>x.name),checks};
  status.textContent=result.ok?'PASS':'FAIL';status.className=result.ok?'pass':'fail';out.textContent=JSON.stringify(result,null,2);document.title=`${result.ok?'PASS':'FAIL'} · v0.36 live simulation`;
})();
</script>
