<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timing Defense v0.37 Stage 3 multi-client simulation</title>
<style>body{font:14px system-ui;background:#101714;color:#e7eee9;padding:18px}pre{white-space:pre-wrap;background:#17211c;padding:14px;border-radius:10px;max-width:980px}.pass{color:#9ee6ad}.fail{color:#ff9e9e}</style>
<h1>v0.37 Stage 3 live multi-client simulation</h1><div id="status">RUNNING…</div><pre id="log"></pre><pre id="out"></pre>
<script>
(async()=>{
  const status=document.getElementById('status'),logEl=document.getElementById('log'),out=document.getElementById('out');
  const log=[];const checks=[];let code='',hostSession='',guestSession='',host=null,guest=null;
  const say=s=>{log.push(s);logEl.textContent=log.join('\n')};
  const add=(name,pass,actual,expected)=>{checks.push({name,pass:!!pass,actual,expected});say(`${pass?'PASS':'FAIL'} · ${name}`)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function postRaw(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>null);return{r,d}}
  async function post(path,body){const {r,d}=await postRaw(path,body);if(!r.ok)throw new Error(`${path}: ${d?.error||r.status}`);return d}
  class SimClient{
    constructor(name,cls,session=''){this.name=name;this.cls=cls;this.session=session;this.slot=0;this.ws=null;this.state=null;this.messages=[];this.errors=[];this.waiters=[];this.seq=1}
    connect(){return new Promise((resolve,reject)=>{const proto=location.protocol==='https:'?'wss:':'ws:',u=new URL(`${proto}//${location.host}/ws/${code}`);if(this.session)u.searchParams.set('session',this.session);u.searchParams.set('nickname',this.name);u.searchParams.set('classId',this.cls);const ws=new WebSocket(u);this.ws=ws;const timer=setTimeout(()=>reject(new Error(`${this.name} connect timeout`)),6000);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}this.messages.push(m);if(m.type==='welcome'){this.session=m.session;this.slot=m.slot;this.state=m.state;this.seq=Math.max(this.seq,Number(m.lastSeq||0)+1);clearTimeout(timer);resolve(m)}if(m.type==='state')this.state=m.state;if(m.type==='error')this.errors.push(m.error);for(const w of [...this.waiters]){if(w.pred(m,this)){this.waiters.splice(this.waiters.indexOf(w),1);w.resolve(m)}}});ws.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(`${this.name} websocket error`))})})}
    send(x){if(this.ws?.readyState!==WebSocket.OPEN)throw new Error(`${this.name} socket not open`);this.ws.send(JSON.stringify(x))}
    attack(){this.send({type:'action',seq:this.seq++,xJudge:'PERFECT',yJudge:'PERFECT'})}
    wait(pred,timeout=6000){return new Promise((resolve,reject)=>{for(const m of [...this.messages].reverse())if(pred(m,this))return resolve(m);const w={pred,resolve};this.waiters.push(w);setTimeout(()=>{const i=this.waiters.indexOf(w);if(i>=0)this.waiters.splice(i,1);reject(new Error(`${this.name} wait timeout`))},timeout)})}
    waitState(pred,timeout=6000){if(this.state&&pred(this.state))return Promise.resolve(this.state);return this.wait((m,c)=>m.type==='state'&&pred(c.state),timeout).then(()=>this.state)}
    close(){try{this.ws?.close(1000,'sim-close')}catch{}}
  }
  async function clearToShop(maxMs=30000){
    const t0=performance.now();
    while(performance.now()-t0<maxMs){
      const run=host.state?.run;
      if(run?.status==='shop')return{ok:true,stage:run.stage};
      if(run?.status==='gameover')return{ok:false,status:'gameover'};
      if(run?.status==='combat'&&(run.monsters?.length||0)>0){
        try{host.attack()}catch{};try{guest.attack()}catch{};await sleep(55);
      }else await sleep(80);
    }
    return{ok:false,status:host.state?.run?.status||'timeout',stage:host.state?.run?.stage};
  }
  async function readyShopAndNext(expectedStage){
    await post(`/api/room/${code}/shop-ready`,{session:host.session,ready:true});
    await post(`/api/room/${code}/shop-ready`,{session:guest.session,ready:true});
    await host.waitState(s=>s.run?.shop?.canNext===true,4000);
    const d=await post(`/api/room/${code}/shop-next`,{session:host.session});
    await host.waitState(s=>s.run?.stage===expectedStage&&['stage-starting','intro','combat'].includes(s.run.status),5000);
    await guest.waitState(s=>s.run?.stage===expectedStage&&['stage-starting','intro','combat'].includes(s.run.status),5000);
    return d;
  }
  try{
    say('creating room');
    const cr=await post('/api/room/create',{method:'friend',nickname:'SIM_A',classId:'rogue',aiFill:[]});code=cr.code;hostSession=cr.session;
    host=new SimClient('SIM_A','rogue',hostSession);guest=new SimClient('SIM_B','archer','');
    const hw=await host.connect(),gw=await guest.connect();guestSession=gw.session;
    add('TWO_HUMAN_JOIN',hw.slot===1&&gw.slot===2,{host:hw.slot,guest:gw.slot},{host:1,guest:2});
    host.send({type:'ready',ready:true});guest.send({type:'ready',ready:true});
    await host.waitState(s=>s.canStart===true);host.send({type:'start'});
    await host.waitState(s=>s.run?.status==='combat',8000);await guest.waitState(s=>s.run?.status==='combat',8000);
    add('STAGE1_SHARED_START',host.state.run.stage===1&&guest.state.run.stage===1&&host.state.run.id===guest.state.run.id,{hostStage:host.state.run.stage,guestStage:guest.state.run.stage,run:host.state.run.id},'same run stage 1');

    await post(`/api/room/${code}/debug-level`,{session:host.session,level:6,slot:1});
    await post(`/api/room/${code}/debug-level`,{session:host.session,level:6,slot:2});

    const oldSession=guest.session,runId=host.state.run.id;guest.close();await sleep(250);guest=new SimClient('SIM_B','archer',oldSession);const rw=await guest.connect();
    add('RECONNECT_SAME_SLOT_RUN',rw.slot===2&&rw.state?.run?.id===runId,{slot:rw.slot,run:rw.state?.run?.id},{slot:2,run:runId});

    say('clearing stage 1');const c1=await clearToShop(22000);await guest.waitState(s=>s.run?.status==='shop',4000);
    add('STAGE1_TO_SHOP',c1.ok&&host.state.run.shop?.stage===1&&guest.state.run.shop?.stage===1,{c1,hostShop:host.state.run.shop?.stage,guestShop:guest.state.run.shop?.stage},'shared stage 1 shop');
    await readyShopAndNext(2);await host.waitState(s=>s.run?.status==='combat',7000);await guest.waitState(s=>s.run?.status==='combat',7000);
    add('SHOP_TO_STAGE2',host.state.run.stage===2&&guest.state.run.stage===2,{host:host.state.run.stage,guest:guest.state.run.stage},2);

    say('clearing stage 2');const c2=await clearToShop(26000);await guest.waitState(s=>s.run?.status==='shop',4000);
    add('STAGE2_TO_SHOP',c2.ok&&host.state.run.shop?.stage===2&&guest.state.run.shop?.stage===2,{c2,hostShop:host.state.run.shop?.stage,guestShop:guest.state.run.shop?.stage},'shared stage 2 shop');
    await readyShopAndNext(3);await host.waitState(s=>s.run?.status==='combat',7000);await guest.waitState(s=>s.run?.status==='combat',7000);
    add('SHOP_TO_STAGE3',host.state.run.stage===3&&guest.state.run.stage===3&&host.state.run.stageTarget===12,{hostStage:host.state.run.stage,guestStage:guest.state.run.stage,target:host.state.run.stageTarget},{stage:3,target:12});

    const stage3SpawnEvents=[];
    const collect=setInterval(()=>{for(const e of host.state?.run?.events||[])if(e.stage===3&&e.type==='spawn'&&!stage3SpawnEvents.some(x=>x.id===e.id))stage3SpawnEvents.push(e)},60);
    say('clearing stage 3');const c3=await clearToShop(32000);clearInterval(collect);await guest.waitState(s=>s.run?.status==='shop',4000);
    const validTypes=stage3SpawnEvents.every(e=>['grunt','runner','brute'].includes(e.monsterType));
    add('STAGE3_LIVE_TYPES_VALID',stage3SpawnEvents.length>0&&validTypes,{count:stage3SpawnEvents.length,types:[...new Set(stage3SpawnEvents.map(e=>e.monsterType))]},'spawn events only grunt/runner/brute');
    add('STAGE3_TO_SHARED_SHOP',c3.ok&&host.state.run.shop?.stage===3&&guest.state.run.shop?.stage===3,{c3,hostShop:host.state.run.shop?.stage,guestShop:guest.state.run.shop?.stage},'shared stage 3 shop');

    await post(`/api/room/${code}/shop-ready`,{session:host.session,ready:true});await post(`/api/room/${code}/shop-ready`,{session:guest.session,ready:true});await host.waitState(s=>s.run?.shop?.canNext===true,4000);
    const blocked=await postRaw(`/api/room/${code}/shop-next`,{session:host.session});
    add('STAGE4_BLOCKED',blocked.r.status===409&&blocked.d?.error==='stage4-blocked'&&host.state.run.stage===3,{status:blocked.r.status,error:blocked.d?.error,stage:host.state.run.stage},{status:409,error:'stage4-blocked',stage:3});
  }catch(e){say(`EXCEPTION · ${e?.stack||e}`);checks.push({name:'SIM_EXCEPTION',pass:false,actual:String(e?.stack||e),expected:'no exception'})}
  finally{
    try{host?.close();guest?.close()}catch{}
    try{if(code&&guestSession)await post(`/api/room/${code}/leave`,{session:guestSession})}catch{}
    try{if(code&&hostSession)await post(`/api/room/${code}/leave`,{session:hostSession})}catch{}
  }
  const passed=checks.filter(x=>x.pass).length,result={ok:passed===checks.length,version:'0.37-cf.1-live-multiclient',room:code,passed,total:checks.length,failed:checks.filter(x=>!x.pass).map(x=>x.name),checks};
  status.textContent=result.ok?'PASS':'FAIL';status.className=result.ok?'pass':'fail';out.textContent=JSON.stringify(result,null,2);document.title=`${result.ok?'PASS':'FAIL'} · v0.37 Stage 3 simulation`;
})();
</script>
