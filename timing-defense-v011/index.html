<style>

#shop.show{display:block}.shopHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.shopTitle{font-size:14px;font-weight:950;letter-spacing:.05em}.shopMeta{font-size:10px;color:#97a7b6}.upgradeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;background:#121923;border:1px solid rgba(255,255,255,.08)}.upgradeText{min-width:0}.upgradeName{font-size:10px;font-weight:900}.upgradeSub{font-size:9px;color:#8493a2;margin-top:2px}.upgrade button{min-width:70px}.shopFoot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:10px;color:#8fa0af}#nextBtn{padding:7px 13px}@media(max-height:520px){#shop{top:47%;max-height:66vh;padding:9px 11px}.upgradeGrid{gap:5px}.upgrade{padding:6px 8px}}#orientation{display:none;position:fixed;inset:0;z-index:20;background:#0b0f14;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;line-height:1.6}@media(orientation:portrait){#orientation{display:flex}}
</style></head><body>
<canvas id="game"></canvas>
<div id="ui">
<div id="topbar"><div><div id="title">TIMING DEFENSE · STAGE / RUN GROWTH TEST</div><div id="attackLabel">KNIGHT · ATTACK 1 · NORMAL · X</div></div><div id="stats">N 0 · G 0 · P 0 · C 0<br>AVG 0.00s</div></div>

 <div class="group"><span class="label">TEAM</span><button data-team="1" class="active">SOLO</button><button data-team="2">+1 AI</button><button data-team="3">+2 AI</button><button data-team="4">+3 AI</button></div>

</div>
<div id="shop"><div class="shopHead"><div><div class="shopTitle">STAGE CLEAR · RUN UPGRADE</div><div class="shopMeta" id="shopStage">Stage 1 complete</div></div><div class="shopMeta" id="shopTimer">NEXT 8.0</div></div><div class="upgradeGrid" id="upgradeGrid"></div><div class="shopFoot"><span id="shopCoin">COIN 0</span><button id="nextBtn">READY / NEXT</button></div></div></div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),attackLabelEl=document.getElementById('attackLabel'),statsEl=document.getElementById('stats'),runStatusEl=document.getElementById('runStatus'),shopEl=document.getElementById('shop'),shopStageEl=document.getElementById('shopStage'),shopTimerEl=document.getElementById('shopTimer'),shopCoinEl=document.getElementById('shopCoin'),upgradeGridEl=document.getElementById('upgradeGrid'),nextBtn=document.getElementById('nextBtn');
let DPR=Math.max(1,Math.min(2.2,devicePixelRatio||1)),W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
const cfg={speed:'normal',oneWayMs:{slow:1350,normal:1100,fast:900},inputLockMs:100,maxCycles:3,goodW:.42,goodH:.42,perfectW:.17,perfectH:.17};
const SLOT_Y=[.27,.39,.51,.63];
const MONSTER_TYPES={grunt:{name:'GRUNT',hp:220,speed:.058,size:.82,baseDamage:70,knockResist:.85,armor:1,reward:11},runner:{name:'RUNNER',hp:120,speed:.115,size:.56,baseDamage:55,knockResist:1,armor:1,reward:10},brute:{name:'BRUTE',hp:650,speed:.034,size:1.02,baseDamage:140,knockResist:.38,armor:1,reward:22},shield:{name:'SHIELD',hp:380,speed:.047,size:.86,baseDamage:95,knockResist:.62,armor:.72,reward:17},flyer:{name:'FLYER',hp:155,speed:.082,size:.62,baseDamage:60,knockResist:.9,armor:1,reward:13},boss:{name:'BOSS',hp:1700,speed:.026,size:1.12,baseDamage:260,knockResist:.22,armor:.9,reward:80}};
const UPG=[['atk','ATK','Damage +8%',40],['crit','CRIT','Critical +2%',45],['critd','CRIT DMG','Critical dmg +15%',40],['wall','WALL HP','Wall +100',35],['def','DEF','Wall damage -2.5%',45],['knock','KNOCKBACK','Knockback +10%',35]];
const S={playerClass:'knight',teamSize:1,attackNo:1,charge:0,phase:'x',phaseStart:performance.now(),dirX:1,dirY:1,target:null,xPos:null,yPos:null,xJudge:null,yJudge:null,resultText:'',resultTier:'',resultUntil:0,lockedCrossUntil:0,hitStopUntil:0,shakeUntil:0,shakeMag:0,playerKick:0,flash:0,level:1,xp:0,xpNext:60,gold:0,stage:1,stageKills:0,stageGoal:7,stageState:'battle',stageEndAt:0,upgrades:{atk:0,crit:0,critd:0,wall:0,def:0,knock:0},projectiles:[],particles:[],floats:[],pulses:[],chargeMotes:[],lastAttackStart:performance.now(),pendingTap:false,ai:[],monsters:[],nextMonsterId:1,nextSpawnAt:0,baseHp:2000,baseHpMax:2000,kills:0,gameOver:false,stats:{normal:0,good:0,perfect:0,critical:0,cycleDurations:[]},errors:[]};
function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function easeOutCubic(t){return 1-Math.pow(1-t,3)}function className(c=S.playerClass){return c==='knight'?'KNIGHT':c==='rogue'?'ROGUE':'TANK'}function classColor(c=S.playerClass){if(c==='rogue')return'170,225,255';if(c==='tank')return'130,210,255';return'255,211,106'}function isHeavy(){return S.charge>=3}function charBase(slot){return{x:W*.105,y:H*SLOT_Y[slot],scale:.37}}function squareGeom(){const b=charBase(0),size=Math.min(H*.27,W*.108,138);return{size,x:b.x+W*.054,y:b.y-size*.42}}function weaponWorldPos(slot=0,cls=S.playerClass){const b=charBase(slot),sc=b.scale;if(cls==='rogue')return{x:b.x+47*sc,y:b.y-18*sc};if(cls==='tank')return{x:b.x+46*sc,y:b.y-10*sc};return{x:b.x+53*sc,y:b.y-20*sc}}function wallFrontX(){return W*.155}
function safeSpawnY(type){const d=MONSTER_TYPES[type],marginTop=Math.max(90*d.size,H*.17),marginBottom=Math.max(40*d.size,H*.13);return rand(marginTop,H-marginBottom)}
function spawnMonster(type=null){type=type||pickMonsterType();const d=MONSTER_TYPES[type];const x=W+Math.max(42,54*d.size);const y=safeSpawnY(type);const m={id:S.nextMonsterId++,type,x,y,baseY:y,hp:d.hp*(1+(S.stage-1)*.08),maxHp:d.hp*(1+(S.stage-1)*.08),age:0,hitFlash:0,dead:false};S.monsters.push(m);return m}
function pickMonsterType(){const s=S.stage,r=Math.random();if(s>=9&&r<.12)return'brute';if(s>=6&&r<.25)return'shield';if(s>=4&&r<.42)return'flyer';if(s>=2&&r<.66)return'runner';return r<.82?'grunt':'brute'}
function getMonster(id){return S.monsters.find(m=>m.id===id&&!m.dead)}function nearestMonster(){let best=null;for(const m of S.monsters){if(m.dead)continue;if(!best||m.x<best.x)best=m}return best}function ensureMonsters(){if(S.stageState==='battle'&&S.monsters.filter(m=>!m.dead).length===0&&S.stageKills<S.stageGoal)spawnMonster()}function monsterAimPoint(m){const d=MONSTER_TYPES[m.type];return{x:m.x-W*.012*d.size,y:m.y-H*.035*d.size}}
function newTarget(){const m=.08,gx=rand(m+cfg.goodW/2,1-m-cfg.goodW/2),gy=rand(m+cfg.goodH/2,1-m-cfg.goodH/2),px=clamp(gx+rand(-.10,.10),gx-cfg.goodW/2+cfg.perfectW/2,gx+cfg.goodW/2-cfg.perfectW/2),py=clamp(gy+rand(-.10,.10),gy-cfg.goodH/2+cfg.perfectH/2,gy+cfg.goodH/2-cfg.perfectH/2);S.target={gx,gy,px,py}}
function startAttack(now){S.phase='x';S.phaseStart=now;S.dirX=S.attackNo%2?1:-1;S.dirY=S.attackNo%2?-1:1;S.xPos=S.yPos=null;S.xJudge=S.yJudge=null;S.pendingTap=false;newTarget();updateAttackLabel()}function updateAttackLabel(){const suffix=isHeavy()?(S.phase==='x'?'HEAVY · X LOCK':S.phase==='y'?'HEAVY · Y LOCK':'HEAVY'):'NORMAL · X';attackLabelEl.textContent=`${className()} · ATTACK ${S.attackNo} · ${suffix}`}function sweepPos(now,dir){const one=cfg.oneWayMs[cfg.speed],leg=Math.max(0,now-S.phaseStart)/one,whole=Math.floor(leg),f=leg-whole;let t=whole%2===0?f:1-f;if(dir<0)t=1-t;return .06+.88*t}function judgeX(x){const t=S.target;if(Math.abs(x-t.px)<=cfg.perfectW/2)return'PERFECT';if(Math.abs(x-t.gx)<=cfg.goodW/2)return'GOOD';return'NORMAL'}function judgeY(y){const t=S.target;if(Math.abs(y-t.py)<=cfg.perfectH/2)return'PERFECT';if(Math.abs(y-t.gy)<=cfg.goodH/2)return'GOOD';return'NORMAL'}function strongResult(x,y){if(x==='PERFECT'&&y==='PERFECT')return['CRITICAL',600];const w=(x==='PERFECT'?2:x==='GOOD'?1:0)+(y==='PERFECT'?2:y==='GOOD'?1:0);if(w>=3)return['SUPER',400];if(w===2)return['GREAT',300];if(w===1)return['HEAVY+',230];return['HEAVY',180]}function baseDamage(j){return j==='PERFECT'?200:j==='GOOD'?140:100}function addFloat(text,x,y,size=25,kind='damage'){S.floats.push({text,x,y,size,kind,age:0,life:kind==='critical'?.70:.50})}function addParticles(x,y,count,scale=1){for(let i=0;i<count;i++){const a=rand(-Math.PI*.8,Math.PI*.8),sp=rand(70,220)*scale;S.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(10,80),age:0,life:rand(.24,.48),size:rand(2,5)*scale})}}
function gainXP(amount){S.xp+=amount;while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=60+12*(S.level-1);addFloat(`LEVEL ${S.level}`,W*.36,H*.22,24,'gain');if(S.level===6){S.resultText=className()+' SKILL AWAKENED';S.resultTier='CRITICAL';S.resultUntil=performance.now()+1300}}updateRunStatus()}
function updateRunStatus(){runStatusEl.textContent=`STAGE ${S.stage} · LV ${S.level} · EXP ${S.xp}/${S.xpNext} · COIN ${S.gold}`}
function attackMultiplier(){return 1+S.upgrades.atk*.08}function critChance(){return S.upgrades.crit*.02}function knockMultiplier(){return 1+S.upgrades.knock*.10}function classSkillDamage(cls){return S.level>=6&&cls==='knight'?1.12:1}function wallDefense(){return Math.min(.45,S.upgrades.def*.025)}
function spawnChargeMotes(level,source=null){const p=weaponWorldPos(),rgb=classColor(),count=5+level*3;const src=source||nearestMonster();const sx0=src?src.x:W*.68,sy0=src?src.y:H*.45;for(let i=0;i<count;i++)S.chargeMotes.push({sx:sx0+rand(-20,20),sy:sy0+rand(-18,18),tx:p.x+rand(-4,4),ty:p.y+rand(-4,4),x:0,y:0,age:-rand(0,.06),life:S.playerClass==='rogue'?rand(.25,.36):S.playerClass==='tank'?rand(.42,.56):rand(.34,.48),bend:rand(-24,24),size:rand(2.2,4.6),rgb,cls:S.playerClass})}
function launchProjectile(owner,slot,cls,tier,damage,heavy=false,now=performance.now()){ensureMonsters();const start=weaponWorldPos(slot,cls),target=nearestMonster(),life=cls==='rogue'?.16:cls==='tank'?.25:.19,end=target?monsterAimPoint(target):{x:W*.96,y:start.y};let finalDamage=damage;if(owner==='local')finalDamage*=attackMultiplier()*classSkillDamage(cls);S.projectiles.push({owner,slot,cls,tier,damage:finalDamage,heavy,targetId:target?.id??null,sx:start.x,sy:start.y,tx:end.x,ty:end.y,x:start.x,y:start.y,age:0,life,rot:0});if(owner==='local'&&S.level>=6&&cls==='rogue'){S.projectiles.push({owner,slot,cls,tier,damage:finalDamage*.55,heavy,targetId:target?.id??null,sx:start.x-5,sy:start.y+7,tx:end.x,ty:end.y+5,x:start.x-5,y:start.y+7,age:-.04,life:.19,rot:0})}if(owner==='local'){S.phase='projectile';S.resultText=tier==='CRITICAL'?'CRITICAL!':tier+'!';S.resultTier=tier;S.resultUntil=now+420}}
function visualImpact(p,m,now,local){if(!m)return false;const critical=p.tier==='CRITICAL',perfect=critical||p.tier==='PERFECT'||p.tier==='SUPER',good=perfect||p.tier==='GOOD'||p.tier==='GREAT',d=MONSTER_TYPES[m.type];let actual=Math.max(1,Math.round(p.damage*d.armor));if(local&&Math.random()<critChance()){actual=Math.round(actual*(1.5+S.upgrades.critd*.15));addFloat('CRIT '+actual,m.x,m.y-50,28,'critical')}m.hp-=actual;m.hitFlash=1;let knockBase=local?(critical?W*.047:perfect?W*.024:good?W*.013:W*.006):(critical?W*.011:perfect?W*.007:good?W*.004:W*.002);if(local)knockBase*=knockMultiplier()*(S.level>=6&&p.cls==='tank'?1.35:1);m.x=Math.min(W+60,m.x+knockBase*d.knockResist);if(local&&(critical||perfect)){S.shakeUntil=now+(critical?145:95);S.shakeMag=critical?4.8:2.8}if(local)S.flash=critical?.9:perfect?.45:.12;const a=monsterAimPoint(m);addParticles(a.x,a.y,critical?16:perfect?9:good?4:2,critical?1.18:1);S.pulses.push({x:a.x,y:a.y,age:0,life:critical?.34:.22,maxR:critical?105:68});addFloat(String(actual),a.x,a.y-H*.035,local?(critical?42:perfect?32:good?27:22):17,local&&critical?'critical':'damage');if(m.hp<=0&&!m.dead){m.dead=true;S.kills++;S.stageKills++;S.gold+=d.reward;addFloat(`COIN +${d.reward}`,a.x,a.y-H*.08,12,'gain');if(S.stageKills>=S.stageGoal&&S.monsters.filter(x=>!x.dead).length===0)clearStage(now)}return true}
function resolveLocalHit(p,now){let m=getMonster(p.targetId)||nearestMonster();visualImpact(p,m,now,true);const critical=p.tier==='CRITICAL',perfect=critical||p.tier==='PERFECT'||p.tier==='SUPER',good=perfect||p.tier==='GOOD'||p.tier==='GREAT';S.hitStopUntil=now+(critical?90:perfect?55:good?28:8);if(isHeavy())S.charge=0;else{S.charge=Math.min(3,S.charge+1);spawnChargeMotes(S.charge,m)}gainXP(critical?12:perfect?8:good?5:3);if(S.xJudge==='NORMAL')S.stats.normal++;if(S.xJudge==='GOOD')S.stats.good++;if(S.xJudge==='PERFECT')S.stats.perfect++;if(S.yJudge){if(S.yJudge==='NORMAL')S.stats.normal++;if(S.yJudge==='GOOD')S.stats.good++;if(S.yJudge==='PERFECT')S.stats.perfect++}if(critical)S.stats.critical++;S.stats.cycleDurations.push((now-S.lastAttackStart)/1000);if(S.stats.cycleDurations.length>50)S.stats.cycleDurations.shift();updateStats();S.phase='recover';S.phaseStart=now}function resolveAIHit(p,now){const m=getMonster(p.targetId)||nearestMonster();visualImpact(p,m,now,false)}function updateStats(){const a=S.stats.cycleDurations,avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;statsEl.innerHTML=`N ${S.stats.normal} · G ${S.stats.good} · P ${S.stats.perfect} · C ${S.stats.critical}<br>AVG ${avg.toFixed(2)}s`}
function handleTap(now){if(now<S.hitStopUntil||S.stageState!=='battle')return;if(S.phase!=='x'&&S.phase!=='y')return;if(now-S.phaseStart<cfg.inputLockMs){S.pendingTap=true;return}if(S.phase==='x'){S.xPos=sweepPos(now,S.dirX);S.xJudge=judgeX(S.xPos);if(isHeavy()){S.phase='y';S.phaseStart=now+85;S.pendingTap=false;S.resultText=S.xJudge+' · X LOCK';S.resultTier=S.xJudge;S.resultUntil=now+270;updateAttackLabel()}else{launchProjectile('local',0,S.playerClass,S.xJudge,baseDamage(S.xJudge),false,now);S.playerKick=S.playerClass==='tank'?8:S.playerClass==='rogue'?15:13}}else{S.yPos=sweepPos(now,S.dirY);S.yJudge=judgeY(S.yPos);const[tier,damage]=strongResult(S.xJudge,S.yJudge);S.lockedCrossUntil=now+520;launchProjectile('local',0,S.playerClass,tier,damage,true,now);S.playerKick=S.playerClass==='tank'?12:S.playerClass==='rogue'?23:21}}
function makeAI(){const classes=['rogue','tank','knight'];S.ai=[];const now=performance.now();for(let slot=1;slot<S.teamSize;slot++)S.ai.push({slot,cls:classes[(slot-1)%classes.length],charge:0,shotNo:0,nextAt:now+450+slot*220,shots:0})}function aiInterval(cls){return cls==='rogue'?1150:cls==='tank'?1650:1400}function aiAttack(ai,now){if(S.stageState!=='battle')return;ai.shotNo++;ai.shots++;const heavy=ai.charge>=3;let r=Math.random(),tier=r<.18?'PERFECT':r<.72?'GOOD':'NORMAL',damage=baseDamage(tier);if(heavy){tier=r<.15?'SUPER':r<.65?'GREAT':'HEAVY+';damage=tier==='SUPER'?400:tier==='GREAT'?300:230;ai.charge=0}else ai.charge++;launchProjectile('ai',ai.slot,ai.cls,tier,damage,heavy,now);ai.nextAt=now+aiInterval(ai.cls)+rand(-140,170)}
function stageGoal(stage){return 5+stage*2}function beginStage(stage,now=performance.now()){S.stage=stage;S.stageKills=0;S.stageGoal=stageGoal(stage);S.stageState='battle';S.monsters=[];S.projectiles=[];S.nextSpawnAt=now+250;shopEl.classList.remove('show');makeAI();S.lastAttackStart=now;startAttack(now);if(stage===5||stage===10){setTimeout(()=>{if(S.stage===stage&&S.stageState==='battle')spawnMonster('boss')},800)}updateRunStatus()}
function clearStage(now){if(S.stageState!=='battle')return;S.stageState='shop';S.stageEndAt=now+8000;shopStageEl.textContent=`Stage ${S.stage} complete`;shopEl.classList.add('show');renderShop()}
function upgradeCost(k){const r=S.upgrades[k],base=UPG.find(x=>x[0]===k)[3];return Math.round(base*(1+r*.58))}function renderShop(){upgradeGridEl.innerHTML='';for(const [k,n,sub] of UPG){const c=upgradeCost(k),div=document.createElement('div');div.className='upgrade';div.innerHTML=`<div class="upgradeText"><div class="upgradeName">${n} · Lv${S.upgrades[k]}</div><div class="upgradeSub">${sub}</div></div><button data-up="${k}" ${S.gold<c?'disabled':''}>${c} C</button>`;upgradeGridEl.appendChild(div)}shopCoinEl.textContent=`COIN ${S.gold}`;shopTimerEl.textContent='NEXT 8.0';upgradeGridEl.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.up,c=upgradeCost(k);if(S.gold<c)return;S.gold-=c;S.upgrades[k]++;if(k==='wall'){S.baseHpMax+=100;S.baseHp=Math.min(S.baseHpMax,S.baseHp+100)}renderShop();updateRunStatus()}))}
function nextStage(){if(S.stage>=10){S.stageState='clear';shopEl.classList.remove('show');S.resultText='RUN CLEAR · STAGE 10';S.resultTier='CRITICAL';S.resultUntil=performance.now()+999999;return}beginStage(S.stage+1)}
nextBtn.addEventListener('click',e=>{e.stopPropagation();nextStage()});
function reset(){S.attackNo=1;S.charge=0;S.level=1;S.xp=0;S.xpNext=60;S.gold=0;S.upgrades={atk:0,crit:0,critd:0,wall:0,def:0,knock:0};S.baseHpMax=2000;S.baseHp=2000;S.projectiles=[];S.particles=[];S.floats=[];S.pulses=[];S.chargeMotes=[];S.monsters=[];S.nextMonsterId=1;S.kills=0;S.gameOver=false;S.stats={normal:0,good:0,perfect:0,critical:0,cycleDurations:[]};beginStage(1,performance.now());updateStats()}
document.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.teamSize=+b.dataset.team;document.querySelectorAll('[data-team]').forEach(x=>x.classList.toggle('active',x===b));reset()}));document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();cfg.speed=b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));reset()}));document.querySelectorAll('[data-class]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.playerClass=b.dataset.class;document.querySelectorAll('[data-class]').forEach(x=>x.classList.toggle('active',x===b));reset()}));document.getElementById('resetBtn').addEventListener('click',e=>{e.stopPropagation();reset()});addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;handleTap(performance.now())});
function update(now,dt){if(S.gameOver||S.stageState==='clear'){for(const p of S.particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}S.particles=S.particles.filter(p=>p.age<p.life);return}if(S.stageState==='shop'){const remain=Math.max(0,S.stageEndAt-now);shopTimerEl.textContent=`NEXT ${(remain/1000).toFixed(1)}`;if(remain<=0)nextStage();return}if(S.pendingTap&&(S.phase==='x'||S.phase==='y')&&(now-S.phaseStart)>=cfg.inputLockMs){S.pendingTap=false;handleTap(now)}if((S.phase==='x'||S.phase==='y')&&(now-S.phaseStart)>cfg.oneWayMs[cfg.speed]*cfg.maxCycles*2){S.resultText='MISS';S.resultTier='MISS';S.resultUntil=now+320;S.phase='recover';S.phaseStart=now}for(const ai of S.ai)if(now>=ai.nextAt)aiAttack(ai,now);const alive=S.monsters.filter(m=>!m.dead).length;if(now>=S.nextSpawnAt&&alive<Math.min(9,2+Math.ceil(S.stage/2))&&S.stageKills+alive<S.stageGoal){spawnMonster();S.nextSpawnAt=now+rand(Math.max(500,1050-S.stage*45),Math.max(750,1500-S.stage*40))}for(const m of S.monsters){if(m.dead)continue;const d=MONSTER_TYPES[m.type];m.age+=dt;m.hitFlash*=Math.pow(.002,dt);m.x-=W*d.speed*(1+(S.stage-1)*.018)*dt;if(m.type==='flyer'){const amp=Math.min(H*.018,14);m.y=clamp(m.baseY+Math.sin(m.age*5)*amp,80,H-65)}else if(m.type==='runner')m.y=clamp(m.baseY+Math.sin(m.age*8.5)*H*.004,70,H-55);if(m.x<=wallFrontX()){m.dead=true;const dealt=Math.round(d.baseDamage*(1-wallDefense()));S.baseHp=Math.max(0,S.baseHp-dealt);addFloat(`-${dealt}`,wallFrontX()+W*.012,m.y,18,'damage');addParticles(wallFrontX()+W*.006,m.y,6,1);S.stageKills++;if(S.baseHp<=0){S.gameOver=true;S.resultText='GAME OVER';S.resultTier='CRITICAL';S.resultUntil=now+999999}else if(S.stageKills>=S.stageGoal&&S.monsters.filter(x=>!x.dead).length===0)clearStage(now)}}S.monsters=S.monsters.filter(m=>!m.dead||m.hitFlash>.02);for(const p of S.projectiles){p.age+=dt;let target=getMonster(p.targetId);if(!target){target=nearestMonster();p.targetId=target?.id??null}if(target){const a=monsterAimPoint(target);p.tx=a.x;p.ty=a.y}if(p.age>=p.life){p.dead=true;if(p.owner==='local')resolveLocalHit(p,now);else resolveAIHit(p,now)}}S.projectiles=S.projectiles.filter(p=>!p.dead);if(S.phase==='recover'&&now-S.phaseStart>390){S.attackNo++;S.lastAttackStart=now;startAttack(now)}S.playerKick*=Math.pow(.001,dt);S.flash*=Math.pow(.001,dt);for(const p of S.particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt}S.particles=S.particles.filter(p=>p.age<p.life);for(const f of S.floats)f.age+=dt;S.floats=S.floats.filter(f=>f.age<f.life);for(const p of S.pulses)p.age+=dt;S.pulses=S.pulses.filter(p=>p.age<p.life);for(const m of S.chargeMotes){m.age+=dt;if(m.age<0)continue;const t=clamp(m.age/m.life,0,1),e=easeOutCubic(t),u=1-e,mx=(m.sx+m.tx)/2+m.bend,my=(m.sy+m.ty)/2-34;m.x=u*u*m.sx+2*u*e*mx+e*e*m.tx;m.y=u*u*m.sy+2*u*e*my+e*e*m.ty}S.chargeMotes=S.chargeMotes.filter(m=>m.age<m.life);updateRunStatus()}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBackground(){ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let x=0;x<W;x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=52){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const wallX=W*.065,wallW=W*.085,wallTop=H*.19,wallBot=H*.73;ctx.fillStyle='rgba(55,67,80,.52)';ctx.fillRect(wallX,wallTop,wallW,wallBot-wallTop);ctx.fillStyle='rgba(255,255,255,.05)';for(let y=wallTop+8;y<wallBot;y+=18)ctx.fillRect(wallX+4,y,wallW-8,2);for(let i=0;i<4;i++){const y=H*SLOT_Y[i]+H*.026;ctx.strokeStyle=i<S.teamSize?'rgba(255,255,255,.16)':'rgba(255,255,255,.05)';ctx.beginPath();ctx.moveTo(wallX+W*.008,y);ctx.lineTo(wallX+wallW+W*.018,y);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.58)';ctx.font='800 10px system-ui';ctx.textAlign='left';ctx.fillText(`WALL HP ${S.baseHp}/${S.baseHpMax}`,wallX+5,wallTop-9);const hpw=wallW-10,hpr=clamp(S.baseHp/S.baseHpMax,0,1);ctx.fillStyle='rgba(255,255,255,.09)';rr(wallX+5,wallTop-3,hpw,5,3);ctx.fill();ctx.fillStyle=hpr>.5?'rgba(160,220,210,.72)':hpr>.25?'rgba(255,211,106,.8)':'rgba(255,110,110,.85)';rr(wallX+5,wallTop-3,hpw*hpr,5,3);ctx.fill()}
function drawCharacter(slot,cls,isLocal){const b=charBase(slot),sc=b.scale;ctx.save();ctx.translate(b.x,b.y);ctx.scale(sc,sc);ctx.fillStyle=isLocal?'#dbe6ef':'#8997a4';ctx.beginPath();ctx.arc(0,-55,20,0,Math.PI*2);ctx.fill();ctx.fillStyle=cls==='tank'?'#718899':cls==='rogue'?'#637f90':'#7991a1';rr(-18,-35,36,55,6);ctx.fill();ctx.strokeStyle='#b8c8d5';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();if(cls==='knight'){ctx.moveTo(16,-20);ctx.lineTo(48,-35);ctx.lineTo(65,-20)}else if(cls==='rogue'){ctx.moveTo(13,-17);ctx.lineTo(45,-6);ctx.moveTo(14,-28);ctx.lineTo(47,-18)}else{ctx.moveTo(14,-12);ctx.arc(35,-12,18,-1.2,1.2)}ctx.stroke();if(isLocal){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,26,32,10,0,0,Math.PI*2);ctx.stroke()}ctx.restore();ctx.fillStyle=isLocal?'rgba(245,249,253,.85)':'rgba(255,255,255,.38)';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(isLocal?'YOU':`CPU ${slot}`,b.x,b.y+38)}
function drawMonsterShape(m){const d=MONSTER_TYPES[m.type],s=d.size;ctx.save();ctx.translate(m.x,m.y);ctx.scale(s,s);if(m.hitFlash>.08){ctx.shadowBlur=18;ctx.shadowColor='rgba(255,255,255,.75)'}if(m.type==='runner'){ctx.fillStyle='#657482';ctx.beginPath();ctx.ellipse(0,-12,23,20,-.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9eacb8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-11,2);ctx.lineTo(-20,20);ctx.moveTo(6,4);ctx.lineTo(17,21);ctx.stroke()}else if(m.type==='brute'||m.type==='boss'){ctx.fillStyle=m.type==='boss'?'#6f5965':'#4e5a65';rr(-38,-64,76,76,10);ctx.fill();ctx.fillStyle='#0b0f14';ctx.beginPath();ctx.arc(-14,-42,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-42,5,0,Math.PI*2);ctx.fill()}else if(m.type==='shield'){ctx.fillStyle='#5e6d7a';ctx.beginPath();ctx.ellipse(-5,-20,29,34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8a99a7';rr(-37,-52,18,62,8);ctx.fill()}else if(m.type==='flyer'){ctx.fillStyle='#697987';ctx.beginPath();ctx.moveTo(0,-45);ctx.lineTo(25,-18);ctx.lineTo(0,8);ctx.lineTo(-25,-18);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(-42,-32);ctx.lineTo(-28,-7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(18,-20);ctx.lineTo(42,-32);ctx.lineTo(28,-7);ctx.closePath();ctx.fill()}else{ctx.fillStyle='#586673';ctx.beginPath();ctx.ellipse(0,-18,30,34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b0f14';ctx.beginPath();ctx.arc(-9,-23,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(9,-23,4,0,Math.PI*2);ctx.fill()}const ratio=clamp(m.hp/m.maxHp,0,1),bw=52,bh=5;ctx.fillStyle='rgba(0,0,0,.45)';rr(-bw/2,-76,bw,bh,3);ctx.fill();ctx.fillStyle=ratio>.5?'rgba(214,231,238,.72)':ratio>.25?'rgba(255,211,106,.82)':'rgba(255,120,120,.86)';rr(-bw/2,-76,bw*ratio,bh,3);ctx.fill();ctx.restore()}function drawMonsters(){for(const m of [...S.monsters].filter(m=>!m.dead).sort((a,b)=>a.y-b.y))drawMonsterShape(m)}
function drawChargeMotes(){for(const m of S.chargeMotes){if(m.age<0)continue;ctx.save();ctx.globalAlpha=.85;ctx.fillStyle=`rgba(${m.rgb},.95)`;ctx.shadowBlur=9;ctx.shadowColor=`rgba(${m.rgb},.7)`;if(m.cls==='rogue'){ctx.translate(m.x,m.y);ctx.rotate(-.6);ctx.fillRect(-m.size*1.5,-m.size*.4,m.size*3,m.size*.8)}else if(m.cls==='tank'){ctx.strokeStyle=`rgba(${m.rgb},.86)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,m.size,0,Math.PI*2);ctx.stroke()}else{ctx.beginPath();ctx.arc(m.x,m.y,m.size,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function drawTimingSquare(now){if(S.phase!=='x'&&S.phase!=='y'&&now>S.lockedCrossUntil)return;const g=squareGeom(),t=S.target,rgb=classColor(),x=g.x,y=g.y,s=g.size,cy=y-22;ctx.save();ctx.textAlign='center';ctx.font='900 10px system-ui';ctx.fillStyle=isHeavy()?`rgba(${rgb},1)`:'rgba(255,255,255,.56)';ctx.fillText(isHeavy()?'HEAVY READY':`CHARGE ${S.charge}/3`,x+s/2,cy-11);const gap=22,start=x+s/2-gap;for(let i=0;i<3;i++){ctx.fillStyle=i<S.charge?`rgba(${rgb},.96)`:'rgba(255,255,255,.13)';ctx.beginPath();ctx.arc(start+i*gap,cy,6.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.055)';rr(x,y,s,s,12);ctx.fill();ctx.strokeStyle=isHeavy()?`rgba(${rgb},.82)`:'rgba(255,255,255,.18)';ctx.lineWidth=isHeavy()?3:2;rr(x,y,s,s,12);ctx.stroke();const gx=x+(t.gx-cfg.goodW/2)*s,gy=y+(t.gy-cfg.goodH/2)*s,gw=cfg.goodW*s,gh=cfg.goodH*s;ctx.fillStyle='rgba(81,201,141,.22)';rr(gx,gy,gw,gh,8);ctx.fill();const px=x+(t.px-cfg.perfectW/2)*s,py=y+(t.py-cfg.perfectH/2)*s,pw=cfg.perfectW*s,ph=cfg.perfectH*s;ctx.fillStyle='rgba(255,211,106,.62)';rr(px,py,pw,ph,5);ctx.fill();let xp=S.xPos;if(S.phase==='x')xp=sweepPos(now,S.dirX);if(xp!==null){const xx=x+xp*s;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xx,y+5);ctx.lineTo(xx,y+s-5);ctx.stroke()}let yp=S.yPos;if(S.phase==='y')yp=sweepPos(now,S.dirY);if(yp!==null){const yy=y+yp*s;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+5,yy);ctx.lineTo(x+s-5,yy);ctx.stroke()}ctx.restore()}
function drawProjectiles(){for(const p of S.projectiles){if(p.age<0)continue;const t=clamp(p.age/p.life,0,1),e=easeOutCubic(t);p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=p.owner==='local'?1:.68;if(p.cls==='knight'){ctx.strokeStyle='rgba(255,226,142,.96)';ctx.lineWidth=p.heavy?7:4.5;ctx.beginPath();ctx.arc(0,0,p.heavy?36:27,-.9,.9);ctx.stroke()}else if(p.cls==='rogue'){ctx.fillStyle='rgba(202,236,255,.97)';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-6,-4.5);ctx.lineTo(-12,0);ctx.lineTo(-6,4.5);ctx.closePath();ctx.fill()}else{ctx.strokeStyle='rgba(160,225,255,.92)';ctx.lineWidth=p.heavy?6:4;ctx.beginPath();ctx.ellipse(0,0,31+58*t,30+14*t,0,-.75,.75);ctx.stroke()}ctx.restore()}}
function drawEffects(now){for(const p of S.pulses){const t=p.age/p.life,r=p.maxR*easeOutCubic(t);ctx.globalAlpha=(1-t)*.55;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}for(const p of S.particles){const t=p.age/p.life;ctx.globalAlpha=1-t;ctx.fillStyle='#e9f2fa';ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1}for(const f of S.floats){const t=f.age/f.life;ctx.save();ctx.globalAlpha=1-clamp((t-.62)/.38,0,1);ctx.translate(f.x,f.y-30*easeOutCubic(t));ctx.font=`900 ${f.size}px system-ui`;ctx.textAlign='center';ctx.fillStyle=f.kind==='gain'?'rgba(220,230,240,.78)':'#f7fbff';ctx.fillText(f.text,0,0);ctx.restore()}if(now<S.resultUntil){ctx.save();ctx.font=`900 ${S.resultTier==='CRITICAL'?31:23}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#f7fbff';ctx.fillText(S.resultText,W*.40,H*.23);ctx.restore()}if(S.gameOver){ctx.fillStyle='rgba(5,8,12,.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 32px system-ui';ctx.fillText('GAME OVER',W*.56,H*.42)}}
function draw(now){ctx.save();if(now<S.shakeUntil){const f=(S.shakeUntil-now)/145;ctx.translate(rand(-S.shakeMag,S.shakeMag)*f,rand(-S.shakeMag,S.shakeMag)*f)}drawBackground();drawCharacter(0,S.playerClass,true);for(const ai of S.ai)drawCharacter(ai.slot,ai.cls,false);drawChargeMotes();drawTimingSquare(now);drawProjectiles();drawMonsters();drawEffects(now);ctx.restore();ctx.fillStyle='rgba(255,255,255,.38)';ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText(`TEAM ${S.teamSize}/4 · KILLS ${S.kills}`,12,H-10);ctx.textAlign='right';ctx.fillText(`COIN ${S.gold} · ENEMIES ${S.monsters.filter(m=>!m.dead).length}`,W-12,H-10)}
let last=performance.now();function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(now>=S.hitStopUntil)update(now,dt);draw(now);requestAnimationFrame(frame)}window.addEventListener('error',e=>S.errors.push(String(e.message||e.error||'error')));window.__gameDebug={state:()=>({phase:S.phase,stage:S.stage,level:S.level,xp:S.xp,charge:S.charge,teamSize:S.teamSize,enemyCount:S.monsters.filter(m=>!m.dead).length,monsterXs:S.monsters.filter(m=>!m.dead).map(m=>m.x),monsterYs:S.monsters.filter(m=>!m.dead).map(m=>m.y),baseHp:S.baseHp,errors:[...S.errors]}),tap:()=>handleTap(performance.now()),setTeam:n=>{S.teamSize=n;reset()}};reset();requestAnimationFrame(frame);
