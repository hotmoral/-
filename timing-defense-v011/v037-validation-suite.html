<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timing Defense v0.37 validation suite</title>
<style>body{font:14px system-ui;background:#101714;color:#e7eee9;padding:18px}h1{font-size:20px}.row{padding:8px 10px;margin:6px 0;background:#17211c;border-radius:8px}.pass{color:#9ee6ad}.fail{color:#ff9e9e}.run{color:#e7d79b}pre{white-space:pre-wrap;background:#17211c;padding:14px;border-radius:10px;max-width:980px}iframe{display:none}</style>
<h1>v0.37 Slice B · Stage 3 automated validation</h1>
<div id="server" class="row run">SERVER · RUNNING…</div>
<div id="client36" class="row run">V036 CLIENT REGRESSION · WAITING…</div>
<div id="client37" class="row run">STAGE3 CLIENT · WAITING…</div>
<div id="multi" class="row run">MULTICLIENT · WAITING…</div>
<div id="final" class="row run">FINAL · RUNNING…</div>
<pre id="out"></pre>
<iframe id="client36Frame"></iframe><iframe id="client37Frame"></iframe><iframe id="multiFrame"></iframe>
<script>
(async()=>{
  const result={version:'0.37-cf.1-validation-suite',server:null,client36:null,client37:null,multiclient:null,ok:false};
  const set=(id,state,text)=>{const el=document.getElementById(id);el.className=`row ${state}`;el.textContent=text};
  async function getJson(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||d?.failed?.join(', ')||`HTTP ${r.status}`);return d}
  function runFrame(id,url,timeout){return new Promise((resolve,reject)=>{const f=document.getElementById(id),t=setTimeout(()=>reject(new Error(`${id} timeout`)),timeout);f.onload=()=>{const poll=setInterval(()=>{try{const title=f.contentDocument?.title||'';if(!/^(PASS|FAIL) ·/.test(title))return;clearInterval(poll);clearTimeout(t);const text=f.contentDocument?.getElementById('out')?.textContent||'{}';resolve(JSON.parse(text))}catch(e){clearInterval(poll);clearTimeout(t);reject(e)}},120)};f.src=`${url}${url.includes('?')?'&':'?'}suite=${Date.now()}`})}
  try{
    result.server=await getJson('/api/diagnostics/v037-slice-b');
    const total=(result.server.v036Regression?.total||0)+(result.server.stage3?.total||0)+(result.server.wall?.total||0),passed=(result.server.v036Regression?.passed||0)+(result.server.stage3?.passed||0)+(result.server.wall?.passed||0);
    set('server',result.server.ok?'pass':'fail',`SERVER · ${result.server.ok?'PASS':'FAIL'} · ${passed}/${total}`);
  }catch(e){result.server={ok:false,error:String(e)};set('server','fail',`SERVER · FAIL · ${e.message||e}`)}
  try{
    set('client36','run','V036 CLIENT REGRESSION · RUNNING…');result.client36=await runFrame('client36Frame','/v036-client-selftest.html',10000);set('client36',result.client36.ok?'pass':'fail',`V036 CLIENT REGRESSION · ${result.client36.ok?'PASS':'FAIL'} · ${result.client36.passed}/${result.client36.total}`);
  }catch(e){result.client36={ok:false,error:String(e)};set('client36','fail',`V036 CLIENT REGRESSION · FAIL · ${e.message||e}`)}
  try{
    set('client37','run','STAGE3 CLIENT · RUNNING…');result.client37=await runFrame('client37Frame','/v037-client-selftest.html',10000);set('client37',result.client37.ok?'pass':'fail',`STAGE3 CLIENT · ${result.client37.ok?'PASS':'FAIL'} · ${result.client37.passed}/${result.client37.total}`);
  }catch(e){result.client37={ok:false,error:String(e)};set('client37','fail',`STAGE3 CLIENT · FAIL · ${e.message||e}`)}
  try{
    set('multi','run','MULTICLIENT · RUNNING…');result.multiclient=await runFrame('multiFrame','/v037-multiclient-sim.html',70000);set('multi',result.multiclient.ok?'pass':'fail',`MULTICLIENT · ${result.multiclient.ok?'PASS':'FAIL'} · ${result.multiclient.passed}/${result.multiclient.total}`);
  }catch(e){result.multiclient={ok:false,error:String(e)};set('multi','fail',`MULTICLIENT · FAIL · ${e.message||e}`)}
  result.ok=!!(result.server?.ok&&result.client36?.ok&&result.client37?.ok&&result.multiclient?.ok);
  set('final',result.ok?'pass':'fail',`FINAL · ${result.ok?'PASS':'FAIL'}`);document.getElementById('out').textContent=JSON.stringify(result,null,2);document.title=`${result.ok?'PASS':'FAIL'} · v0.37 validation suite`;
})();
</script>
