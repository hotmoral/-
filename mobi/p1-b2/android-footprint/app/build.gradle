plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.mobifootprint'
    compileSdk 35

    defaultConfig {
        applicationId 'org.example.mobifootprint'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1-p1-b2.2'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
